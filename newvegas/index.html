<!DOCTYPE html>
<html lang="en">

<title>The Courier's Log — Fallout: New Vegas Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    /* Pip-Boy 3000, monochrome-amber mode — the Mojave's alternate screen color,
       kept distinct from Fallout 76's green-primary CRT */
    --void: #0b0602;
    --stone-1: #1a1006;
    --stone-2: #24160a;
    --stone-3: #301e0d;
    --stone-4: #3d270f;
    --stone-5: #4d3212;
    --panel: rgba(36, 22, 10, 0.68);
    --panel-hi: rgba(255, 200, 120, 0.05);
    --iron: #5c3f1f;
    --iron-light: #8f6a3f;
    /* phosphor green — secondary Pip-Boy mode color, used for NCR/positive accents */
    --frost: #6dffa0;
    --frost-dim: #3f9e68;
    /* amber — key highlights */
    --gold: #ffb000;
    --gold-bright: #ffd27a;
    --gold-dim: #b37c00;
    --heading: #ffe9c2;
    --ink: #ffd9a0;
    --ink-soft: #bd8f52;
    --ink-dim: #7a5c33;
    --blood: #ff5555;
    --sage-ok: #6dffa0;
    --moss: #b3852f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(255,176,0,0.06), transparent 40%),
      radial-gradient(circle at 50% 42%, transparent 30%, rgba(0,0,0,0.65) 100%),
      repeating-linear-gradient(180deg, rgba(0,0,0,0.16) 0px, transparent 1px, transparent 3px);
    font-family: 'Share Tech Mono', monospace;
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  .tome {
    width: min(95vw, 1520px);
    margin: 0 auto;
    display: flex;
    gap: 0;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(92,63,31,0.7), 0 0 40px rgba(255,176,0,0.05);
    overflow: hidden;
  }

  /* ---------- SIDE NAV ---------- */
  .nav {
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--stone-2), var(--stone-1));
    padding: 28px 0 20px;
    min-width: 220px;
    flex-shrink: 0;
    position: relative;
    border-right: 1px solid var(--iron);
  }
  .nav::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, transparent 2px 44px);
    pointer-events: none;
  }
  .nav-brand {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--gold);
    text-align: center;
    letter-spacing: 0.08em;
    padding: 0 16px 20px;
    border-bottom: 1px solid var(--iron);
    margin-bottom: 10px;
    text-shadow: 0 0 8px rgba(255,176,0,0.35);
  }

  .nav-btn {
    all: unset;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    margin: 1px 8px;
    color: var(--ink-soft);
    font-family: 'Share Tech Mono', monospace;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background .15s ease, color .15s ease;
    border-left: 2px solid transparent;
  }
  .nav-btn .icon { font-size: 15px; filter: saturate(0.8); flex-shrink: 0; width: 18px; text-align: center; }
  .nav-btn:hover { background: rgba(255,176,0,0.06); color: var(--heading); }
  .nav-btn.active {
    background: rgba(255,176,0,0.1);
    color: var(--gold-bright);
    border-left-color: var(--gold);
    text-shadow: 0 0 6px rgba(255,176,0,0.4);
  }

  .nav-mobile { display: none; }

  /* ---------- MAIN PAGE — stays on the same dark CRT palette as the nav ---------- */
  .page {
    flex: 1;
    min-width: 0;
    padding: 34px clamp(24px, 3.4vw, 54px) 50px;
    background: linear-gradient(180deg, var(--stone-1), var(--void) 60%);
    position: relative;
    min-height: 680px;
  }

  header.title-block {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
    margin-bottom: 2px; flex-wrap: wrap; position: relative; z-index: 1;
  }
  h1 {
    font-family: 'VT323', monospace;
    font-size: clamp(26px, 4vw, 38px);
    color: var(--heading);
    margin: 0;
    letter-spacing: 0.04em;
    text-shadow: 0 0 10px rgba(255,176,0,0.3);
  }
  .subtitle { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.03em; margin-top: 5px; }
  .seal {
    font-family: 'VT323', monospace;
    font-size: 13px;
    color: var(--frost);
    background: radial-gradient(circle at 35% 30%, #24160a, #0b0602 75%);
    border: 2px solid var(--gold-dim);
    box-shadow: 0 2px 8px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,176,0,0.2);
    border-radius: 50%;
    width: 62px; height: 62px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.1; letter-spacing: 0.03em;
    transform: rotate(-6deg); opacity: 0.9; flex-shrink: 0; text-transform: uppercase;
  }

  .rune-divider { position: relative; height: 15px; margin: 6px 0 20px; }
  .rune-divider::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent 0%, var(--iron) 12%, var(--iron) 88%, transparent 100%); }
  .rune-divider::after { content: "☢"; position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%); color: var(--gold-dim); font-size: 11px; background: var(--stone-1); padding: 0 10px; line-height: 1; }

  .search-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; position: relative; z-index: 1; }
  .search-plate { display: flex; align-items: center; gap: 8px; background: var(--panel); color: var(--ink); padding: 9px 14px; border: 1px solid var(--iron); flex: 1; min-width: 220px; }
  .search-plate input { background: transparent; border: none; outline: none; color: var(--ink); font-family: 'Share Tech Mono', monospace; font-size: 13px; width: 100%; letter-spacing: 0.02em; }
  .search-plate input::placeholder { color: var(--ink-dim); }

  .back-to-top {
    position: fixed; left: 22px; bottom: 22px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); backdrop-filter: blur(4px); border: 1px solid var(--iron);
    box-shadow: inset 0 1px 0 var(--panel-hi), 0 4px 14px rgba(0,0,0,0.45);
    color: var(--gold-bright); font-size: 18px; cursor: pointer;
    opacity: 0; pointer-events: none; transform: translateY(8px);
    transition: opacity .2s ease, transform .2s ease, border-color .15s ease, color .15s ease;
  }
  .back-to-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .back-to-top:hover { border-color: var(--gold-dim); color: var(--gold); }

  .filter-pill {
    font-family: 'Share Tech Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; color: var(--ink-soft);
    background: transparent; border: none; border-bottom: 2px solid transparent;
    padding: 7px 10px 6px; cursor: pointer; user-select: none; text-transform: uppercase;
    transition: color .15s ease, border-color .15s ease, text-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-pill:hover { color: var(--heading); border-bottom-color: rgba(109,255,160,0.5); text-shadow: 0 0 10px rgba(109,255,160,0.3); }
  .filter-pill:focus-visible { outline: none; color: var(--heading); border-bottom-color: rgba(109,255,160,0.5); }
  .filter-pill.active { color: var(--gold-bright); border-bottom-color: var(--gold); text-shadow: 0 0 10px rgba(255,176,0,0.25); }

  .sub-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 18px; position: relative; z-index: 1; }
  .sub-pill {
    font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--ink-soft);
    background: transparent; border: none; border-bottom: 2px solid transparent;
    padding: 7px 12px 6px; cursor: pointer; text-transform: uppercase;
    transition: color .15s ease, border-color .15s ease, text-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .sub-pill:hover { color: var(--heading); border-bottom-color: rgba(109,255,160,0.5); }
  .sub-pill.active { color: var(--gold-bright); border-bottom-color: var(--gold); text-shadow: 0 0 10px rgba(255,176,0,0.25); }
  .sub-pill .n { opacity:0.65; font-size:9px; margin-left:2px; }
  .sub-pill .n::before { content: '[ '; }
  .sub-pill .n::after { content: ' ]'; }

  .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; position: relative; z-index: 1; }
  .dash-card { background: var(--panel); border: 1px solid var(--iron); border-left: 3px solid var(--frost-dim); padding: 16px; cursor: pointer; box-shadow: inset 0 1px 0 var(--panel-hi); transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .dash-card:hover { transform: translateY(-2px); border-color: var(--gold-dim); box-shadow: 2px 6px 18px rgba(0,0,0,0.5), inset 0 1px 0 var(--panel-hi), 0 0 12px rgba(255,176,0,0.12); }
  .dash-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dash-icon { font-size: 18px; }
  .dash-label { font-family: 'VT323', monospace; font-size: 15px; color: var(--heading); letter-spacing: 0.06em; text-transform: uppercase; }
  .dash-bar-track { background: rgba(0,0,0,0.25); border: 1px solid var(--iron); height: 7px; overflow: hidden; margin-bottom: 8px; }
  .dash-bar-fill { background: var(--frost); height: 100%; transition: width .3s ease; }
  .dash-count { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--ink-soft); }

  .overview-hero { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--iron); box-shadow: inset 0 1px 0 var(--panel-hi); padding: 22px 26px; margin-bottom: 16px; position: relative; z-index: 1; }
  .completion-ring-wrap { position: relative; width: 104px; height: 104px; flex-shrink: 0; }
  .completion-ring { width: 104px; height: 104px; transform: rotate(-90deg); }
  .completion-ring-track { fill: none; stroke: rgba(0,0,0,0.3); stroke-width: 9; }
  .completion-ring-fill { fill: none; stroke: var(--frost); stroke-width: 9; stroke-linecap: butt; transition: stroke-dashoffset .6s ease; }
  .completion-ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'VT323', monospace; font-size: 26px; font-weight: 600; color: var(--heading); }
  .overview-hero-info { flex: 1; min-width: 220px; }
  .overview-hero-title { font-family: 'VT323', monospace; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold-bright); margin-bottom: 4px; }
  .overview-hero-count { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .points-total-badge { display: inline-flex; align-items: center; gap: 7px; font-family: 'Share Tech Mono', monospace; font-size: 12.5px; letter-spacing: 0.02em; color: var(--gold-bright); background: rgba(255,176,0,0.1); border: 1px solid rgba(255,176,0,0.35); padding: 6px 13px; }

  .reset-zone { margin-top: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 1; }
  .reset-btn { all: unset; cursor: pointer; font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--blood); border: 1px solid var(--blood); padding: 8px 14px; text-transform: uppercase; }
  .reset-btn:hover { background: rgba(255,85,85,0.12); }
  .reset-btn.armed { background: var(--blood); color: var(--stone-1); }
  .reset-hint { font-family: 'Share Tech Mono', monospace; font-size: 11.5px; color: var(--ink-soft); opacity: 0.8; }

  .entries { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }

  .quest { background: var(--panel); border: 1px solid var(--iron); border-left: 3px solid var(--gold-dim); padding: 16px 18px 14px; position: relative; box-shadow: 0 3px 16px rgba(0,0,0,0.4), inset 0 1px 0 var(--panel-hi); }
  .quest.done { border-left-color: var(--sage-ok); }
  .quest-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
  .quest-title-wrap { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .quest h3 { font-family: 'VT323', monospace; font-weight: 600; font-size: 19px; margin: 0; color: var(--heading); letter-spacing: 0.01em; line-height: 1.3; }

  .fav-btn, .track-btn { all: unset; cursor: pointer; }
  .fav-btn { font-size: 16px; line-height: 1; flex-shrink: 0; color: var(--ink-dim); opacity: 0.7; transition: color .15s ease, opacity .15s ease, transform .15s ease; }
  .fav-btn:hover { color: var(--gold-dim); opacity: 1; }
  .fav-btn.active { color: var(--gold-bright); opacity: 1; transform: scale(1.12); text-shadow: 0 0 8px rgba(255,210,122,0.45); }

  .quest-meta { font-family: 'Share Tech Mono', monospace; font-size: 11.5px; color: var(--ink-soft); margin: 3px 0 10px; opacity: 0.95; }
  .quest-meta span { margin-right: 12px; }
  .quest-meta b { color: var(--heading); font-weight: 600; }

  .quest-steps { margin: 0 0 10px; padding-left: 20px; font-size: 12.8px; line-height: 1.55; color: var(--ink); }
  .quest-steps li { margin-bottom: 4px; }

  .rewards-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .reward-chip { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--gold-bright); background: rgba(255,176,0,0.1); border: 1px solid rgba(255,176,0,0.4); padding: 3px 9px; margin: 0; }

  .quest-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .track-btn { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); font-family: 'Share Tech Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.85; }
  .track-btn .box { width: 13px; height: 13px; border: 1.5px solid var(--ink-soft); display: inline-block; }
  .quest.done .track-btn .box { background: var(--sage-ok); border-color: var(--sage-ok); }
  .quest.done .track-btn { color: var(--sage-ok); opacity: 1; }

  .empty-state { font-family: 'VT323', monospace; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); padding: 46px 10px; text-align: center; opacity: 0.8; position: relative; z-index: 1; }

  .search-result-card { cursor: pointer; transition: border-left-color .15s ease, background .15s ease; }
  .search-result-card:hover { border-left-color: var(--frost); background: rgba(109,255,160,0.05); }
  .search-result-card .ach-desc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .ach-desc { font-size: 12.8px; line-height: 1.55; color: var(--ink); margin: 0 0 10px; }
  .search-section-note { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; }

  @keyframes flashHighlight { 0%, 100% { box-shadow: 0 0 0 0 rgba(109,255,160,0); } 20% { box-shadow: 0 0 0 4px rgba(109,255,160,0.55); } }
  .quest.flash-highlight { animation: flashHighlight 2.2s ease-out; }

  footer.note { margin-top: 32px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-soft); opacity: 0.6; position: relative; z-index: 1; }

  @media (min-width: 1180px) {
    .entries { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 16px; align-items: start; }
    .dash-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  }
  @media (min-width: 1680px) { .entries { grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); } }

  @media (max-width: 780px) {
    .tome { flex-direction: column; width: 100%; }
    .nav { display: none; }
    .nav-mobile { display: flex; overflow-x: auto; gap: 6px; padding: 12px; background: var(--stone-1); }
    .nav-mobile .nav-btn { margin: 0; flex-shrink: 0; }
    .page { padding: 24px 18px 40px; }
  }

  /* ---- shared accessibility defaults (JAW Digital suite) ---- */
  :focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
    border-radius: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="tome">
  <nav class="nav" id="nav-desktop"></nav>

  <main class="page">
    <nav class="nav-mobile" id="nav-mobile"></nav>

    <header class="title-block">
      <div>
        <h1 id="page-title">The Courier's Log</h1>
        <div class="subtitle" id="page-subtitle">— field notes from the Mojave Wasteland —</div>
      </div>
      <div class="seal">NCR<br/>194</div>
    </header>
    <div class="rune-divider"></div>

    <div class="search-row" id="search-row">
      <div class="search-plate">
        <span>🔎</span>
        <input id="search" type="text" placeholder="Search the log…" />
      </div>
      <span class="filter-pill active" data-fav="all">All entries</span>
      <span class="filter-pill" data-fav="favorites">★ Favorites only</span>
      <span class="filter-pill" data-hide-done="true">✓ Hide completed</span>
      <span id="progress-tally" style="display:none; font-family:'Share Tech Mono', monospace; font-size:11px; color: var(--sage-ok);"></span>
    </div>

    <div class="sub-row" id="sub-row" style="display:none;"></div>

    <section class="entries" id="entries"></section>

    <footer class="note">A record kept for one courier of the Mojave Express by JAW Digital</footer>
  </main>
</div>

<button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">↑</button>

<script>window.JAW_GAME = 'newvegas';</script>
<script src="../sync.js"></script>
<script src="../account.js"></script>
<script>

/* ============================= SEARCH INDEX ============================= */
function buildSearchIndex(){
  return ENTRIES.map(e => ({
    itemId: e.id, title: e.title,
    sectionLabel: (SECTIONS.find(s=>s.id===e.sec)||{}).label + (TABS[e.sec] ? ' › ' + ((TABS[e.sec].find(t=>t.id===e.sub)||{}).label||'') : ''),
    icon: (SECTIONS.find(s=>s.id===e.sec)||{}).icon || '📄',
    snippet: (e.desc && e.desc[0]) || Object.values(e.meta||{}).join(' · '),
    searchText: [e.title, JSON.stringify(e.meta||{}), (e.desc||[]).join(' ')].join(' ').toLowerCase(),
    nav: { section: e.sec, sub: e.sub },
  }));
}
const SEARCH_INDEX = buildSearchIndex();

/* ============================= STATE ============================= */
let activeSection = 'overview';
let activeSub = null;
let favOnly = false;
let hideCompleted = false;
let query = '';
let favorites = new Set();
let tracked = new Set();

function storageKey(){ return 'newvegas-journal-progress'; }
function navStateKey(){ return 'newvegas-journal-lastview'; }

function syncFilterPills(){
  document.querySelectorAll('.filter-pill[data-fav]').forEach(p => p.classList.toggle('active', p.dataset.fav === (favOnly ? 'favorites' : 'all')));
  const hideBtn = document.querySelector('.filter-pill[data-hide-done]');
  if (hideBtn) hideBtn.classList.toggle('active', hideCompleted);
}

function loadProgress(){
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) {
      const parsed = JSON.parse(raw);
      favorites = new Set(parsed.favorites || []);
      tracked = new Set(parsed.tracked || []);
    }
  } catch (e) { /* start fresh */ }
}
function saveProgress(){
  try {
    const state = { favorites: Array.from(favorites), tracked: Array.from(tracked), updatedAt: Date.now() };
    const payload = JSON.stringify(state);
    localStorage.setItem(storageKey(), payload);
    if (window.JawSync) window.JawSync.save(storageKey(), payload);
    if (window.JawAccount && window.JawAccount.isSignedIn()) window.JawAccount.save('newvegas', state);
  } catch (e) { console.error('Could not save progress', e); }
}

async function syncPullAndReconcile(){
  if (!window.JawSync) return;
  try {
    const remote = await window.JawSync.pull(storageKey());
    if (!remote) return;
    const remoteParsed = JSON.parse(remote);
    const localRaw = localStorage.getItem(storageKey());
    const localParsed = localRaw ? JSON.parse(localRaw) : null;
    if (!localParsed || (remoteParsed.updatedAt || 0) > (localParsed.updatedAt || 0)) {
      favorites = new Set(remoteParsed.favorites || []);
      tracked = new Set(remoteParsed.tracked || []);
      localStorage.setItem(storageKey(), remote);
      renderAll();
    }
  } catch (e) { console.error('Sync pull failed', e); }
}
async function syncAccountPullAndReconcile(){
  if (!window.JawAccount || !window.JawAccount.isSignedIn()) return;
  try {
    const remote = await window.JawAccount.load('newvegas');
    if (!remote) return;
    const localRaw = localStorage.getItem(storageKey());
    const localParsed = localRaw ? JSON.parse(localRaw) : null;
    if (!localParsed || (remote.updatedAt || 0) > (localParsed.updatedAt || 0)) {
      favorites = new Set(remote.favorites || []);
      tracked = new Set(remote.tracked || []);
      localStorage.setItem(storageKey(), JSON.stringify(remote));
      renderAll();
    }
  } catch (e) { console.error('Account sync pull failed', e); }
}

function saveNavState(){
  try { localStorage.setItem(navStateKey(), JSON.stringify({ activeSection, activeSub })); } catch (e) {}
}
function loadNavState(){
  try {
    const raw = localStorage.getItem(navStateKey());
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && SECTIONS.some(sec => sec.id === s.activeSection)) activeSection = s.activeSection;
    if (s && 'activeSub' in s) activeSub = s.activeSub;
  } catch (e) {}
}

function entriesFor(sec, sub){ return ENTRIES.filter(e => e.sec === sec && (!sub || e.sub === sub)); }
function statFor(sec, sub){
  const scoped = entriesFor(sec, sub).filter(e => e.trackable);
  const done = scoped.filter(e => tracked.has(e.id)).length;
  return { done, total: scoped.length };
}
function sectionStat(sec){
  if (!TABS[sec]) return statFor(sec, null);
  let done = 0, total = 0;
  TABS[sec].forEach(t => { const s = statFor(sec, t.id); done += s.done; total += s.total; });
  return { done, total };
}
function overallStat(){
  let done = 0, total = 0;
  SECTIONS.filter(s => s.id !== 'overview').forEach(s => { const st = sectionStat(s.id); done += st.done; total += st.total; });
  return { done, total };
}

/* ============================= NAV ============================= */
function renderNav(){
  const btns = SECTIONS.map(s => `<button class="nav-btn ${activeSection===s.id?'active':''}" data-section="${s.id}">
      <span class="icon">${s.icon}</span> ${s.label}
    </button>`).join('');
  document.getElementById('nav-desktop').innerHTML = btns;
  document.getElementById('nav-mobile').innerHTML = btns;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSection = btn.dataset.section;
      activeSub = TABS[activeSection] ? TABS[activeSection][0].id : null;
      favOnly = false; hideCompleted = false; query = '';
      const si = document.getElementById('search'); if (si) si.value = '';
      syncFilterPills();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ============================= SUB TABS ============================= */
function renderSubRow(){
  const row = document.getElementById('sub-row');
  const tabs = TABS[activeSection];
  if (!tabs) { row.style.display = 'none'; row.innerHTML = ''; return; }
  if (!activeSub) activeSub = tabs[0].id;
  row.style.display = 'flex';
  row.innerHTML = tabs.map(t => {
    const s = statFor(activeSection, t.id);
    return `<button class="sub-pill ${activeSub===t.id?'active':''}" data-sub="${t.id}">${t.icon||''} ${t.label} <span class="n">${s.done}/${s.total}</span></button>`;
  }).join('');
  row.querySelectorAll('.sub-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSub = btn.dataset.sub;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ============================= HEADER ============================= */
function renderHeader(){
  const titles = {
    overview: ['The Courier\'s Log', '— field notes from the Mojave Wasteland —'],
    quests: ['Main Quest', '— from Goodsprings to the Second Battle of Hoover Dam —'],
    factions: ['Factions', '— NCR, Legion, House, the Strip families, and the wasteland in between —'],
    companions: ['Companions', '— the people (and machines) who ride the road with you —'],
    perks: ['Perks & Traits', '— the S.P.E.C.I.A.L. system, one level at a time —'],
    gear: ['Unique Gear', '— named weapons, armor and implants worth tracking down —'],
    locations: ['Places & Points of Interest', '— the Strip, the wasteland, the vaults, and beyond —'],
    treasure: ['Snow Globes & Notable Caches', '— collectibles and hidden loot worth the detour —'],
  };
  const [t, sub] = titles[activeSection] || titles.overview;
  document.getElementById('page-title').textContent = t;
  document.getElementById('page-subtitle').textContent = sub;
}

/* ============================= CARD RENDER ============================= */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderCard(e){
  const isFav = favorites.has(e.id);
  const isDone = tracked.has(e.id);
  const metaHtml = e.meta ? Object.entries(e.meta).filter(([,v])=>v).map(([k,v]) => `<span><b>${escapeHtml(k)}:</b> ${escapeHtml(v)}</span>`).join('') : '';
  const stepsHtml = (e.desc && e.desc.length) ? `<ul class="quest-steps">${e.desc.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>` : '';
  const rewardsHtml = (e.rewards && e.rewards.length) ? `<div class="rewards-row">${e.rewards.map(r => `<span class="reward-chip">${escapeHtml(r)}</span>`).join('')}</div>` : '';
  return `<div class="quest ${isDone?'done':''}" data-id="${e.id}">
    <div class="quest-top">
      <div class="quest-title-wrap"><h3>${escapeHtml(e.title)}</h3></div>
      <button class="fav-btn ${isFav?'active':''}" data-fav-id="${e.id}" title="Favorite">★</button>
    </div>
    <div class="quest-meta">${metaHtml}</div>
    ${stepsHtml}
    ${rewardsHtml}
    <div class="quest-foot">
      <label class="track-btn" data-track-id="${e.id}"><span class="box"></span> ${isDone ? 'Completed / Obtained' : 'Mark complete'}</label>
    </div>
  </div>`;
}

function wireCards(container){
  container.querySelectorAll('[data-fav-id]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const id = Number(btn.dataset.favId);
      if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
      saveProgress();
      renderAll();
    });
  });
  container.querySelectorAll('[data-track-id]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const id = Number(el.dataset.trackId);
      if (tracked.has(id)) tracked.delete(id); else tracked.add(id);
      saveProgress();
      renderAll();
    });
  });
}

/* ============================= SECTION RENDERERS ============================= */
function renderOverview(){
  const overall = overallStat();
  const pct = overall.total ? Math.round((overall.done/overall.total)*100) : 0;
  const circumference = 2 * Math.PI * 43;
  const offset = circumference * (1 - pct/100);
  let html = `<div class="overview-hero">
    <div class="completion-ring-wrap">
      <svg class="completion-ring" viewBox="0 0 104 104">
        <circle class="completion-ring-track" cx="52" cy="52" r="43"></circle>
        <circle class="completion-ring-fill" cx="52" cy="52" r="43" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="completion-ring-pct">${pct}%</div>
    </div>
    <div class="overview-hero-info">
      <div class="overview-hero-title">Overall progress</div>
      <div class="overview-hero-count">${overall.done} of ${overall.total} entries tracked across every section</div>
      <span class="points-total-badge">☢ ${favorites.size} favorited</span>
    </div>
  </div>
  <div class="dash-grid">`;
  SECTIONS.filter(s => s.id !== 'overview').forEach(s => {
    const st = sectionStat(s.id);
    const p = st.total ? Math.round((st.done/st.total)*100) : 0;
    html += `<div class="dash-card" data-jump="${s.id}">
      <div class="dash-card-top"><span class="dash-icon">${s.icon}</span><span class="dash-label">${s.label}</span></div>
      <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${p}%"></div></div>
      <div class="dash-count">${st.done} / ${st.total} tracked</div>
    </div>`;
  });
  html += `</div>
  <div class="reset-zone" style="margin-top:24px;">
    <button class="reset-btn" id="reset-btn">Reset all progress</button>
    <span class="reset-hint">Clears every favorite and completion mark. Click twice to confirm.</span>
  </div>`;
  document.getElementById('entries').innerHTML = html;
  document.querySelectorAll('[data-jump]').forEach(card => {
    card.addEventListener('click', () => {
      activeSection = card.dataset.jump;
      activeSub = TABS[activeSection] ? TABS[activeSection][0].id : null;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  const resetBtn = document.getElementById('reset-btn');
  if (resetBtn) {
    let armed = false;
    resetBtn.addEventListener('click', () => {
      if (!armed) { armed = true; resetBtn.classList.add('armed'); resetBtn.textContent = 'Click again to confirm'; return; }
      favorites = new Set(); tracked = new Set();
      saveProgress();
      renderAll();
    });
  }
}

function renderSearchResults(){
  const q = query.toLowerCase();
  const results = SEARCH_INDEX.filter(r => r.searchText.includes(q));
  let html = `<p class="search-section-note">${results.length} result${results.length===1?'':'s'} for "${escapeHtml(query)}"</p>`;
  if (!results.length) { html += `<div class="empty-state">No entries found</div>`; document.getElementById('entries').innerHTML = html; return; }
  html += results.map(r => `<div class="quest search-result-card" data-jump-nav='${JSON.stringify(r.nav)}'>
    <div class="quest-top"><div class="quest-title-wrap"><span class="result-icon">${r.icon}</span><h3>${escapeHtml(r.title)}</h3></div></div>
    <div class="quest-meta"><span>${escapeHtml(r.sectionLabel)}</span></div>
    <p class="ach-desc">${escapeHtml(r.snippet||'')}</p>
  </div>`).join('');
  document.getElementById('entries').innerHTML = html;
  document.querySelectorAll('[data-jump-nav]').forEach(card => {
    card.addEventListener('click', () => {
      const nav = JSON.parse(card.dataset.jumpNav);
      activeSection = nav.section; activeSub = nav.sub;
      query = ''; const si = document.getElementById('search'); if (si) si.value = '';
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function renderEntriesSection(){
  let list = entriesFor(activeSection, TABS[activeSection] ? activeSub : null);
  if (favOnly) list = list.filter(e => favorites.has(e.id));
  if (hideCompleted) list = list.filter(e => !tracked.has(e.id));
  const container = document.getElementById('entries');
  if (!list.length) { container.innerHTML = `<div class="empty-state">No entries here yet</div>`; return; }
  container.innerHTML = list.map(renderCard).join('');
  wireCards(container);
}

/* ============================= MASTER RENDER ============================= */
function renderAll(){
  renderNav();
  renderHeader();
  document.getElementById('search-row').style.display = 'flex';
  syncFilterPills();
  if (activeSection === 'overview') {
    document.getElementById('sub-row').style.display = 'none';
    if (query.trim()) renderSearchResults(); else renderOverview();
  } else if (query.trim()) {
    document.getElementById('sub-row').style.display = 'none';
    renderSearchResults();
  } else {
    renderSubRow();
    renderEntriesSection();
  }
  const tally = document.getElementById('progress-tally');
  if (activeSection !== 'overview' && (TABS[activeSection] || entriesFor(activeSection,null).length)) {
    const s = TABS[activeSection] ? statFor(activeSection, activeSub) : statFor(activeSection, null);
    tally.style.display = 'inline';
    tally.textContent = `${s.done} / ${s.total} complete`;
  } else { tally.style.display = 'none'; }
  saveNavState();
}

/* ============================= FILTER / SEARCH WIRING ============================= */
document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; renderAll(); });
document.querySelectorAll('.filter-pill[data-fav]').forEach(p => {
  p.addEventListener('click', () => { favOnly = p.dataset.fav === 'favorites'; syncFilterPills(); renderAll(); });
});
document.querySelector('.filter-pill[data-hide-done]').addEventListener('click', (e) => {
  hideCompleted = !hideCompleted; syncFilterPills(); renderAll();
});

/* ============================= BACK TO TOP ============================= */
const backToTop = document.getElementById('back-to-top');
window.addEventListener('scroll', () => { backToTop.classList.toggle('visible', window.scrollY > 600); });
backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* ============================= INIT ============================= */
loadProgress();
loadNavState();
if (!TABS[activeSection] && activeSection !== 'overview' && activeSection !== 'companions') activeSection = 'overview';
if (TABS[activeSection] && !activeSub) activeSub = TABS[activeSection][0].id;
renderAll();
syncPullAndReconcile();
if (window.JawAccount) {
  window.__jawSyncOnConfigured = () => { syncPullAndReconcile(); };
  window.addEventListener('jaw-account-ready', syncAccountPullAndReconcile);
  syncAccountPullAndReconcile();
}
</script>
<script src="../studio-nav.js" defer></script>
