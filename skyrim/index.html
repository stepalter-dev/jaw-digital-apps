<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dragonborn's Field Journal — Skyrim Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral+SC:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    /* canvas — deep charcoal slate, in-game menu darkness */
    --void: #0B0D0E;
    --stone-1: #0D1012;
    --stone-2: #121517;
    --stone-3: #171B1E;
    --stone-4: #1C2124;
    --stone-5: #242A2E;
    /* card/panel surface + etched iron borders + inner highlight */
    --panel: rgba(18, 22, 26, 0.75);
    --panel-hi: rgba(255, 255, 255, 0.05);
    --iron: #2A3138;
    --iron-light: #8E9499;
    /* frost starlight — active states / glows / interactive accents */
    --frost: #A2C4D9;
    --frost-dim: #5F7D8F;
    /* antique rune-bronze — key highlights */
    --gold: #C49E64;
    --gold-bright: #D8BD8C;
    --gold-dim: #96794A;
    /* text & headings — bone/weathered silver-white; meta — muted stone-gray */
    --heading: #DCD8C8;
    --ink: #DCD8C8;
    --ink-soft: #8E9499;
    --ink-dim: #5F6569;
    --blood: #A24B45;
    /* "done"/success accent — a completed quest reads as an active frost glow */
    --sage-ok: #A2C4D9;
    /* desaturated moss-green — shared by The Reach's map-hold fill and (historically) the Fishing
       "Uncommon" tag. The Fishing tag now uses its own --tag-uncommon below instead: --moss's hue sits
       too close to --ink-soft at a glance to read as a distinct rarity tier next to Common. */
    --moss: #93A886;
    /* Fishing rarity tags only — a clearly blue/green/grey trio, desaturated to fit the theme but with
       enough hue separation to actually read as three different tiers at a glance (Rare reuses --frost). */
    --tag-uncommon: #7FA35E;
    --tag-common: #9A968C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(196,158,100,0.04), transparent 40%),
      radial-gradient(ellipse at 12% 0%, rgba(162,196,217,0.05), transparent 50%),
      radial-gradient(circle at 50% 42%, transparent 30%, rgba(0,0,0,0.6) 100%);
    font-family: 'Spectral', serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  .tome {
    width: min(95vw, 1520px);
    margin: 0 auto;
    display: flex;
    gap: 0;
    box-shadow: 0 30px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(42,49,56,0.7);
    border-radius: 0;
    overflow: hidden;
  }

  /* ---------- SIDE NAV (desktop) ---------- */
  .nav {
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--stone-2), var(--stone-1));
    padding: 28px 0 20px;
    min-width: 210px;
    flex-shrink: 0;
    position: relative;
    border-right: 1px solid var(--iron);
  }
  .nav::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, transparent 2px 44px);
    pointer-events: none;
  }
  .nav-brand {
    font-family: 'Cinzel Decorative', serif;
    font-size: 15px;
    color: var(--gold);
    text-align: center;
    letter-spacing: 0.1em;
    padding: 0 16px 20px;
    border-bottom: 1px solid var(--iron);
    margin-bottom: 10px;
  }
  .nav-brand .rune-row { color: var(--frost-dim); font-size: 11px; letter-spacing: 0.3em; display:block; margin-top:6px; }

  .nav-btn {
    all: unset;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    margin: 1px 8px;
    color: var(--ink-soft);
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 0;
    transition: background .15s ease, color .15s ease;
    border-left: 2px solid transparent;
  }
  .nav-btn .icon { font-size: 15px; filter: saturate(0.6); flex-shrink: 0; width: 18px; text-align: center; }
  .nav-btn .count {
    margin-left: auto;
    font-family: 'Spectral', serif;
    font-size: 10px;
    opacity: 0.6;
  }
  .nav-btn .count::before { content: '[ '; }
  .nav-btn .count::after { content: ' ]'; }
  .nav-btn:hover { background: rgba(162,196,217,0.06); color: var(--heading); }
  .nav-btn.active {
    background: rgba(196,158,100,0.09);
    color: var(--gold-bright);
    border-left-color: var(--gold);
    text-shadow: 0 0 10px rgba(196,158,100,0.25);
  }
  .nav-btn.active .count { color: var(--gold); opacity: 1; }

  .nav-mobile { display: none; }

  /* ---------- PAGE ---------- */
  .page {
    flex: 1;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(196,158,100,0.03), transparent 45%),
      radial-gradient(ellipse at 100% 100%, rgba(0,0,0,0.45), transparent 55%),
      linear-gradient(165deg, var(--stone-3), var(--stone-2) 65%, var(--stone-1));
    background-color: var(--stone-2);
    padding: 34px clamp(24px, 3.4vw, 54px) 50px;
    position: relative;
    min-height: 680px;
    min-width: 0;
  }
  .page::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: 0.5;
    mix-blend-mode: overlay;
  }

  header.title-block {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 2px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(20px, 3vw, 30px);
    color: var(--heading);
    margin: 0;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .subtitle {
    font-family: 'Spectral SC', serif;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-top: 5px;
  }
  .seal {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    color: var(--gold-dim);
    background: rgba(0,0,0,0.3);
    border: 2px solid var(--gold-dim);
    border-radius: 50%;
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
    letter-spacing: 0.04em;
    transform: rotate(-6deg);
    opacity: 0.9;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  /* Skyrim's signature rule — a razor-thin line fading at the edges, broken by a centered rune */
  .rune-divider {
    position: relative;
    height: 15px;
    margin: 6px 0 20px;
  }
  .rune-divider::before {
    content: "";
    position: absolute;
    top: 50%; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--iron) 12%, var(--iron) 88%, transparent 100%);
  }
  .rune-divider::after {
    content: "◆";
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%,-50%);
    color: var(--gold-dim);
    font-size: 9px;
    background: var(--stone-2);
    padding: 0 10px;
    line-height: 1;
  }

  /* search */
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .search-plate {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(11,13,14,0.55);
    color: var(--ink);
    padding: 9px 14px;
    border-radius: 0;
    border: 1px solid var(--iron);
    box-shadow: inset 0 1px 0 var(--panel-hi);
    flex: 1;
    min-width: 220px;
  }
  .search-plate input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: 'Spectral', serif;
    font-size: 13px;
    width: 100%;
    letter-spacing: 0.02em;
  }
  .search-plate input::placeholder { color: var(--ink-dim); }

  /* floating "back to top" button — appears once the reader has scrolled a screen or more down a
     long list, so jumping back to the search bar/filters doesn't require manual scrolling.
     Bottom-LEFT deliberately: sync.js's own status widget already fixes itself to bottom-right
     (bottom:14px;right:14px;z-index:99999) on every page, so the right corner is taken. */
  .back-to-top {
    position: fixed;
    left: 22px;
    bottom: 22px;
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    backdrop-filter: blur(4px);
    border: 1px solid var(--iron);
    box-shadow: inset 0 1px 0 var(--panel-hi), 0 4px 14px rgba(0,0,0,0.45);
    color: var(--gold-bright);
    font-size: 18px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity .2s ease, transform .2s ease, border-color .15s ease, color .15s ease;
  }
  .back-to-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .back-to-top:hover { border-color: var(--gold-dim); color: var(--gold); }

  .filter-pill {
    font-family: 'Cinzel', serif;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 7px 10px 6px;
    border-radius: 0;
    cursor: pointer;
    user-select: none;
    text-transform: uppercase;
    transition: color .15s ease, border-color .15s ease, text-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-pill:hover { color: var(--heading); border-bottom-color: rgba(162,196,217,0.5); text-shadow: 0 0 10px rgba(162,196,217,0.3); }
  .filter-pill:focus { outline: none; }
  .filter-pill:focus-visible { outline: none; color: var(--heading); border-bottom-color: rgba(162,196,217,0.5); text-shadow: 0 0 10px rgba(162,196,217,0.3); }
  .filter-pill.active { color: var(--gold-bright); border-bottom-color: var(--gold); text-shadow: 0 0 10px rgba(196,158,100,0.25); }

  /* sub nav (questlines) */
  .sub-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .sub-pill {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 7px 12px 6px;
    border-radius: 0;
    cursor: pointer;
    text-transform: uppercase;
    transition: color .15s ease, border-color .15s ease, text-shadow .15s ease;
    /* No CSS reset existed for focus/tap on these pills, so whenever one actually received focus
       (keyboard tab order, touch tap-highlight, some browsers' click-to-focus on non-form elements)
       the browser's default focus ring — a plain solid box in an unrelated color — rendered on top
       of/alongside our custom underline "active" treatment, looking like two different pills were
       both "selected" at once. Reset that default box and fold focus into the same visual language
       used everywhere else (hover's frost underline, or gold if it's also .active — see below). */
    -webkit-tap-highlight-color: transparent;
  }
  .sub-pill:hover { color: var(--heading); border-bottom-color: rgba(162,196,217,0.5); text-shadow: 0 0 10px rgba(162,196,217,0.3); }
  .sub-pill:focus { outline: none; }
  .sub-pill:focus-visible { outline: none; color: var(--heading); border-bottom-color: rgba(162,196,217,0.5); text-shadow: 0 0 10px rgba(162,196,217,0.3); }
  .sub-pill.active { color: var(--gold-bright); border-bottom-color: var(--gold); text-shadow: 0 0 10px rgba(196,158,100,0.25); }
  .sub-pill .n { opacity:0.65; font-size:9px; margin-left:2px; }
  .sub-pill .n::before { content: '[ '; }
  .sub-pill .n::after { content: ' ]'; }

  .branch-banner {
    background: rgba(162,75,69,0.08);
    border: 1px solid var(--blood);
    border-radius: 0;
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    position: relative;
    z-index: 1;
  }
  .branch-banner b { color: var(--blood); font-family:'Cinzel', serif; font-size: 11px; letter-spacing:0.06em; text-transform: uppercase; }

  /* dashboard */
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
    position: relative;
    z-index: 1;
  }
  .dash-card {
    background: var(--panel);
    border: 1px solid var(--iron);
    border-left: 3px solid var(--gold-dim);
    border-radius: 0;
    padding: 16px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 var(--panel-hi);
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .dash-card:hover { transform: translateY(-2px); border-color: var(--frost-dim); box-shadow: 2px 6px 18px rgba(0,0,0,0.5), inset 0 1px 0 var(--panel-hi), 0 0 12px rgba(162,196,217,0.12); }
  .dash-card.disabled { cursor: default; opacity: 0.5; }
  .dash-card.disabled:hover { transform: none; border-color: var(--iron); box-shadow: inset 0 1px 0 var(--panel-hi); }
  .dash-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dash-icon { font-size: 18px; }
  .dash-label { font-family: 'Cinzel', serif; font-size: 12px; color: var(--heading); letter-spacing: 0.08em; text-transform: uppercase; }
  .dash-bar-track { background: rgba(0,0,0,0.4); border: 1px solid var(--iron); border-radius: 0; height: 7px; overflow: hidden; margin-bottom: 8px; }
  .dash-bar-fill { background: var(--gold); height: 100%; border-radius: 0; transition: width .3s ease; }
  .dash-count { font-family: 'Spectral', serif; font-size: 11px; color: var(--ink-soft); }
  .dash-soon { font-family: 'Spectral', serif; font-size: 11px; color: var(--ink-dim); opacity: 0.85; font-style: italic; }

  /* Overview hero: combined completion ring + achievement points total, distinct from the per-section
     dash-cards below it. The ring is an SVG circle animated via stroke-dashoffset. */
  .overview-hero {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--iron);
    box-shadow: inset 0 1px 0 var(--panel-hi);
    padding: 22px 26px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .completion-ring-wrap { position: relative; width: 104px; height: 104px; flex-shrink: 0; }
  .completion-ring { width: 104px; height: 104px; transform: rotate(-90deg); }
  .completion-ring-track { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 9; }
  .completion-ring-fill { fill: none; stroke: var(--gold); stroke-width: 9; stroke-linecap: butt; transition: stroke-dashoffset .6s ease; }
  .completion-ring-pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: 21px; font-weight: 600; color: var(--heading);
  }
  .overview-hero-info { flex: 1; min-width: 220px; }
  .overview-hero-title { font-family: 'Cinzel', serif; font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-bright); margin-bottom: 4px; }
  .overview-hero-count { font-family: 'Spectral', serif; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .points-total-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: 'Spectral SC', serif; font-size: 12.5px; letter-spacing: 0.02em; color: var(--gold-bright);
    background: rgba(196,158,100,0.1); border: 1px solid rgba(196,158,100,0.35);
    padding: 6px 13px;
  }

  /* Export / Import progress buttons — visually distinct from the destructive red Reset button */
  .io-btn {
    all: unset;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--frost);
    border: 1px solid var(--frost-dim);
    border-radius: 0;
    padding: 8px 14px;
    text-transform: uppercase;
  }
  .io-btn:hover { background: rgba(162,196,217,0.1); }
  .io-status { font-family: 'Spectral', serif; font-size: 11.5px; opacity: 0.9; }
  .io-status.ok { color: var(--sage-ok); }
  .io-status.err { color: var(--blood); }

  .reset-zone {
    margin-top: 8px;
    padding-top: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .reset-btn {
    all: unset;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--blood);
    border: 1px solid var(--blood);
    border-radius: 0;
    padding: 8px 14px;
    text-transform: uppercase;
  }
  .reset-btn:hover { background: rgba(162,75,69,0.12); }
  .reset-btn.armed { background: var(--blood); color: var(--stone-1); }
  .reset-hint { font-family: 'Spectral', serif; font-size: 11.5px; color: var(--ink-soft); opacity: 0.8; }

  /* quest / entry cards */
  .entries { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
  .entries.grid-mode { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); align-items: start; }
  .ach-group-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 4px; }

  .quest {
    background: var(--panel);
    border: 1px solid var(--iron);
    border-left: 3px solid var(--gold-dim);
    border-radius: 0;
    padding: 16px 18px 14px;
    position: relative;
    box-shadow: 0 3px 16px rgba(0,0,0,0.4), inset 0 1px 0 var(--panel-hi);
  }
  .quest.done { border-left-color: var(--sage-ok); }
  .quest.alt { border-left-color: var(--blood); border-left-style: dashed; }
  .quest.optional { border-left-color: var(--frost-dim); }

  .quest-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
  .quest-title-wrap { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .quest-order { font-family:'Spectral SC', serif; font-size: 11px; color: var(--gold-dim); }
  .quest h3 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 14.5px; margin: 0; color: var(--heading); letter-spacing: 0.02em; line-height: 1.35; }
  .tag-chip {
    font-family: 'Spectral SC', serif;
    font-size: 9.5px;
    letter-spacing: 0.03em;
    padding: 2px 7px;
    border-radius: 0;
    text-transform: uppercase;
  }
  .tag-optional { background: rgba(162,196,217,0.14); color: var(--frost); }
  .tag-alt { background: rgba(162,75,69,0.16); color: var(--blood); }
  /* Fishing rarity tags — Rare reuses frost-blue, Uncommon gets a desaturated moss-green, Common
     stays neutral stone-grey; "Common to uncommon" is treated as the rarer (uncommon) tier. */
  .tag-rare { background: rgba(162,196,217,0.14); color: var(--frost); }
  .tag-uncommon { background: rgba(127,163,94,0.18); color: var(--tag-uncommon); }
  .tag-common { background: rgba(154,150,140,0.16); color: var(--tag-common); }

  .fav-btn, .track-btn { all: unset; cursor: pointer; }
  .fav-btn { font-size: 16px; line-height: 1; flex-shrink: 0; color: var(--ink-dim); opacity: 0.7; transition: color .15s ease, opacity .15s ease, transform .15s ease; }
  .fav-btn:hover { color: var(--gold-dim); opacity: 1; }
  .fav-btn.active { color: var(--gold-bright); opacity: 1; transform: scale(1.12); text-shadow: 0 0 8px rgba(216,189,140,0.45); }

  .quest-meta { font-family: 'Spectral', serif; font-size: 11.5px; color: var(--ink-soft); margin: 3px 0 10px; opacity: 0.95; }
  .quest-meta span { margin-right: 12px; }
  .quest-meta b { color: var(--heading); font-weight: 600; }

  .quest-steps { margin: 0 0 10px; padding-left: 20px; font-size: 12.8px; line-height: 1.55; color: var(--ink); }
  .quest-steps li { margin-bottom: 4px; }

  .choice-box {
    background: rgba(196,158,100,0.07);
    border: 1px solid var(--gold-dim);
    border-radius: 0;
    padding: 9px 12px;
    margin: 0 0 10px;
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .choice-box b { font-family: 'Cinzel', serif; font-size: 10.5px; letter-spacing: 0.06em; color: var(--gold-bright); text-transform: uppercase; display:block; margin-bottom:4px; }

  .rewards-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .reward-chip {
    font-family: 'Spectral', serif;
    font-size: 11px;
    color: var(--gold-bright);
    background: rgba(196,158,100,0.1);
    border: 1px solid rgba(196,158,100,0.35);
    padding: 3px 9px;
    border-radius: 0;
    margin: 0;
  }
  .reward-chip.matched { background: rgba(196,158,100,0.32); border-color: var(--gold); color: var(--gold-bright); }

  /* Alchemy effect-lookup: each ingredient's 4 effect chips become clickable buttons that surface every
     other ingredient sharing that effect — the actual pairing info a player needs to brew a potion. */
  button.reward-chip.effect-chip {
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }

  /* Achievements grid: 3 cards per row on desktop, 2 on tablet, 1 on mobile — scoped to .ach-grid so the

     .ach-categories wraps every category header + grid as a single child of #entries so it spans the
     full row of the outer auto-fill grid (see the 1180px/1680px rules below) instead of each header and
     each grid being auto-placed into its own ~400-460px column — which was squeezing the 3-up grid into
     a narrow strip and leaving a large empty gap next to the sidebar. */
  .ach-categories { grid-column: 1 / -1; width: 100%; }
  .ach-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 4px; }
  @media (min-width: 700px) {
    .ach-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1180px) {
    .ach-grid { grid-template-columns: repeat(3, 1fr); }

    display: flex;
    flex-direction: column;
    height: 100%;
    margin: 0;
  }
  .ach-grid .ach-card .quest-title-wrap { flex-direction: column; align-items: flex-start; gap: 5px; }
  .ach-grid .ach-card .ach-desc { flex-grow: 1; }
  .ach-grid .ach-card .quest-foot { margin-top: auto; padding-top: 6px; }

  /* Global search results — reuses .ach-grid/.ach-card for the compact 3/2/1 responsive layout; each
     result is a clickable card (not a tracked entry, so no fav/track buttons) that jumps to and
     highlights the real entry elsewhere in the app, same as the existing cross-link buttons. */
  .search-result-card { cursor: pointer; transition: border-left-color .15s ease, background .15s ease; }
  .search-result-card:hover { border-left-color: var(--frost); background: rgba(162,196,217,0.05); }
  .search-result-card .quest-title-wrap { flex-direction: row; align-items: baseline; }
  .search-result-card .result-icon { margin-right: 7px; opacity: 0.85; }
  .search-result-card .ach-desc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .search-section-note { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; }

  /* Perk Trees: skill selector (grouped by Combat/Magic/Stealth, one skill shown at a time) + a compact
     2-3 up grid for that skill's perks. .skill-view reuses the .ach-categories full-row trick so the whole
     block (tab pills, selector, and grid) is a single child of #entries instead of letting the outer
     auto-fill grid interleave/misplace the tree header and its card grid as separate items. */
  .skill-view { grid-column: 1 / -1; width: 100%; }
  .skill-select { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  /* No flex-wrap here: the row itself must never break, or the label (as one flex item) gets pushed
     onto its own line above the pills (as the other flex item) — that's what caused the stagger. The
     label has flex-shrink:0 so it always keeps its width; .skill-select-pills is left free to shrink
     and wrap ITS OWN children internally, keeping the label inline at the start of the row. */
  .skill-select-row { display: flex; align-items: flex-start; gap: 10px; }
  .skill-select-label { font-family:'Cinzel', serif; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); opacity: 0.65; width: 60px; flex-shrink: 0; padding-top: 6px; }

    'Return the Horn to Arngeir at High Hrothgar.',
    'Learn the final word of Unrelenting Force from Wulfgar.',
    'Receive the Greybeards\' formal recognition as Dragonborn.'
  ],
  rewards:['Final word of Unrelenting Force', 'Word for Become Ethereal', 'Free access to High Hrothgar'], trackable:true },

{ id:106, line:'main', order:7, title:'A Blade in the Dark', giver:'Delphine', location:'Sleeping Giant Inn (Riverwood), Kynesgrove',
  steps:[
    'Follow the note left in Ustengrav to the Sleeping Giant Inn in Riverwood and meet innkeeper Delphine.',
    'Learn that Delphine is secretly a Blade, and that she gave you the Horn as a test.',
    'Travel to Kynesgrove to intercept a dragon burial mound.',
    'Witness Alduin resurrect the dragon Sahloknir and kill it to prove you are Dragonborn.'
  ],
  rewards:[], trackable:true },

{ id:107, line:'main', order:8, title:'Diplomatic Immunity', giver:'Delphine', location:'Riverwood, Solitude, Thalmor Embassy',
  steps:[
    'Talk to Delphine, who wants proof the Thalmor are hunting dragons.',
    'Travel to Solitude and meet the smuggler Malborn, handing off any gear you want smuggled in.',
    'Attend the Thalmor Embassy party in disguise; create a diversion and slip away with Malborn.',
    'Steal Thalmor intelligence documents from the ambassador\'s solar and the dungeon below.',
    'Escape the embassy (optionally free the prisoner Etienne Rarnis).'
  ],
  rewards:[], trackable:true },

{ id:108, line:'main', order:9, title:'A Cornered Rat', giver:'Delphine', location:'Riften, the Ratway', level:'8',
  steps:[
    'Report the stolen Thalmor intel to Delphine, who reveals a fellow Blade, Esbern, may still be alive.',
    'Travel to Riften and search the criminal-run Ratway for Esbern\'s hidden warren.',
    'Use the secret passphrase to earn Esbern\'s trust.',
    'Escort Esbern back to Delphine at the Sleeping Giant Inn.'
  ],
  rewards:[], trackable:true },

{ id:109, line:'main', order:10, title:"Alduin's Wall", giver:'Esbern', location:'The Ratway, Riverwood, Sky Haven Temple',
  steps:[
    'Escort Esbern out of the Ratway and back to Riverwood to reunite with Delphine.',
    'Travel with both Blades to their hidden stronghold, Sky Haven Temple, past the Karthspire troll gauntlet.',
    'Examine the ancient mural, Alduin\'s Wall, depicting the first-era Nords\' defeat of Alduin using the Dragonrend shout.'
  ],
  rewards:['Dragonbane (unique sword, bonus damage vs. dragons)'], trackable:true },

{ id:110, line:'main', order:11, title:'The Throat of the World', giver:'Delphine', location:'High Hrothgar, Throat of the World',
  steps:[
    'Return to High Hrothgar and finish learning Unrelenting Force if you have not already.',
    'Tell Arngeir you need the Dragonrend shout — the Greybeards refuse, since it was "given, not learned."',
    'Climb to Paarthurnax atop the Throat of the World, who teaches Clear Skies as a lesson and shares more of Alduin\'s history.'
  ],
  rewards:['Word for Fire Breath', 'Full Clear Skies shout'], trackable:true },

{ id:111, line:'main', order:12, title:'Elder Knowledge', giver:'Paarthurnax', location:'Throat of the World, Septimus Signus\'s Outpost, Alftand, Blackreach, Tower of Mzark', level:'18 · Hard',
  steps:[
    'Learn from Paarthurnax that Dragonrend can\'t be taught normally — you need an Elder Scroll instead.',
    'Research at the College of Winterhold points to Septimus Signus\'s Outpost in the far north.',
    'Retrieve a Dwemer lockbox from the ruins of Alftand for Septimus.',
    'Descend through Alftand into the vast underground cavern of Blackreach.',
    'Reach the Tower of Mzark and use the Dwemer mechanism to claim the Elder Scroll.'
  ],
  rewards:['An Elder Scroll'], trackable:true },

{ id:112, line:'main', order:13, title:"Alduin's Bane", giver:'Automatic (on acquiring the Elder Scroll)', location:'Throat of the World',
  steps:[
    'Return to Paarthurnax at the Throat of the World with the Elder Scroll.',
    'Use the Elder Scroll at the Time-Wound to witness a vision of ancient Nord heroes using Dragonrend against Alduin, learning the shout instantly.',
    'Fight Alduin as he arrives — Dragonrend grounds him, but he flees wounded rather than dying.'
  ],
  rewards:['Dragonrend shout (all 3 words at once)'], trackable:true },

{ id:113, line:'main', order:14, title:'The Fallen', giver:'Automatic (after Alduin flees)', location:'Throat of the World, High Hrothgar / Sky Haven Temple, Dragonsreach',
  steps:[
    'Consult Paarthurnax, Arngeir, or Esbern about tracking down Alduin.',
    'Travel to Whiterun and speak to the Jarl about using Dragonsreach\'s ancient dragon-trap mechanism.',
    'If neither Civil War side controls most of Skyrim, the Jarl may insist on a truce first (triggers the optional Season Unending).',
    'Use a Shout to lure a dragon, Odahviing, into the trap at Dragonsreach, then weaken and capture him.',
    'Interrogate Odahviing — he reveals Alduin fled to Sovngarde and offers to fly you to his mountain lair in exchange for his freedom.'
  ],
  rewards:['All words of the Call Dragon shout'], trackable:true },

{ id:114, line:'main', order:15, optional:true, title:'Season Unending', giver:'Jarl Balgruuf or Vignar Gray-Mane', location:'Solitude, Windhelm, High Hrothgar',
  steps:[
    'Triggered mid-"The Fallen" if the Jarl of Whiterun insists on a truce before Dragonsreach\'s trap can be used.',
    'Travel to High Hrothgar and convince Arngeir to have the Greybeards host a peace council.',
    'Get General Tullius (Solitude) and Ulfric Stormcloak (Windhelm) to agree to attend.',
    'Return to High Hrothgar and negotiate the treaty — trading which holds go to which side and setting a truce duration.'
  ],
  choice:{ flag:'Requires a Civil War side', text:'This quest only pays off if you\'ve already joined the Imperial Legion or the Stormcloaks — the negotiated treaty favors whichever side you\'ve joined. It\'s skipped automatically if one side already controls 8 of Skyrim\'s 9 holds.' },
  rewards:['Call Dragon shout (all 3 words)'], trackable:true },

{ id:115, line:'main', order:16, optional:true, title:'Paarthurnax', giver:'Esbern or Delphine', location:'Sky Haven Temple, Throat of the World',
  steps:[
    'Triggered either at your discretion after Alduin\'s Bane, or automatically if Delphine confronts you during Season Unending.',
    'Delphine and Esbern reveal Paarthurnax was Alduin\'s lieutenant during the ancient dragons\' tyranny, before teaching mortals Dragonrend and turning on his master.',
    'As Blades, their oath demands his death — they refuse further help until it\'s done.',
    'Arngeir and the Greybeards vehemently defend Paarthurnax\'s redemption if you ask them.'
  ],
  choice:{ flag:'Choice Point — spare or kill Paarthurnax', text:'Kill Paarthurnax at the Throat of the World to satisfy the Blades\' oath (this permanently damages your standing with the Greybeards, and is generally seen as the darker option since Paarthurnax is a genuinely reformed ally). Or refuse and spare him, siding with the Greybeards (Delphine and Esbern are upset but won\'t attack you, and this does not block the Main Quest). You can also simply never resolve it. Killing him is NOT required to finish the game.' },
  rewards:['Free access to Sky Haven Temple restored (if Paarthurnax is killed)'], trackable:true },

{ id:116, line:'main', order:17, title:"The World-Eater's Eyrie", giver:'Automatic (via Odahviing)', location:'Skuldafn',
  steps:[
    'Odahviing flies you to Skuldafn, an ancient temple where Alduin\'s portal to Sovngarde resides, then leaves you to fight alone.',
    'Battle through Skuldafn\'s draugr and dragon priests to reach the portal.',
    'Step through the portal into Sovngarde.'
  ],
  rewards:[], trackable:true },

{ id:117, line:'main', order:18, title:'Sovngarde', giver:'Automatic', location:'Sovngarde',
  steps:[
    'Arrive in the mist-shrouded Nordic afterlife and learn Alduin has been devouring the souls trapped here.',
    'Navigate the misty plain, fighting or avoiding Alduin\'s minions, to reach the Hall of Valor.',
    'Recruit the spirits of three legendary Nord heroes — Gormlaith Golden-Hilt, Hakon One-Eye, and Felldir the Old — who once helped defeat Alduin.'
  ],
  rewards:[], trackable:true },

{ id:118, line:'main', order:19, title:'Dragonslayer', giver:'Automatic', location:'Sovngarde',
  steps:[
    'Engage Alduin in the climactic battle across Sovngarde\'s plain alongside the three ancient heroes.',
    'Use Dragonrend to repeatedly ground Alduin and wear him down in combat.',
    'Deliver the final blow, banishing Alduin and freeing the trapped souls of Sovngarde.'
  ],
  rewards:['Ends the Main Quest — recognized as Skyrim\'s hero, the Dragonborn'], trackable:true },

/* ======================= THIEVES GUILD ======================= */
{ id:200, line:'thieves', order:1, title:'A Chance Arrangement', giver:'Brynjolf', location:'Riften',
  steps:[
    'Meet Brynjolf at the Riften market (day) or the Bee and Barb (night); he wants to frame merchant Brand-Shei.',
    "Steal Madesi's Silver Ring from his locked stall cabinet and strongbox — pickpocket his key, or pick the locks at night.",
    'Plant the ring on Brand-Shei (or drop it and admit you couldn\'t go through with it — either passes the test).',
    'Report back to Brynjolf.'
  ],
  rewards:['100 gold'], trackable:true },

{ id:201, line:'thieves', order:2, title:'Taking Care of Business', giver:'Brynjolf', location:'Riften, the Ragged Flagon',
  steps:[
    'Meet Brynjolf at the Ragged Flagon, reached through the Ratway beneath Riften.',
    'Collect three debts by any means — persuade, bribe, intimidate, or pay yourself — from Keerava, Bersi Honey-Hand, and Haelga.',
    'Return to Brynjolf to officially join the Thieves Guild.'
  ],
  rewards:['Thieves Guild membership', 'Leveled potions'], trackable:true },

{ id:202, line:'thieves', order:3, title:'Loud and Clear', giver:'Mercer Frey (via Brynjolf)', location:'Goldenglow Estate', level:'6',
  steps:[
    'Mercer Frey sends you to Goldenglow Estate, a mead farm whose owner Aringoth has stopped paying the Guild and hired mercenaries.',
    'Sneak or fight in (a sewer entrance is optional) and burn three beehives to create a diversion.',
    "Crack Aringoth's safe (or find the key) and retrieve the Goldenglow Bill of Sale.",
    'Return the Bill of Sale to Brynjolf.'
  ],
  rewards:['Leveled gold'], trackable:true },

{ id:203, line:'thieves', order:4, title:'Dampened Spirits', giver:'Maven Black-Briar', location:'Ragged Flagon, Bannered Mare, Honningbrew Meadery', level:'8',
  steps:[
    'Report to power player Maven Black-Briar, who wants rival mead-maker Sabjorn ruined.',
    'Meet contact Mallus Maccius at the Bannered Mare in Whiterun.',
    'Infiltrate Honningbrew Meadery; kill the giant skeever infestation for a cover story.',
    "Sabotage the mead vat with skeever poison so Sabjorn's big taste-test event fails publicly.",
    "Steal Sabjorn's promissory note from his safe and deliver it to Maven."
  ],
  rewards:['Enchanted leveled one-handed weapon', 'Unlocks Mallus Maccius as a fence'], trackable:true },

{ id:204, line:'thieves', order:5, title:"Scoundrel's Folly", giver:'Mercer Frey', location:'Winking Skeever (Solitude), East Empire Company Warehouse, Brinewater Grotto', level:'6',
  steps:[
    'Mercer notices the same symbol on the Goldenglow bill of sale and the Honningbrew promissory note, and sends you to squeeze informant Gulum-Ei at the Winking Skeever in Solitude.',
    "Gulum-Ei will only talk in exchange for a case of rare Firebrand Wine, stolen from the Blue Palace.",
    'Return the wine, then tail Gulum-Ei from a distance as he meets a contact at the East Empire Company Warehouse.',
    'Confront or negotiate with him at Brinewater Grotto to learn the name Karliah.'
  ],
  rewards:['Assorted soul gems', 'Upgraded Thieves Guild Armor'], trackable:true },

{ id:205, line:'thieves', order:6, title:'Speaking With Silence', giver:'Mercer Frey', location:'Snow Veil Sanctum', level:'6',
  steps:[
    'Meet Mercer outside Snow Veil Sanctum, northeast of Windhelm, where he believes former guildmate Karliah is hiding.',
    'Fight through the Nordic ruin together.',
    "Find Karliah, who reveals Mercer himself is the real traitor — he murdered the previous Guild Master, Gallus, and framed her for it years ago.",
    'Mercer attacks her; she escapes, leaving behind Gallus\'s encoded journal.'
  ],
  rewards:["Gallus's Encoded Journal", 'Word for the Disarm shout'], trackable:true },

{ id:206, line:'thieves', order:7, title:'Hard Answers', giver:'Karliah', location:'Understone Keep, Markarth',
  steps:[
    "Take Gallus's encoded journal to Enthir, a mage fixer in Winterhold, who identifies it as written in the lost Falmer language.",
    'Enthir points you to scholar Calcelmo in Understone Keep, Markarth.',
    "Sneak into (or otherwise access) Calcelmo's Dwemer museum to copy his Falmer Translation Guide.",
    'Bring the copy back to Enthir to have the journal decoded.',
    'Meet Karliah again to learn the truth about Mercer, Gallus, and the Nightingales.'
  ],
  rewards:['Nightingale Blade'], trackable:true },

{ id:207, line:'thieves', order:8, title:'The Pursuit', giver:'Karliah', location:'Riftweald Manor, Riften',
  steps:[
    'Meet Karliah at the Ragged Flagon — Brynjolf, Delvin, and Vex initially hold you both at knifepoint until her story and the journal convince them.',
    "Break into Mercer Frey's manor in Riften through the backyard, dealing with his bodyguard Vald if needed.",
    'Sneak into his private office and steal his plans, along with the unique sword Chillrend from his collection.',
    'Return to Brynjolf.'
  ],
  rewards:['Chillrend (unique enchanted sword)'], trackable:true },

{ id:208, line:'thieves', order:9, title:'Trinity Restored', giver:'Brynjolf', location:'Nightingale Hall',
  steps:[
    "Show Brynjolf Mercer's stolen plans for one last heist — the Eyes of the Falmer.",
    'Karliah reveals Mercer was a Nightingale, an agent of Nocturnal, and that you need the same edge before confronting him.',
    'Meet Karliah and Brynjolf at The Shadow Stone outside Riften and enter Nightingale Hall.',
    "Take the Nightingale Oath, binding your soul to Nocturnal's service."
  ],
  rewards:['Nightingale Armor'], trackable:true },

{ id:209, line:'thieves', order:10, title:'Blindsighted', giver:'Brynjolf', location:'Irkngthand', level:'12',
  steps:[
    'Travel to the ancient ruin Irkngthand, where Mercer is stealing the Eyes of the Falmer statue and the Skeleton Key.',
    'Fight through the Arcanex, Grand Cavern, Slave Pens, and Sanctuary sections — Dwarven sphere guardians, Falmer, and traps.',
    'Locate Karliah, then hunt down and slay Mercer Frey.',
    'Recover the Skeleton Key and both Eyes of the Falmer, then escape.'
  ],
  rewards:['Nightingale Bow', 'The Skeleton Key', 'Right and Left Eye of the Falmer'], trackable:true },

{ id:210, line:'thieves', order:11, title:'Darkness Returns', giver:'Karliah', location:'Twilight Sepulcher', level:'8',
  steps:[
    'Enter the Twilight Sepulcher and meet the last Nightingale Sentinel, a spirit who explains the order\'s history and betrayal.',
    'Walk the trapped "Pilgrim\'s Path," passing a series of tests.',
    'Use the Skeleton Key to unlock the Ebonmere, returning it to Nocturnal and restoring the natural order.',
    'Have Karliah offer you a choice of Nightingale Blessing.'
  ],
  choice:{ flag:'Choose a Nightingale Blessing', text:"Pick one of three passive powers named for the three Nightingales: Karliah's (Shadow), Brynjolf's (Illumination), or Mercer's (Strife). Purely a playstyle choice — it can be swapped later by returning to the Sepulcher." },
  rewards:['A Nightingale Blessing (your choice)'], trackable:true },

{ id:212, line:'thieves', order:11.1, title:'Silver Lining', giver:'Delvin Mallory (after 5 radiant jobs in Markarth)', location:'Markarth, Pinewatch',
  steps:[
    'Speak to Endon at the Silver-Blood Inn in Markarth about a silver mold he ordered from a Khajiit caravan, stolen by bandits led by Rigel Strong-Arm.',
    "Travel to Pinewatch, northeast of Falkreath, and fight through to the bandits' sanctuary.",
    'Take the key from Rigel Strong-Arm, open the locked room, and recover the silver mold.',
    'Return the mold to Endon.'
  ],
  rewards:['A piece of enchanted armor', 'Leveled gold', 'Endon becomes an available fence in Markarth'], trackable:true },

{ id:213, line:'thieves', order:11.2, title:'The Dainty Sload', giver:'Erikur (Blue Palace), via Delvin Mallory (after 5 radiant jobs in Solitude)', location:'Solitude docks; the Red Wave and the Dainty Sload',
  steps:[
    'Speak to Erikur at the Blue Palace, who wants ship captain Volf framed for smuggling after a business dispute.',
    'Meet Sabine Nytte aboard the Red Wave near the East Empire Company Warehouse and obtain Balmora Blue from her — the fast route costs 1,500 gold for the key.',
    "Board the Dainty Sload, deal with the First Mate to reach the Captain's Chest, and plant the Balmora Blue in Volf's footlocker.",
    'Report back to Erikur.'
  ],
  rewards:['A random spell tome', 'A new merchant at the Ragged Flagon', 'Three Thief Cache barrels appear around Solitude'], trackable:true },

{ id:214, line:'thieves', order:11.3, title:'Imitation Amnesty', giver:'Delvin Mallory (after 5 radiant jobs in Whiterun)', location:'Whiterun, Dragonsreach',
  steps:[
    "Delvin relays a request from Olfrid Battle-Born: an old war buddy, \"Arn,\" wanted for murder in Solitude, has been jailed in Whiterun for drunkenness under a false name.",
    "Steal the letter incriminating Arn from the Jarl's chambers in Dragonsreach.",
    "Forge the prison registry in the steward's quarters to cement Arn's false identity.",
    'Report back to Olfrid Battle-Born.'
  ],
  rewards:['Ring of Peerless Lockpicking'], trackable:true },

{ id:215, line:'thieves', order:11.4, title:'Summerset Shadows', giver:'Delvin Mallory (after 5 radiant jobs in Windhelm)', location:'Windhelm',
  steps:[
    'Delvin warns that a rival gang, the Summerset Shadows, is muscling in on Windhelm — speak to Torsten Cruel-Sea for details.',
    'Confront the stall vendor Niranye about her fence Fjotli, and persuade or intimidate her into admitting she\'s being coerced by the Summerset Shadows.',
    "Find the hidden panel in the back room of Niranye's house leading to a basement safe with letters naming the gang's hideout.",
    "Clear the hideout, defeat the gang's leader Linwe, and take the locket from his body.",
    'Deliver the locket to Torsten Cruel-Sea.'
  ],
  rewards:['Leveled gold', 'Restored Guild influence in Windhelm'], trackable:true },

{ id:211, line:'thieves', order:12, title:'Under New Management', giver:'None (auto-triggers)', location:'Ragged Flagon, Riften',
  steps:[
    "Complete the four hold \"reputation\" quests above — Silver Lining (Markarth), The Dainty Sload (Solitude), Imitation Amnesty (Whiterun), Summerset Shadows (Windhelm) — each unlocked after 5 radiant jobs from Delvin or Vex in that hold.",
    'Once Guild influence is restored across all five holds, attend the induction ceremony at the Ragged Flagon.',
    "Receive the Guild Master's Armor from Tonilia, along with the key to the Guild Master's Tribute Chest."
  ],
  rewards:["Guild Master's Armor", 'Tribute Chest Key (periodic loot)', 'Amulet of Articulation', 'Title: Guild Master'], trackable:true },

/* ======================= COMPANIONS ======================= */
{ id:300, line:'companions', order:1, title:'Take Up Arms', giver:'Kodlak Whitemane', location:'Pelagia Farm, Jorrvaskr',
  steps:[
    '(Optional) Help fight a giant near Pelagia Farm on the way into Whiterun.',
    'Find Jorrvaskr and speak to Harbinger Kodlak Whitemane.',
    'Spar with Vilkas to prove your combat skill.',
    'Run small errands for senior members to earn their trust.'
  ],
  rewards:['Companions membership'], trackable:true },

{ id:301, line:'companions', order:2, title:'Proving Honor', giver:'Skjor', location:"Dustman's Cairn, Jorrvaskr", level:'6',
  steps:[
    'After one radiant job, Skjor sends you after a newly-discovered Fragment of Wuuthrad hidden in Dustman\'s Cairn.',
    'Team up with Farkas as your Shield-Brother and fight through the draugr-filled crypt.',
    'Recover the fragment.',
    'Return for an initiation into full membership.'
  ],
  rewards:['A Skyforge Steel weapon', 'Word for the Fire Breath shout'], trackable:true },

{ id:302, line:'companions', order:3, title:'The Silver Hand', giver:'Skjor', location:'Whiterun / the Underforge, Gallows Rock', level:'6',
  steps:[
    'Skjor secretly meets you at night near the Underforge, a hidden ritual crypt beneath Eorlund Gray-Mane\'s smithy.',
    'Aela and Skjor reveal the Circle\'s secret — they are all werewolves — and offer you lycanthropy through a blood ritual.',
    'Join Aela to hunt down and wipe out a band of Silver Hand werewolf-hunters at their base, Gallows Rock.'
  ],
  choice:{ flag:'Accept lycanthropy', text:'Drinking from the ritual fountain makes you a werewolf, which the main storyline expects in order to continue — there is no story-sanctioned way to refuse and keep progressing normally at this point. (It can later be cured via the Companions questline finale, or reacquired afterward through side content.)' },
  rewards:['Lycanthropy (werewolf transformation)'], trackable:true },

{ id:303, line:'companions', order:4, title:"Blood's Honor", giver:'Kodlak Whitemane', location:'Glenmoril Coven, Jorrvaskr', level:'14',
  steps:[
    "Kodlak, disapproving of the Silver Hand bloodshed, reveals the true history of the Companions' lycanthropy — a past Harbinger's pact with the Glenmoril Witches — and that it dooms members to Hircine's Hunting Grounds instead of Sovngarde.",
    "Travel to the Glenmoril Coven in northwest Falkreath and bring back a Glenmoril Witch's head, the reagent needed for a cure.",
    '(Optional) Wipe out the whole coven for extra heads, useful later to cure other Circle members.',
    'While you are away, the Silver Hand attacks Jorrvaskr and mortally wounds Kodlak.'
  ],
  rewards:[], trackable:true },

{ id:304, line:'companions', order:5, title:'Purity of Revenge', giver:'Vilkas', location:'Jorrvaskr, Driftshade Refuge',
  steps:[
    "With Kodlak dying and the Silver Hand having stolen the recovered Fragments of Wuuthrad, Vilkas asks you to hit back.",
    "Travel with him as a follower to the Silver Hand's hideout, Driftshade Refuge, southeast of Dawnstar.",
    'Clear it out and recover the stolen Fragments of Wuuthrad.'
  ],
  rewards:[], trackable:true },

{ id:305, line:'companions', order:6, title:'Glory of the Dead', giver:'Vilkas', location:"Whiterun / Skyforge, Ysgramor's Tomb",
  steps:[
    "Attend Kodlak's funeral at the Skyforge.",
    "Deliver the last fragment of Wuuthrad to Eorlund Gray-Mane, who reforges the full axe.",
    "Carry the restored Wuuthrad with the Circle (Vilkas, Farkas, Aela) into Ysgramor's Tomb to perform the cleansing ritual Kodlak wanted.",
    'Fight through spectral former Harbingers guarding the tomb.',
    "Reach Kodlak's trapped spirit, torn between man and wolf."
  ],
  choice:{ flag:'Cure Kodlak — and optionally, yourself', text:"Use a Glenmoril Witch head to cure Kodlak's spirit, freeing him to pass on to Sovngarde instead of Hircine's Hunting Grounds — this step is required to finish the quest. Kodlak's spirit then offers to use a second witch head, if you have one, to cure YOUR OWN lycanthropy on the spot. You may accept (becoming fully human again) or decline and remain a werewolf — a low-stakes, reversible flavor choice either way." },
  rewards:['Wuuthrad (unique battleaxe)', 'Shield of Ysgramor', 'Word for the Animal Allegiance shout', 'Title: Harbinger of the Companions', 'New Skyforge crafting options', 'Up to 7 new recruitable followers'], trackable:true },

{ id:306, line:'companions', order:7, optional:true, title:'Animal Extermination', giver:'Companions job board (Aela, Vilkas, or Farkas)', location:'Random — a leveled animal den or lair',
  steps:[
    'Ask a senior Companion for work to be offered a randomly-assigned radiant job.',
    'Travel to the assigned location and kill the troublesome animal (often a bear, sabre cat, or similar predator) terrorizing the area.',
    'Return to Jorrvaskr to report success and collect payment.'
  ],
  rewards:['Gold', 'Companions reputation'], trackable:true },

{ id:307, line:'companions', order:8, optional:true, title:'Trouble in Skyrim', giver:'Companions job board (Aela, Vilkas, or Farkas)', location:'Random — a leveled bandit or Forsworn camp',
  steps:[
    'Ask a senior Companion for work to be offered a randomly-assigned radiant job.',
    'Travel to the assigned camp or hideout and kill the bandit or Forsworn leader causing trouble.',
    'Return to Jorrvaskr to report success and collect payment.'
  ],
  rewards:['Gold', 'Companions reputation'], trackable:true },

{ id:308, line:'companions', order:9, optional:true, title:'Striking the Heart', giver:'Companions job board (Aela, Vilkas, or Farkas)', location:'Random — a leveled vampire or necromancer lair',
  steps:[
    'Ask a senior Companion for work to be offered a randomly-assigned radiant job.',
    'Travel to the assigned lair and kill the vampire or necromancer leader responsible for local attacks.',
    'Return to Jorrvaskr to report success and collect payment.'
  ],
  rewards:['Gold', 'Companions reputation'], trackable:true },

/* ======================= COLLEGE OF WINTERHOLD ======================= */
{ id:400, line:'college', order:1, title:'First Lessons', giver:'Faralda (gatekeeper)', location:'College of Winterhold',
  steps:[
    'Approach the bridge into the College and speak with Faralda, the gatekeeper mage.',
    'Prove your ability with a spell, or persuade her past the test with a high Speech skill.',
    'Cross into the courtyard and enter the Hall of the Elements.',
    "Sit in on Tolfdir's introductory lecture and take part in a practice exercise."
  ],
  rewards:['College membership', 'Lesser Ward spell'], trackable:true },

{ id:401, line:'college', order:2, title:'Under Saarthal', giver:'Tolfdir', location:'Saarthal, College of Winterhold', level:'6',
  steps:[
    'Join Tolfdir and a group of fellow new students on a field trip to the ancient Nordic ruin of Saarthal.',
    'Help Arniel Gane recover minor artifacts and escape a magical trap using a special amulet.',
    'Explore deeper with Tolfdir and discover a mysterious ancient Orb of unknown origin buried at the ruin\'s heart.',
    'Report the find to the Arch-Mage.'
  ],
  rewards:['Staff of Magelight', 'Word for the Ice Form shout'], trackable:true },

{ id:402, line:'college', order:3, title:'Hitting the Books', giver:'Savos Aren (via Urag gro-Shub)', location:'Fellglow Keep', level:'8',
  steps:[
    'Librarian Urag gro-Shub identifies three reference books that could explain the Orb, taken by a former apprentice, Orthorn.',
    'Orthorn joined renegade mages holed up at Fellglow Keep.',
    'Fight through the keep\'s captive-experimenting mage cabal (optionally free Orthorn from their dungeon).',
