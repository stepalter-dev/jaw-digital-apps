/* ============================= GLOBAL SEARCH INDEX ============================= */

// One flat, searchable record per trackable/reference entry across the ENTIRE app — not just quests.
// Built once from the data arrays above (must run after all of them are declared). Each record carries
// enough `nav` info to jump straight to the right section/sub-tab, and an `itemId` matching that entry's
// `data-id` in its real card so the existing scrollIntoView + flash-highlight pattern can find it there.
function buildSearchIndex(){
  const idx = [];

  QUESTS.forEach(q => {
    const ql = QUESTLINES.find(l => l.id === q.line);
    idx.push({
      itemId: q.id, title: q.title, sectionLabel: 'Quests & Factions', icon: ql ? ql.icon : '📜',
      snippet: [q.giver, q.location].filter(Boolean).join(' — ') || (q.steps && q.steps[0]) || '',
      searchText: [q.title, q.giver, q.location, q.prince, (q.steps||[]).join(' '), (q.rewards||[]).join(' '), q.choice ? q.choice.text : ''].join(' ').toLowerCase(),
      nav: { section:'quests', line:q.line, branch: q.branch || (q.line==='civilwar' ? 'imperial' : q.line==='dawnguard' ? 'dawnguard' : null) },
    });
  });

  PERKS.forEach(p => idx.push({
    itemId: p.id, title: p.name, sectionLabel: 'Character Builds › Perk Trees', icon: '📜',
    snippet: `${p.tree} — ${p.effect}`,
    searchText: [p.name, p.tree, p.category, p.effect].join(' ').toLowerCase(),
    nav: { section:'builds', buildTab:'perks', skillTree:p.tree },
  }));
  STANDING_STONES.forEach(s => idx.push({
    itemId: s.id, title: s.name, sectionLabel: 'Character Builds › Standing Stones', icon: '💎',
    snippet: s.effect,
    searchText: [s.name, s.effect, s.location].join(' ').toLowerCase(),
    nav: { section:'builds', buildTab:'stones' },
  }));
  BUILD_GUIDES.forEach(b => idx.push({
    itemId: null, title: b.name, sectionLabel: 'Character Builds › Build Guides', icon: '🛡️',
    snippet: b.race,
    searchText: [b.name, b.race, b.stone, (b.priority||[]).join(' '), b.tips].join(' ').toLowerCase(),
    nav: { section:'builds', buildTab:'archetypes' },
  }));
  CC_GAMEPLAY_SYSTEMS.forEach(g => idx.push({
    itemId: null, title: g.name, sectionLabel: 'Character Builds › CC Gameplay Systems', icon: g.icon,
    snippet: g.desc.slice(0, 120),
    searchText: [g.name, g.desc].join(' ').toLowerCase(),
    nav: { section:'builds', buildTab:'ccsystems' },

function storageKey(){ return 'skyrim-journal-progress'; }

// Keeps the static "All entries / Favorites only / Hide completed" filter pills in the search row in sync
// with favOnly/hideCompleted after any code path that changes them programmatically (tab switches, cross-links).
function syncFilterPills(){
  document.querySelectorAll('.filter-pill[data-fav]').forEach(p => p.classList.toggle('active', p.dataset.fav === (favOnly ? 'favorites' : 'all')));
  const hideBtn = document.querySelector('.filter-pill[data-hide-done]');
  if (hideBtn) hideBtn.classList.toggle('active', hideCompleted);
}

function loadProgress(){
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) {
      const parsed = JSON.parse(raw);
      favorites = new Set(parsed.favorites || []);
      tracked = new Set(parsed.tracked || []);
    }
  } catch (e) { /* start fresh */ }
}
function saveProgress(){
  try {
    const state = {
      favorites: Array.from(favorites),
      tracked: Array.from(tracked),
      updatedAt: Date.now(),
    };
    const payload = JSON.stringify(state);
    localStorage.setItem(storageKey(), payload);
    if (window.JawSync) window.JawSync.save(storageKey(), payload);
    if (window.JawAccount && window.JawAccount.isSignedIn()) window.JawAccount.save('skyrim', state);
  } catch (e) { console.error('Could not save progress', e); }
}

// Same idea as syncPullAndReconcile() below, but against a signed-in JawAccount (Supabase)
// instead of the GitHub Gist — the account-backed path used by the paid version of this app.
async function syncAccountPullAndReconcile(){
  if (!window.JawAccount || !window.JawAccount.isSignedIn()) return;
  try {
    const remote = await window.JawAccount.load('skyrim');
    if (!remote) return;
    const localRaw = localStorage.getItem(storageKey());
    const localParsed = localRaw ? JSON.parse(localRaw) : null;
    if (!localParsed || (remote.updatedAt || 0) > (localParsed.updatedAt || 0)) {
      favorites = new Set(remote.favorites || []);
      tracked = new Set(remote.tracked || []);
      localStorage.setItem(storageKey(), JSON.stringify(remote));
      renderAll();
    }
  } catch (e) { console.error('Account sync pull failed', e); }
}

// Pulls the Gist's copy of this journal's progress (if sync is configured) and adopts it
// if it's newer than what's in localStorage — recovers progress after cleared storage,
// a reinstall, or opening on a new device. Local storage stays the fast, offline-safe path.
async function syncPullAndReconcile(){
  if (!window.JawSync) return;
  try {
    const remote = await window.JawSync.pull(storageKey());
    if (!remote) return;
    const remoteParsed = JSON.parse(remote);
    const localRaw = localStorage.getItem(storageKey());
    const localParsed = localRaw ? JSON.parse(localRaw) : null;
    if (!localParsed || (remoteParsed.updatedAt || 0) > (localParsed.updatedAt || 0)) {
      favorites = new Set(remoteParsed.favorites || []);
      tracked = new Set(remoteParsed.tracked || []);
      localStorage.setItem(storageKey(), remote);
      renderAll();
    }
  } catch (e) { console.error('Sync pull failed', e); }
}

// Journal Notes lives in its own localStorage key, separate from storageKey()'s tracked/favorites payload —
// same reasoning as navStateKey() below: Export/Import Progress and Reset All Progress are about trackable
// checkmarks, and shouldn't touch (or wipe) freeform writing. Also intentionally left out of the
// JawSync/JawAccount cloud sync above — notes stay local-only for now, same as before those existed.
function notesKey(){ return 'skyrim-journal-notes'; }
function loadNotes(){

}
function saveNotes(){

}

// Remembers which tab/sub-tab the user was last viewing — kept in its own localStorage key, separate from
// storageKey()'s tracked/favorites payload, so Export/Import Progress (which is about trackable checkmarks,
// not navigation) never touches it.
function navStateKey(){ return 'skyrim-journal-lastview'; }
function saveNavState(){
  try {
    localStorage.setItem(navStateKey(), JSON.stringify({
      activeSection, activeLine, activeBranch, activeBuildTab, activeSkillTree,
      activeFollowerTab, activeCraftTab, activeShoutTab, activeTreasureTab,
      activeLocationTab, activeLocationHold, activeSecretsTab,
    }));
  } catch (e) { /* not critical */ }
}
function loadNavState(){
  try {
    const raw = localStorage.getItem(navStateKey());
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && typeof s === 'object' && SECTIONS.some(sec => sec.id === s.activeSection)) activeSection = s.activeSection;
    if ('activeLine' in s) activeLine = s.activeLine;
    if ('activeBranch' in s) activeBranch = s.activeBranch;
    if (s.activeBuildTab) activeBuildTab = s.activeBuildTab;
    if (s.activeSkillTree) activeSkillTree = s.activeSkillTree;
    if (s.activeFollowerTab) activeFollowerTab = s.activeFollowerTab;
    if (s.activeCraftTab) activeCraftTab = s.activeCraftTab;
    if (s.activeShoutTab) activeShoutTab = s.activeShoutTab;
    if (s.activeTreasureTab) activeTreasureTab = s.activeTreasureTab;
    if (s.activeLocationTab) activeLocationTab = s.activeLocationTab;
    if (s.activeLocationHold) activeLocationHold = s.activeLocationHold;
    if (s.activeSecretsTab) activeSecretsTab = s.activeSecretsTab;
  } catch (e) { /* start at the default view */ }
}

function questsForLine(line){ return QUESTS.filter(q => q.line === line); }
function trackableCount(list){ return list.filter(q => q.trackable && !q.alt); }
function statFor(line, branch){
  let scoped = questsForLine(line).filter(q => !q.alt);
  if (branch) scoped = scoped.filter(q => q.branch === branch);
  scoped = scoped.filter(q => q.trackable);
  const done = scoped.filter(q => tracked.has(q.id)).length;
  return { done, total: scoped.length };
}
function achStat(){
  const done = ACHIEVEMENTS.filter(a => tracked.has(a.id)).length;
  return { done, total: ACHIEVEMENTS.length };
}

// Combined completion across every trackable item in the entire app — sums the same per-section stat
// helpers the dashboard cards already use, so it can never drift out of sync with them.
function overallStat(){
  let done = 0, total = 0;
  QUESTLINES.forEach(ql => { const s = statFor(ql.id); done += s.done; total += s.total; });
  [achStat(), buildsStat(), followersStat(), craftingStat(), bestiaryStat(), shoutsStat(), treasureStat(), locationsStat(), housingStat(), secretsStat()]
    .forEach(s => { done += s.done; total += s.total; });
  return { done, total };
}

// Achievement points earned vs. the full possible total, pulled from each achievement's own point value.
function achPointsStat(){
  let earned = 0, total = 0;
  ACHIEVEMENTS.forEach(a => { total += a.points; if (tracked.has(a.id)) earned += a.points; });
  return { earned, total };
}

    banner.querySelectorAll('[data-branch]').forEach(pill => {

}

      <button id="export-progress-btn" class="io-btn">Export Progress</button>
      <button id="import-progress-btn" class="io-btn">Import Progress</button>
      <input id="import-progress-file" type="file" accept="application/json,.json" style="display:none;" />
      <button id="reset-progress-btn" class="reset-btn">Reset All Progress</button>
      <span class="reset-hint">Clears every checkmark and favorite — can't be undone.</span>
      <span id="io-status" class="io-status"></span>

  let resetArmed = false, resetTimer = null;
  const resetBtn = document.getElementById('reset-progress-btn');
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = 'Are you sure? Click to confirm';
      resetBtn.classList.add('armed');
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { resetArmed = false; resetBtn.textContent = 'Reset All Progress'; resetBtn.classList.remove('armed'); }, 4000);
    } else {
      clearTimeout(resetTimer);
      favorites = new Set(); tracked = new Set();
      saveProgress(); renderAll();
    }
  });

  // Re-queries #io-status fresh every call rather than closing over one DOM node — a successful import
  // calls renderAll(), which rebuilds this whole reset-zone (including a brand-new #io-status element),
  // so a captured reference would silently write to a detached node.
  const showIoStatus = (msg, ok) => {
    const el = document.getElementById('io-status');
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('ok', ok);
    el.classList.toggle('err', !ok);
  };

  document.getElementById('export-progress-btn').addEventListener('click', () => {
    try {
      const payload = {
        app: 'skyrim-field-journal',
        version: 1,
        exportedAt: new Date().toISOString(),
        favorites: Array.from(favorites),
        tracked: Array.from(tracked),
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = payload.exportedAt.slice(0, 10);
      a.href = url;
      a.download = `skyrim-journal-progress-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showIoStatus(`✓ Exported ${payload.tracked.length} tracked + ${payload.favorites.length} favorited entries.`, true);
    } catch (e) {
      showIoStatus('Export failed — see console for details.', false);
      console.error('Export failed', e);
    }
  });

  const importInput = document.getElementById('import-progress-file');
  document.getElementById('import-progress-btn').addEventListener('click', () => { importInput.value = ''; importInput.click(); });
  importInput.addEventListener('change', () => {
    const file = importInput.files && importInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { showIoStatus('Import failed — that file is not valid JSON.', false); return; }

      const isIdArray = arr => Array.isArray(arr) && arr.every(v => typeof v === 'number' || typeof v === 'string');
      if (!parsed || typeof parsed !== 'object' || !isIdArray(parsed.favorites) || !isIdArray(parsed.tracked)) {
        showIoStatus('Import failed — file is missing the expected "favorites"/"tracked" id lists.', false);
        return;
      }

      favorites = new Set(parsed.favorites);
      tracked = new Set(parsed.tracked);
      saveProgress();
      renderAll();
      showIoStatus(`✓ Imported ${parsed.tracked.length} tracked + ${parsed.favorites.length} favorited entries.`, true);
    };
    reader.onerror = () => showIoStatus('Import failed — could not read that file.', false);
    reader.readAsText(file);
  });

  container.querySelectorAll('.dash-card[data-nav-section]').forEach(card => {
    card.addEventListener('click', () => {
      activeSection = card.dataset.navSection;
      if (activeSection === 'quests') activeLine = 'main';
      if (card.dataset.navLocationtab) activeLocationTab = card.dataset.navLocationtab;
      favOnly = card.dataset.navFav === 'true';
      hideCompleted = false;
      renderAll();
      syncFilterPills();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ============================= CHARACTER BUILDS RENDER ============================= */

function buildsStat(){
  const items = [...PERKS, ...STANDING_STONES];
  const done = items.filter(i => tracked.has(i.id)).length;
  return { done, total: items.length };
}

function renderBuilds(){
  try { renderBuildsInner(); } catch (err) { showRenderError(err); }
}

function renderBuildsInner(){
  const container = document.getElementById('entries');
  container.classList.remove('grid-mode');
  document.getElementById('sub-row').style.display = 'none';
  document.getElementById('branch-banner').style.display = 'none';

  const tabsHtml = `<div class="sub-row" style="display:flex; margin-bottom:18px;">${BUILD_TABS.map(t =>
    `<span class="sub-pill ${activeBuildTab===t.id?'active':''}" data-buildtab="${t.id}">${t.icon} ${t.label}</span>`).join('')}</div>`;

  if (activeBuildTab === 'perks') {
    document.getElementById('search-row').style.display = 'flex';
    if (!PERK_TREES.includes(activeSkillTree)) activeSkillTree = PERK_TREES[0];

    // Skill selector — grouped by Combat/Magic/Stealth, each pill carrying its own learned-count badge
    // (independent of the current search/favorites filter, same convention as the Quests & Factions sub-row).
    const skillSelectorHtml = `<div class="skill-select">${SKILL_CATEGORIES.map(cat => {
      const trees = PERK_TREES.filter(t => PERK_TREE_CATEGORY[t] === cat);
      if (!trees.length) return '';
      return `<div class="skill-select-row">
        <span class="skill-select-label">${cat}</span>
        <div class="skill-select-pills">${trees.map(t => {
          const treeItems = PERKS.filter(p => p.tree === t);
          const treeDone = treeItems.filter(p => tracked.has(p.id)).length;
          return `<span class="sub-pill ${activeSkillTree===t?'active':''}" data-skilltree="${t}">${t} <span class="n">${treeDone}/${treeItems.length}</span></span>`;
        }).join('')}</div>

    }).join('')}</div>`;

    let list = PERKS.filter(p => p.tree === activeSkillTree);
    if (favOnly) list = list.filter(p => favorites.has(p.id));
    if (hideCompleted) list = list.filter(p => !tracked.has(p.id));
    if (query.trim()) {
      const q = query.toLowerCase();

      <p style="font-size:12px; color: var(--ink-soft); margin: 0 0 14px;">Survival Mode was added free to all Special Edition owners in the November 2021 Anniversary Update. It's an optional gameplay toggle (Settings menu) that turns Skyrim itself into your adversary — reference only below, nothing here needs tracking.</p>
      <div class="ach-group-list">
        <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>Hunger</h3></div></div>
          <p class="ach-desc">Grows over time and eats into your total stamina (shown as a dark region in the stamina bar) along with your ability to wield most weapons. Eating food restores it — cooked food more than raw — and eating enough grants Well Fed. Eating raw meat risks Food Poisoning, which blocks healing benefits from food until it wears off. It takes roughly 1,334 units of food to go from fully starved to Well Fed.</p>
        </article>
        <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>Fatigue (Exhaustion)</h3></div></div>
          <p class="ach-desc">Eats into your total magicka and dulls potion effectiveness (including Enchanting/Smithing potions) and magicka/stamina recovery as it climbs. Sleeping in an indoor bed grants Rested/Well Rested as usual (minimum 2 hours); sleeping outdoors only leaves you Drained at best. Full recovery from absolute fatigue takes about 11 hours of rest.</p>
        </article>
        <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>Cold & Warmth</h3></div></div>
          <p class="ach-desc">Skyrim is split into warm, cold, and freezing climates; time in snow or rain raises your Cold, which eats into total health and slows movement, lockpicking, and pickpocketing — maxing it out kills you from exposure. Your Warmth rating (mostly from clothing/armor, up to 54 body/29 helmet/24 gauntlet-or-boot points) slows how fast Cold builds. Hot soup, torches (+50 Warmth), and standing near fire sources all help; swimming in freezing water instantly adds Cold and starts health damage until you get out.</p>
        </article>
        <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>Disabled fast travel</h3></div></div>
          <p class="ach-desc">All travel is on foot, horseback, or by carriage/boat/ship carriage upgrade — arriving that way can still leave you hungry, cold, and tired. Fast travel remains available while riding a tamed dragon (except into walled cities, Fort Dawnguard, the Forgotten Vale, or to/from Solstheim).</p>
        </article>
        <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>Other changes</h3></div></div>
          <ul class="quest-steps">
            <li>No passive health regeneration — only Restoration magic, food, potions, and health-regen enchantments restore it.</li>
            <li>Leveling up requires sleeping in a bed (perk points can still be spent later).</li>
            <li>Starting carry weight drops from 300 to 150; the Steed Stone and Extra Pockets perk each grant +50 instead of +100.</li>
            <li>Arrows and lockpicks gain weight (0.1 each) instead of being weightless.</li>
            <li>Disease is more dangerous and more common; uncooked meat can cause Food Poisoning, and untreated diseases can progress to a worse stage. Prolonged hunger, fatigue, or cold also risk Afflictions (Weakened, Addled, Frostbitten) that can linger.</li>
            <li>Shrine blessings cost a gold offering (except shrines you craft yourself) and come out weaker if taken while fatigued.</li>
            <li>Standing Stones are weaker overall — e.g. the Steed Stone only grants +50 carry weight here instead of its normal bonus.</li>
          </ul>
        </article>
        <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>Racial passives added for Survival Mode</h3></div></div>
          <p class="ach-desc">Only these races get Survival-specific bonuses — the rest (Breton, Imperial, Redguard) are unchanged.</p>
          <table class="ach-desc" style="width:100%; border-collapse:collapse; font-size:12.5px;">
            <tr style="border-bottom:1px solid var(--line);"><td style="padding:4px 8px 4px 0; color:var(--gold-dim); font-weight:600;">Argonian</td><td style="padding:4px 0;">Weakness to Cold 25%; Raw Diet (immune to Food Poisoning)</td></tr>
            <tr style="border-bottom:1px solid var(--line);"><td style="padding:4px 8px 4px 0; color:var(--gold-dim); font-weight:600;">Dark Elf</td><td style="padding:4px 0;">Resist Fatigue 25%</td></tr>
            <tr style="border-bottom:1px solid var(--line);"><td style="padding:4px 8px 4px 0; color:var(--gold-dim); font-weight:600;">High Elf</td><td style="padding:4px 0;">Resist Fatigue 25%</td></tr>
            <tr style="border-bottom:1px solid var(--line);"><td style="padding:4px 8px 4px 0; color:var(--gold-dim); font-weight:600;">Khajiit</td><td style="padding:4px 0;">Raw Diet (immune to Food Poisoning); Resist Cold (+15 Warmth)</td></tr>
            <tr style="border-bottom:1px solid var(--line);"><td style="padding:4px 8px 4px 0; color:var(--gold-dim); font-weight:600;">Nord</td><td style="padding:4px 0;">Resist Cold (+25 Warmth)</td></tr>
            <tr style="border-bottom:1px solid var(--line);"><td style="padding:4px 8px 4px 0; color:var(--gold-dim); font-weight:600;">Orc</td><td style="padding:4px 0;">Resist Hunger 15%; Resist Fatigue 15%; Resist Cold (+10 Warmth)</td></tr>
            <tr><td style="padding:4px 8px 0 0; color:var(--gold-dim); font-weight:600;">Wood Elf</td><td style="padding:4px 0;">Resist Fatigue 25%</td></tr>
          </table>
        </article>
        <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>Practical tips</h3></div></div>
          <ul class="quest-steps">
            <li>Wear warm clothing/armor, carry a torch (+50 Warmth), and eat hot soup (made by cooking with Fire Salts) to hold off Cold in places like Winterhold and Solstheim; standing near forges, smelters, campfires, and wall torches also warms you.</li>
            <li>The Camping creation lets you pitch a movable campsite for cooking and sleeping in the field — you'll wake up Drained since it's outdoors, but it beats freezing in the open.</li>
            <li>Level Restoration early: with no passive health regeneration, healing spells (or a steady supply of food/potions) carry far more weight than in a normal playthrough.</li>
            <li>The most weight-efficient cooked foods are Salmon Steak, Seared Slaughterfish, Rabbit Haunch, and Steamed Mudcrab Legs (0.1 weight each); Crab Stew is the best over-time restorative, healing both Health and Stamina.</li>
            <li>Raising an NPC's disposition (favor quests like chopping wood) unlocks free beds and food from them.</li>
            <li>Shouting Clear Skies clears bad weather and slows your Freezing rate; riding a horse, using Flame Cloak, or (as a Dunmer) Ancestor's Wrath let you cross freezing water safely.</li>
          </ul>
        </article>
      </div>`;
  } else if (activeBuildTab === 'ccsystems') {
    document.getElementById('search-row').style.display = 'none';
    container.innerHTML = tabsHtml + `
      <p style="font-size:12px; color: var(--ink-soft); margin: 0 0 14px;">Four Anniversary Edition Creations that change or add real gameplay mechanics rather than quests or items — reference only below, nothing here needs tracking.</p>
      <div class="ach-group-list">${CC_GAMEPLAY_SYSTEMS.map(g => `
        <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>${g.icon} ${g.name}</h3></div></div>

  });
  container.querySelectorAll('[data-fav]').forEach(btn => {

      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      renderBuilds(); saveProgress();
    });
  });
  container.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderBuilds(); saveProgress(); renderNav();
    });
  });
}

    const rodsNote = query.trim() || favOnly ? '' : `<div class="choice-box" style="margin:18px 0;"><b>Specialist Rods</b>The Alik'ri and Argonian Fishing Rods each favor a different size of catch and unlock the four rod-locked rare fish above (Angelfish/Lyretail Anthias need Alik'ri; Angler/Scorpion Fish need Argonian) — without the right rod, a hooked rare fish just gets away ("You lost your catch"). Both rods are earned from quests given by Viriya (Alik'ri) and Swims-In-Deep-Water (Argonian), after which you can also craft replacements. A third rod, Dwarven, trades fish odds for a better chance at rare junk (including Dwarven salvage) at five Dwemer-linked fishing spots.</div>
      <div class="choice-box" style="margin:18px 0;"><b>Fishing Legend &amp; unique rewards</b>There's no formal "Legendary" rarity tier — common/uncommon/rare are the only rarities. "Fishing Legend" is instead a specific quest from Swims-In-Deep-Water at the Riften Fishery: catch all four rod-locked rare fish and you're rewarded with the unique dagger Fang of Haynekhtnamet. Other one-of-a-kind junk pulls include several enchanted rings (Denstagmer's, Mentor's, Ring of Kynareth, Ring of Phynaster, Ring of the Wind) and unique fishing maps/rod recipes.</div>
      <div class="choice-box" style="margin:18px 0;"><b>Home aquarium</b>Purchase a fish tank and fish plaques to mount your catches as trophies. Falk Firebeard sells a small tank + 3 plaques for Proudspire Manor in Solitude; Lakeview Manor, Heljarchen Hall, and Windstad Manor can each be built out with a full aquarium room. Because all three manors' plaques share the same underlying quest aliases, only one house at a time can actually hold mounted fish. Slaughterfish and Juvenile Mudcrabs can't be mounted.</div>`;
    bodyHtml = introNote + (list.length === 0 ? `<div class="empty-state">No fish match. Try another search or clear the filter.</div>` : `<div class="ach-group-list">${list.map(cardHtml).join('')}</div>`) + rodsNote;

    if (hideCompleted) list = list.filter(e => !tracked.has(e.id));

      const isFav = favorites.has(e.id), isDone = tracked.has(e.id), isOpen = expandedCraftItems.has(e.id);
      const disenchantTip = e.type === 'Weapon'
        ? 'Learned by disenchanting a weapon that carries this enchantment at an Arcane Enchanter — this destroys the weapon.'

      return `
      <article class="quest ${isDone ? 'done' : ''}" data-id="${e.id}">
        <div class="quest-top">
          <div class="quest-title-wrap"><h3>${e.name}</h3><span class="tag-chip tag-optional">${e.type}</span></div>

          <p class="ach-desc" style="opacity:0.8;">${disenchantTip}</p>
        </div>` : ''}
        <div class="quest-foot"><span></span><button class="track-btn" data-track="${e.id}"><span class="box"></span> ${isDone ? 'Learned' : 'Mark learned'}</button></div>
      </article>`;
    };
    const disenchantNote = `<div class="choice-box" style="margin-bottom:18px;"><b>Disenchanting</b>Learn any enchantment permanently by disenchanting an item that carries it at an Arcane Enchanter (this destroys the item). Good early disenchant targets: Ancient Nord/Falmer/bandit gear with Fortify Health or Resist elements, and any cheap Muffle boots or Waterbreathing jewelry found early on, since those effects are otherwise expensive to discover. Click "Show detail" on any entry below for its full effect and item-type disenchanting note.</div>`;

  progressEl.style.display = 'inline';

  container.querySelectorAll('[data-crafttab]').forEach(pill => {
    pill.addEventListener('click', () => { activeCraftTab = pill.dataset.crafttab; favOnly = false; hideCompleted = false; query = ''; activeEffectLookup = null; const si = document.getElementById('search'); if (si) si.value = ''; renderAll(); });
  });
  container.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.fav);
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      renderCrafting(); saveProgress();
    });
  });
  container.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderCrafting(); saveProgress(); renderNav();
    });
  });
  container.querySelectorAll('[data-expand]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.expand);
      if (expandedCraftItems.has(id)) {
        expandedCraftItems.delete(id);
        if (activeEffectLookup && activeEffectLookup.ingredientId === id) activeEffectLookup = null;
      } else {
        expandedCraftItems.add(id);
      }
      renderCrafting();
    });
  });
  container.querySelectorAll('[data-effect]').forEach(btn => {
    btn.addEventListener('click', () => {
      const effect = btn.dataset.effect;
      const forId = Number(btn.dataset.effectfor);
      activeEffectLookup = (activeEffectLookup && activeEffectLookup.ingredientId === forId && activeEffectLookup.effect === effect)
        ? null
        : { ingredientId: forId, effect };
      renderCrafting();
    });
  });
  container.querySelectorAll('[data-effect-close]').forEach(btn => {
    btn.addEventListener('click', () => { activeEffectLookup = null; renderCrafting(); });
  });
  container.querySelectorAll('[data-link-perktree]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSection = 'builds'; activeBuildTab = 'perks'; activeSkillTree = btn.dataset.linkPerktree;
      favOnly = false; hideCompleted = false; query = ''; const si = document.getElementById('search'); if (si) si.value = '';
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  container.querySelectorAll('[data-link-nav]').forEach(btn => {
    btn.addEventListener('click', () => { navigateToResult(JSON.parse(btn.dataset.linkNav)); });
  });
}

function bestiaryStat(){
  const done = CREATURES.filter(c => tracked.has(c.id)).length;
  return { done, total: CREATURES.length };
}

function renderBestiary(){
  try { renderBestiaryInner(); } catch (err) { showRenderError(err); }
}

function renderBestiaryInner(){
  document.getElementById('search-row').style.display = 'flex';
  document.getElementById('sub-row').style.display = 'none';
  document.getElementById('branch-banner').style.display = 'none';
  const container = document.getElementById('entries');
  container.classList.remove('grid-mode');

  if (hideCompleted) list = list.filter(c => !tracked.has(c.id));

    const q = query.toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(q) || c.tip.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
  }
  const { done, total } = bestiaryStat();
  const progressEl = document.getElementById('progress-tally');
  progressEl.textContent = `${done} of ${total} encountered`;
  progressEl.style.display = 'inline';

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">No creatures match. Try another search or clear the filter.</div>`;
  } else {
    const grouped = BESTIARY_GROUPS.map(g => ({ g, items: list.filter(c => c.group === g) })).filter(x => x.items.length);
    const cardHtml = c => {
      const isFav = favorites.has(c.id), isDone = tracked.has(c.id);

        <div class="quest-top">
          <div class="quest-title-wrap"><h3>${c.name}</h3></div>

        </div>
        <p class="ach-desc">${c.tip}</p>
        <div class="quest-foot"><span></span><button class="track-btn" data-track="${c.id}"><span class="box"></span> ${isDone ? 'Encountered' : 'Mark encountered'}</button></div>
      </article>`;
    };
    container.innerHTML = grouped.map(({ g, items }) => `
      <div style="margin: 18px 0 10px; font-family:'Cinzel', serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold-dim);">${g} <span style="opacity:0.6; font-family:'Spectral', serif; text-transform:none; letter-spacing:0;">(${items.filter(c=>tracked.has(c.id)).length}/${items.length})</span></div>

    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderBestiary(); saveProgress(); renderNav();
    });
  });
}

    const done = DRAGON_MASKS.filter(m => tracked.has(m.id)).length;

    const cardHtml = m => {
      const isFav = favorites.has(m.id), isDone = tracked.has(m.id);

      renderShouts(); saveProgress();

    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderShouts(); saveProgress(); renderNav();
    });

function locationsStat(){
  const items = [...HOLD_CAPITALS, ...LOCATIONS_POI, ...Object.values(HOLD_DUNGEONS).flat()];
  const done = items.filter(i => tracked.has(i.id)).length;
  return { done, total: items.length };
}

function housingStat(){
  const items = [...CITY_HOMES, ...HEARTHFIRE_HOMES, ...DLC_HOMES];
  const done = items.filter(i => tracked.has(i.id)).length;
  return { done, total: items.length };
}

function renderLocations(){
  try { renderLocationsInner(); } catch (err) { showRenderError(err); }
}

// Interactive Map body. Pins read the SAME `tracked` Set the "Visited/Cleared" checkboxes elsewhere
// read/write (no separate tracking system) for status color-coding, and carry the same `nav` shape the
// global search index uses so click-to-navigate reuses navigateToResult()'s existing scroll+flash
// pattern. The hold filter (activeMapHolds) and legend are wired up in renderLocationsInner/CSS.
function renderLocationMapBody(){
  const holdShapesSvg = LOCATION_HOLDS.map(hold => {
    const shape = HOLD_MAP_SHAPES[hold];
    if (!shape) return '';
    const shown = !activeMapHolds || activeMapHolds.has(hold);
    return `<polygon class="map-hold-shape ${shown ? '' : 'dimmed'}" points="${shape.points}" style="fill: var(${shape.fillVar});" data-hold-shape="${hold}"><title>${hold}</title></polygon>`;
  }).join('');

  const pins = buildMapPins();
  mapPinIndex = {};
  const pinSvg = pins.map(p => {
    mapPinIndex[p.id] = p;
    const catClass = `is-${p.category}`;
    const visitedClass = tracked.has(p.id) ? 'is-visited' : '';
    const shown = p.inset || !activeMapHolds || activeMapHolds.has(p.hold);
    const dimClass = shown ? '' : 'dimmed';
    const labelOffset = p.category === 'capital' ? 11 : 8;
    return `
      <g class="map-pin ${catClass} ${visitedClass} ${dimClass}" data-pin-id="${p.id}" data-pin-hold="${p.hold || ''}" data-pin-category="${p.category}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})" tabindex="0">
        <circle class="map-pin-dot" cx="0" cy="0"></circle>
        <text class="map-pin-label" x="${labelOffset}" y="4">${p.name}</text>

}

// Click-to-preview popup for a map pin: name/type/hold + visited status (read straight from `tracked`)
// + a short summary, with a "View full entry" button that reuses navigateToResult() — the same
// scroll-and-flash jump every other cross-link button in the app already uses.
function showMapPinPopup(pinEl){
  const id = Number(pinEl.dataset.pinId);
  const p = mapPinIndex[id];
  const popup = document.getElementById('map-popup');
  const wrap = pinEl.closest('.skyrim-map-wrap');
  if (!p || !popup || !wrap) return;
  activeMapPinId = id;

  const isVisited = tracked.has(id);
  const statusLabel = p.category === 'capital' || p.category === 'poi' ? (isVisited ? 'Visited' : 'Not yet visited')
    : p.category === 'housing' ? (isVisited ? 'Acquired' : 'Not yet acquired')
    : (isVisited ? 'Cleared' : 'Not yet cleared');
  const summary = (p.summary || '').length > 160 ? p.summary.slice(0, 157) + '…' : (p.summary || '');

  popup.innerHTML = `
    <button class="mp-close" aria-label="Close">✕</button>
    <h4>${p.name}</h4>
    <p class="mp-meta">${p.type}${p.hold ? ' · ' + p.hold : ''} · <span class="mp-status ${isVisited ? '' : 'not-visited'}">${statusLabel}</span></p>
    ${summary ? `<p class="mp-summary">${summary}</p>` : ''}
    <button class="mp-goto" type="button">View full entry →</button>`;

  // Position the popup near the pin, in the map-wrap's own coordinate space (it's the positioned
  // ancestor), then nudge back on-screen if it would overflow the wrap's right/bottom edge.
  const pinRect = pinEl.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  popup.style.display = 'block';
  let left = (pinRect.left - wrapRect.left) + (pinRect.width / 2) + 12;
  let top = (pinRect.top - wrapRect.top) - 4;
  const popupW = popup.offsetWidth, popupH = popup.offsetHeight;
  if (left + popupW > wrap.clientWidth - 8) left = (pinRect.left - wrapRect.left) - popupW - 12;
  if (left < 8) left = 8;
  if (top + popupH > wrap.clientHeight - 8) top = wrap.clientHeight - popupH - 8;
  if (top < 8) top = 8;
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';

  popup.querySelector('.mp-close').addEventListener('click', (e) => { e.stopPropagation(); hideMapPinPopup(); });
  popup.querySelector('.mp-goto').addEventListener('click', (e) => { e.stopPropagation(); hideMapPinPopup(); navigateToResult({ itemId: p.id, nav: p.nav }); });
  popup.addEventListener('click', (e) => e.stopPropagation());
}

function hideMapPinPopup(){
  const popup = document.getElementById('map-popup');
  if (popup) popup.style.display = 'none';
  activeMapPinId = null;
}

// Toggles one hold in/out of the map's hold filter. Multi-select: click a hold pill to hide/show just
// that hold's pins. Snaps back to "All Holds" (activeMapHolds = null) if every hold ends up selected or
// none do, so the map never gets stuck on a confusing all-dimmed state.
function toggleMapHoldFilter(holdName){
  if (!activeMapHolds) activeMapHolds = new Set(LOCATION_HOLDS);
  if (activeMapHolds.has(holdName)) activeMapHolds.delete(holdName); else activeMapHolds.add(holdName);
  if (activeMapHolds.size === 0 || activeMapHolds.size === LOCATION_HOLDS.length) activeMapHolds = null;
  hideMapPinPopup();
  renderLocations();
}

// Closes the map popup on any click elsewhere in the document — attached once, not re-bound per render.
document.addEventListener('click', () => { if (activeMapPinId !== null) hideMapPinPopup(); });

  } else if (activeLocationTab === 'housing') {

    const cityList = CITY_HOMES.filter(h => passesFilter(h, h.id) && matches(h.name, h.city, h.hold, h.unlock, h.upgrades.map(u => u.name).join(' ')));
    const cityCardHtml = h => {

      return `

    const dlcCardHtml = h => {

  container.querySelectorAll('[data-link-nav]').forEach(btn => {
    btn.addEventListener('click', () => { navigateToResult(JSON.parse(btn.dataset.linkNav)); });
  });
  container.querySelectorAll('.map-pin').forEach(pin => {
    pin.addEventListener('click', (e) => { e.stopPropagation(); showMapPinPopup(pin); });
    pin.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showMapPinPopup(pin); } });
  });
  container.querySelectorAll('[data-hold-filter]').forEach(pill => {
    pill.addEventListener('click', () => { toggleMapHoldFilter(pill.dataset.holdFilter); });
  });
  const resetPillEl = container.querySelector('[data-map-filter-reset]');
  if (resetPillEl) resetPillEl.addEventListener('click', () => { activeMapHolds = null; hideMapPinPopup(); renderLocations(); });
}

/* ============================= SECRETS & ODDITIES RENDER ============================= */

function renderSecrets(){
  try { renderSecretsInner(); } catch (err) { showRenderError(err); }
}

function renderSecretsInner(){
  const container = document.getElementById('entries');
  container.classList.remove('grid-mode');
  document.getElementById('sub-row').style.display = 'none';
  document.getElementById('branch-banner').style.display = 'none';
  document.getElementById('search-row').style.display = 'flex';

  const tabsHtml = `<div class="sub-row" style="display:flex; margin-bottom:18px;">${SECRETS_TABS.map(t =>
    `<span class="sub-pill ${activeSecretsTab===t.id?'active':''}" data-secretstab="${t.id}">${t.icon} ${t.label}</span>`).join('')}</div>`;

  let list = SECRETS.filter(s => s.sub === activeSecretsTab);
  if (favOnly) list = list.filter(s => favorites.has(s.id));
  if (hideCompleted) list = list.filter(s => !tracked.has(s.id));
  if (query.trim()) {
    const q = query.toLowerCase();
    list = list.filter(s => [s.name, s.ref, s.location, s.note].join(' ').toLowerCase().includes(q));
  }
  const scoped = SECRETS.filter(s => s.sub === activeSecretsTab);
  const done = scoped.filter(s => tracked.has(s.id)).length;
  const statLabel = `${done} of ${scoped.length} discovered`;

  const cardHtml = s => {
    const isFav = favorites.has(s.id), isDone = tracked.has(s.id);
    return `
    <article class="quest ${isDone ? 'done' : ''}" data-id="${s.id}">
      <div class="quest-top">
        <div class="quest-title-wrap"><h3>${s.name}</h3>${s.ref ? `<span class="tag-chip tag-optional">${s.ref}</span>` : ''}</div>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${s.id}" aria-label="Favorite">★</button>
      </div>
      <div class="quest-meta"><span><b>Where:</b> ${s.location}</span></div>
      <p class="ach-desc">${s.note}</p>
      <div class="quest-foot"><span></span><button class="track-btn" data-track="${s.id}"><span class="box"></span> ${isDone ? 'Discovered' : 'Mark discovered'}</button></div>
    </article>`;
  };
  const bodyHtml = list.length === 0 ? `<div class="empty-state">No entries match. Try another search or clear the filter.</div>` : `<div class="ach-group-list">${list.map(cardHtml).join('')}</div>`;

  container.innerHTML = tabsHtml + bodyHtml;
  const progressEl = document.getElementById('progress-tally');
  progressEl.textContent = statLabel;
  progressEl.style.display = 'inline';

  container.querySelectorAll('[data-secretstab]').forEach(pill => {
    pill.addEventListener('click', () => { activeSecretsTab = pill.dataset.secretstab; favOnly = false; hideCompleted = false; query = ''; const si = document.getElementById('search'); if (si) si.value = ''; renderAll(); saveNavState(); });
  });
  container.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.fav);
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      renderSecrets(); saveProgress();
    });
  });
  container.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderSecrets(); saveProgress(); renderNav();
    });
  });
}

    <textarea id="notes-area" spellcheck="false" placeholder="Dear journal..." style="width:100%; min-height:420px; resize:vertical; box-sizing:border-box; background: var(--panel); color: var(--ink); border: 1px solid var(--iron); box-shadow: inset 0 1px 0 var(--panel-hi); padding:18px; font-family:'Spectral', serif; font-size:14px; line-height:1.6;">${journalNotes.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>

/* ============================= ACHIEVEMENTS RENDER ============================= */

function renderAchievements(){
  try { renderAchievementsInner(); } catch (err) { showRenderError(err); }
}

function renderAchievementsInner(){
  document.getElementById('search-row').style.display = 'flex';
  document.getElementById('sub-row').style.display = 'none';
  document.getElementById('branch-banner').style.display = 'none';
  const container = document.getElementById('entries');
  container.classList.remove('grid-mode');

  let list = ACHIEVEMENTS.slice();
  if (favOnly) list = list.filter(a => favorites.has(a.id));
  if (hideCompleted) list = list.filter(a => !tracked.has(a.id));
  if (query.trim()) {
    const q = query.toLowerCase();
    list = list.filter(a =>
      a.name.toLowerCase().includes(q) ||
      a.description.toLowerCase().includes(q) ||
      a.group.toLowerCase().includes(q)
    );
  }

  const { done, total } = achStat();
  const progressEl = document.getElementById('progress-tally');
  progressEl.textContent = `${done} of ${total} earned`;
  progressEl.style.display = 'inline';

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">No achievements match. Try another search or clear the filter.</div>`;
    return;
  }

  const grouped = ACHIEVEMENT_GROUPS.map(g => ({ g, items: list.filter(a => a.group === g) })).filter(x => x.items.length);

  const cardHtml = a => {
    const isFav = favorites.has(a.id);
    const isDone = tracked.has(a.id);
    const trophyClass = a.trophy === 'gold' ? 'gold' : a.trophy === 'silver' ? 'silver' : '';
    const linkBtn = a.linkLine ? `<button class="ach-link-btn" data-link-line="${a.linkLine}" data-link-branch="${a.linkBranch||''}" data-link-quest="${a.linkQuest||''}">🔗 View quest</button>` : '<span></span>';
    return `
    <article class="quest ach-card ${isDone ? 'done' : ''}" data-id="${a.id}">
      <div class="quest-top">
        <div class="quest-title-wrap">
          <span class="points-badge ${trophyClass}">${a.points} pts</span>
          <h3>${a.name}</h3>
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${a.id}" aria-label="Favorite">★</button>
      </div>
      <p class="ach-desc">${a.description}</p>
      <div class="quest-foot">
        ${linkBtn}
        <button class="track-btn" data-track="${a.id}"><span class="box"></span> ${isDone ? 'Earned' : 'Mark earned'}</button>
      </div>
    </article>`;
  };

  container.innerHTML = `<div class="ach-categories">${grouped.map(({ g, items }) => `
    <div style="margin: 18px 0 10px; font-family:'Cinzel', serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold-dim);">${g} <span style="opacity:0.6; font-family:'Spectral', serif; text-transform:none; letter-spacing:0;">(${items.filter(a=>tracked.has(a.id)).length}/${items.length})</span></div>
    <div class="ach-grid">${items.map(cardHtml).join('')}</div>
  `).join('')}</div>`;

  container.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.fav);
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      renderAchievements(); saveProgress();
    });
  });
  container.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderAchievements(); saveProgress(); renderNav();
    });
  });
  container.querySelectorAll('[data-link-line]').forEach(btn => {
    btn.addEventListener('click', () => {
      const line = btn.dataset.linkLine;
      const branch = btn.dataset.linkBranch;
      const questId = btn.dataset.linkQuest ? Number(btn.dataset.linkQuest) : null;
      activeSection = 'quests';
      activeLine = line;
      activeBranch = branch || (line === 'civilwar' ? 'imperial' : null);
      favOnly = false; hideCompleted = false; query = '';
      const si = document.getElementById('search'); if (si) si.value = '';
      renderAll();
      syncFilterPills();
      let scrolled = false;
      if (questId) {
        const targetCard = document.querySelector(`.quest[data-id="${questId}"]`);
        if (targetCard) {
          targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          targetCard.classList.add('flash-highlight');
          setTimeout(() => targetCard.classList.remove('flash-highlight'), 2200);
          scrolled = true;
        }
      }
      if (!scrolled) window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ============================= QUESTS RENDER ============================= */

function renderQuests(){
  try { renderQuestsInner(); } catch (err) { showRenderError(err); }
}

function renderQuestsInner(){
  document.getElementById('search-row').style.display = 'flex';
  const container = document.getElementById('entries');
  container.classList.remove('grid-mode');

  let list = questsForLine(activeLine);
  if (activeLine === 'civilwar' || activeLine === 'dawnguard') {
    list = list.filter(q => !q.branch || q.branch === activeBranch);
  }
  if (favOnly) list = list.filter(q => favorites.has(q.id));
  if (hideCompleted) list = list.filter(q => !tracked.has(q.id));
  if (query.trim()) {
    const q = query.toLowerCase();
    list = list.filter(item =>
      item.title.toLowerCase().includes(q) ||
      (item.steps||[]).join(' ').toLowerCase().includes(q) ||
      (item.rewards||[]).join(' ').toLowerCase().includes(q) ||
      (item.giver||'').toLowerCase().includes(q) ||
      (item.prince||'').toLowerCase().includes(q) ||
      (item.choice ? item.choice.text.toLowerCase().includes(q) : false)
    );
  }

  const progressEl = document.getElementById('progress-tally');
  const stat = (activeLine === 'civilwar' || activeLine === 'dawnguard') ? statFor(activeLine, activeBranch) : statFor(activeLine);
  progressEl.textContent = `${stat.done} of ${stat.total} quests complete`;
  progressEl.style.display = 'inline';

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">No entries here yet. Try another questline or clear the search.</div>`;
    return;
  }

  container.innerHTML = list.map(q => {
    const isFav = favorites.has(q.id);
    const isDone = tracked.has(q.id);
    const stepsHtml = (q.steps||[]).map(s => `<li>${s}</li>`).join('');
    const rewardsHtml = (q.rewards||[]).map(r => `<span class="reward-chip">${r}</span>`).join('');
    const tags = [
      q.optional ? `<span class="tag-chip tag-optional">Optional</span>` : '',
      q.alt ? `<span class="tag-chip tag-alt">Alternate branch</span>` : '',
    ].join('');
    const metaBits = [
      q.prince ? `<span><b>Prince:</b> ${q.prince}</span>` : '',
      q.giver ? `<span><b>Giver:</b> ${q.giver}</span>` : '',
      q.location ? `<span><b>Where:</b> ${q.location}</span>` : '',
      q.level ? `<span><b>Level:</b> ${q.level}</span>` : '',
    ].join('');
    return `
    <article class="quest ${isDone ? 'done' : ''} ${q.alt ? 'alt' : ''} ${q.optional ? 'optional' : ''}" data-id="${q.id}">
      <div class="quest-top">
        <div class="quest-title-wrap">
          ${q.order ? `<span class="quest-order">#${q.order}</span>` : ''}
          <h3>${q.title}</h3>
          ${tags}
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${q.id}" aria-label="Favorite">★</button>
      </div>
      ${metaBits ? `<div class="quest-meta">${metaBits}</div>` : ''}
      ${stepsHtml ? `<ol class="quest-steps">${stepsHtml}</ol>` : ''}
      ${q.choice ? `<div class="choice-box"><b>${q.choice.flag || 'Choice Point'}</b>${q.choice.text}</div>` : ''}
      ${rewardsHtml ? `<div class="rewards-row">${rewardsHtml}</div>` : ''}
      <div class="quest-foot">
        <span></span>
        ${q.trackable ? `<button class="track-btn" data-track="${q.id}"><span class="box"></span> ${isDone ? 'Completed' : 'Mark complete'}</button>` : ''}
      </div>
    </article>`;
  }).join('');

  container.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.fav);
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      renderQuests(); saveProgress(); renderSubRow(); renderNav();
    });
  });
  container.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderQuests(); saveProgress(); renderSubRow();
    });
  });
}

/* ============================= MASTER RENDER ============================= */

function showRenderError(err){
  console.error('Journal render error:', err);
  const container = document.getElementById('entries');
  if (!container) return;
  container.classList.remove('grid-mode');
  container.innerHTML = `
    <div class="placeholder-card" style="border-color: var(--blood);">
      <div class="p-icon">⚠️</div>
      <h2 style="color: var(--blood);">Something tore in the page</h2>
      <p>The journal hit an unexpected error while drawing this page. Try clicking another tab and back again. If it keeps happening, this is the detail to report:</p>
      <p style="font-family:'Spectral', monospace; font-size:11px; color: var(--ink-dim); word-break:break-word;">${(err && err.message) ? err.message : String(err)}</p>
    </div>`;
}

/* ============================= GLOBAL SEARCH RESULTS RENDER ============================= */

// Sends the browser to a search result's real home (section + sub-tab) and, when that entry has a
// real trackable card (itemId isn't null — build guides don't have one), scrolls to and flashes it —
// exactly the same navigate-and-highlight pattern the existing cross-link buttons already use.
function navigateToResult(r){
  const nav = r.nav;
  activeSection = nav.section;
  if ('line' in nav) { activeLine = nav.line; activeBranch = nav.branch || null; }
  if (nav.buildTab) activeBuildTab = nav.buildTab;
  if (nav.skillTree) activeSkillTree = nav.skillTree;
  if (nav.followerTab) activeFollowerTab = nav.followerTab;
  if (nav.craftTab) activeCraftTab = nav.craftTab;
  if (nav.shoutTab) activeShoutTab = nav.shoutTab;
  if (nav.treasureTab) activeTreasureTab = nav.treasureTab;
  if (nav.locationTab) activeLocationTab = nav.locationTab;
  if (nav.holdTab) activeLocationHold = nav.holdTab;
  favOnly = false; hideCompleted = false; query = '';
  const si = document.getElementById('search'); if (si) si.value = '';
  renderAll();
  syncFilterPills();
  let scrolled = false;
  if (r.itemId !== null && r.itemId !== undefined) {
    const targetCard = document.querySelector(`.quest[data-id="${r.itemId}"]`);
    if (targetCard) {
      targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      targetCard.classList.add('flash-highlight');
      setTimeout(() => targetCard.classList.remove('flash-highlight'), 2200);
      scrolled = true;
    }
  }
  if (!scrolled) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderGlobalSearchResults(){
  document.getElementById('search-row').style.display = 'flex';
  document.getElementById('sub-row').style.display = 'none';
  document.getElementById('branch-banner').style.display = 'none';
  const container = document.getElementById('entries');
  container.classList.remove('grid-mode');

  const q = query.trim().toLowerCase();
  let results = SEARCH_INDEX.filter(r => r.searchText.includes(q));
  if (favOnly) results = results.filter(r => r.itemId !== null && favorites.has(r.itemId));
  if (hideCompleted) results = results.filter(r => r.itemId === null || !tracked.has(r.itemId));

  const progressEl = document.getElementById('progress-tally');
  const sectionCount = new Set(results.map(r => r.sectionLabel.split(' › ')[0])).size;
  progressEl.textContent = results.length
    ? `${results.length} result${results.length === 1 ? '' : 's'} across ${sectionCount} section${sectionCount === 1 ? '' : 's'}`
    : '';
  progressEl.style.display = results.length ? 'inline' : 'none';

  if (results.length === 0) {
    container.innerHTML = `<div class="empty-state">No matches for "${query.trim()}" anywhere in the journal. Try a different search term.</div>`;
    return;
  }

  const order = [];
  const bySection = {};
  results.forEach(r => {
    if (!bySection[r.sectionLabel]) { bySection[r.sectionLabel] = []; order.push(r.sectionLabel); }
    bySection[r.sectionLabel].push(r);
  });

  // Trackable entries (itemId !== null) get a "mark complete" toggle right on the result card, so a
  // completed quest can be checked off without leaving the search results to open its full entry.
  // Shouts are the one exception: their itemId is a slug used only for scroll-to-card, since the
  // shout itself isn't individually tracked — only its 1-3 component words are (see renderShoutsInner) —
  // so a shout search result never gets this button.
  const isShoutResult = r => r.nav.section === 'shouts' && r.nav.shoutTab === 'shouts';
  const resultCardHtml = (r, idx) => {
    const canTrack = r.itemId !== null && r.itemId !== undefined && !isShoutResult(r);
    const isDone = canTrack && tracked.has(r.itemId);
    return `
    <article class="quest ach-card search-result-card ${isDone ? 'done' : ''}" data-search-idx="${idx}">
      <div class="quest-top">
        <div class="quest-title-wrap"><span class="result-icon">${r.icon}</span><h3>${r.title}</h3></div>
      </div>
      ${r.snippet ? `<p class="ach-desc">${r.snippet}</p>` : ''}
      ${canTrack ? `<div class="quest-foot"><span></span><button class="track-btn" data-search-track="${r.itemId}"><span class="box"></span> ${isDone ? 'Completed' : 'Mark complete'}</button></div>` : ''}
    </article>`;
  };

  container.innerHTML = `<p class="search-section-note">Searching the whole journal — every quest, perk, follower, crafting entry, creature, shout, treasure, and location, not just this tab.</p>
    <div class="ach-categories">${order.map(label => {
      const items = bySection[label];
      return `<div style="margin: 18px 0 10px; font-family:'Cinzel', serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold-dim);">${label} <span style="opacity:0.6; font-family:'Spectral', serif; text-transform:none; letter-spacing:0;">(${items.length})</span></div>
        <div class="ach-grid">${items.map(r => resultCardHtml(r, results.indexOf(r))).join('')}</div>`;
    }).join('')}</div>`;

  container.querySelectorAll('[data-search-idx]').forEach(card => {
    card.addEventListener('click', () => navigateToResult(results[Number(card.dataset.searchIdx)]));
  });
  container.querySelectorAll('[data-search-track]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation(); // don't also trigger the card's navigate-away click
      const id = Number(btn.dataset.searchTrack);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      saveProgress();
      renderGlobalSearchResults();
    });
  });
}

/* ============================= MASTER RENDER ============================= */

// Shared by renderAll() (full repaint, incl. nav/header) and renderCurrentList() (content only, on
// every keystroke/filter toggle): a non-empty search query always wins and shows global results,
// regardless of which section is active — that's what makes search behave the same on every tab.
function renderSectionContent(){
  if (query.trim()) { renderGlobalSearchResults(); return; }
  if (activeSection === 'overview') { renderOverview(); }
  else if (activeSection === 'quests') { renderQuests(); }
  else if (activeSection === 'achievements') { renderAchievements(); }
  else if (activeSection === 'builds') { renderBuilds(); }
  else if (activeSection === 'followers') { renderFollowers(); }
  else if (activeSection === 'crafting') { renderCrafting(); }
  else if (activeSection === 'bestiary') { renderBestiary(); }
  else if (activeSection === 'shouts') { renderShouts(); }
  else if (activeSection === 'treasure') { renderTreasure(); }
  else if (activeSection === 'locations') { renderLocations(); }
  else if (activeSection === 'secrets') { renderSecrets(); }
  else if (activeSection === 'notes') { renderNotes(); }
  else { renderPlaceholder(); }
}

function renderAll(){
  try {
    renderNav();
    renderHeader();
    renderSubRow();
    renderSectionContent();
    saveNavState();
  } catch (err) {
    showRenderError(err);
  }
}

function renderCurrentList(){
  try {
    renderSectionContent();
  } catch (err) {
    showRenderError(err);
  }
}

document.getElementById('search').addEventListener('input', e => { query = e.target.value; renderCurrentList(); });
document.querySelectorAll('.filter-pill[data-fav]').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.filter-pill[data-fav]').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    favOnly = pill.dataset.fav === 'favorites';
    renderCurrentList();
  });
});
document.querySelectorAll('.filter-pill[data-hide-done]').forEach(pill => {
  pill.addEventListener('click', () => {
    hideCompleted = !hideCompleted;
    pill.classList.toggle('active', hideCompleted);
    renderCurrentList();
  });
});

window.addEventListener('scroll', () => {
  backToTopBtn.classList.toggle('visible', window.scrollY > 600);
});
backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

loadProgress();
loadNavState();
loadNotes();
renderAll();
syncPullAndReconcile();
window.__jawSyncOnConfigured = syncPullAndReconcile;
syncAccountPullAndReconcile();
window.__jawAccountOnSignedIn = syncAccountPullAndReconcile;
