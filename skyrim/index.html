  choice:{ flag:'Tip — a one-stop blood run', text:"Liar's Retreat (a cave west of Markarth) has Orc, Falmer, Dark Elf, and Wood Elf corpses all in the same dungeon, letting you collect 4 of the 5 required blood samples in a single trip." },
  rewards:['Oghma Infinium'], trackable:true },

{ id:704, line:'daedric', order:5, prince:'Hircine', title:'Ill Met By Moonlight', giver:'Mathies or Sinding', location:"Falkreath, Bloated Man's Grotto",
  steps:[
    'In Falkreath, learn a jailed werewolf, Sinding, killed a local girl while transforming against his will because of a cursed item, the Ring of Hircine.',
    'Speak to Sinding in jail — he offers the ring in exchange for hunting a unique white stag said to commune with Hircine, then escapes his cell as a werewolf.',
    'Track down and kill the White Stag east of Falkreath; the Aspect of Hircine emerges and sends you to Bloated Man\'s Grotto to hunt Sinding himself.'
  ],
  choice:{ flag:'Choice Point — hunt or spare Sinding', text:"Side with Hircine's will and hunt Sinding down through waves of hunters, killing him and flaying his skin for the unique cuirass Savior's Hide — OR spare Sinding and fight alongside him against the same hunters instead, letting him live and receiving the (now uncursed) Ring of Hircine." },
  rewards:["Savior's Hide OR Ring of Hircine"], trackable:true },

{ id:705, line:'daedric', order:6, prince:'Malacath', title:'The Cursed Tribe', giver:'Atub', location:"Largashbur, Fallowstone Cave, Giant's Grove", level:'Required 9, suggested 32 · Medium',
  steps:[
    'Arrive at the Orc stronghold Largashbur (The Rift, southwest of Riften) during a giant attack and help fight it off.',
    'Shaman Atub explains the tribe and its cowardly chief, Yamarz, are cursed by Malacath for weakness; fetch a bowl of troll fat and a Daedra heart for a cleansing ritual.',
    "Witness Atub's ritual — Malacath orders Yamarz to kill the giant terrorizing the camp and bring back its club as an offering.",
    "Escort Yamarz through Fallowstone Cave to the Giant's Grove."
  ],
  choice:{ flag:"Yamarz's betrayal", text:'At the grove, Yamarz tries to weasel out of the fight — agreeing to kill the giant for him leads to his immediate betrayal and attack on you (kill him), or persuading him to honor Malacath\'s wishes gets him quickly killed by the giant instead. Either way both the giant and Yamarz end up dead.' },
  rewards:['Volendrung (unique warhammer)', 'Blood-Kin status with the Orcs', 'Up to 3 new followers'], trackable:true },

{ id:706, line:'daedric', order:7, prince:'Mehrunes Dagon', title:'Pieces of the Past', giver:'Silus Vesuius', location:"Silus's House (Dawnstar), Dead Crone Rock, Cracked Tusk Keep, Shrine of Mehrunes Dagon", level:'Required 20',
  steps:[
    'At level 20+, visit the newly-opened "Museum of the Mythic Dawn" in Dawnstar, run by cultist descendant Silus Vesuius.',
    "Agree to retrieve the three broken pieces of the legendary Mehrunes' Razor — the pommel from Dead Crone Rock, and the blade shards and hilt from Cracked Tusk Keep.",
    "Return all three pieces to Silus, who insists on reforging the blade at the actual Shrine of Mehrunes Dagon, far east of Morthal.",
    'Silus performs the ritual and Mehrunes Dagon speaks through/possesses him.'
  ],
  choice:{ flag:'Choice Point — kill or spare Silus', text:"Kill the now-possessed Silus to claim the completed Mehrunes' Razor — OR let him go, in which case he flees with the Razor and you receive only leveled gold as a consolation. Killing him is the only way to get the artifact." },
  rewards:["Mehrunes' Razor (or leveled gold)", 'Access to the Shrine interior', 'Word for the Dismay shout'], trackable:true },

{ id:707, line:'daedric', order:8, prince:'Mephala', title:'The Whispering Door', giver:'Hulda (rumor) / Jarl Balgruuf', location:'Whiterun, Dragonsreach', level:'Required 20 · Medium',
  steps:[
    "Hear rumors at the Bannered Mare in Whiterun about trouble in the Jarl's family.",
    "Ask Jarl Balgruuf about his brooding, violent youngest son, Nelkir, then speak to Nelkir in Dragonsreach.",
    'Nelkir reveals he\'s been listening through a locked, blood-stained door in the basement to a mysterious "Whispering Lady."',
    'Investigate the door yourself and hear her voice — she is Mephala, Prince of Whispers, who asks you (not the "too limited" child) to free her.',
    'Acquire the Whispering Door Key from Balgruuf or Farengar Secret-Fire and open the door.'
  ],
  choice:{ flag:'Missable — charging the blade', text:"The Ebony Blade starts weak and only reaches its strongest tier by killing 10 friendly NPCs — followers or citizens whose favors you've completed — who trust you enough to say something like \"What do you need?\" before you strike. Killing hostile enemies or strangers doesn't count, so start banking trusted kills early if you want it maxed out for Oblivion Walker/completion purposes." },
  rewards:['The Ebony Blade (grows stronger the more you use it to kill those who trust you)'], trackable:true },

{ id:708, line:'daedric', order:9, prince:'Meridia', title:'The Break of Dawn', giver:"Meridia (via Beacon or Statue)", location:'Statue to Meridia, Kilkreath Ruins', level:'Required 12, suggested 24',
  steps:[
    "Find Meridia's Beacon (a randomized boss-chest drop) or travel to her Statue on Mount Kilkreath, west of Solitude.",
    'Meridia explains her temple was desecrated by the necromancer Malkoran, using her stolen artifact to fuel his undead army.',
    'Place the Beacon on its pedestal to be shown Meridia\'s radiant true form, then descend into the temple.',
    "Guide beams of Meridia's light through the ruined temple's corridors to unlock the inner sanctum while fighting draugr and undead.",
    'Confront and destroy Malkoran at the heart of the temple.'
  ],
  rewards:['Dawnbreaker (unique sword, bonus fire damage vs. undead)'], trackable:true },

{ id:709, line:'daedric', order:10, prince:'Molag Bal', title:'The House of Horrors', giver:'Vigilant Tyranus', location:'Markarth (Abandoned House), radiant location', level:'Suggested 14',
  steps:[
    'In Markarth, meet witch-hunter Vigilant Tyranus investigating an abandoned house he suspects of Daedric activity.',
    "Enter with him — Molag Bal's voice manipulates you both, locking the house and forcing a fight; kill Tyranus (unavoidable).",
    "Proceed to an altar where Molag Bal traps you and reveals his mace was defiled by a rival Daedra, Boethiah, through her priest Logrolf the Willful.",
    'Travel to a radiant location to find and free Logrolf, then bring him back to the altar.',
    'Force Logrolf to bow and submit to Molag Bal, then kill him as the final act of the ritual.'
  ],
  rewards:['The Mace of Molag Bal'], trackable:true },

{ id:710, line:'daedric', order:11, prince:'Namira', title:'The Taste of Death', giver:'Kleppr/Frabbi, Brother Verulus, Eola', location:'Markarth, Hall of the Dead, Reachcliff Cave', level:'Suggested 6',
  steps:[
    "Hear rumors in Markarth about the Hall of the Dead being closed; speak to priest Brother Verulus, who reveals corpses have been cannibalized inside.",
    'Investigate and meet Eola, a secret worshipper of Namira, Prince of Decay, who reveals she is behind it and invites you to join her cult at Reachcliff Cave.'
  ],
  choice:{ flag:'Choice Point — join Namira or side with Arkay', text:'Clear Reachcliff Cave of undead alongside Eola, bring a fresh kill to Namira\'s shrine, and eat the corpse to become a Champion of Namira, receiving the Ring of Namira — OR reject Eola\'s cult and instead complete the separate favor-quest resolution for Brother Verulus, earning the Amulet of Arkay instead. Mutually exclusive endings.' },
  rewards:['Ring of Namira + leveled gold OR Amulet of Arkay'], trackable:true },

{ id:711, line:'daedric', order:12, prince:'Peryite', title:'The Only Cure', giver:'An Afflicted Refugee, then Kesh the Clean', location:'Shrine to Peryite (The Reach), Bthardamz', level:'Required 10/12, suggested 16',
  steps:[
    'Encounter a plague-scarred "Afflicted Refugee" who credits Peryite, Prince of Pestilence, with keeping him alive, and points you to Kesh the Clean at Peryite\'s shrine.',
    'Kesh asks you to gather ingredients (Flawless Ruby, Silver Ingot, Vampire Dust, Deathbell) to brew a special incense.',
    'Inhale the incense to commune with an apparition of Peryite, who orders the death of a heretic priest, Orchendor, inside the Dwemer ruin Bthardamz.',
    'Travel there and kill Orchendor, then return to the shrine.'
  ],
  rewards:['Spellbreaker (unique enchanted shield)'], trackable:true },

{ id:712, line:'daedric', order:13, prince:'Sanguine', title:'A Night to Remember', giver:'Sam Guevenne', location:'Any tavern; Temple of Dibella, Rorikstead, Whiterun, Morvunskar', level:'Required 14',
  steps:[
    'Meet a stranger, Sam Guevenne, in any tavern, who challenges you to a drinking contest for a prize staff.',
    'Win by out-drinking him, then black out.',
    'Wake up the next day in the Temple of Dibella in Markarth having caused chaos overnight; help clean up the temple to make amends.',
    "Piece together the previous night's events across Rorikstead, Ysolda in Whiterun (who has your missing staff), and hints of a wedding you apparently arranged.",
    'Track everything to the bandit-held ruin Morvunskar, where Sam reveals himself as the Daedric Prince Sanguine.'
  ],
  rewards:['Sanguine Rose (summons a Dremora ally)'], trackable:true },

{ id:713, line:'daedric', order:14, prince:'Sheogorath', title:'The Mind of Madness', giver:'Dervenin', location:'Solitude, Pelagius Wing of the Blue Palace',
  steps:[
    'In Solitude, meet a mad beggar, Dervenin, whose "master" has secluded himself in the forbidden Pelagius Wing of the Blue Palace.',
    "Get Pelagius' Hip Bone from Dervenin and a key to the wing from palace staff (or the steward, if The Man Who Cried Wolf is done).",
    'Enter the wing and touch a portal that pulls you literally inside the mind of the long-dead, insane former King Pelagius III.',
    'Navigate three surreal trials — Confidence, Night Terrors, and Paranoia — guided/mocked by Sheogorath, Prince of Madness.',
    'Complete all three trials and escape the mind.'
  ],
  rewards:['Wabbajack (unique staff, randomized effects)', 'A set of Fine Clothes'], trackable:true },

{ id:714, line:'daedric', order:15, prince:'Vaermina', title:'Waking Nightmare', giver:'Erandur', location:'Windpeak Inn (Dawnstar), Nightcaller Temple', level:'Suggested 18 · Medium/Hard',
  steps:[
    'In Dawnstar, learn the townsfolk (and the Jarl) are plagued by shared nightmares.',
    'Meet Erandur, a reformed priest of Mara who was once a priest of Vaermina, Prince of Nightmares; he traces the cause to Nightcaller Temple on the cliff above town.',
    'Escort Erandur into the temple, fighting animated statues and undead priests; find the book The Dreamstride and drink Vaermina\'s Torpor to enter a dream-state.',
    "Release the Miasma's containment and fight to the inner sanctum, killing the corrupted priests Veren Duleri and Thorek."
  ],
  choice:{ flag:'Choice Point — kill or spare Erandur', text:'Erandur reveals HE was the priest most responsible for the centuries-old disaster, and asks you to either kill him as atonement (granting the Skull of Corruption) — or spare him, letting him live and eventually join you as a recruitable follower (forgoing the artifact).' },
  rewards:['Skull of Corruption OR Erandur as a follower'], trackable:true },

/* ======================= SAINTS & SEDUCERS (Creation Club — free base-game since Nov 2021) ======================= */
{ id:9000, line:'saintsseducers', order:1, title:'Balance of Power', giver:"Ri'saad", location:'Khajiit Caravan camp outside Whiterun or Markarth',
  steps:[
    "Locate Ri'saad's Khajiit caravan — it stops for several days outside Whiterun or Markarth — and ask about the trouble he's been having on the road.",
    'Read his note: two new bandit gangs, the golden-armored "Saints" and dark-armored "Seducers," have been raiding near North Brittleshin Pass and Fort Kastav.',
    "Clear both bandit camps and loot each leader's journal — reading them frees a caged Elytra Nymph pet in each camp and reveals where the true gang leaders, Kinthal (Saints) and Svarig (Seducers), are hiding.",
    "Track down and kill Kinthal and Svarig at their separate camps; loot the two unique soul gems near Kinthal's altar.",
    'Read both leaders\' journals — together they reveal the gangs were funded by a mad conjurer, Thoron, hiding in the Solitude sewers.',
    "Return to Ri'saad to report the gangs dealt with."
  ],
  rewards:['300 gold', 'Access to two Elytra Nymph pet cages'], trackable:true },

{ id:9001, line:'saintsseducers', order:2, title:'Restoring Order', giver:'(Continues automatically after Balance of Power)', location:'Solitude, Solitude Sewers',
  steps:[
    "Enter the Solitude sewers through the manhole cover near where Thoron was reported.",
    'Fight through the overgrown "root cave" tunnel system beneath Solitude — Elytra Nymphs and Corrupted Spriggans included.',
    'Reach the four-way intersection where Thoron is performing his ritual and defeat him — he summons Golden Saints and Dark Seducers to aid him.',
    "Loot Thoron's body for the Madness Helmet of Recovery and spell tomes to summon Golden Saints or Dark Seducers.",
    "Search Thoron's workstation in the northern alcove for the Sheogorath-Shaped Amber and a note that begins the Amber and Madness Smithing quest.",
    'Retrieve the Sword of Jyggalag from the western alcove to complete the quest.'
  ],
  rewards:['Sword of Jyggalag (artifact)', 'Conjure Golden Saint / Dark Seducer spell tomes', 'Ring of Disrobing', 'Sheogorath-Shaped Amber (needed for "Staada\'s Quest")'], trackable:true },

{ id:9002, line:'saintsseducers', order:3, title:'My Pet Elytra (Dementia)', giver:'(Found while clearing a Seducers bandit camp)', location:'Seducers bandit camp near North Brittleshin Pass or Fort Kastav', optional:true,
  steps:[
    "Find the caged Elytra Nymph inside a Seducers bandit camp while clearing it for Balance of Power.",
    "Use the cage key looted from the Seducers bandit leader to free and speak with the nymph.",
    'Recruit it as a pet.'
  ],
  rewards:['Demented Elytra Nymph (recruitable pet)'], trackable:true },

{ id:9003, line:'saintsseducers', order:4, title:'My Pet Elytra (Mania)', giver:'(Found while clearing a Saints bandit camp)', location:'Saints bandit camp near North Brittleshin Pass or Fort Kastav', optional:true,
  steps:[
    "Find the caged Elytra Nymph inside a Saints bandit camp while clearing it for Balance of Power.",
    "Use the cage key looted from the Saints bandit leader to free and speak with the nymph.",
    'Recruit it as a pet.'
  ],
  rewards:['Manic Elytra Nymph (recruitable pet)'], trackable:true },

{ id:9004, line:'saintsseducers', order:5, title:'Golden and Dark Smithing', giver:'Notes on the Blacksmith (looted from the Saints Bandit Leader)', location:'First Saints bandit camp', optional:true,
  steps:[
    "Loot the Notes on the Blacksmith off the Saints Bandit Leader's corpse at the first Saints camp.",
    'Read the note to unlock the recipes.'
  ],
  rewards:['Ability to craft Golden and Dark armor and weapons at any forge'], trackable:true },

{ id:9005, line:'saintsseducers', order:6, title:'Amber and Madness Smithing', giver:"Note found on Thoron's workbench", location:"Thoron's workstation, Solitude Sewers (during Restoring Order)", optional:true,
  steps:[
    "Loot the crafting note from Thoron's workstation in the northern alcove of his sewer lair.",
    'Read it to unlock the recipes.'
  ],
  rewards:['Ability to craft Amber and Madness armor and weapons at any forge'], trackable:true },

{ id:9006, line:'saintsseducers', order:7, title:'Nerveshatter', giver:"Bandit's Note on Hidden Treasure (looted from a knapsack at the first Seducers camp)", location:"Camp east of Svarig's camp; Crystaldrift Cave", optional:true,
  steps:[
    "Loot the Bandit's Note on Hidden Treasure from a knapsack at the first Seducers camp — it points to Crystaldrift Cave.",
    "Find Gadnor's body and read his journal, Gadnor's Last Wishes, at the small campsite inside.",
    "Place 1x Amber and 1x Madness Ore on the brazier near his bier to dispel the illusion hiding his warhammer (both materials are essentially guaranteed after completing Restoring Order).",
    'Retrieve Nerveshatter — Seducers bandits ambush you the moment you claim it.'
  ],
  rewards:['Nerveshatter (unique warhammer)'], trackable:true },

{ id:9007, line:'saintsseducers', order:8, title:"Staada's Quest", giver:'Courier (delivers "A Request to Meet")', location:"Coast beneath Solitude's Great Arch", optional:true,
  steps:[
    'Read the note "A Request to Meet," delivered by courier shortly after completing Restoring Order.',
    "Travel to the coast beneath Solitude's Great Arch and meet the Golden Saint Staada."
  ],
  choice:{ flag:'Give up an item — or keep both', text:"Hand over either the Sheogorath-Shaped Amber or the Sword of Jyggalag to receive Staada's Helmet and let her leave peacefully. OR refuse to give up either item — Staada turns hostile and must be fought, but you keep both the Amber and the Sword (the Amber can then be combined with other items at an Atronach Forge to summon her again later, at the cost of forfeiting the helmet)." },
  rewards:["Staada's Helmet (if you surrender the amber or the sword)"], trackable:true },

/* ======================= GALLOWS HALL (Creation Club — Anniversary Edition) ======================= */
{ id:10000, line:'gallowshall', order:1, title:'Dreams of the Dead', giver:"Naara's Journal (found within the abandoned fort)", location:"Gallows Hall, north shore of Mara's Eye Pond (southwest of Windhelm)",
  steps:[
    "Enter Gallows Hall and read Naara's Journal and the notes beside her body — the door slams shut and objects begin flying as unquiet spirits stir.",
    'Study the map in the center of the room for a clue, then set the four wall torches in order: Morthal, Falkreath, Nightgate Inn, Fort Dunstad.',
    'Take the Staff of Worms once the mist clears, then use it to reanimate the skeleton mage in the eastern part of the room and search it for the Arch Necromancer\'s Key.',
    'Open the safe by the arcane enchanter for the Bloodworm Helm, leveled treasure, and a second clue.',
    'Pray at the small Statue of Vaermina along the west wall, then sleep in the bedroll beside the Altar of the Revenant — this can trigger the Dark Brotherhood quest "With Friends Like These..." if that questline is active, so time it accordingly.',
    "While dreaming, search three coffins around the room for Dreamer's Greater Soul Gems, then read the Arch Necromancer's final instructions.",
    "Place all four Greater Soul Gems in the altar's holders to transform them into Black Soul Gems and complete the quest."
  ],
  rewards:['Staff of Worms (raises a permanent dead thrall)', 'Bloodworm Helm', 'Helm of Oreyn Bearclaw', 'Access to Gallows Hall + the Bone Forge (an extra permanent skeleton follower)', 'The Altar of the Revenant — reusable, turns Greater/Grand Soul Gems into Black Soul Gems'], trackable:true },

/* ======================= THE RISING DEAD (Creation Club "Plague of the Dead" — Anniversary Edition;
   the necromancy-themed CC item pack "Necromantic Grimoire" is a separate, quest-less spellbook/robe
   pack from the same November 2021 update, covered under Creation Club Extras) ======================= */
{ id:10010, line:'risingdead', order:1, title:'The Rising Dead', giver:'Anonymous Letter (delivered by courier at level 5)', location:'Ritual site north of Southfringe Sanctum, southeast of Helgen', level:'5',
  steps:[
    'Reach character level 5 and read the Anonymous Letter delivered by courier, warning of a necromancer ritual.',
    'Travel to the ritual site in the mountains north of Southfringe Sanctum.',
    "Defeat the zombies now guarding the site — the necromancers' summoning succeeded, but they lost control of it.",
    "Loot the marked necromancer's corpse for a leveled Conjure Zombie spell tome, then read his journal to complete the quest."
  ],
  rewards:['Spell Tome: Conjure Zombie (or Conjure Foul Zombie at level 11+)', 'Random zombie-horde world encounters unlock across Skyrim, especially at night'], trackable:true },

/* ======================= GHOSTS OF THE TRIBUNAL (Creation Club — Anniversary Edition) ======================= */
{ id:10020, line:'tribunal', order:1, title:'Ghosts of the Tribunal', giver:"Heretic Dossier: Blacksmith's Confessional (Temple in Raven Rock)", location:"Raven Rock Temple, Fahlbtharz, Ashfall's Tear",
  steps:[
    'Read the Heretic Dossier at the Temple in Raven Rock, then travel to Fahlbtharz Forge and kill Hand Kenro Hlan — looting him also starts the concurrent quest Trueflame.',
    "Head to Ashfall's Tear and solve the ALMSIVI pillar puzzle (order: A, S, V) to enter.",
    "Optional: wear Kenro's looted helmet and robes to infiltrate the cult peacefully instead of fighting the Ordinators guarding the door.",
    'Speak with Matriarch Drevlan and choose to join the heretics (persuade her, or win a trial by combat against her Hands) or destroy them outright.',
    'If joining: complete the three tasks she assigns — Her Word Against Theirs, Buyer Beware, and Careless Curation — to recover the Masks of Vivec and Sotha Sil and spread her word.',
    'Return and clear the ash zombies attacking the temple, then speak to Drevlan for the Tribunal Armory Key and the Her Hand/Indoril armor recipes.'
  ],
  choice:{ flag:'Choice Point — join or destroy the cult', text:"Disguised as Kenro, you can persuade or fight your way into Matriarch Drevlan's trust and join her Almalexia-worshipping heretics, unlocking three side tasks, follower NPCs, and the Tribunal Armory Key (needed for Skull Crusher). OR fight through the temple by force and destroy the cult — you can still complete the related quests by looting bodies for clues, but without the key you can't reach Skull Crusher, and the masks you recover are unenchanted replicas rather than the true artifacts." },
  rewards:['Hand Ethra Mavandas, Hand Kydren Indobar, Vesparth the Toe, and Watchman Sindras as potential followers (if joining)', 'Tribunal Armory Key (if joining)', 'Ability to craft the Her Hand and Indoril armor sets', 'Masks of the Tribunal (Almalexia, Dagoth Ur, Sotha Sil, Vivec)'], trackable:true },

{ id:10021, line:'tribunal', order:2, title:'Trueflame', giver:"Hand Kenro's Note (looted from Hand Kenro Hlan)", location:"Fahlbtharz Forge, Ashfall's Tear, Old Attius Farm Cellar", optional:true,
  steps:[
    'Loot the Unenchanted Weapon and a sample of Pyroil Tar from Hand Kenro Hlan at Fahlbtharz Forge.',
    "Track down all four Fahlbtharz Forge Gems — one from Kenro, one from the Buyer during Buyer Beware, one from the Ashfall's Tear armory, and one from Erden Relvel at the end of Ashen Heart.",
    'Return to Fahlbtharz Forge, place the four gems in the forge\'s receptacles, apply the pyroil tar to the blade, and set it in the sword slot to reforge Trueflame, the legendary Blade of Nerevar.'
  ],
  rewards:['Trueflame (fire-enchanted legendary blade)'], trackable:true },

/* ======================= THE CAUSE (Creation Club — Anniversary Edition) ======================= */
{ id:10030, line:'thecause', order:1, title:'The Cause', giver:"Stranger's Plea (delivered by courier at level 46)", location:'Shrine of Stendarr, Mythic Dawn Camp, Rielle, Red Scar Cavern', level:'46',
  steps:[
    "Reach level 46 and read the Stranger's Plea from Skorvild, an ex-Mythic Dawn cultist asking for help.",
    "Travel to the Shrine of Stendarr (the Two Pillars, in Whiterun Hold's tundra) — Skorvild is killed by his former cult before you arrive; loot the Mythic Dawn Orders and his journal from the scene.",
    'Clear the Mythic Dawn Camp north of the Alchemist\'s Shack and read the Excavation Leader\'s Journal describing a plan to reopen an Oblivion Gate.',
    'Delve through Varlais Cavern into the Ayleid ruin of Rielle, fighting wights to collect the four Elemental Shards (Wel, Sercen, Nen, Alata) and place each in its matching compass-point holder.',
    'Take the Great Welkynd Stone that\'s revealed and defeat Norion the Undying, an Ayleid Lich guarding it, then loot the Staff of Ehlno Ede and the Rielle key from his corpse.',
    "Optionally aid the Vigilants of Stendarr fighting Mythic Dawn agents on your way out, then read a fallen Vigil Enforcer's journal pointing to Red Scar Cavern.",
    'Fight or bluff your way (in looted Mythic Dawn robes) through Red Scar Cavern to the inactive Oblivion Gate and kill the cult leader Vonos to end the quest — but his death reopens the gate.'
  ],
  rewards:['Staff of Ehlno Ede'], trackable:true },

{ id:10031, line:'thecause', order:2, title:'The Consequences', giver:'(Continues automatically after The Cause)', location:'Red Scar Cavern, Deadlands',
  steps:[
    "Search Vonos's body and read his journal to learn you were manipulated into reopening Mehrunes Dagon's gate.",
    'Step through the portal into the Deadlands and fight your way down either the left or right lava-spanning path — beware Spiddal Stick gas clouds along the right-hand route.',
    "Defeat Valkyn Gatanas and his Daedric Horse (left path) for Scourge and a Summon Daedric Horse spell tome.",
    'Defeat Valkyn Methats and his Flame Atronachs (right path) for Torment.',
    'Return to Tamriel through Red Scar Cavern, where surviving Vigilants and Mythic Dawn are still fighting a second battle, and escape to complete the quest.'
  ],
  rewards:['Torment', 'Scourge', 'Daedric Gauntlets of Negation', 'Summon Daedric Horse spell tome', 'Ongoing access to Deadlands alchemy flora (Bloodgrass, Harrada, Spiddal Stick)'], trackable:true },

/* ======================= GOBLINS (Creation Club — Anniversary Edition) ======================= */
{ id:10040, line:'goblins', order:1, title:'Blue in the Face', giver:'Letter to Clexius (found at the Bee and Barb, Riften)', location:"Gromm's Pass, south of Forelhost",
  steps:[
    'Find the Letter to Clexius in an upstairs room at the Bee and Barb in Riften, describing a goblin tribe led by a mysterious "Blue God".',
    "Travel to Gromm's Pass, a cave south of Forelhost overrun with hostile goblins and the plantable Steel-Blue Entoloma mushroom.",
    "Find Avanessa Calladius's body and loot The Posting of the Hunt, then reach the central chamber where a goblin wielding the legendary Spear of Bitter Mercy fights for his life in an enclosed pit.",
    'Kill the "Blue God" — actually a tribal Orc disguised in Entoloma paste — and his goblin minions, then loot the Goblin Totem Staff and read his journal.',
    'Free the surviving goblin from the fighting pit to recruit him as a follower named Gogh.'
  ],
  rewards:['Goblin Totem Staff (chain lightning enchantment)', 'Gogh — a recruitable Goblin follower who wields the unobtainable Spear of Bitter Mercy'], trackable:true },

/* ======================= BLOODCHILL MANOR (Creation Club — Anniversary Edition) ======================= */
{ id:10050, line:'bloodchill', order:1, title:'Guests for Dinner', giver:'Dinner Invitation (delivered by courier at level 12)', location:'Bloodchill Cavern', level:'12',
  steps:[
    'Reach level 12 and read the Dinner Invitation delivered by courier.',
    'Travel to Bloodchill Cavern, speak to the waiter, and take your seat at the banquet table.',
    "Read the note on your plate, Please Read Aloud — partway through, the waiter reveals himself as a vampire and attacks alongside the other hidden vampires and two gargoyles (as a vampire yourself, you're instead asked to drink a thrall's blood first, triggering the same fight from the other side).",
    'Survive the ambush, then speak to the sole intended survivor.'
  ],
  choice:{ flag:'Playing as a vampire changes the ending', text:"As a non-vampire, the Dawnguard agent Durian reveals himself as the true intended heir once the vampires are dead and rewards you with gold — but no house key, though you still gain ownership of the house. As a vampire, the waiter instead hands you both gold and the Bloodchill Manor Key directly." },
  rewards:['Leveled gold', 'Bloodchill Manor Key (as a vampire) / ownership of Bloodchill Manor either way'], trackable:true },

/* ======================= MYRWATCH (Creation Club — Anniversary Edition) ======================= */
{ id:10060, order:1, line:'myrwatch', title:'Myrwatch', giver:"Automatic (approach the tower) / Hans's Journal", location:'Myrwatch, east of Morthal',
  steps:[
    'Approach Myrwatch, an undiscovered tower east of Morthal guarded by a lone chaurus, and try the locked front door.',
    "Find Hans's body nearby and read Hans's Journal for the hint: \"When the eye is doused in flames, the hair will light the way.\"",
    'Cast a fire spell (Hans also carries a spare Spell Tome: Flames) at the eye-shaped seal on the ground in front of the entrance.',
    'Follow the ghostly hare that appears to the nearby brazier, which lights and unseals the tower door.'
  ],
  rewards:['Access to Myrwatch — a mage-tower player home with a staff enchanter, an indoor alchemy garden, and display space for unique artifacts'], trackable:true },

/* ======================= HENDRAHEIM (Creation Club — Anniversary Edition) ======================= */
{ id:10070, line:'hendraheim', order:1, title:'Hendraheim', giver:"Courier (Warrior's Challenge, delivered at level 10)", location:'Hendraheim, north of Bilegulch Mine', level:'10',
  steps:[
    "Reach level 10 and read the Warrior's Challenge delivered by courier.",
    'Travel to Hendraheim, an ancient Nordic hall north of Bilegulch Mine and southwest of Fort Sungard.',
    'Speak with Eydvina Shield-Hearth, the current owner, who challenges you to single combat for a warrior\'s death.',
    'Defeat Eydvina and loot the Key to Hendraheim, along with a note explaining her wish to enter Sovngarde, from her body.'
  ],
  rewards:['Key to Hendraheim — a Nordic warrior-hall player home'], trackable:true },

/* ======================= NCHUANTHUMZ: DWARVEN HOME (Creation Club — Anniversary Edition) ======================= */
{ id:10080, line:'nchuanthumz', order:1, title:'The Sanctuary and the Manufactory', giver:"Seeks-Ancient-Artifacts' Journal, v1 (The Frozen Hearth, Winterhold)", location:'Frostroot Cave, Nchuanthumz',
  steps:[
    "Find Seeks-Ancient-Artifacts' Journal, v1 on a table at The Frozen Hearth in Winterhold and read it to learn of a lost Dwemer sanctuary.",
    'Fight through Frostroot Cave into Nchuanthumz, then take the lift down to the Manufactory.',
    "Examine the body of Seeks-Ancient-Artifacts for a Dwemer Actuator and his second journal, which lists the repair parts needed: 1 Dwemer Oil, 3 Dwemer Cogs, 3 Dwemer Actuators (all found on the two nearby tables).",
    'Deliver the parts to the Dwarven Sphere Overseer to bring the Manufactory back online.',
    "Find a Centurion Dynamo Core (from the destroyed Dwarven Centurion Master to the west, if you don't already have one) and use it to build a Dwarven Spider Renovator.",
    'Summon the Renovator via the levers upstairs to clean each of the three sections of the house, waiting 24 hours per section until Nchuanthumz is fully restored and furnished.'
  ],
  rewards:['Nchuanthumz — a fully furnished Dwemer player home with a Manufactory for building automatons'], trackable:true },

/* ======================= DEAD MAN'S DREAD (Creation Club — Anniversary Edition) ======================= */
{ id:10090, line:'deadmansdread', order:1, title:'The Restless', giver:'The Restless (book, at The Winking Skeever in Solitude)', location:"Castle Dour Dungeon, Orphan's Tear, Blackbone Isle",
  steps:[
    "Find the book The Restless on a table at The Winking Skeever in Solitude, telling of the pirate Cyrus and the lost ship Dead Man's Dread.",
    "Talk your way (or fight your way) into the cell in Castle Dour Dungeon, read Kevon's Note, and pry a map to Blackbone Isle from a loose brick in the wall.",
    "Travel to the shipwreck Orphan's Tear and defeat Celeste's Blackwater Brigands guarding the only boat to the isle — Celeste drops the unique Blackwater Blade.",
    'Sail to Blackbone Isle and fight through Blackbone Isle Grotto\'s undead to reach the buried ship Dead Man\'s Dread.',
    "In the captain's quarters, read the Captain's Journal and take Cyrus' Sabre, Cyrus' Clothes, and Cyrus' Boots.",
    'Fight off the Ghost Sailors and the Ghost Captain who rise to defend the ship, then escape the grotto back to the boat.',
    'After a later courier delivers a note from a "restless soul," return to the ship to claim Dead Man\'s Dread itself as a player home.'
  ],
  rewards:['Blackwater Blade', "Cyrus' Sabre, Clothes, and Boots", "Dead Man's Dread — a pirate ship player home"], trackable:true },

/* ======================= MISCELLANEOUS & SIDE QUESTS ======================= */
{ id:800, line:'misc', order:1, title:'The Forsworn Conspiracy', giver:'Eltrys', location:'Markarth',
  steps:[
    "Witness a Forsworn attack on a woman, Margret, in Markarth's market.",
    'Guard Eltrys secretly suspects a conspiracy framing the Forsworn for political murders and asks you to gather evidence against three prominent citizens — Weylin, Thonar Silver-Blood, and Nepos the Nose.',
    'Report back periodically for gold rewards as you uncover the truth: the Forsworn are being scapegoated by the Silver-Blood family and corrupt officials to cover up the murder of the previous Jarl.'
  ],
  choice:{ flag:'Framed regardless', text:'This quest ends with you framed for murder no matter your findings — submit and go to Cidhna Mine (leading into No One Escapes Cidhna Mine) or resist arrest and fight your way out (forecloses that questline).' },
  rewards:['Leveled gold per clue', 'Silver Emerald Necklace (if Margret saved)'], trackable:true },

{ id:801, line:'misc', order:2, title:'No One Escapes Cidhna Mine', giver:'Automatic', location:'Cidhna Mine, Markarth', level:'6 · Medium',
  steps:[
    'Wake up imprisoned in Cidhna Mine after choosing to go to jail at the end of The Forsworn Conspiracy.',
    'Work toward an audience with the imprisoned Forsworn king, Madanach ("the King in Rags"), past his bodyguard Borkul the Beast.'
  ],
  choice:{ flag:'Choice Point — escape with the Forsworn or kill Madanach', text:'Follow Madanach\'s plan and escape together with the other Forsworn prisoners (siding with the Forsworn, angering the Silver-Bloods) — OR kill Madanach and escape alone/differently, siding with the Silver-Bloods instead.' },
  rewards:['Shiv', 'Silver-Blood Family Ring and/or Armor of the Old Gods (varies by ending)'], trackable:true },

{ id:802, line:'misc', order:3, title:'The Heart of Dibella', giver:'Hamal', location:'Broken Tower Redoubt, Karthwasten, Temple of Dibella', level:'14 · Hard',
  steps:[
    'Gain access to the Inner Sanctum of the Temple of Dibella in Markarth.',
    'Help the priestesses locate a new Sybil after the old one\'s death.',
    'Learn the candidate, a girl named Fjotra, is held captive by the Forsworn at Broken Tower Redoubt near Karthwasten.',
    '(Optional) Escort Enmon along the way.',
    'Rescue Fjotra and escort her back to the temple, then pray at Dibella\'s altar.'
  ],
  rewards:['"Agent of Dibella" blessing', 'Free Enchanting training'], trackable:true },

{ id:803, line:'misc', order:4, title:'The Lost Expedition', giver:'Automatic (journals)', location:'Nchuand-Zel, beneath Markarth',
  steps:[
    'Find journals scattered through the Dwemer ruin Nchuand-Zel beneath Markarth documenting a doomed archaeological expedition.',
    'Piece together the expedition\'s fate as you explore deeper, confronting what became of its last member.'
  ],
  rewards:['Leveled gold/items'], trackable:true },

{ id:804, line:'misc', order:5, title:'Laid to Rest', giver:'Morthal guards / Idgrod Ravencrone', location:"Morthal, Movarth's Lair", level:'6',
  steps:[
    'In Morthal, investigate a suspicious house fire that killed a man\'s wife and daughter.',
    'Question townsfolk and the prophetic Jarl, Idgrod Ravencrone.',
    'Confront and defeat a hidden vampire, Laelette, posing as the grieving husband\'s new lover.',
    "Follow the trail to a vampire conspiracy tied to the ancient lair Movarth's Lair.",
    'Report to the Jarl and lead townspeople to help clear the vampire nest.'
  ],
  rewards:['Leveled gold', 'Option to buy the Windstad Manor plot'], trackable:true },

{ id:805, line:'misc', order:6, title:'Rising at Dawn', giver:'Falion (via rumors)', location:'Morthal',
  steps:[
    'As a vampire, ask innkeepers around Skyrim for rumors until directed to Falion, a mage in Morthal who studies the undead.',
    'Bring him a filled Black Soul Gem.',
    'Meet him at his summoning circle outside town at dawn and let him perform the cleansing ritual.'
  ],
  choice:{ flag:'Only available as a vampire', text:'Only obtainable once you have contracted vampirism; repeatable any number of times if reinfected.' },
  rewards:['Cures vampirism'], trackable:true },

{ id:806, line:'misc', order:7, title:'Promises to Keep', giver:'Louis Letrush', location:'Riften, Black-Briar Lodge', level:'Easy',
  steps:[
    'Bard Louis Letrush in Riften asks you to collect a horse, Frost, that he bought from Sibbi Black-Briar, now in jail.',
    "Visit Sibbi, who admits the horse isn't really his to sell and directs you to steal it (and its lineage papers) from Black-Briar Lodge.",
    'Sneak into the lodge, steal the papers and the horse, and return to Louis.'
  ],
  choice:{ flag:'Choice Point — hand over Frost or keep him', text:'Give Frost to Louis as agreed for a gold reward, or persuade him to let you keep the horse instead.' },
  rewards:['Leveled gold OR the horse Frost'], trackable:true },

{ id:807, line:'misc', order:8, title:'The Book of Love', giver:'Dinya Balu', location:'Temple of Mara (Riften), Ivarstead, Markarth', level:'Easy',
  steps:[
    'Speak with priestess Dinya Balu at the Temple of Mara in Riften.',
    'Help a confused young woman, Fastred, sort out her feelings in Ivarstead.',
    'Help court wizard Calcelmo and his secret sweetheart Faleen in Markarth.',
    'Help a troubled couple, Ruki and Fenrig, work through hardship.',
    'Return to Dinya once all three are resolved.'
  ],
  rewards:['"Agent of Mara" blessing', 'Amulet of Mara'], trackable:true },

{ id:808, line:'misc', order:9, title:'Unfathomable Depths', giver:'From-Deepest-Fathoms', location:'Riften docks, Avanchnzel', level:'14/16 · Hard',
  steps:[
    'Meet a disturbed Argonian woman wandering the Riften docks who begs you to take a strange Dwemer cube, "the Lexicon," to the ruin Avanchnzel.',
    'Travel to Avanchnzel and fight through it, including a group of rival treasure hunters.',
    'Use the Lexicon to unlock the ruin\'s central Dwemer mechanism.'
  ],
  rewards:['"Ancient Knowledge" — boost to Enchanting, Alchemy, and Smithing'], trackable:true },

{ id:809, line:'misc', order:10, title:'Lights Out!', giver:'Jaree-Ra', location:'Solitude, Solitude Lighthouse, Wreck of the Icerunner, Broken Oar Grotto', level:'6 · Easy/Medium',
  steps:[
    'Meet the Argonian con-man Jaree-Ra in Solitude, who wants to run a ship aground by extinguishing the Solitude Lighthouse beacon.',
    'Put out the beacon and return to Jaree-Ra.'
  ],
  choice:{ flag:'Betrayal', text:'After the wreck, Jaree-Ra and his gang betray and attack you rather than share the loot — fight them off, then track survivors to Broken Oar Grotto to finish them and claim the plundered goods.' },
  rewards:['Random loot'], trackable:true },

{ id:810, line:'misc', order:11, title:'Tending the Flames', giver:'Viarmo', location:"Bards College (Solitude), Dead Men's Respite, Blue Palace", level:'6',
  steps:[
    'Visit the Bards College in Solitude; learn Jarl Elisif plans to cancel the Burning of King Olaf festival unless the college produces a satisfying new verse about the historic burning.',
    "Travel to the tomb Dead Men's Respite to find the ghost of the executed bard who wrote the original poem and learn the missing verse — and the more complicated truth about Olaf and Queen Potema.",
    'Return and perform the completed Edda at the Blue Palace to save the festival.'
  ],
  rewards:['Leveled gold', 'Bards College membership', 'Solitude Fire Festival restored', 'Word for the Whirlwind Sprint shout'], trackable:true },

{ id:811, line:'misc', order:12, title:'The Man Who Cried Wolf', giver:'Falk Firebeard', location:'Wolfskull Cave, Solitude', level:'8 · Easy',
  steps:[
    "In Solitude's Blue Palace, witness Varnius Junius warning Jarl Elisif of strange lights and noises from Wolfskull Cave.",
    'Investigate the cave and discover a cult performing a ritual to resurrect the ancient undead Wolf Queen, Potema.',
    'Interrupt the ritual before it completes and report back to Falk Firebeard.'
  ],
  rewards:['Leveled gold'], trackable:true },

{ id:812, line:'misc', order:13, title:'The Wolf Queen Awakened', giver:'Courier (letter)', location:'Blue Palace, Hall of the Dead (Solitude), Potema\'s Catacombs', level:'Required 10 · Very Hard',
  steps:[
    'After leveling up post-Man-Who-Cried-Wolf, receive a letter warning that Potema has fully escaped her binding.',
    "Speak to Falk Firebeard, then Styrr, a priest of Arkay, who explains Potema's history as a power-hungry undead former queen.",
    "Descend into Potema's Catacombs beneath Solitude, fighting through her undead forces.",
    "Defeat Potema and her skeletal remains, retrieve Potema's Skull, and return it to Styrr."
  ],
  rewards:['Leveled gold', 'Shield of Solitude'], trackable:true },

{ id:813, line:'misc', order:14, title:'In My Time Of Need', giver:"Alik'r Warriors", location:"Swindler's Den, Dragonsreach, Whiterun", level:'6',
  steps:[
    "Encounter Alik'r Warriors interrogating people about a fugitive Redguard woman.",
    'Find her, Saadia, hiding as a barmaid at the Bannered Mare in Whiterun under a false identity; she claims the Alik\'r are hunting her unjustly, while their leader Kematu claims she betrayed her homeland to the Aldmeri Dominion.'
  ],
  choice:{ flag:'Choice Point — side with Saadia or the Alik\'r', text:'Side with Saadia — ambush and kill Kematu\'s warriors at the Whiterun stables — OR side with the Alik\'r — report Saadia\'s location or bring her to Kematu at Swindler\'s Den. Both pay a reward; the "truth" is deliberately ambiguous.' },
  rewards:['500 gold'], trackable:true },

{ id:814, line:'misc', order:15, title:'Missing In Action', giver:'Idolaf Battle-Born / Fralia Gray-Mane', location:'Whiterun, Northwatch Keep', level:'12',
  steps:[
    "Witness the feud between the Battle-Born and Gray-Mane families in Whiterun's market.",
    "Learn from Fralia or Avulstein Gray-Mane that Thorald Gray-Mane, presumed dead, may be a Thalmor prisoner.",
    '(Optional) Recruit Avulstein as a temporary follower.',
    'Infiltrate the Thalmor prison Northwatch Keep and rescue Thorald.'
  ],
  rewards:['An enchanted weapon or 200 gold'], trackable:true },

{ id:815, line:'misc', order:16, title:'The Blessings of Nature', giver:'Danica Pure-Spring', location:'Whiterun, Orphan Rock, Eldergleam Sanctuary', level:'Easy',
  steps:[
    "Help priestess Danica Pure-Spring restore Whiterun's sacred, lightning-blasted Gildergreen tree.",
    'Retrieve the enchanted dagger Nettlebane from a coven of hagravens at Orphan Rock.',
    'Travel to Eldergleam Sanctuary (optionally escorting pilgrim Maurice Jondrelle) and cut through the roots blocking the inner sanctuary.'
  ],
  choice:{ flag:'Choice Point — take the sap or let Maurice pray', text:'Activate the Eldergleam yourself to harvest sap for Danica — OR let Maurice pray to the tree first, after which he receives a sapling instead.' },
  rewards:['Nettlebane (unique dagger)', 'Free Restoration training'], trackable:true },

{ id:816, line:'misc', order:17, title:'Blood on the Ice', giver:'A Windhelm guard', location:'Windhelm',
  steps:[
    'In Windhelm, a serial killer known as "the Butcher" is murdering women; investigate a crime scene, question Helgird about the unusual wound pattern, and follow a blood trail to the abandoned manor Hjerim.',
    'Search Hjerim to find the killer\'s hidden lair, "Beware the Butcher!" pamphlets, and a Necromancer Amulet.',
    'Question pamphlet author Viola Giordano and museum curator Calixto Corrium — Viola concludes the amulet marks the culprit as Wuunferth, the court wizard.'
  ],
  choice:{ flag:'Choice Point — the real twist', text:"Report to steward Jorleif and have Wuunferth arrested — he's actually INNOCENT, the investigation ends with no reward, and the killer strikes again days later. Instead confront Wuunferth directly: he's secretly investigating too, and predicts the killer will strike in the Stone Quarter — stake it out at night and catch the true culprit, Calixto Corrium, driven to madness by grief. Kill Calixto to end the killings." },
  rewards:['Ability to decorate Hjerim once purchased', 'Optional Necromancer Amulet'], trackable:true },

{ id:817, line:'misc', order:18, title:'The White Phial', giver:'Nurelion', location:'Windhelm (The White Phial shop), Forsaken Cave', level:'6',
  steps:[
    'In Windhelm\'s alchemy shop, dying alchemist Nurelion begs you to retrieve the legendary White Phial from Forsaken Cave.',
    'Brave the cave and retrieve the Phial.',
    'Return it to Nurelion — it turns out cracked/broken; his assistant Quintus Navale still rewards you for the attempt.'
  ],
  rewards:['5 then 500 gold', 'Word for the Marked for Death shout'], trackable:true },

{ id:818, line:'misc', order:19, title:'Repairing the Phial', giver:'Quintus Navale', location:'The White Phial (Windhelm), Throat of the World, Stonehill Bluff',
  steps:[
    "After Nurelion's health worsens, Quintus asks you to gather three rare reagents to repair the cracked Phial.",
    'One is found atop the Throat of the World itself; others come from locations like Stonehill Bluff.',
    'Return all three ingredients to Quintus to repair the Phial.'
  ],
  choice:{ flag:'Prerequisite', text:"Requires completing the Main Quest's The Throat of the World first." },
  rewards:['The restored White Phial (permanent reusable alchemy tool)'], trackable:true },

{ id:819, line:'misc', order:20, title:'Rise in the East', giver:'Orthus Endario', location:"Windhelm, Dawnstar, Japhet's Folly", level:'6',
  steps:[
    "Visit the East Empire Company's Windhelm office and speak to Orthus Endario about pirates disrupting shipping.",
    'Steal a hidden logbook from a suspicious employee, Suvaris Atheron, revealing a mole.',
    "Travel to Dawnstar and meet company enforcer Adelaisa Vendicci, who leads an assault on the pirates' base at Japhet's Folly.",
    'Fight the pirates ("Blood Horkers") and kill their leader, Haldyn.'
  ],
  rewards:['Leveled gold', 'Adelaisa Vendicci as a follower'], trackable:true },

{ id:820, line:'misc', order:21, title:'The Golden Claw', giver:'Lucan Valerius', location:'Riverwood, Bleak Falls Barrow', level:'6',
  steps:[
    'In Riverwood, shopkeeper Lucan Valerius reports a prized ornament, the Golden Claw, was stolen by a bandit who fled to Bleak Falls Barrow.',
    'Retrieve it while clearing the barrow — the claw is also the key to the barrow\'s puzzle door.',
    'Return it to Lucan for a reward.'
  ],
  choice:{ flag:'Overlaps with the Main Quest', text:'Concurrent with the Main Quest\'s Bleak Falls Barrow — the events and objectives are closely tied together.' },
  rewards:['Leveled gold', 'Word for the Unrelenting Force shout'], trackable:true },

{ id:821, line:'misc', order:22, title:"Kyne's Sacred Trials", giver:'Froki Whetted-Blade', location:"Froki's Shack and beast locations across Skyrim", level:'20 · Medium',
  steps:[
    'Meet old hunter Froki Whetted-Blade, who still honors Kyne rather than the Divines, at his shack.',
    'Accept his challenge to hunt unique "Guardian" beasts in three groups: Mudcrab/Skeever/Wolf, then Bear/Mammoth/Sabre Cat, then a lone Troll.',
    'Return to Froki after each group.'
  ],
  rewards:["Kyne's Token (unique amulet)"], trackable:true },

{ id:822, line:'misc', order:23, title:'A Scroll For Anska', giver:'Anska', location:'High Gate Ruins', level:'24',
  steps:[
    'Meet Nord wizard Anska inside High Gate Ruins, searching for a scroll linking her bloodline to Ysgramor.',
    'Escort and protect her through draugr-filled catacombs and a symbol-lever puzzle to the throne room of the Dragon Priest Vokun.',
    'Defeat Vokun together and claim his mask and Staff of Fireballs.',
    'Find the sealed scroll and hand it to Anska.'
  ],
  choice:{ flag:'Keep Anska alive', text:'This quest only counts toward the Sideways achievement if Anska survives to receive the scroll.' },
  rewards:['Spell Tome: Conjure Flaming Familiar', 'Staff of Fireballs', 'Word for the Storm Call shout', 'Vokun (mask)'], trackable:true },

{ id:823, line:'misc', order:24, title:'Ancestral Worship', giver:'Golldir', location:"Hillgrund's Tomb", level:'6',
  steps:[
    "Meet Golldir outside Hillgrund's Tomb, too frightened to enter his own family's barrow, defiled by necromancer Vals Veran.",
    "Escort Golldir through the tomb, fighting draugr, and free his captured aunt Agna.",
    'Confront and kill Vals Veran.'
  ],
  rewards:["Hillgrund's Tomb Crypt Key", 'Leveled gold', 'Golldir as a follower'], trackable:true },

{ id:824, line:'misc', order:25, title:'Evil in Waiting', giver:'Automatic', location:'Valthume', level:'24',
  steps:[
    'Enter the Nordic ruin Valthume and meet the ghost Valdar, who warns of a powerful, still-living Dragon Priest, Hevnoraak, sealed within.',
    "Explore the catacombs and collect four ritual vessels carried by Hevnoraak's draugr minions.",
    'Confront and defeat Hevnoraak in the ruin\'s depths.'
  ],
  rewards:['Hevnoraak (mask)', "Hevnoraak's Staff", 'Word for the Aura Whisper shout'], trackable:true },

{ id:825, line:'misc', order:26, title:'Infiltration', giver:'Stalleo', location:"Treva's Watch", level:'6',
  steps:[
    "Meet Stalleo outside the fort Treva's Watch, whose family has been kidnapped and fort seized while he was at war.",
    'Use a secret escape tunnel to sneak in the back way.',
    'Fight through to open the main gate from inside, clear the courtyard, and free his family.'
  ],
  rewards:['Spell Tome: Detect Life'], trackable:true },

{ id:826, line:'misc', order:27, title:'Repentance', giver:'Illia', location:'Darklight Tower', level:'8',
  steps:[
    'Enter Darklight Tower, home to a coven of witches; witness mage Illia refusing to help her mother Silvia complete a ritual to become a hagraven by sacrificing an innocent.',
    'Agree to help her; fight upward through the tower\'s witches with Illia at your side.',
    'Confront and defeat Silvia (who partially transforms) at the top.'
  ],
  rewards:["Staff of Hag's Wrath", 'Illia as a follower'], trackable:true },

{ id:827, line:'misc', order:28, title:'Siege on the Dragon Cult', giver:'Captain Valmir', location:'Forelhost', level:'24',
  steps:[
    'Meet Captain Valmir at the ruined fortress Forelhost, once the last stronghold of the Dragon Cult, seeking a powerful mask for the war effort.',
    'Fight through the stronghold, crypt, and refectory zones.',
    'Solve a claw-door puzzle to reach the inner sanctum.',
    'Defeat the Dragon Priest Rahgot and claim his mask; return it to Valmir.'
  ],
  rewards:['Rahgot (mask)', 'Dragon Priest Staff', 'Word for the Storm Call shout'], trackable:true },

{ id:828, line:'misc', order:29, title:'Silenced Tongues', giver:"Heddic's Volunruud Notes (book)", location:'Volunruud', level:'14',
  steps:[
    "Explore Volunruud and find the notes of a previous adventurer, Heddic, trying to open the sealed burial chamber of Tongue chieftain Kvenel.",
    "Locate ceremonial weapons scattered through the ruin's four passages to unlock the puzzle door to the Elder's Cairn.",
    'Open the cairn and defeat the reanimated Kvenel.'
  ],
  rewards:['Eduj and Okin (unique matched war axes)', 'Word for the Aura Whisper shout'], trackable:true },

{ id:829, line:'misc', order:30, title:'The Pale Lady', giver:'Automatic', location:'Frostmere Crypt', level:'6 (27 for leveled sword)',
  steps:[
    'Near Frostmere Crypt, optionally intervene in bandits attacking one of their own, Eisa Blackthorn.',
    'Learn thievery has occurred inside and investigate; read journals revealing the bandits found a hidden underground forest while digging.',
    'Fight deeper and confront the supernatural guardian of the grove, the Pale Lady, and banish her.'
  ],
  rewards:['The Pale Blade (unique sword)', 'Word for the Ice Form shout'], trackable:true },

{ id:830, line:'misc', order:31, title:'A Return To Your Roots', giver:"Sinderion's Field Journal", location:'Blackreach, Sarethi Farm', level:'18',
  steps:[
    'Pick up a sample of the rare Crimson Nirnroot in Blackreach, triggering interest in alchemist Sinderion\'s abandoned research.',
    'Find his Field Laboratory and journal in Blackreach explaining his fascination with the plant.',
    'Collect 30 total Crimson Nirnroot samples scattered through Blackreach\'s caverns (some require careful platforming or Whirlwind Sprint).',
    'Deliver the full collection to his colleague, Avrusa Sarethi, at Sarethi Farm.'
  ],
  rewards:["Sinderion's Serendipity (alchemy bonus)", 'The Nirnroot Missive'], trackable:true },

{ id:831, line:'misc', order:32, title:'Forbidden Legend', giver:'Various (book "Lost Legends")', location:"Folgunthur, Saarthal, Geirmund's Hall, Reachwater Rock", level:'6 (36 for leveled items)',
  steps:[
    'Learn the legend of Gauldur, a powerful First-Era wizard murdered by either his king or his own three sons — Jyrik, Mikrul, and Sigdis Gauldurson — who fled and each hid a piece of a powerful amulet.',
    'Explore Folgunthur (Mikrul), Saarthal (Jyrik — overlapping with the College\'s Under Saarthal), and Geirmund\'s Hall (Sigdis), defeating each undead brother and claiming a fragment of the Gauldur Amulet and a unique weapon.',
    "Travel to Reachwater Rock to reforge the complete amulet and confront the spirit of Gauldur himself."
  ],
  rewards:['Gauldur Amulet (reforged)', 'Staff of Jyrik Gauldurson', 'Gauldur Blackblade', 'Gauldur Blackbow', 'Words for Frost Breath and Ice Form shouts'], trackable:true },

    'Reach Dimhollow Cavern and witness the vampire Lokil kill the captive Vigilant Adalvald.',

    'Free Serana, a vampire sealed inside for centuries, who carries an Elder Scroll.'
  ], rewards:[], trackable:true },

{ id:1302, line:'dawnguard', order:3, title:'Bloodline', giver:'Serana', location:'Dimhollow Crypt, Icewater Jetty, Castle Volkihar', level:'Medium',
  steps:[
    'Escort Serana out of Dimhollow Crypt and across Skyrim to her family home, Castle Volkihar, northwest of Solitude.',
    'Cross to the castle by boat from Icewater Jetty and meet Serana\'s father, Lord Harkon, master of the Volkihar vampire clan.',
    'Harkon welcomes his daughter home and offers you his blood, promising the power of a Vampire Lord.'
  ],
  choice:{ flag:'Choice Point — Dawnguard or Volkihar', text:'Accept Lord Harkon\'s gift to become a Vampire Lord and join the Volkihar Clan (continue with The Bloodstone Chalice) — or refuse and return to Isran, remaining mortal and committing fully to the Dawnguard (continue with A New Order). The two paths reconverge a few quests later at "Prophet," but this choice determines your form (Vampire Lord vs. mortal) and which faction you fight for at the questline\'s climax.' },
  rewards:['Vampire Lord form (if accepted)', 'Spell Tome: Necromantic Healing', 'Word for the Drain Vitality shout'], trackable:true },

{ id:1303, line:'dawnguard', branch:'dawnguard', order:4, title:'A New Order', giver:'Isran', location:'Fort Dawnguard and the field', level:'Medium',
  steps:[
    'After refusing Harkon\'s gift and returning to Isran, help fend off a vampire attack on Fort Dawnguard.',
    'Track down and recruit two of Isran\'s old allies: Gunmar, a troll-hunter (help him corner a bear first), and Sorine Jurard, a Dwemer-obsessed Breton tinkerer.',
    'Bring both allies back to Fort Dawnguard.',
    'Listen to Isran\'s rallying speech as the Dawnguard is reinforced and properly established.'
  ], rewards:['Master trainers in Smithing and Marksman', 'Hunter radiant quests unlocked', 'Full Dawnguard membership'], trackable:true },

{ id:1304, line:'dawnguard', branch:'vampire', order:4, title:'The Bloodstone Chalice', giver:'Garan Marethi (on Harkon\'s orders)', location:'Redwater Den', level:'Easy',
  steps:[
    'After accepting Harkon\'s gift, follow Garan Marethi to fetch the Bloodstone Chalice, an artifact that amplifies vampiric power.',
    'Travel to Redwater Den, a skooma den built over a profaned bloodspring, and fight through its vampires and thralls.',
    'Fill the Chalice at the Bloodspring, then defeat Stalf and Salonia Caelia when they challenge you for it.',
    'Return the filled Chalice to Castle Volkihar.'
  ], rewards:['Access to the Bloodstone Chalice at Castle Volkihar', 'Vampire radiant quests unlocked', 'Followers Cusith and Garmr unlocked', 'Full Volkihar Clan membership'], trackable:true },

{ id:1305, line:'dawnguard', order:5, title:'Prophet', giver:'Isran or Lord Harkon', location:'Fort Dawnguard or Castle Volkihar',
  steps:[
    'Both paths converge here: locate Dexion Evicus, a Moth Priest capable of reading an Elder Scroll to find the lost artifact Auriel\'s Bow.',
    '(Dawnguard side) Race the vampires to find and rescue Dexion before they capture him.',
    '(Vampire side) Locate and capture the Moth Priest for Lord Harkon\'s purposes.',
    'Either way, Dexion ends up in your side\'s custody, ready to begin deciphering the Elder Scrolls.'
  ], rewards:[], trackable:true },

{ id:1306, line:'dawnguard', order:6, title:'Chasing Echoes', giver:'Serana', location:'Castle Volkihar, the Soul Cairn',
  steps:[
    'With Dexion secured, Serana suggests finding her mother Valerica, who vanished into the Soul Cairn and may know more about the Elder Scrolls.',
    'Explore Castle Volkihar\'s ruined wing to find Valerica\'s old study and the means to open a portal to the Soul Cairn.',
    'Step through the portal (non-vampires must let Serana partially soul-trap them first to survive there).'
  ], rewards:[], trackable:true },

{ id:1307, line:'dawnguard', order:7, title:'Beyond Death', giver:'Automatic (on entering the Soul Cairn)', location:'The Soul Cairn', level:'13',
  steps:[
    'Find Valerica trapped behind an invisible barrier in the Boneyard and defeat the three Boneyard Keepers holding it up.',
    'Follow Valerica into the Boneyard and defeat the dragon Durnehviir, who guards the Blood Elder Scroll.',
    'Recover the Elder Scroll (Blood) and, if you are not a vampire, retrieve your trapped soul from a Soul Essence Gem nearby.',
    '(Optional) Later, return to Durnehviir\'s word wall to eventually learn his unique Summon Durnehviir shout.'
  ], rewards:['Elder Scroll (Blood)', 'Summon Durnehviir shout (via word wall)', 'A camp established at Dayspring Canyon'], trackable:true },

{ id:1308, line:'dawnguard', order:8, title:'Scroll Scouting', giver:'Dexion Evicus', location:'Tower of Mzark, Blackreach',
  steps:[
    'Dexion also needs the Dragon Elder Scroll, hidden in the Tower of Mzark deep within Blackreach.',
    '(This overlaps with the Main Quest\'s Elder Knowledge — the same Dwemer mechanism yields the scroll.)',
    'Retrieve the Elder Scroll (Dragon) and bring it back to Dexion.'
  ], rewards:['Elder Scroll (Dragon)'], trackable:true },

{ id:1309, line:'dawnguard', order:9, title:'Seeking Disclosure', giver:'Dexion Evicus', location:'Fort Dawnguard or Castle Volkihar',
  steps:[
    'Bring both the Blood and Dragon Elder Scrolls to Dexion.',
    'Watch as reading the first scroll without proper preparation blinds Dexion — he can no longer finish the ritual himself.',
    'Learn from him of a hidden method to read the scrolls yourself, tied to a place called the Ancestor Glade.'
  ], rewards:[], trackable:true },

{ id:1310, line:'dawnguard', order:10, title:'Unseen Visions', giver:'Dexion Evicus / Serana', location:'Ancestor Glade',
  steps:[
    'Travel to the Ancestor Glade and perform the ritual using all three Elder Scrolls — Blood, Dragon, and Serana\'s original scroll.',
    'Read the scrolls to witness a vision revealing the location of the lost artifact Auriel\'s Bow.'
  ], rewards:["A vision of Auriel's Bow's location"], trackable:true },

{ id:1311, line:'dawnguard', order:11, title:'Touching the Sky', giver:'Automatic (after Unseen Visions)', location:'The Forgotten Vale (via Darkfall Cave)', level:'Suggested 15+',
  steps:[
    'Journey into the hidden, ancient snow elf sanctuary of the Forgotten Vale, reached through Darkfall Cave.',
    'Navigate the Vale\'s ruins, fighting Falmer and Gargoyles, guided by the last snow elves — Knight-Paladin Gelebor and his corrupted brother Vyrthur.',
    'Reach Auriel\'s Chapel and retrieve Auriel\'s Bow.'
  ], rewards:["Auriel's Bow"], trackable:true },

{ id:1312, line:'dawnguard', order:12, title:'Kindred Judgment', giver:'Serana / Isran', location:'Fort Dawnguard, Castle Volkihar', level:'Hard',
  steps:[
    '(Dawnguard side) Rally Isran and the Dawnguard for a full assault on Castle Volkihar, fighting through its vampire court.',
    '(Vampire side) Return directly to Castle Volkihar with Serana at your side.',
    'Confront Lord Harkon, who demands Auriel\'s Bow before attacking regardless of your answer — refusing him is recommended, since giving up the bow only weakens you for the fight.',
    'Defeat Harkon in his Vampire Lord form alongside Serana.'
  ],
  choice:{ flag:'Branch-dependent finale', text:'The confrontation dialogue differs by path, but both lead to the same boss fight against Lord Harkon. Winning as the Dawnguard ends the questline here. Winning as a vampire continues into one final quest, Destroying the Dawnguard.' },
  rewards:['Ownership of Castle Volkihar (vampire side)', "Ability to cure Serana's vampirism (Dawnguard side)"], trackable:true },

{ id:1313, line:'dawnguard', branch:'vampire', order:13, title:'Destroying the Dawnguard', giver:'Automatic (vampire path only)', location:'Fort Dawnguard',
  steps:[
    'With Harkon dead and the Volkihar Clan yours to command, finish the war by attacking the Dawnguard at their own fort.',
    'Defeat Isran and the remaining Dawnguard members.'
  ], rewards:['Ends the Dawnguard storyline on the vampire path'], trackable:true },

{ id:1314, line:'dawnguard', order:14, optional:true, title:'Lost to the Ages', giver:"Katria's ghost", location:'Various Dwemer ruins across Skyrim',
  steps:[
    'Encounter the ghost of Katria, a Nord adventurer who died seeking the legendary Aetherium Forge.',
    'Follow her guidance through several Dwemer ruins, collecting fragments of the Aetherium Forge blueprints and Aetherium shards.',
    'Reach the Aetherium Forge itself and craft a unique Aetherium artifact.'
  ],
  choice:{ flag:'Choice Point — one Aetherium artifact', text:'The Forge lets you craft only one of three unique items: the Aetherium Shield, the Aetherium Staff, or the Aetherium Crown. Choose carefully — the other two become unobtainable once you\'ve chosen.' },
  rewards:['One Aetherium artifact (Shield, Staff, or Crown)'], trackable:true },

/* ======================= DRAGONBORN (DLC) ======================= */
{ id:1350, line:'dragonborn', order:1, title:'Dragonborn', giver:'Cultists (ambush) → Gjalund Salt-Sage', location:'Windhelm docks, The Northern Maiden, Raven Rock', level:'After The Way of the Voice',
  steps:[
    'After learning your first word of a shout at High Hrothgar, be ambushed by cultists of "Lord Miraak" who call you a false Dragonborn.',
    'Defeat the cultists and find orders on their bodies pointing to the island of Solstheim.',
    'Book passage with Gjalund Salt-Sage aboard the Northern Maiden at the Windhelm docks and sail to Raven Rock.',
    'Ask around Raven Rock about Miraak, and investigate the strange, glowing Earth Stone shrine outside town.'
  ], rewards:['Access to Solstheim'], trackable:true },

{ id:1351, line:'dragonborn', order:2, title:'The Temple of Miraak', giver:'Automatic (after Dragonborn)', location:'Temple of Miraak', level:'30',
  steps:[
    'Meet Frea, a Skaal woman searching for her people, who have been enthralled to rebuild the Temple of Miraak.',
    'Fight through the temple alongside Frea to its Sanctum, past draugr, cultists, and the unique Gatekeeper.',
    'Learn a word of the Dragon Aspect shout at the temple\'s word wall.',
    'Reach the sealed vault beyond and read the Black Book Waking Dreams to enter Apocrypha for the first time.'
  ], rewards:['Word for the Dragon Aspect shout', 'Black Book: Waking Dreams'], trackable:true },

{ id:1352, line:'dragonborn', order:3, title:'The Fate of the Skaal', giver:'Storn Crag-Strider', location:'Skaal Village, Apocrypha',
  steps:[
    'Return Frea to Skaal Village and learn that Miraak has enthralled villagers through corrupted All-Maker Stones.',
    'Read a second Black Book to re-enter Apocrypha and learn the first word of the Bend Will shout from Hermaeus Mora.',
    'Use Bend Will to free the entranced Skaal villagers.'
  ], rewards:['Progress toward the Bend Will shout'], trackable:true },

{ id:1353, line:'dragonborn', order:4, title:'Cleansing the Stones', giver:'Storn Crag-Strider', location:'All-Maker Stones across Solstheim',
  steps:[
    'Travel to each of the remaining corrupted All-Maker Stones (Beast, Earth, Sun, Tree, Water — whichever aren\'t already cleansed).',
    'Use the first word of Bend Will at each stone to cleanse it and free it from Miraak\'s influence.'
  ], rewards:['All-Maker Stones restored to the Skaal'], trackable:true },

{ id:1354, line:'dragonborn', order:5, title:'The Path of Knowledge', giver:'Storn Crag-Strider / Neloth', location:'Solstheim',
  steps:[
    'Learn that reading more Black Books is the only way to grow strong enough to challenge Miraak.',
    'Track down Black Books scattered across Solstheim\'s dungeons and ruins, several tied to Telvanni wizard Neloth\'s research at Tel Mithryn.',
    'Read enough Black Books to progress toward the complete Bend Will shout.'
  ], rewards:['Access to further Black Books and their unique powers'], trackable:true },

{ id:1355, line:'dragonborn', order:6, title:'The Gardener of Men', giver:'Hermaeus Mora (via a Black Book)', location:'Apocrypha',
  steps:[
    'Read the final needed Black Book to be drawn once more into Apocrypha.',
    'Navigate Hermaeus Mora\'s shifting library realm, fighting Seekers and Lurkers.',
    'Receive the last word of Bend Will directly from Hermaeus Mora, who wants Miraak\'s interference brought to an end.'
  ], rewards:['Final word of the Bend Will shout'], trackable:true },

{ id:1356, line:'dragonborn', order:7, title:'At the Summit of Apocrypha', giver:'Frea', location:'Apocrypha', level:'25',
  steps:[
    'With Bend Will complete, read the Black Book Waking Dreams again to return to Apocrypha for the final confrontation.',
    'Traverse six chapters of Apocrypha\'s shifting library, solving book-and-gate puzzles while fighting off Seekers.',
    'Use Bend Will to tame and ride the dragon Sahrotaar for the final approach.',
    'Reach the summit and defeat Miraak in the climactic battle, then absorb his soul.'
  ],
  choice:{ flag:'Dragon-soul denial mechanic', text:'Miraak can normally steal the soul of any dragon killed on Solstheim, keeping himself powered up during the fight — riding a tamed dragon into the final battle via Bend Will is specifically what denies him that dragon\'s soul when it dies.' },
  rewards:["Miraak's equipment", 'A full respec of your skill perk trees', 'Tree Stone power', 'Final word of the Dragon Aspect shout'], trackable:true },

{ id:1357, line:'dragonborn', order:8, optional:true, title:'The Final Descent', giver:'Crescius Caerellius', location:'Raven Rock, Bloodskal Barrow',
  steps:[
    'Help the eccentric Crescius Caerellius learn what happened to his great-grandfather, lost long ago searching Bloodskal Barrow for a legendary weapon.',
    'Clear Bloodskal Barrow of draugr and traps.',
    'Recover the unique Bloodskal Blade and his ancestor\'s journal.'
  ], rewards:['Bloodskal Blade (unique greatsword with a ranged energy-wave power)'], trackable:true },

{ id:1358, line:'dragonborn', order:9, optional:true, title:'March of the Dead', giver:'Councilor Morvayn or a Raven Rock guard', location:'Raven Rock',
  steps:[
    'Investigate a wave of ash spawn attacks striking Raven Rock.',
    'Track the source to a disturbed nearby burial ground.',
    'Stop the ringleader responsible for animating the ash spawn.'
  ], rewards:[], trackable:true },

{ id:1359, line:'dragonborn', order:10, optional:true, title:'The Ebony Warrior', giver:'The Ebony Warrior (approaches you directly)', location:'Anywhere in Skyrim or Solstheim', level:'Required 80',
  steps:[
    'At character level 80, be approached by the legendary Ebony Warrior, who challenges you to single combat for the honor of the fight.',
    'Defeat him in battle.',
    '(Optional) Spare him afterward and he may join future fights against dragons as an ally.'
  ], rewards:["The Ebony Warrior's unique armor and weapons", 'Word for a shout of your choice', '+10 permanent health, magicka, or stamina'], trackable:true },

{ id:1360, line:'dragonborn', order:11, optional:true, title:'Unearthed', giver:'Ralis Sedarys', location:'Kolbjorn Barrow',
  steps:[
    'Help Telvanni researcher Ralis Sedarys investigate Kolbjorn Barrow, once home to the ancient Nord enchanter Ahzidal.',
    'Clear the barrow of draugr and traps alongside Ralis.',
    'Decide the fate of the recovered Ahzidal artifacts.'
  ],
  choice:{ flag:'Choice Point', text:'Split the recovered Ahzidal artifacts with Ralis, or kill him to keep the full set for yourself — killing him is the only way to claim every piece.' },
  rewards:["Pieces of Ahzidal's armor set (Daedric-tier enchanted artifacts)"], trackable:true },

{ id:1361, line:'dragonborn', order:12, optional:true, title:'Deathbrand', giver:'A treasure map (found on a leveled corpse or purchased)', location:'Various coastal locations on Solstheim',
  steps:[
    'Find the first of several Deathbrand treasure maps, each leading to the next.',
    'Follow the chain of maps along Solstheim\'s coastline to a series of hidden caches.',
    'Recover the full Deathbrand armor set from the final hoard.'
  ], rewards:['Deathbrand armor set (unique light armor)'], trackable:true },

/* ======================= HEARTHFIRE (DLC) ======================= */
{ id:1370, line:'hearthfire', order:1, title:'Build a Homestead', giver:'The Jarl or steward of the relevant hold', location:'Falkreath Hold (Lakeview Manor), Hjaalmarch (Windstad Manor), The Pale (Heljarchen Hall)',
  steps:[
    'Complete each hold\'s prerequisite favor quest to unlock its plot of land for purchase: Kill the Bandit Leader (Falkreath), Laid to Rest (Hjaalmarch), or Waking Nightmare followed by Kill the Giant (The Pale).',
    'Buy the 5,000-gold plot from the hold\'s Jarl or steward.',
    'Use a drafting table and carpenter\'s workbench with quarried stone, clay, and sawn logs to build up to three wings on the house.',
    'Furnish rooms as desired — armory, alchemy lab, enchanter, greenhouse, stable, and more — and assign a follower as steward to help supply materials.',
    'Adopt up to two children and hire staff such as a bard or carriage driver.'
  ],
  choice:{ flag:'Not a traditional quest', text:'Hearthfire has no numbered questline — home construction and adoption are open-ended systems you can pursue on any or all three plots, in any order, once each hold\'s prerequisite favor is complete.' },
  rewards:['Up to three fully customizable homes', 'A hold-appropriate housecarl once you are Thane and own the home', 'Up to two adopted children'], trackable:true },

// hold's territory — scales how far dungeon pins fan out from the capital.
const HOLD_MAP_RADIUS = {
  'Haafingar': 90, 'Hjaalmarch': 85, 'The Pale': 130, 'Winterhold': 110, 'Eastmarch': 110,
  'The Rift': 120, 'Whiterun Hold': 130, 'The Reach': 110, 'Falkreath Hold': 110,
};

// 16-point compass -> degrees clockwise from north (SVG: north = -y, east = +x). Longest phrases first
// so "north-northeast" matches before the plain "north"/"northeast" it contains.
const DIRECTION_ANGLES = {
  'north-northeast': 22.5, 'north-northwest': 337.5, 'south-southeast': 157.5, 'south-southwest': 202.5,
  'east-northeast': 67.5, 'east-southeast': 112.5, 'west-northwest': 292.5, 'west-southwest': 247.5,
  'northeast': 45, 'northwest': 315, 'southeast': 135, 'southwest': 225,
  'north': 0, 'south': 180, 'east': 90, 'west': 270,
};
const DIRECTION_WORDS = Object.keys(DIRECTION_ANGLES).sort((a, b) => b.length - a.length);

// Cheap deterministic hash -> [0,1). Same id always produces the same pin position (no Math.random),
// so pins don't jump around between renders.
function mapHash01(n){ const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }

// Pulls the first compass direction out of a location's `overview` prose (e.g. "southeast of Windhelm")
// — real UESP-sourced directional text, so even though the distance/spread below is computed, the
// *direction* from the hold capital is grounded in the same research the entry itself was written from.
function parseDirectionAngle(text){
  if (!text) return null;
  const lower = text.toLowerCase();
  for (const word of DIRECTION_WORDS) { if (lower.includes(word)) return DIRECTION_ANGLES[word]; }
  return null;
}

// Places a dungeon pin relative to its hold capital: real compass direction (parsed above) plus a
// deterministic id-seeded jitter for angle spread and distance, so the ~250 non-capital pins fan out
// legibly around each capital instead of stacking on one ray or landing all at the same radius.
function computeHoldRelativePin(id, holdName, overviewText){
  const capital = HOLD_CAPITAL_COORDS[holdName];
  if (!capital) return null;
  const baseAngle = parseDirectionAngle(overviewText);
  const angle = (baseAngle === null) ? mapHash01(id) * 360 : baseAngle + (mapHash01(id) * 40 - 20);
  const radiusFrac = 0.4 + mapHash01(id * 31 + 7) * 0.55;
  const radius = (HOLD_MAP_RADIUS[holdName] || 100) * radiusFrac;
  const rad = angle * Math.PI / 180;
  return { x: capital.x + radius * Math.sin(rad), y: capital.y - radius * Math.cos(rad) };
}

// Notable Locations (POI) don't share one field shape — some are realm-hopping (Soul Cairn, Sovngarde,
// Apocrypha) or on Solstheim, which isn't part of the mainland hold map at all. Mainland entries get a
// hand-placed coordinate (few enough, and well-known enough, to place directly); the rest render inside
// a small labeled inset box instead of a fabricated mainland position.
const POI_MAP_COORDS = {
  8010: { x: 560, y: 420 },     // High Hrothgar — Throat of the World, Whiterun/Rift border
  8011: { x: 552, y: 398 },     // Throat of the World
  8014: { x: 330, y: 345 },     // Blackreach — underground, roughly beneath the Reach/Whiterun border
  8022: { inset: 'realm' },     // The Soul Cairn
  8023: { inset: 'realm' },     // Sovngarde
  8024: { inset: 'solstheim' }, // Raven Rock
  8025: { inset: 'solstheim' }, // Skaal Village
  8026: { inset: 'solstheim' }, // Tel Mithryn
  8027: { inset: 'realm' },     // Apocrypha
  8028: { inset: 'solstheim' }, // Temple of Miraak
};

// Fixed coordinates for the two inset boxes (drawn in otherwise-empty sea corners of the same viewBox).
const INSET_COORDS = {
  solstheim: { 8024: { x: 900, y: 80 }, 8025: { x: 952, y: 35 }, 8026: { x: 958, y: 75 }, 8028: { x: 888, y: 95 }, 11208: { x: 908, y: 63 } },
  realm:     { 8022: { x: 900, y: 665 }, 8023: { x: 940, y: 678 }, 8027: { x: 920, y: 700 } },
};

// Hearthfire homestead plots only carry a `hold` field (no city) — hand-placed from their known in-game
// locations rather than the generic directional scheme, since there are only three of them.
const HEARTHFIRE_MAP_COORDS = {
  11205: { x: 410, y: 480 }, // Lakeview Manor — Falkreath Hold, near Lake Ilinalta, north toward the Whiterun border
  11206: { x: 170, y: 265 }, // Windstad Manor — Hjaalmarch, coast west of Morthal
  11207: { x: 430, y: 195 }, // Heljarchen Hall — The Pale, south of Dawnstar near the Whiterun border
};

// Builds every pin on the map from the SAME data arrays that already drive the Locations list views —
// no separate/duplicated location data. Combines: hold capitals, all "Dungeons by Hold" entries (via
// HOLD_DUNGEONS, generically — new holds need no changes here), Notable Locations, and Housing.
function buildMapPins(){
  const pins = [];

  HOLD_CAPITALS.forEach(cap => {
    const c = HOLD_CAPITAL_COORDS[cap.hold];
    if (c) pins.push({ id: cap.id, name: cap.name, type: 'Hold Capital', hold: cap.hold, summary: cap.desc, x: c.x, y: c.y, category: 'capital',
      nav: { section:'locations', locationTab:'capitals' } });
  });

  Object.entries(HOLD_DUNGEONS).forEach(([holdName, list]) => {
    list.forEach(d => {
      const pos = computeHoldRelativePin(d.id, holdName, d.overview);
      if (pos) pins.push({ id: d.id, name: d.name, type: d.type, hold: holdName, summary: d.overview, x: pos.x, y: pos.y, category: 'dungeon',
        nav: { section:'locations', locationTab:'dungeons', holdTab:holdName } });
    });
  });

  LOCATIONS_POI.forEach(p => {
    const coord = POI_MAP_COORDS[p.id];
    if (!coord) return;
    const nav = { section:'locations', locationTab:'poi' };
    if (coord.inset) {
      const ic = INSET_COORDS[coord.inset][p.id];
      if (ic) pins.push({ id: p.id, name: p.name, type: 'Notable Location', hold: null, summary: p.desc, x: ic.x, y: ic.y, category: 'poi', inset: coord.inset, nav });
    } else {
      pins.push({ id: p.id, name: p.name, type: 'Notable Location', hold: null, summary: p.desc, x: coord.x, y: coord.y, category: 'poi', nav });
    }
  });

  CITY_HOMES.forEach(h => {
    const c = HOLD_CAPITAL_COORDS[h.hold];
    if (c) pins.push({ id: h.id, name: h.name, type: 'Home', hold: h.hold, summary: h.unlock, x: c.x + 16, y: c.y - 16, category: 'housing',
      nav: { section:'locations', locationTab:'housing' } });
  });

  HEARTHFIRE_HOMES.forEach(h => {
    const c = HEARTHFIRE_MAP_COORDS[h.id];
    if (c) pins.push({ id: h.id, name: h.name, type: 'Homestead', hold: h.hold, summary: h.unlock, x: c.x, y: c.y, category: 'housing',
      nav: { section:'locations', locationTab:'housing' } });
  });

  DLC_HOMES.forEach(h => {
    const ic = INSET_COORDS.solstheim[h.id];
    if (ic) pins.push({ id: h.id, name: h.name, type: 'Home', hold: null, summary: h.unlock, x: ic.x, y: ic.y, category: 'housing', inset: 'solstheim',
      nav: { section:'locations', locationTab:'housing' } });
  });

  return pins;
}
