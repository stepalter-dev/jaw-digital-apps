<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Molly's Field Journal — RDR2 Tips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ecdfc0;
    --paper-shadow: #c9b98d;
    --paper-dark: #ded0aa;
    --ink: #2a2016;
    --ink-soft: #4a3d2b;
    --leather: #4a2f1e;
    --leather-dark: #35210f;
    --rust: #9c3d2e;
    --gold: #a6812e;
    --sage: #5c6647;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--leather-dark);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.04), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(0,0,0,0.3), transparent 60%);
    font-family: 'Libre Baskerville', serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  .journal {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 0;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.03) inset;
    border-radius: 4px;
    overflow: hidden;
  }

  /* ---------- SIDE TABS (desktop) ---------- */
  .tabs {
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--leather), var(--leather-dark));
    padding: 90px 0 20px;
    min-width: 66px;
    flex-shrink: 0;
    position: relative;
  }

  .tabs::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.15) 0px, transparent 2px 40px);
    pointer-events: none;
  }

  .tab-btn {
    all: unset;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 14px 16px;
    margin: 3px 0;
    margin-right: -1px;
    background: #3d2818;
    color: #cdbb92;
    font-family: 'Special Elite', monospace;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 3px 0 0 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
    transition: transform .15s ease, background .15s ease, color .15s ease;
    transform-origin: left center;
  }

  .tab-btn .icon { font-size: 16px; filter: grayscale(0.3) sepia(0.2); }
  .tab-btn .count {
    margin-left: auto;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    opacity: 0.65;
  }

  .tab-btn:hover { background: #4d3420; color: #ecdfc0; }

  .tab-btn.active {
    background: var(--paper);
    color: var(--ink);
    transform: translateX(6px);
    box-shadow: -3px 4px 10px rgba(0,0,0,0.35);
  }
  .tab-btn.active .count { color: var(--rust); opacity: 1; }

  /* mobile strip */
  .tabs-mobile {
    display: none;
  }

  /* ---------- PAGE ---------- */
  .page {
    flex: 1;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.25), transparent 45%),
      linear-gradient(var(--paper), var(--paper-dark));
    background-color: var(--paper);
    padding: 36px 40px 50px;
    position: relative;
    min-height: 640px;
  }

  .page::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(60,45,20,0.05) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: 0.5;
    mix-blend-mode: multiply;
  }

  header.title-block {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    border-bottom: 3px double var(--ink-soft);
    padding-bottom: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  h1 {
    font-family: 'Rye', serif;
    font-weight: 400;
    font-size: clamp(28px, 4vw, 42px);
    color: var(--leather-dark);
    margin: 0;
    letter-spacing: 0.02em;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
  }

  .subtitle {
    font-family: 'Special Elite', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  .stamp {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    color: var(--rust);
    border: 2px solid var(--rust);
    border-radius: 50%;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.1;
    transform: rotate(-9deg);
    opacity: 0.75;
    flex-shrink: 0;
  }

  /* search */
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-plate {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #2a2016;
    color: #e9d9b0;
    padding: 9px 14px;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 2px 6px rgba(0,0,0,0.3);
    flex: 1;
    min-width: 220px;
  }

  /* floating "back to top" button — appears once the reader has scrolled a screen or more down a
     long list, so jumping back to the search bar/filters doesn't require manual scrolling.
     Bottom-LEFT deliberately: sync.js's own status widget already fixes itself to bottom-right
     (bottom:14px;right:14px;z-index:99999) on every page, so the right corner is taken. */
  .back-to-top {
    position: fixed;
    left: 22px;
    bottom: 22px;
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--leather);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 2px 3px 10px rgba(0,0,0,0.4);
    color: var(--gold);
    font-size: 18px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity .2s ease, transform .2s ease, background .15s ease;
  }
  .back-to-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .back-to-top:hover { background: var(--leather-dark); }

  .search-plate input {
    background: transparent;
    border: none;
    outline: none;
    color: #f3e7c9;
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    width: 100%;
    letter-spacing: 0.03em;
  }
  .search-plate input::placeholder { color: #a3906a; }

  .filter-pill {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    background: rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.15);
    padding: 6px 10px;
    border-radius: 20px;
    cursor: pointer;
    user-select: none;
  }
  .filter-pill.active {
    background: var(--sage);
    color: #f3edd8;
    border-color: var(--sage);
  }

  /* entries */
  .entries {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .entries.dashboard-mode { display: block; }

  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .dash-card {
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(60,45,20,0.15);
    border-left: 4px solid var(--gold);
    border-radius: 2px;
    padding: 16px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .dash-card:hover {
    transform: translateY(-2px);
    box-shadow: 2px 4px 10px rgba(60,45,20,0.15);
  }
  .dash-card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .dash-icon { font-size: 18px; }
  .dash-label {
    font-family: 'Special Elite', monospace;
    font-size: 13.5px;
    color: var(--leather-dark);
  }
  .dash-bar-track {
    background: rgba(0,0,0,0.1);
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .dash-bar-fill {
    background: var(--sage);
    height: 100%;
    border-radius: 10px;
    transition: width .3s ease;
  }
  .dash-count {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .reset-zone {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px dashed rgba(60,45,20,0.25);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .reset-btn {
    all: unset;
    cursor: pointer;
    font-family: 'Special Elite', monospace;
    font-size: 12px;
    color: var(--rust);
    border: 1.5px solid var(--rust);
    border-radius: 3px;
    padding: 8px 14px;
    transition: background .15s ease, color .15s ease;
  }
  .reset-btn:hover { background: rgba(156,61,46,0.08); }
  .reset-btn.armed {
    background: var(--rust);
    color: #f3e7c9;
  }
  .reset-hint {
    font-family: 'Libre Baskerville', serif;
    font-size: 11.5px;
    color: var(--ink-soft);
    opacity: 0.75;
  }

  .entry {
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(60,45,20,0.15);
    border-left: 4px solid var(--gold);
    border-radius: 2px;
    padding: 16px 16px 14px;
    position: relative;
    box-shadow: 2px 3px 8px rgba(60,45,20,0.08);
  }

  .entry.tracked { border-left-color: var(--sage); }

  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }

  .entry h3 {
    font-family: 'Special Elite', monospace;
    font-size: 14.5px;
    margin: 0;
    color: var(--leather-dark);
    line-height: 1.35;
  }

  .fav-btn, .track-btn {
    all: unset;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
    filter: grayscale(1) opacity(0.4);
    transition: filter .15s ease, transform .15s ease;
  }
  .fav-btn.active { filter: none; opacity: 1; transform: scale(1.1); }

  .entry p {
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  .entry-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Courier Prime', monospace;
    font-size: 10.5px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .track-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--ink-soft);
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    filter: none;
    opacity: 0.75;
  }
  .track-btn .box {
    width: 12px; height: 12px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    display: inline-block;
  }
  .entry.tracked .track-btn .box { background: var(--sage); border-color: var(--sage); }

  .animal-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: -4px 0 10px;
  }
  .animal-link-btn {
    all: unset;
    cursor: pointer;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 20px;
    padding: 3px 9px;
    transition: background .15s ease, color .15s ease;
  }
  .animal-link-btn:hover {
    background: var(--gold);
    color: #fff;
  }
  @keyframes flashHighlight {
    0%, 100% { box-shadow: 0 0 0 0 rgba(166,129,46,0); }
    20% { box-shadow: 0 0 0 4px rgba(166,129,46,0.55); }
  }
  .entry.flash-highlight {
    animation: flashHighlight 2.2s ease-out;
  }
  .entry.tracked .track-btn { color: var(--sage); opacity: 1; }
  .track-btn.is-on .box { background: var(--sage); border-color: var(--sage); }
  .track-btn.is-on { color: var(--sage); opacity: 1; }

  .empty-state {
    font-family: 'Special Elite', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 40px 10px;
    text-align: center;
    opacity: 0.7;
  }

  footer.note {
    margin-top: 30px;
    text-align: center;
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.6;
  }

  @media (max-width: 720px) {
    .journal { flex-direction: column; }
    .tabs { display: none; }
    .tabs-mobile {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 12px;
      background: var(--leather-dark);
    }
    .tabs-mobile .tab-btn {
      margin: 0;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: none;
    }
    .tabs-mobile .tab-btn.active { transform: none; }
    .page { padding: 26px 18px 40px; }
  }
</style>
</head>
<body>

<div class="journal">
  <nav class="tabs" id="tabs-desktop"></nav>

  <main class="page">
    <nav class="tabs-mobile" id="tabs-mobile"></nav>

    <header class="title-block">
      <div>
        <h1>Molly's Field Journal</h1>
        <div class="subtitle">— tips, tricks &amp; hints for the frontier —</div>
      </div>
      <div class="stamp">RDR2<br/>NOTES</div>
    </header>

    <div class="search-row">
      <div class="search-plate">
        <span>🔎</span>
        <input id="search" type="text" placeholder="Search the journal…" />
      </div>
      <span class="filter-pill active" data-fav="all">All entries</span>
      <span class="filter-pill" data-fav="favorites">★ Favorites only</span>
      <span id="progress-tally" style="display:none; font-family:'Courier Prime', monospace; font-size:11px; color: var(--sage);"></span>
    </div>

    <div class="search-row" id="sub-row" style="display:none;"></div>

    <div id="horse-name-bar" style="display:none; align-items:center; gap:10px; margin-bottom:20px; background: rgba(255,255,255,0.35); border: 1px solid rgba(60,45,20,0.15); border-left: 4px solid var(--gold); border-radius: 2px; padding: 12px 16px;">
      <span style="font-family:'Special Elite', monospace; font-size:12.5px; color: var(--leather-dark);">🐴 Your horse's name:</span>
      <input id="horse-name-input" type="text" placeholder="e.g. Hosea" style="flex:1; min-width:120px; background: transparent; border: none; border-bottom: 1.5px solid var(--ink-soft); font-family:'Libre Baskerville', serif; font-size: 14px; color: var(--ink); padding: 4px 2px; outline: none;" />
    </div>

    <section class="entries" id="entries"></section>

    <footer class="note">JAW + MNB 2024</footer>
  </main>
</div>

<button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">↑</button>

<script src="../sync.js"></script>

const TIPS = [
  { id:120, cat:'compendium', sub:'regular-fish', title:'Bluegill', body:'All lakes and rivers, most active during rain. Best bait: Cheese.', trackable:true },
  { id:121, cat:'compendium', sub:'regular-fish', title:'Chain Pickerel', body:'Lakes, rivers, and swamps, most active in sunny weather. Best bait: Corn.', trackable:true },
  { id:122, cat:'compendium', sub:'regular-fish', title:'Redfin Pickerel', body:'Rivers in the south, most active on warm sunny days. Best bait: Bread.', trackable:true },
  { id:123, cat:'compendium', sub:'regular-fish', title:'Rock Bass', body:'Any clear water, most active on sunny days. Best bait: Cheese or other natural bait.', trackable:true },
  { id:124, cat:'compendium', sub:'regular-fish', title:'Smallmouth Bass', body:'Northern rivers, most active during rain. Best bait: any natural bait.', trackable:true },
  { id:125, cat:'compendium', sub:'regular-fish', title:'Bullhead Catfish', body:'Swamps, most active during rain. Best bait: Cheese or corn.', trackable:true },
  { id:126, cat:'compendium', sub:'regular-fish', title:'Perch', body:'Rivers and lakes across the map, most active in sunny weather. Best bait: Bread.', trackable:true },
  { id:127, cat:'compendium', sub:'regular-fish', title:'Lake Sturgeon', body:'Southern lakes and swamps, most active during overcast weather. Best bait/lure: Lake Lure.', trackable:true },
  { id:128, cat:'compendium', sub:'regular-fish', title:'Largemouth Bass', body:'Any waters in the south, most active during rain. Best bait: Crayfish.', trackable:true },
  { id:129, cat:'compendium', sub:'regular-fish', title:'Steelhead Trout', body:'Lakes, mostly in the south, most active during rain. Best bait: Worms.', trackable:true },
  { id:130, cat:'compendium', sub:'regular-fish', title:'Muskie', body:'Northern lakes, most active on overcast days. Best bait/lure: Lake Lure.', trackable:true },
  { id:131, cat:'compendium', sub:'regular-fish', title:'Sockeye Salmon', body:'Rivers in the north, most active during overcast weather. Best bait/lure: River Lure.', trackable:true },
  { id:132, cat:'compendium', sub:'regular-fish', title:'Northern Pike', body:'Northern rivers, most active in sunny weather. Best bait/lure: River Lure. Note: confirmed as its own species distinct from Muskie, though I still can\'t confirm a separate Legendary catch for it.', trackable:true },
  { id:133, cat:'compendium', sub:'regular-fish', title:'Channel Catfish', body:'Muddy swamp waters, most active during rain. Best bait/lure: Swamp Lure.', trackable:true },
  { id:134, cat:'compendium', sub:'regular-fish', title:'Longnose Gar', body:'Swamp waters, most active during rain. Best bait/lure: Swamp Lure.', trackable:true },
  { id:200, cat:'compendium', sub:'legendary-animals', title:'Legendary Alligator — Lagras', body:'Lemoyne, on the western shore of Lagras Lake, a short way south of the main body of water.', trackable:true },
  { id:201, cat:'compendium', sub:'legendary-animals', title:'Legendary Beaver — near Van Horn', body:'New Hanover, west of Van Horn Trading Post, north shore of a pond just south of Elysian Pool.', trackable:true },
  { id:202, cat:'compendium', sub:'legendary-animals', title:'Legendary Bharati Grizzly Bear — O\'Creagh\'s Run', body:'Ambarino, Grizzlies East, north/west of O\'Creagh\'s Run. First encountered during a Chapter 2 story mission with Hosea — if you don\'t finish it off then, you can return to the same spot later.', trackable:true },
  { id:203, cat:'compendium', sub:'legendary-animals', title:'Legendary Big Horn Ram — near Valentine', body:'Ambarino, just outside Valentine, wedged between the Dakota River and Cattail Pond.', trackable:true },
  { id:204, cat:'compendium', sub:'legendary-animals', title:'Legendary Boar — Bluewater Marsh', body:'New Hanover, Bluewater Marsh, east side of the Kamassa River.', trackable:true },
  { id:205, cat:'compendium', sub:'legendary-animals', title:'Legendary Buck — Big Valley', body:'West Elizabeth, Big Valley, west of Mount Shann, north of Lake Owanjila.', trackable:true },
  { id:206, cat:'compendium', sub:'legendary-animals', title:'⚠ Legendary Cougar — Gaptooth Ridge (New Austin)', body:'New Austin, west of Tumbleweed, Gaptooth Ridge. New Austin isn\'t open in the main story until the Epilogue — this one can\'t be hunted as Arthur, only as John.', trackable:true },
  { id:207, cat:'compendium', sub:'legendary-animals', title:'Legendary Coyote — near Dewberry Creek', body:'Western Lemoyne, near Eris Field, south of Dewberry Creek.', trackable:true },
  { id:208, cat:'compendium', sub:'legendary-animals', title:'Legendary Elk — near Fort Wallace', body:'Ambarino, just east of Fort Wallace, roughly south of Bacchus Bridge.', trackable:true },
  { id:209, cat:'compendium', sub:'legendary-animals', title:'Legendary Fox — Scarlett Meadows', body:'Western Lemoyne, near Mattock Pond, north of Rhodes.', trackable:true },
  { id:210, cat:'compendium', sub:'legendary-animals', title:'Legendary Moose — Kamassa River', body:'Northeastern Ambarino, off the western shore of the Kamassa River.', trackable:true },
  { id:211, cat:'compendium', sub:'legendary-animals', title:'⚠ Legendary Panther (Giaguaro) — Bolger Glade', body:'Lemoyne, south of Rhodes near Bolger Glade. Won\'t spawn at all until you\'ve completed 9 Master Hunter challenges — worth noting on the Challenges list once that\'s built.', trackable:true },
  { id:212, cat:'compendium', sub:'legendary-animals', title:'⚠ Legendary Pronghorn — Rio Bravo (New Austin)', body:'New Austin, near Fort Mercer, west of Rio del Lobo Rock. Same as the Cougar — New Austin is Epilogue-only, so this one is John-only in a normal playthrough.', trackable:true },
  { id:213, cat:'compendium', sub:'legendary-animals', title:'Legendary Tatanka Bison — south of Stillwater Creek', body:'Southern West Elizabeth, south of Stillwater Creek, near MacFarlane\'s Ranch and Thieves Landing.', trackable:true },
  { id:214, cat:'compendium', sub:'legendary-animals', title:'Legendary White Bison — Lake Isabella', body:'Northwestern Ambarino, west of Barrow Lagoon, near the northeastern shore of Lake Isabella.', trackable:true },
  { id:215, cat:'compendium', sub:'legendary-animals', title:'Legendary Wolf — Cotorra Springs', body:'Central Ambarino, north side of the Dakota River, around Cotorra Springs.', trackable:true },
  { id:100, cat:'compendium', sub:'legendary-fish', title:'Legendary Bluegill — Flat Iron Lake', body:'Between the shore and the island south of Clemens Point. Best lure: Special Lake Lure.', trackable:true },
  { id:101, cat:'compendium', sub:'legendary-fish', title:'Legendary Bullhead Catfish — Sisika Island', body:'West of Sisika Penitentiary, on the northern shore. Needs a boat to reach comfortably. Best lure: Special River Lure.', trackable:true },
  { id:102, cat:'compendium', sub:'legendary-fish', title:'Legendary Chain Pickerel — Dakota River', body:'On the bend of the Dakota River, northwest of Flatneck Station, The Heartlands. Best lure: Special River Lure.', trackable:true },
  { id:103, cat:'compendium', sub:'legendary-fish', title:'Legendary Channel Catfish — Rio Bravo', body:'Not available until you\'ve mailed the other 13 legendary fish to Jeremy Gill and he invites you on a trip — this one comes from a Stranger mission, not free fishing, and only opens up in the Epilogue.', trackable:true },
  { id:104, cat:'compendium', sub:'legendary-fish', title:'Legendary Lake Sturgeon — near Saint Denis', body:'Fish from the railroad bridge between Rhodes and Saint Denis, near Caliga Hall — stand near the edge and watch for trains. Best lure: Special River Lure.', trackable:true },
  { id:105, cat:'compendium', sub:'legendary-fish', title:'Legendary Largemouth Bass — San Luis River', body:'Southeast of Lake Don Julio, New Austin, south of Armadillo. Most sources say Special Lake Lure, though a couple list River Lure — worth trying both.', trackable:true },
  { id:106, cat:'compendium', sub:'legendary-fish', title:'Legendary Longnose Gar — Lagras', body:'Northwest tip of the Lakay peninsula / southern shore of Bluewater Marsh. Best lure: Special Swamp Lure.', trackable:true },
  { id:107, cat:'compendium', sub:'legendary-fish', title:'Legendary Muskie — Van Horn', body:'At the foot of the lighthouse by Van Horn Trading Post. Best lure: Special River Lure.', trackable:true },
  { id:108, cat:'compendium', sub:'legendary-fish', title:'Legendary Perch — Elysian Pool', body:'Near Annesburg. Best lure: Special Lake Lure.', trackable:true },
  { id:109, cat:'compendium', sub:'legendary-fish', title:'Legendary Redfin Pickerel — Stillwater Creek', body:'East of MacFarlane\'s Ranch, near where it meets the Lower Montana River, west of Thieves Landing. Best lure: Special Lake Lure.', trackable:true },
  { id:110, cat:'compendium', sub:'legendary-fish', title:'Legendary Rock Bass — Aurora Basin', body:'Western border of West Elizabeth, due west of Blackwater. Best lure: Special Lake Lure.', trackable:true },
  { id:111, cat:'compendium', sub:'legendary-fish', title:'Legendary Smallmouth Bass — Owanjila Lake', body:'West of Strawberry. Best lure: Special Lake Lure.', trackable:true },
  { id:112, cat:'compendium', sub:'legendary-fish', title:'Legendary Sockeye Salmon — Lake Isabella', body:'Western Ambarino, near where Beartooth Beck feeds the lake, west of Barrow Lagoon. Dress warm. Best lure: Special Lake Lure (a couple of sources say River Lure — Lake is the majority pick).', trackable:true },
  { id:113, cat:'compendium', sub:'legendary-fish', title:'Legendary Steelhead Trout — Roanoke Valley', body:'North of Annesburg, at Willard\'s Rest near the waterfall. Best lure: Special River Lure.', trackable:true },
  { id:114, cat:'compendium', sub:'legendary-fish', title:'⚠ Legendary Northern Pike — unverified', body:'Listed as a species in some compendium references, but I couldn\'t confirm a separate legendary catch for it distinct from the Muskie across current sources. Flagging rather than guessing — will dig further before we call this one done.', trackable:false },
  { id:140, cat:'compendium', sub:'small-critters', title:'Squirrel', body:'Common in forests all over the map. Easy to spot, surprisingly hard to get a perfect pelt from — they\'re small and skittish, so a body shot ruins the hide. Aim for the head with a low-caliber weapon.', trackable:true },
  { id:141, cat:'compendium', sub:'small-critters', title:'Chipmunk', body:'Rarer than squirrels and pickier about habitat. Good spots: the Taxidermist\'s house area northeast of Strawberry in Big Valley, Scarlett Meadows, near Wapiti, and the woods around Annesburg. Daytime is best.', trackable:true },
  { id:142, cat:'compendium', sub:'small-critters', title:'Opossum', body:'Nocturnal. The hills immediately east of Emerald Ranch are reliable at night. They\'ll play dead when you approach — that\'s your shot.', trackable:true },
  { id:143, cat:'compendium', sub:'small-critters', title:'Raccoon', body:'North of Owanjila near Strawberry, Cumberland Forest, and around Rhodes.', trackable:true },
  { id:144, cat:'compendium', sub:'small-critters', title:'Rat', body:'Common near towns and water — Armadillo, the area between Owanjila and Strawberry, and the water-facing outskirts of Saint Denis.', trackable:true },
  { id:145, cat:'compendium', sub:'small-critters', title:'Skunk', body:'Nocturnal, fairly common everywhere. Strawberry, Ringneck Creek in northwest Lemoyne, and around Van Horn Trading Post are reliable. Don\'t skin it — it\'s a "collected" item, not a skinned one.', trackable:true },
  { id:146, cat:'compendium', sub:'small-critters', title:'Badger', body:'Found almost everywhere except Grizzlies West. Best odds west of the Kamassa River in Lemoyne, Tall Trees northeast of Aurora Basin, and north of Bacchus Station near Donner Falls.', trackable:true },
  { id:147, cat:'compendium', sub:'small-critters', title:'Muskrat', body:'Highest concentration in Bluewater Marsh, but shows up along most major waterways — Dewberry Creek and the river feeding Owanjila Lake are both solid bets. Semiaquatic, so stick close to water.', trackable:true },
  { id:148, cat:'compendium', sub:'small-critters', title:'Armadillo', body:'New Austin only — Cholla Springs and around the town of Armadillo are the classic spots.', trackable:true },
  { id:149, cat:'compendium', sub:'small-critters', title:'Bat', body:'Nocturnal and easy to miss. Try the north side of Aurora Basin in Tall Trees, Bolger Glade southeast of Rhodes, or the northwest side of Elysian Pool southwest of Annesburg.', trackable:true },
  { id:150, cat:'compendium', sub:'small-critters', title:'Beaver', body:'South side of Owanjila near Strawberry, or north of Lake Isabella in West Elizabeth — generally anywhere calm rivers and lakes meet timber.', trackable:true },
  { id:151, cat:'compendium', sub:'small-critters', title:'Rabbit', body:'The easiest one on this list — extremely common almost everywhere on the map, no special trip needed.', trackable:true },
  { id:160, cat:'compendium', sub:'large-grazers', title:'Whitetail Deer', body:'Extremely common in the forests of New Hanover, Lemoyne, and West Elizabeth. Skittish — keep your distance and use a rifle or a bow with poison arrows for a clean kill.', trackable:true },
  { id:161, cat:'compendium', sub:'large-grazers', title:'Whitetail Buck', body:'Same forests as the deer, but the antlered male. Same approach: distance and a rifle.', trackable:true },
  { id:162, cat:'compendium', sub:'large-grazers', title:'Elk', body:'Northeast of Valentine, in Cumberland Forest, usually mixed in among whitetail deer. Scoped rifle, aim for the head.', trackable:true },
  { id:163, cat:'compendium', sub:'large-grazers', title:'American Bison', body:'Herds roam The Heartlands, native to the plains of New Hanover and West Elizabeth. Big animal — bring a high-powered rifle (Carcano) or a bow with Improved Arrows, not a light one.', trackable:true },
  { id:164, cat:'compendium', sub:'large-grazers', title:'Wild Boar', body:'New Hanover, Lemoyne, and West Elizabeth, especially swamps — they tend to avoid alligator territory. Rifle or bow with poison arrows for a clean hide.', trackable:true },
  { id:165, cat:'compendium', sub:'large-grazers', title:'Moose', body:'Genuinely rare and patchy — even experienced players report long searches. Best bets: Owanjila Lake (Strawberry), the southwest shore of Lake Isabella, Aurora Basin, Barrow Lagoon, and around Cattail Pond. Scoped rifle, headshot only — they won\'t sit still long.', trackable:true },
  { id:166, cat:'compendium', sub:'large-grazers', title:'Bighorn Sheep / Ram', body:'Western Grizzlies near the train tracks west of Valentine by Cattail Pond, and around Mount Shann in West Elizabeth.', trackable:true },
  { id:167, cat:'compendium', sub:'large-grazers', title:'Pronghorn', body:'Common in grasslands across New Hanover and West Elizabeth — unlike the Legendary Pronghorn, the regular one is NOT New Austin-locked, so this one\'s fine to get as Arthur.', trackable:true },
  { id:180, cat:'compendium', sub:'predators', title:'Gray Wolf', body:'Hunt in packs. Reliable spots: Aurora Basin and around Hanging Dog Ranch. They rarely attack alone — if you see one, assume there are at least two more nearby.', trackable:true },
  { id:181, cat:'compendium', sub:'predators', title:'Coyote', body:'Widespread — New Austin, West Elizabeth, Lemoyne, and New Hanover all have them. Rare in Grizzlies West specifically. Bow or repeater for a clean kill.', trackable:true },
  { id:182, cat:'compendium', sub:'predators', title:'Cougar', body:'New Austin, New Hanover, and West Elizabeth — frequent around MacFarlane\'s Ranch, Stillwater Creek, Plainview, and Rio Bravo near Fort Mercer. Dangerous: if you\'ve taken ANY damage before it charges, its attack is an instant kill. Only a full health bar protects you. A poison arrow or throwing knife to the torso is the safer approach.', trackable:true },
  { id:183, cat:'compendium', sub:'predators', title:'Red Fox', body:'Forested areas of Lemoyne, eastern New Hanover, and the western woodlands of West Elizabeth.', trackable:true },
  { id:184, cat:'compendium', sub:'predators', title:'Gray Fox', body:'Same general range as the Red Fox, but more common in Lemoyne and New Hanover forests. Dewberry Creek in Lemoyne is a reliable spot.', trackable:true },
  { id:185, cat:'compendium', sub:'predators', title:'American Black Bear', body:'Less common than grizzlies — try the area around the "O" in Ambarino, north of Strawberry in West Elizabeth, or east of Aurora Basin in Tall Trees. More timid than a grizzly and often runs rather than charges.', trackable:true },
  { id:186, cat:'compendium', sub:'predators', title:'Grizzly Bear', body:'Tall Trees (north of the Lower Montana River), west of Wallace Station in West Elizabeth, the Dakota River east of Window Rock, and north of O\'Creagh\'s Run in Grizzlies East. Much more aggressive than a black bear — bring a scoped rifle and keep distance.', trackable:true },
  { id:187, cat:'compendium', sub:'predators', title:'⚠ Bobcat — not actually in RDR2', body:'Worth knowing: the Bobcat isn\'t a real, huntable species in RDR2 despite showing up on some old fan lists. It exists in the original Red Dead Redemption (Mexico), and there are leftover compendium/item assets suggesting it was planned for RDR2, but it was cut before release. Don\'t spend time hunting for it — it\'s not there.', trackable:false },
  { id:190, cat:'compendium', sub:'reptiles', title:'American Alligator', body:'Southern Bluewater Marsh and around Bayou Nwa, Lemoyne. A rifle is needed to pierce the armored hide.', trackable:true },
  { id:191, cat:'compendium', sub:'reptiles', title:'Snapping Turtle', body:'Native to the Lemoyne swamps. Slow-moving and won\'t react even when approached, so it\'s an easy one — a bow with small game arrows keeps the shell intact.', trackable:true },
  { id:192, cat:'compendium', sub:'reptiles', title:'American Bullfrog', body:'Lemoyne and Bayou Nwa, in shallow water. Prefers warm climates, so don\'t expect to find it up north.', trackable:true },
  { id:193, cat:'compendium', sub:'reptiles', title:'Diamondback Rattlesnake', body:'Lemoyne, New Hanover, and parts of West Elizabeth. Preys on ground-dwelling birds and rodents — a bow with small game arrows is the safest way to take one without wrecking the skin.', trackable:true },
  { id:194, cat:'compendium', sub:'reptiles', title:'Water Snakes (Cottonmouth and relatives)', body:'Found around swamps and wetlands, especially Lemoyne. Same approach as other snakes — small game arrows, watch your footing near water.', trackable:true },
  { id:195, cat:'compendium', sub:'reptiles', title:'⚠ Full snake family — 12 subspecies', body:'RDR2 actually tracks 12 separate snake entries in the compendium: 3 rattlesnake types, 3 venomous snakes, 3 water snakes, and 3 boa constrictor varieties. I\'ve got solid data on the common ones above, but I don\'t have confirmed individual spawn spots for all 12 yet — rather than guess, flagging this as a follow-up pass if Molly wants full snake completion specifically.', trackable:false },
  { id:196, cat:'compendium', sub:'reptiles', title:'Gila Monster', body:'A New Austin specialty — desert lizard, so this one\'s tied to the same Epilogue-access situation as the Legendary Cougar and Pronghorn if she\'s trying to get it as Arthur.', trackable:true },
  { id:220, cat:'compendium', sub:'birds-of-prey', title:'Hawks (3 species)', body:'Ferruginous, Red-tailed, and Rough-legged Hawks. Widespread almost everywhere, but most populous around Armadillo in New Austin. Varmint Rifle is the best weapon so you don\'t shred a small bird.', trackable:true },
  { id:221, cat:'compendium', sub:'birds-of-prey', title:'Eagles (Bald and Golden)', body:'Native to the mountain habitats of Ambarino and West Elizabeth. Best concentration is the eastern shore of Lake Owanjila; also check the Dakota River between Valentine and Strawberry, and near Annesburg.', trackable:true },
  { id:222, cat:'compendium', sub:'birds-of-prey', title:'Owls (Great Horned and Barn)', body:'Nocturnal — check abandoned buildings, barns, and silos where they nest. Leaving small bait like a rabbit or squirrel out at night can draw one in.', trackable:true },
  { id:223, cat:'compendium', sub:'birds-of-prey', title:'Vultures (Turkey Vulture, California Condor)', body:'Scavengers — watch the sky above a fresh kill or carcass and one will usually show up circling.', trackable:true },
  { id:224, cat:'compendium', sub:'birds-of-prey', title:'Falcon (Prairie Falcon)', body:'Catches other birds mid-flight, so it tends to show up wherever smaller birds are common. Less location-pinned than the others — keep an eye on open sky near rivers and cliffs.', trackable:true },
  { id:230, cat:'compendium', sub:'waterfowl', title:'Mallard Duck', body:'Common near almost any body of water — Lemoyne swamplands, the Ambarino stretch between the "R" and "I" on the map, the river southwest of Valentine, and east of Annesburg. Bow with small game arrows for a clean kill. Not found in Grizzlies West or New Austin.', trackable:true },
  { id:231, cat:'compendium', sub:'waterfowl', title:'Canada Goose', body:'Grasslands of The Heartlands and Lemoyne. Best concentration is around Emerald Ranch, with another cluster at the mouth of the Dakota River near Bard\'s Crossing. Varmint Rifle.', trackable:true },
  { id:232, cat:'compendium', sub:'waterfowl', title:'Herons (Great Blue, Tricolored)', body:'Wet, grassy marshlands of Lemoyne. Varmint Rifle for a clean kill.', trackable:true },
  { id:233, cat:'compendium', sub:'waterfowl', title:'Egrets (Reddish, Little, Snowy)', body:'Swampland of Bayou Nwa is the reliable spot for all three. Varmint Rifle with .22 shots.', trackable:true },
  { id:234, cat:'compendium', sub:'waterfowl', title:'Cormorants (Double-crested, Neotropic)', body:'Wetlands and coastal waters — the riverbank south of Rhodes is a solid spot for both types. Varmint Rifle.', trackable:true },
  { id:235, cat:'compendium', sub:'waterfowl', title:'Pelican', body:'Eastern shorelines — Bayou Nwa, Bluewater Marsh, Lagras, around Saint Denis, Copperhead Landing, the eastern coast of the Great Plains, and Quaker\'s Cove. Varmint Rifle.', trackable:true },
  { id:236, cat:'compendium', sub:'waterfowl', title:'⚠ Cranes and Loons — need another pass', body:'The compendium includes Whooping Crane, Sandhill Crane, and three Loon species (Common, Pacific, Yellow-billed), but I don\'t have confident, specific spawn locations for them yet. Rather than guess at marshland or northern-lake locations, flagging these for dedicated research next time we\'re in this section.', trackable:false },
  { id:240, cat:'compendium', sub:'songbirds', title:'Cardinal', body:'Common — south of Valentine in The Heartlands, and just west of town near the river. Small game arrows or Varmint Rifle.', trackable:true },
  { id:241, cat:'compendium', sub:'songbirds', title:'Woodpecker (Pileated, Red-Bellied)', body:'Pileated Woodpecker lives in the New Hanover woodlands. Red-Bellied Woodpecker is found in Roanoke Ridge.', trackable:true },
  { id:242, cat:'compendium', sub:'songbirds', title:'Robin', body:'A bit rarer than most songbirds — reliable near Braithwaite Manor and just west of Annesburg.', trackable:true },
  { id:243, cat:'compendium', sub:'songbirds', title:'Oriole', body:'Northwest of Flatneck Station in The Heartlands.', trackable:true },
  { id:244, cat:'compendium', sub:'songbirds', title:'Songbird (generic species)', body:'One of the most common birds in the game — can spawn almost anywhere, though rare in New Austin and Grizzlies West. Highest concentration is in and around Roanoke Valley.', trackable:true },
  { id:245, cat:'compendium', sub:'songbirds', title:'Sparrow', body:'Common across the northern half of the map — a reliable spot is west of Braithwaite Manor, south of Rhodes.', trackable:true },
  { id:246, cat:'compendium', sub:'songbirds', title:'Cedar Waxwing', body:'South of Riggs Station.', trackable:true },
  { id:247, cat:'compendium', sub:'songbirds', title:'Blue Jay', body:'Rarer than the others — stick close to the marked zone along the Dakota River banks between Wallace Station and Diablo Ridge. Likes to stay near water.', trackable:true },
  { id:248, cat:'compendium', sub:'songbirds', title:'Crow', body:'One of the most common birds in the game — no special trip needed, they\'re basically everywhere.', trackable:true },
  { id:250, cat:'compendium', sub:'herbs', title:'Yarrow', body:'Grassy fields and meadows of The Heartlands, Scarlett Meadows, and south of Rhodes in Lemoyne. Tall plant with a red flowery top. Key ingredient for Health Cures and Special Miracle Tonic.', trackable:true },
  { id:251, cat:'compendium', sub:'herbs', title:'Wild Mint', body:'Loves water — grows along almost any river or stream, marshes and moist meadows. The Little Creek River in Big Valley and the Dakota River are especially thick with it.', trackable:true },
  { id:252, cat:'compendium', sub:'herbs', title:'Wintergreen Berry', body:'Coldest parts of the map — northeast Ambarino and New Hanover. Easy to spot thanks to its red color. Used for Potent Predator Bait.', trackable:true },
  { id:253, cat:'compendium', sub:'herbs', title:'Wild Carrot', body:'Extremely common, especially in The Heartlands — basically any open field. Good free horse feed.', trackable:true },
  { id:254, cat:'compendium', sub:'herbs', title:'Creeping Thyme', body:'The Heartlands, alongside Yarrow, Wild Carrots, and American Ginseng — especially around Emerald Ranch.', trackable:true },
  { id:255, cat:'compendium', sub:'herbs', title:'American Ginseng', body:'The Heartlands and New Hanover, abundant around Emerald Ranch.', trackable:true },
  { id:256, cat:'compendium', sub:'herbs', title:'Alaskan Ginseng', body:'Ambarino and northwest West Elizabeth, in forests and moist areas — also a reliable patch northeast of Brandywine Drop, west of Willard\'s Rest. Spot it from a distance by its red berries.', trackable:true },
  { id:257, cat:'compendium', sub:'herbs', title:'Indian Tobacco', body:'Scarlett Meadows, Lemoyne — fields and the edges of the woods.', trackable:true },
  { id:258, cat:'compendium', sub:'herbs', title:'Milkweed', body:'Scarlett Meadows, Lemoyne, same general area as Indian Tobacco.', trackable:true },
  { id:259, cat:'compendium', sub:'herbs', title:'Blackberry', body:'Scarlett Meadows, Lemoyne — fields and along the woodline.', trackable:true },
  { id:260, cat:'compendium', sub:'herbs', title:'Red Raspberry', body:'Forested, often elevated areas. Cumberland Forest in New Hanover is the best spot — grows on small bushes, easy to spot against the green.', trackable:true },
  { id:261, cat:'compendium', sub:'herbs', title:'Burdock Root', body:'Along the Little Creek River, just west of Wallace Station.', trackable:true },
  { id:262, cat:'compendium', sub:'herbs', title:'Hummingbird Sage', body:'Areas with dense foliage and cover under trees — western Lemoyne, western West Elizabeth, and along the banks of the Kamassa River.', trackable:true },
  { id:264, cat:'compendium', sub:'herbs', title:'Golden Currant', body:'Streams in West Elizabeth and the northeast of New Hanover. Common — shouldn\'t take long to find.', trackable:true },
  { id:265, cat:'compendium', sub:'herbs', title:'Oleander Sage', body:'Near Saint Denis, Lemoyne — river banks of Bayou Nwa are the easiest spot. Spot it from afar by its pinkish flowers. Used to craft Poison weapons like the Poison Throwing Knife and Poison Arrow.', trackable:true },
  { id:266, cat:'compendium', sub:'herbs', title:'Oregano', body:'One of the most common herbs in the game — dry grasslands almost anywhere on the map.', trackable:true },
  { id:267, cat:'compendium', sub:'herbs', title:'Parasol Mushroom', body:'Well-drained soil and woodlands across the map. Pale colored, easy to spot once you know the shape.', trackable:true },
  { id:268, cat:'compendium', sub:'herbs', title:'Prairie Poppy', body:'Great Plains region of West Elizabeth only, mostly near the train tracks.', trackable:true },
  { id:269, cat:'compendium', sub:'herbs', title:'English Mace', body:'Two spots: east of O\'Creagh\'s Run and northwest of Martha\'s Swain (available after Chapter 2), or the river banks of Rio Bravo in New Austin (Epilogue only). Yellow flowers.', trackable:true },
  { id:270, cat:'compendium', sub:'herbs', title:'Evergreen Huckleberry', body:'Along the length of the Kamassa River, through Lemoyne and New Hanover. Shrubs with sharp leaves.', trackable:true },
  { id:271, cat:'compendium', sub:'herbs', title:'⚠ Desert Sage — New Austin only', body:'Only found in the western areas of Gaptooth Ridge, New Austin — same Epilogue-lock situation as the Cougar, Pronghorn, and Gila Monster.', trackable:true },
  { id:272, cat:'compendium', sub:'herbs', title:'⚠ Red Sage — New Austin only', body:'Only found near Rio Bravo, New Austin — another one that\'s effectively John-only in a normal playthrough.', trackable:true },
  { id:273, cat:'compendium', sub:'herbs', title:'⚠ Orchids — separate 11-species batch still to come', body:'The 43rd plant category is Orchids — 11 species tied to a specific collectible chain with precise single spawn points each. Everything else in the plant list is now done. Worth its own dedicated pass rather than folding in here.', trackable:false },
  { id:274, cat:'compendium', sub:'herbs', title:'Blackcurrant', body:'Well-lit areas away from water in Gaptooth Ridge and Cholla Springs — New Austin only, so this is another Epilogue-tied one. Look for bushes carrying dark berries.', trackable:true },
  { id:275, cat:'compendium', sub:'herbs', title:'Common Bulrush', body:'Basically everywhere near streams and lakes — no special trip needed.', trackable:true },
  { id:276, cat:'compendium', sub:'herbs', title:'⚠ Vanilla Flower — Bluewater Marsh', body:'River banks of Bayou Nwa / Bluewater Marsh — grows on tree bark, spotted by its vanilla-colored blossoms.', trackable:true },
  { id:277, cat:'compendium', sub:'herbs', title:'Violet Snowdrop', body:'Northern Ambarino only — look near the edges of the snowy areas rather than deep in the snow itself. Small violet ground-hugging blossoms. A reliable patch: east of Brandywine Drop, in the grassy area with a large boulder and fallen tree trunk.', trackable:true },
  { id:278, cat:'compendium', sub:'herbs', title:'⚠ Wild Feverfew — New Austin only', body:'Only found in Cholla Springs, New Austin — another one only collectible in the Epilogue as John.', trackable:true },
  { id:279, cat:'compendium', sub:'herbs', title:'Bay Bolete', body:'Tall Trees (West Elizabeth) and Caliban\'s Seat (New Hanover), near the river — moist, shaded ground. Orange-brown cap.', trackable:true },
  { id:280, cat:'compendium', sub:'herbs', title:'Chanterelles', body:'Grassy areas and woodlands of Lemoyne, and the eastern part of New Hanover. Yellow dome-shaped fungi.', trackable:true },
  { id:281, cat:'compendium', sub:'herbs', title:'Ram\'s Head', body:'Woodlands of West Elizabeth and Ambarino.', trackable:true },
  { id:290, cat:'compendium', sub:'orchids', title:'About the orchids', body:'All 13 orchids are tied to one side-mission chain: "Duchesses and Other Animals," given by Algernon Wasp, unlocked in Chapter 4 after the main mission "The Gilded Cage." He\'s in a greenhouse north of Saint Denis. He asks for them in 5 batches alongside bird plumes and gator eggs — the game won\'t let you pick more than needed until each stage is active, so don\'t worry about "wasting" extra finds.', trackable:false },
  { id:291, cat:'compendium', sub:'orchids', title:'Lady of the Night Orchid (need 15)', body:'Bayou Nwa, on the western side near the shoreline. Grows on trees.', trackable:true },
  { id:292, cat:'compendium', sub:'orchids', title:'Lady Slipper Orchid (need 7)', body:'Western West Elizabeth — north of Lake Owanjila, and east of Aurora Basin (west of Blackwater). Grows on the ground.', trackable:true },
  { id:293, cat:'compendium', sub:'orchids', title:'Moccasin Orchid (need 10)', body:'West of Van Horn Trading Post, around Butcher Creek, on the stream below Elysian Pool.', trackable:true },
  { id:294, cat:'compendium', sub:'orchids', title:'Acuna\'s Star Orchid (need 3)', body:'East of Lakay, mostly on the islands toward the ocean, in the same general Bayou Nwa area as the exotic bird plumes. Grows on trees.', trackable:true },
  { id:295, cat:'compendium', sub:'orchids', title:'Cigar Orchid (need 7)', body:'South of Lakay extending north near the shoreline, in the Bluewater Marsh area of Bayou Nwa. Grows on trees close to the road.', trackable:true },
  { id:296, cat:'compendium', sub:'orchids', title:'Ghost Orchid (need 5)', body:'Marshes east of Shady Belle, especially the southern half of Crawdad Willies.', trackable:true },
  { id:297, cat:'compendium', sub:'orchids', title:'Night Scented Orchid (need 5)', body:'South of Braithwaite Manor. Light green color. Only about 10 fixed spawn spots exist on the whole map, so don\'t expect to stumble onto these randomly.', trackable:true },
  { id:298, cat:'compendium', sub:'orchids', title:'Rat Tail Orchid (need 10)', body:'All around Lagras lake. Yellow color, grows on trees.', trackable:true },
  { id:299, cat:'compendium', sub:'orchids', title:'Spider Orchid (need 5)', body:'Western Bayou Nwa. Gold color, grows on trees.', trackable:true },
  { id:300, cat:'compendium', sub:'orchids', title:'Clamshell Orchid (need 5)', body:'East of Caliga Hall — also described as running down the shoreline from Shady Belle. Grows on tree trunks in swampland.', trackable:true },
  { id:301, cat:'compendium', sub:'orchids', title:'Dragon\'s Mouth Orchid (need 5)', body:'Grizzlies East, north of Emerald Ranch. Probably the rarest of the 13 — grows on the ground as well as trees.', trackable:true },
  { id:302, cat:'compendium', sub:'orchids', title:'Queen\'s Orchid (need 5)', body:'Near the shores of Lagras.', trackable:true },
  { id:303, cat:'compendium', sub:'orchids', title:'Sparrow\'s Egg Orchid (need 10)', body:'North of Roanoke Ridge, west of Annesburg. Grows on the ground at fixed spots — easy to spot once you\'re in the right area.', trackable:true },
  { id:700, cat:'challenges', sub:'bandit', title:'Bandit 1', body:'Hold up 5 townsfolk.', trackable:true },
  { id:701, cat:'challenges', sub:'bandit', title:'Bandit 2', body:'Rob any 2 coaches, or return 2 stolen coaches to the Fence.', trackable:true },
  { id:702, cat:'challenges', sub:'bandit', title:'Bandit 3', body:'Rob the cash register in 4 different shops in one day.', trackable:true },
  { id:703, cat:'challenges', sub:'bandit', title:'Bandit 4', body:'Rob 3 coaches, or return 3 stolen coaches to the Fence, in a single day.', trackable:true },
  { id:704, cat:'challenges', sub:'bandit', title:'Bandit 5', body:'Amass a $250 bounty in one state.', trackable:true },
  { id:705, cat:'challenges', sub:'bandit', title:'Bandit 6', body:'Steal 5 horses and sell them to the Horse Fence at Clemens Cove. Note: the Horse Fence isn\'t available until Chapter 3, so this one can\'t be finished before then.', trackable:true },
  { id:706, cat:'challenges', sub:'bandit', title:'Bandit 7', body:'Rob $50 worth of cash and valuables from townsfolk and travelers.', trackable:true },
  { id:707, cat:'challenges', sub:'bandit', title:'Bandit 8', body:'Steal 7 wagons and sell them to the Fence at Emerald Ranch.', trackable:true },
  { id:708, cat:'challenges', sub:'bandit', title:'Bandit 9', body:'Hogtie someone and leave them on the railroad tracks 3 times.', trackable:true },
  { id:709, cat:'challenges', sub:'bandit', title:'Bandit 10', body:'Complete 5 train robberies without dying or being caught. Easy trick: at a busy station like Flatneck, find an open flatbed cart with a chest on it — opening the chest counts as a "robbery" and rarely triggers a wanted level, so you can repeat it train after train.', trackable:true },
  { id:710, cat:'challenges', sub:'explorer', title:'Explorer 1', body:'Find a Treasure Map.', trackable:true },
  { id:711, cat:'challenges', sub:'explorer', title:'Explorer 2', body:'Find a Treasure.', trackable:true },
  { id:712, cat:'challenges', sub:'explorer', title:'Explorer 3', body:'Find a Treasure.', trackable:true },
  { id:713, cat:'challenges', sub:'explorer', title:'Explorer 4', body:'Find a Treasure.', trackable:true },
  { id:714, cat:'challenges', sub:'explorer', title:'Explorer 5', body:'Find a Treasure.', trackable:true },
  { id:715, cat:'challenges', sub:'explorer', title:'Explorer 6', body:'Find a Treasure.', trackable:true },
  { id:716, cat:'challenges', sub:'explorer', title:'Explorer 7', body:'Find a Treasure.', trackable:true },
  { id:717, cat:'challenges', sub:'explorer', title:'Explorer 8', body:'Find a Treasure.', trackable:true },
  { id:718, cat:'challenges', sub:'explorer', title:'Explorer 9', body:'Find a Treasure.', trackable:true },
  { id:719, cat:'challenges', sub:'explorer', title:'Explorer 10', body:'Find a Treasure. All 10 tiers together add up to needing 3 full treasure map chains completed, not just random landmark digging — worth pairing with dedicated treasure map research.', trackable:true },
  { id:720, cat:'challenges', sub:'gambler', title:'Gambler 1', body:'Win 5 hands of poker.', trackable:true },
  { id:721, cat:'challenges', sub:'gambler', title:'Gambler 2', body:'In Blackjack, double down and win the hand, 5 times. Best odds when you start with a high card or a face card.', trackable:true },
  { id:722, cat:'challenges', sub:'gambler', title:'Gambler 3', body:'Win 3 games of Five Finger Fillet. The first-round opponent at any location is the easiest — you only have to track 2 buttons.', trackable:true },
  { id:723, cat:'challenges', sub:'gambler', title:'Gambler 4', body:'Bust one poker opponent out (be the one who sends them home after they go all-in) at each of 3 locations: Flatneck Station, Saint Denis, and Valentine.', trackable:true },
  { id:724, cat:'challenges', sub:'gambler', title:'Gambler 5', body:'Win 3 rounds of dominoes without drawing any tiles, against 2 or fewer opponents. Mostly luck — look for a table with only 2-3 players.', trackable:true },
  { id:725, cat:'challenges', sub:'gambler', title:'Gambler 6', body:'Beat the Blackjack dealer at 2 locations: Rhodes and Van Horn.', trackable:true },
  { id:726, cat:'challenges', sub:'gambler', title:'Gambler 7', body:'Beat the Five Finger Fillet player at 3 locations: Strawberry, Valentine, and Van Horn.', trackable:true },
  { id:727, cat:'challenges', sub:'gambler', title:'Gambler 8', body:'Win 3 hands of Blackjack with 3 hits or more each. Widely considered the single worst challenge in the game — heavily luck-based (you need a strong hand built from 4+ cards that still beats the dealer). No reliable trick, just persistence.', trackable:true },
  { id:728, cat:'challenges', sub:'gambler', title:'Gambler 9', body:'Win 3 games of dominoes in a row. Tip: if you\'re about to lose a round, you can leave the table and buy back in — this ends the game early instead of registering a loss, protecting your streak. One clean trick: rent a room in Rhodes, sleep to morning, then save and reload to reset the saloon with no one else seated, so you can play alone.', trackable:true },
  { id:729, cat:'challenges', sub:'gambler', title:'Gambler 10', body:'Win 3 hands of Poker in a row. Going all-in early tends to make the AI fold more often than not — reload your save if it doesn\'t work and try again.', trackable:true },
  { id:730, cat:'challenges', sub:'herbalist', title:'Herbalist 1', body:'Pick 6 Yarrow.', trackable:true },
  { id:731, cat:'challenges', sub:'herbalist', title:'Herbalist 2', body:'Pick and eat 4 different species of berry.', trackable:true },
  { id:732, cat:'challenges', sub:'herbalist', title:'Herbalist 3', body:'Craft 7 items using Sage as an ingredient.', trackable:true },
  { id:733, cat:'challenges', sub:'herbalist', title:'Herbalist 4', body:'Pick 5 mushrooms and feed them to your horse.', trackable:true },
  { id:734, cat:'challenges', sub:'herbalist', title:'Herbalist 5', body:'Craft 9 items using Indian Tobacco as an ingredient.', trackable:true },
  { id:735, cat:'challenges', sub:'herbalist', title:'Herbalist 6', body:'Pick 15 different species of herb.', trackable:true },
  { id:736, cat:'challenges', sub:'herbalist', title:'Herbalist 7', body:'Craft and use 5 Special Miracle Tonics.', trackable:true },
  { id:737, cat:'challenges', sub:'herbalist', title:'Herbalist 8', body:'Use Oleander Sage to craft 6 poison weapons.', trackable:true },
  { id:738, cat:'challenges', sub:'herbalist', title:'⚠ Herbalist 9 — can\'t be done as Arthur', body:'Pick one of each species of herb in the game. This is the tier that can\'t be finished before the Epilogue — several plants (Desert Sage, Red Sage, Wild Feverfew, Blackcurrant, all confirmed in the Compendium) only grow in New Austin, which doesn\'t open until you\'re playing as John.', trackable:true },
  { id:739, cat:'challenges', sub:'herbalist', title:'Herbalist 10', body:'Season and cook all 11 types of meat in the game.', trackable:true },
  { id:740, cat:'challenges', sub:'horseman', title:'Horseman 1', body:'Kill 5 rabbits from horseback. Rabbits are common south of Valentine and around Flatneck Station — ride into them.', trackable:true },
  { id:741, cat:'challenges', sub:'horseman', title:'Horseman 2', body:'Jump over 3 obstacles in 15 seconds — any fences or small rocks work.', trackable:true },
  { id:742, cat:'challenges', sub:'horseman', title:'Horseman 3', body:'Ride from Valentine to Rhodes in under 5 minutes. Horse stimulants (bought at Stables) refresh stamina instantly and make this easy.', trackable:true },
  { id:743, cat:'challenges', sub:'horseman', title:'Horseman 4', body:'While mounted, drag someone with your lasso for 3,300 feet (about 1,000 meters). Any random person works, and they\'re allowed to die along the way.', trackable:true },
  { id:744, cat:'challenges', sub:'horseman', title:'Horseman 5', body:'Trample 5 animals while on horseback. Pheasants are slow and easy targets — found especially south of Rhodes.', trackable:true },
  { id:745, cat:'challenges', sub:'horseman', title:'Horseman 6', body:'Ride from Strawberry to Saint Denis in under 9 minutes without touching any water — including puddles. Follow the train tracks and cross the bridge southeast of Saint Denis; bring horse stimulants.', trackable:true },
  { id:746, cat:'challenges', sub:'horseman', title:'Horseman 7', body:'Kill 7 enemies from horseback without dismounting. Riding into a town and shooting until lawmen arrive works — lawmen count, unarmed civilians don\'t.', trackable:true },
  { id:747, cat:'challenges', sub:'horseman', title:'Horseman 8', body:'Kill 9 predators from horseback. Alligators in the swamps southeast of Rhodes (near Shady Belle) are a reliable, dense source.', trackable:true },
  { id:748, cat:'challenges', sub:'horseman', title:'⚠ Horseman 9 — needs the Epilogue', body:'Ride from Van Horn to Blackwater in under 17 minutes without touching water. This can\'t be done before the Epilogue — Blackwater is hostile to Arthur earlier in the story, so this tier genuinely requires playing as John. Route: cross the bridge southwest of Van Horn, then the one at Flatneck Station, then the small wooden bridge at Owanjila Dam into the Blackwater region.', trackable:true },
  { id:749, cat:'challenges', sub:'horseman', title:'Horseman 10', body:'Break one of every wild horse breed. Despite how it reads, the White Arabian is NOT required — the game shows exactly which breeds you still need if you check the challenge from the pause menu.', trackable:true },
  { id:750, cat:'challenges', sub:'master-hunter', title:'Master Hunter 1', body:'Skin 3 deer.', trackable:true },
  { id:751, cat:'challenges', sub:'master-hunter', title:'Master Hunter 2', body:'Collect 3 perfect-quality rabbit pelts.', trackable:true },
  { id:752, cat:'challenges', sub:'master-hunter', title:'Master Hunter 3', body:'Track 10 different animal species using your binoculars.', trackable:true },
  { id:753, cat:'challenges', sub:'master-hunter', title:'Master Hunter 4', body:'Call an animal in and get a clean kill, 5 times.', trackable:true },
  { id:754, cat:'challenges', sub:'master-hunter', title:'Master Hunter 5', body:'Skin 3 Black Bears or Grizzly Bears.', trackable:true },
  { id:755, cat:'challenges', sub:'master-hunter', title:'Master Hunter 6', body:'Kill 5 Cougars with your bow, then skin them.', trackable:true },
  { id:756, cat:'challenges', sub:'master-hunter', title:'Master Hunter 7', body:'Use bait to lure and kill both a herbivore and a predator.', trackable:true },
  { id:757, cat:'challenges', sub:'master-hunter', title:'Master Hunter 8', body:'Catch 3 fish without using a fishing rod — fish washed up on riverbanks or caves can simply be picked up, or chased into shallow water.', trackable:true },
  { id:758, cat:'challenges', sub:'master-hunter', title:'Master Hunter 9', body:'Catch an opossum while it\'s playing possum. Chase it until it drops and plays dead, then shoot or grab it immediately.', trackable:true },
  { id:759, cat:'challenges', sub:'master-hunter', title:'Master Hunter 10', body:'Find and kill the Legendary Panther, "Giaguaro." As noted in the Compendium, this animal won\'t even spawn until this tier is active in the first place — it\'s the reward tier, not a prerequisite.', trackable:true },
  { id:760, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 1', body:'Kill 3 flying birds.', trackable:true },
  { id:761, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 2', body:'Kill 2 different species of animal in the same Dead Eye use.', trackable:true },
  { id:762, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 3', body:'Kill 5 flying birds while on a moving train.', trackable:true },
  { id:763, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 4', body:'Kill someone from 80 feet away with a tomahawk.', trackable:true },
  { id:764, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 5', body:'Kill 6 animals without switching or reloading your weapon.', trackable:true },
  { id:765, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 6', body:'Kill someone at least 660 feet away with a long scoped rifle. Needs an actual long scope attached — the mount length matters for this one to register.', trackable:true },
  { id:766, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 7', body:'Get 7 headshots in a row.', trackable:true },
  { id:767, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 8', body:'Disarm 3 enemies without reloading or switching your weapon.', trackable:true },
  { id:768, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 9', body:'Shoot 3 people\'s hats off in the same Dead Eye use.', trackable:true },
  { id:769, cat:'challenges', sub:'sharpshooter', title:'Sharpshooter 10', body:'Kill 3 flying birds with 3 consecutive long scoped rifle shots. Same long-scope requirement as tier 6.', trackable:true },
  { id:770, cat:'challenges', sub:'survivalist', title:'Survivalist 1', body:'Catch 3 Bluegill.', trackable:true },
  { id:771, cat:'challenges', sub:'survivalist', title:'Survivalist 2', body:'Hand in 5 animals to camp or a trapper.', trackable:true },
  { id:772, cat:'challenges', sub:'survivalist', title:'Survivalist 3', body:'Kill 5 animals with a Varmint Rifle.', trackable:true },
  { id:773, cat:'challenges', sub:'survivalist', title:'Survivalist 4', body:'Craft a Dynamite Arrow, Fire Arrow, Improved Arrow, Poison Arrow, and Small Game Arrow — one of each.', trackable:true },
  { id:774, cat:'challenges', sub:'survivalist', title:'Survivalist 5', body:'Catch a fish in the Bayou from a riverboat, and separately while standing on train tracks.', trackable:true },
  { id:775, cat:'challenges', sub:'survivalist', title:'Survivalist 6', body:'Kill a scavenging animal while it feeds on a corpse, 5 times. Predator bait works too — the bait itself counts as "a corpse" being fed on.', trackable:true },
  { id:776, cat:'challenges', sub:'survivalist', title:'Survivalist 7', body:'Kill 8 small game animals with consecutive shots using Small Game Arrows.', trackable:true },
  { id:777, cat:'challenges', sub:'survivalist', title:'Survivalist 8', body:'Craft a Homing Tomahawk, Improved Tomahawk, Volatile Dynamite, and Volatile Fire Bottle.', trackable:true },
  { id:778, cat:'challenges', sub:'survivalist', title:'Survivalist 9', body:'Catch a fish weighing at least 19 lbs. Genuinely hard to land naturally — try fishing near where the Legendary Moose spawns (large Muskies show up in that same water), or check Longnose Gar near the back of Shady Belle or the outskirts of Saint Denis.', trackable:true },
  { id:779, cat:'challenges', sub:'survivalist', title:'Survivalist 10', body:'Catch one of every type of fish in the game — pairs directly with the Regular Fish and Legendary Fish sections of the Compendium.', trackable:true },
  { id:780, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 1', body:'Kill 3 enemies with a knife.', trackable:true },
  { id:781, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 2', body:'Kill 3 enemies in 10 seconds using only throwing knives. Easy spot: Valentine, throw knives at people seated around the poker table.', trackable:true },
  { id:782, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 3', body:'Kill 3 birds of prey using only a tomahawk.', trackable:true },
  { id:783, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 4', body:'Kill 10 enemies with a shotgun using crafted ammunition.', trackable:true },
  { id:784, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 5', body:'Kill 5 mounted enemies, using exactly 1 throwing knife per kill.', trackable:true },
  { id:785, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 6', body:'Kill 4 enemies at the same time with a single stick of dynamite.', trackable:true },
  { id:786, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 7', body:'Kill 4 consecutive enemies by throwing and retrieving the same tomahawk.', trackable:true },
  { id:787, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 8', body:'Kill 15 enemies using a long-barreled shotgun.', trackable:true },
  { id:788, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 9', body:'Kill 9 unaware enemies from behind, using the bow.', trackable:true },
  { id:789, cat:'challenges', sub:'weapons-expert', title:'Weapons Expert 10', body:'Kill a Grizzly Bear without taking any damage, using only throwing knives. The hardest single tier in the whole challenge list for a lot of players — bring plenty of knives and be ready to retry.', trackable:true },
  { id:500, cat:'gold-medals', sub:'general', title:'How the medal system works', body:'There are 104 Gold Medals total across all story missions (one per mission). You do NOT need all of them — only 70 are required for the "Gold Rush" trophy/achievement, so Molly can skip whichever ones sound most annoying. Medals are Bronze (under half the optional objectives), Silver (half or more), or Gold (all of them) — and all requirements must be met in a single playthrough of that attempt, no reloading checkpoints mid-mission.', trackable:false },
  { id:501, cat:'gold-medals', sub:'general', title:'The single best tip: replay missions', body:'Any completed story mission can be replayed anytime from Pause Menu > Progress > Story > pick the mission > Replay Mission. The smart approach: play each mission normally first to see what its gold requirements actually are, then replay it once you know what\'s needed — much easier than trying to guess blind on a first attempt. One catch: replays used to strip your tonics and limit your weapon selection, but a patch changed this so replays now give you gear appropriate to that point in the story, making it far less punishing than it used to be.', trackable:false },
  { id:502, cat:'gold-medals', sub:'chapter-1', title:'Outlaws from the West (Mission 1)', body:'Gold requires: take no damage during the shootout at the cabin, loot 6+ items from the house, and hit at least 80% accuracy. All three are doable in one pass — clear the 6 enemies carefully from cover (there are 4 on the ground, one in a second-story window, one in the outhouse), then loot cupboards, nightstands, drawers, and the loft before leaving.', trackable:true },
  { id:503, cat:'gold-medals', sub:'chapter-1', title:'Enter, Pursued By a Memory (Mission 2)', body:'Gold requires: kill all the wolves without taking damage, and hit at least 80% accuracy. Trade your pistol for the shotgun before the wolf fight, use it to attract and drop them, and back up onto rocks if they get too close instead of trading hits.', trackable:true },
  { id:509, cat:'gold-medals', sub:'epilogue', title:'All 104 gold medals are now covered', body:'The entire game — all 6 chapters and both Epilogue parts — is fully covered here. 104 of 104 gold medal requirements are documented with real objectives.', trackable:false },
  { id:600, cat:'gold-medals', sub:'epilogue', title:'The Wheel (Epilogue 1)', body:'Gold requires: reach Pronghorn Ranch without dropping any supplies, and reclaim the wagon within 1 minute.', trackable:true },
  { id:601, cat:'gold-medals', sub:'epilogue', title:'Simple Pleasures (Epilogue 1)', body:'Gold requires: fill a bucket within 10 seconds while milking, and finish within 5:15.', trackable:true },
  { id:602, cat:'gold-medals', sub:'epilogue', title:'Farming, for Beginners (Epilogue 1)', body:'Gold requires: fix the first section of fence in 1:30, and avoid getting hit by the bull.', trackable:true },
  { id:603, cat:'gold-medals', sub:'epilogue', title:'Fatherhood, for Beginners (Epilogue 1)', body:'Gold requires: tire out Jeremiah within 45 seconds, feed him a treat, teach Jack to ride without getting bucked off, and win the race back to Pronghorn Ranch.', trackable:true },
  { id:604, cat:'gold-medals', sub:'epilogue', title:'Old Habits (Epilogue 1)', body:'Gold requires: defeat the Laramie without taking a hit, and finish the fight within 25 seconds.', trackable:true },
  { id:605, cat:'gold-medals', sub:'epilogue', title:'Jim Milton Rides, Again (Epilogue 1)', body:'Gold requires: get 10 kills while dual wielding sidearms, get 15 headshots, and use no health items.', trackable:true },
  { id:606, cat:'gold-medals', sub:'epilogue', title:'Fatherhood, for Idiots (Epilogue 1)', body:'Gold requires: kill all 3 enemies in Dead Eye, and return to Pronghorn Ranch within 1:30 after the confrontation.', trackable:true },
  { id:607, cat:'gold-medals', sub:'epilogue', title:'Motherhood (Epilogue 1)', body:'Gold requires: finish within 1:30.', trackable:true },
  { id:608, cat:'gold-medals', sub:'epilogue', title:'Home of the Gentry (Epilogue 1)', body:'Gold requires: finish within 2:30.', trackable:true },
  { id:609, cat:'gold-medals', sub:'epilogue', title:'Gainful Employment (Epilogue 1)', body:'Gold requires: locate the bounty within 30 seconds of arriving in Strawberry, then catch and hogtie them within 1:15 of mounting your horse. Epilogue Part 1 is fully covered — 10 of 10.', trackable:true },
  { id:610, cat:'gold-medals', sub:'epilogue', title:'Bare Knuckle Friendships (Epilogue 2)', body:'Gold requires: find Charles within 1:50 of arriving in Saint Denis, and kill all of Guido Martelli\'s men within 10 seconds.', trackable:true },
  { id:611, cat:'gold-medals', sub:'epilogue', title:'Home Improvement for Beginners (Epilogue 2)', body:'Gold requires: finish within 18 seconds — the shortest time limit in the whole game.', trackable:true },
  { id:612, cat:'gold-medals', sub:'epilogue', title:'An Honest Day\'s Labors (Epilogue 2)', body:'Gold requires: kill all of Langton\'s men during the horseback escape, escape with Shane Finley within 5 minutes of choosing your approach, hit 70% accuracy, and use no health items.', trackable:true },
  { id:613, cat:'gold-medals', sub:'epilogue', title:'The Tool Box (Epilogue 2)', body:'Gold requires: headshot every Skinner Brother hiding up in the trees, find Mr. Wayne within 2:15, use only sidearms, and use no health items.', trackable:true },
  { id:614, cat:'gold-medals', sub:'epilogue', title:'A New Jerusalem (Epilogue 2)', body:'Gold requires: hammer the nails with 80% accuracy, and finish within 3:35.', trackable:true },
  { id:615, cat:'gold-medals', sub:'epilogue', title:'A Quick Favor for an Old Friend (Epilogue 2)', body:'Gold requires: force Cortez\'s men to flee Rhodes within 30 seconds, get 5 headshots covering Sadie with a long scoped rifle, get 4 hip-fire kills, and use no health items.', trackable:true },
  { id:616, cat:'gold-medals', sub:'epilogue', title:'Uncle\'s Bad Day (Epilogue 2)', body:'Gold requires: get 5 headshots using the bow, return to Beecher\'s Hope within 3:10 after freeing Uncle, hit 80% accuracy, and use no health items.', trackable:true },
  { id:617, cat:'gold-medals', sub:'epilogue', title:'A Really Big Bastard (Epilogue 2)', body:'Gold requires: shoot the bear 4 times as it charges, headshot both rival bounty hunters in Dead Eye, and finish within 7:15.', trackable:true },
  { id:618, cat:'gold-medals', sub:'epilogue', title:'Trying Again (Epilogue 2)', body:'Gold requires: catch a fish, and finish within 5:20.', trackable:true },
  { id:619, cat:'gold-medals', sub:'epilogue', title:'A New Future Imagined (Epilogue 2)', body:'Gold requires: finish within 7:30.', trackable:true },
  { id:620, cat:'gold-medals', sub:'epilogue', title:'American Venom (Epilogue 2)', body:'Gold requires: help Sadie catch Cleet within 35 seconds, headshot the sniper who shoots Charles, hit 85% accuracy, and use no health items. This is the very last mission in the game — Epilogue Part 2, and all 104 gold medals, are now fully covered.', trackable:true },
  { id:580, cat:'gold-medals', sub:'chapter-6', title:'Icarus and Friends', body:'Gold requires: keep the balloon at the correct altitude for the whole trip, get 5 headshots from the balloon, hit 70% accuracy, and use no health items.', trackable:true },
  { id:581, cat:'gold-medals', sub:'chapter-6', title:'Do Not Seek Absolution – I', body:'Gold requires: finish within 1:20.', trackable:true },
  { id:582, cat:'gold-medals', sub:'chapter-6', title:'Visiting Hours', body:'Gold requires: headshot both prison guards while sniping from the tower, escape to the boat within 2:45, finish within 9 minutes, hit 80% accuracy, and use no health items.', trackable:true },
  { id:583, cat:'gold-medals', sub:'chapter-6', title:'Do Not Seek Absolution – II', body:'Gold requires: find Edith Downes within 1:10.', trackable:true },
  { id:584, cat:'gold-medals', sub:'chapter-6', title:'Just a Social Call', body:'Gold requires: headshot 3 mounted enemies, reach the horses within 2:45 after killing Cornwall, and use no health items.', trackable:true },
  { id:585, cat:'gold-medals', sub:'chapter-6', title:'A Rage Unleashed', body:'Gold requires: knock out 2 soldiers on the boat, then round up the horses and reach shore within 1:30.', trackable:true },
  { id:586, cat:'gold-medals', sub:'chapter-6', title:'The Delights of Van Horn', body:'Gold requires: headshot 5 soldiers with a long scoped rifle, and hit 85% accuracy.', trackable:true },
  { id:587, cat:'gold-medals', sub:'chapter-6', title:'Goodbye, Dear Friend', body:'Gold requires: find Colm\'s backup within 45 seconds, get 5 headshots with a long scoped rifle, and finish within 6:30.', trackable:true },
  { id:588, cat:'gold-medals', sub:'chapter-6', title:'The Course of True Love – V', body:'Gold requires: headshot 5 of the Braithwaites as they pursue the train, and finish within 7:30.', trackable:true },
  { id:589, cat:'gold-medals', sub:'chapter-6', title:'The Bridge to Nowhere', body:'Gold requires: plant the dynamite within 1:35, and escape the oncoming train within 19 seconds.', trackable:true },
  { id:590, cat:'gold-medals', sub:'chapter-6', title:'Archeology for Beginners', body:'Gold requires: recover the relics without being detected, and do it within 1:30.', trackable:true },
  { id:591, cat:'gold-medals', sub:'chapter-6', title:'Honor, Amongst Thieves', body:'Gold requires: recover the vaccine without being detected, and finish within 5 minutes.', trackable:true },
  { id:592, cat:'gold-medals', sub:'chapter-6', title:'Favored Sons', body:'Gold requires: kill the soldier on the cannon within 45 seconds, get 35 headshots, and use no health items.', trackable:true },
  { id:593, cat:'gold-medals', sub:'chapter-6', title:'Mrs. Sadie Adler, Widow – II', body:'Gold requires: headshot the sniper in the barn, secure the barn without taking any damage, and finish within 5:30.', trackable:true },
  { id:594, cat:'gold-medals', sub:'chapter-6', title:'The Fine Art of Conversation', body:'Gold requires: kill a pursuer\'s horse during the escape, finish within 9:30, hit 75% accuracy, and use no health items.', trackable:true },
  { id:595, cat:'gold-medals', sub:'chapter-6', title:'The King\'s Son', body:'Gold requires: while infiltrating Fort Wallace, headshot every soldier blocking your path to Eagle Flies, kill 15 enemies during the canoe escape, and hit 80% accuracy.', trackable:true },
  { id:596, cat:'gold-medals', sub:'chapter-6', title:'My Last Boy', body:'Gold requires: save Paytah, get 30 headshots, hit 80% accuracy, and use no health items.', trackable:true },
  { id:597, cat:'gold-medals', sub:'chapter-6', title:'Our Best Selves', body:'Gold requires: get a headshot in Dead Eye right after jumping off Dutch\'s horse, finish within 11 minutes, fight through the train at 80% accuracy, and use no health items.', trackable:true },
  { id:598, cat:'gold-medals', sub:'chapter-6', title:'Red Dead Redemption', body:'Gold requires: get 7 headshots while covering Sadie from the lighthouse, reach Abigail and Sadie within 1 minute after Sadie is captured, hit 70% accuracy, and use no health items. Chapter 6 — and the whole main story — is now fully covered, 19 of 19.', trackable:true },
  { id:505, cat:'gold-medals', sub:'chapter-1', title:'The Aftermath of Genesis (Mission 3)', body:'Gold requires: kill each deer with one arrow, don\'t spook either deer, and get a clean kill on the second deer. Only go for a deer that\'s alone — a quick, quiet bow shot is the key. Eagle Eye afterward reveals two more tracks (one crossing the river to the left, one to the right) leading to a pair of deer.', trackable:true },
  { id:506, cat:'gold-medals', sub:'chapter-1', title:'Old Friends (Mission 4)', body:'Gold requires: catch and hogtie Kieran within 45 seconds, kill 3 O\'Driscolls in the same Dead Eye use, finish within 15 minutes 30 seconds, get 15 headshots, and complete without using any health items. A demanding one — don\'t be afraid to come back to it once you\'re more comfortable with Dead Eye and gunplay rather than trying it blind.', trackable:true },
  { id:507, cat:'gold-medals', sub:'chapter-1', title:'Who the Hell is Leviticus Cornwall? (Mission 5)', body:'Gold requires: save Lenny when he\'s hanging from the train, clear the guards within 1 minute 30 seconds of stopping the train, take no damage during the shootout, get 10 headshots, and use no health items. When Lenny\'s in trouble, get to him fast and mash the pull button to haul him up — that part alone can end the run if you\'re slow.', trackable:true },
  { id:508, cat:'gold-medals', sub:'chapter-1', title:'Eastward Bound (Mission 6)', body:'Gold requires: pick up Javier when you enter Horseshoe Overlook, and finish within 6 minutes. The easiest of the six — mainly a matter of not dawdling.', trackable:true },
  { id:510, cat:'gold-medals', sub:'chapter-2', title:'Polite Society, Valentine Style', body:'Gold requires: return the lost wagon horse to its owner, and find Karen within 45 seconds.', trackable:true },
  { id:511, cat:'gold-medals', sub:'chapter-2', title:'Americans at Rest', body:'Gold requires: save Javier within 15 seconds, and beat Tommy within 1 minute 30 seconds.', trackable:true },
  { id:512, cat:'gold-medals', sub:'chapter-2', title:'Good, Honest, Snake Oil', body:'Gold requires: stop Benedict Allbright from falling off the cliff, hogtie him within 1:15, and get him back to the sheriff within 1:30.', trackable:true },
  { id:513, cat:'gold-medals', sub:'chapter-2', title:'Who is Not Without Sin', body:'Gold requires: win 2 hands of poker, and return the Reverend to camp within 2 minutes 5 seconds.', trackable:true },
  { id:514, cat:'gold-medals', sub:'chapter-2', title:'Exit Pursued by a Bruised Ego', body:'Gold requires: track the bear within 1:30, hit it at least 6 times, and finish within 12 minutes.', trackable:true },
  { id:515, cat:'gold-medals', sub:'chapter-2', title:'Paying a Social Call', body:'Gold requires: silently kill 4 O\'Driscolls, get 12 headshots, hit 80% accuracy, and use no health items.', trackable:true },
  { id:516, cat:'gold-medals', sub:'chapter-2', title:'The First Shall Be Last', body:'Gold requires: silently kill the bounty hunters by the river with Javier, shoot the rope to free Sean, get 10 headshots, and use no health items.', trackable:true },
  { id:517, cat:'gold-medals', sub:'chapter-2', title:'A Quiet Time', body:'Gold requires: try to make amends with an old rival, catch Lenny in the act, and avoid getting arrested.', trackable:true },
