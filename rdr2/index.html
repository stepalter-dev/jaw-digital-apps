  { id:518, cat:'gold-medals', sub:'chapter-2', title:'The Spines of America', body:'Gold requires: loot everything at Carmody Dell, don\'t get spotted, and deliver the wagon to Emerald Ranch within 1:10. The timing is the hard part here.', trackable:true },
  { id:519, cat:'gold-medals', sub:'chapter-2', title:'Blessed are the Meek?', body:'Gold requires: kill all the mounted lawmen while escaping within 55 seconds, get 15 headshots, hit 70% accuracy, and use no health items.', trackable:true },
  { id:520, cat:'gold-medals', sub:'chapter-2', title:'Money Lending and Other Sins – III', body:'Gold requires: finish within 2 minutes 10 seconds.', trackable:true },
  { id:521, cat:'gold-medals', sub:'chapter-2', title:'We Loved Once and True – III', body:'Gold requires: peacefully convince the Chelonians to let you take Jamie, and get Jamie back to Mary within 2 minutes.', trackable:true },
  { id:522, cat:'gold-medals', sub:'chapter-2', title:'Pouring Forth Oil – II', body:'Gold requires: deliver the wagon to the drop-off within 1:45.', trackable:true },
  { id:523, cat:'gold-medals', sub:'chapter-2', title:'A Fisher of Men', body:'Gold requires: once you reach the river, catch a fish within 1:30, and finish the whole mission within 7:20.', trackable:true },
  { id:524, cat:'gold-medals', sub:'chapter-2', title:'Pouring Forth Oil – IV', body:'Gold requires: kill all the train guards before Sean fires a shot, clear the baggage car of loot, escape the law within 1:30, land 10 Dead Eye kills, and use no health items.', trackable:true },
  { id:525, cat:'gold-medals', sub:'chapter-2', title:'An American Pastoral Scene', body:'Gold requires: headshot every mounted guard protecting the wagon, land 10 Dead Eye kills, finish within 6 minutes, and use no health items.', trackable:true },
  { id:526, cat:'gold-medals', sub:'chapter-2', title:'The Sheep and the Goats', body:'Gold requires: herd all the sheep into the pen in Valentine, get 25 headshots, hit 70% accuracy, and use no health items.', trackable:true },
  { id:527, cat:'gold-medals', sub:'chapter-2', title:'A Strange Kindness', body:'Gold requires: return the captive to his family within 1:40, get 5 headshots, hit 80% accuracy, and use no health items. Chapter 2 is now fully covered — 18 of 18.', trackable:true },
  { id:530, cat:'gold-medals', sub:'chapter-3', title:'The New South', body:'Gold requires: knock out Anders Anderson without taking a hit, catch and return him to jail within 5:30, and catch a fish along with Dutch and Hosea.', trackable:true },
  { id:531, cat:'gold-medals', sub:'chapter-3', title:'Further Questions of Female Suffrage', body:'Gold requires: fend off the Lemoyne Raiders in under 1 minute, get 5 headshots, hit 85% accuracy, and use no health items.', trackable:true },
  { id:532, cat:'gold-medals', sub:'chapter-3', title:'American Distillation', body:'Gold requires: win the race back to camp, take no damage, get 5 headshots, and hit 70% accuracy.', trackable:true },
  { id:533, cat:'gold-medals', sub:'chapter-3', title:'An Honest Mistake', body:'Gold requires: save Uncle when he\'s overpowered, get 20 headshots, hit 80% accuracy, and use no health items.', trackable:true },
  { id:534, cat:'gold-medals', sub:'chapter-3', title:'The Course of True Love – II', body:'Gold requires: reach Penelope without getting spotted, and finish within 3 minutes.', trackable:true },
  { id:535, cat:'gold-medals', sub:'chapter-3', title:'Preaching Forgiveness As He Went', body:'Gold requires: kill 10 Lemoyne Raiders using a long scoped rifle, finish within 11:30, hit 70% accuracy, and use no health items.', trackable:true },
  { id:536, cat:'gold-medals', sub:'chapter-3', title:'Sodom? Back to Gomorrah', body:'Gold requires: loot every safe, headshot 5 mounted lawmen during the horseback escape, reach Downes Ranch within 1:55, hit 70% accuracy, and use no health items.', trackable:true },
  { id:537, cat:'gold-medals', sub:'chapter-3', title:'The Course of True Love – III', body:'Gold requires: finish within 4:15.', trackable:true },
  { id:538, cat:'gold-medals', sub:'chapter-3', title:'Advertising, the New American Art – II', body:'Gold requires: headshot 5 Lemoyne Raiders in the saloon, hit 90% accuracy, and use no health items — a tight one, aim carefully.', trackable:true },
  { id:539, cat:'gold-medals', sub:'chapter-3', title:'Magicians for Sport', body:'Gold requires: inspect every clue in Trelawny\'s caravan, stay within 30 feet of Trelawny\'s trail while tracking, kill 2 bounty hunters in the cornfields within 1 minute, and use no health items.', trackable:true },
  { id:540, cat:'gold-medals', sub:'chapter-3', title:'Horse Flesh for Dinner', body:'Gold requires: kill the stable hand showing you the horses, catch the stallion within 10 seconds, and get 5 headshots.', trackable:true },
  { id:541, cat:'gold-medals', sub:'chapter-3', title:'Friends in Very Low Places', body:'Gold requires: complete without being spotted, and finish within 8:10.', trackable:true },
  { id:542, cat:'gold-medals', sub:'chapter-3', title:'The Fine Joys of Tobacco', body:'Gold requires: silently kill the man Sean distracts in the wagon store, douse the fields within 2:20, kill 5 more during the escape, and use no health items.', trackable:true },
  { id:543, cat:'gold-medals', sub:'chapter-3', title:'Blessed are the Peacemakers', body:'Gold requires: free yourself and self-surgery within 1 minute, recover your weapons from the O\'Driscoll camp, kill the O\'Driscolls who beat and shot you, and escape the camp without being spotted.', trackable:true },
  { id:544, cat:'gold-medals', sub:'chapter-3', title:'A Short Walk in a Pretty Town', body:'Gold requires: kill 3 lawmen in Dead Eye while saving Bill, use only sidearms, finish within 4:30, get 20 headshots, and use no health items.', trackable:true },
  { id:545, cat:'gold-medals', sub:'chapter-3', title:'Blood Feuds, Ancient and Modern', body:'Gold requires: headshot both Gareth and Gerald Braithwaite, get 20 headshots total, hit 85% accuracy, and use no health items.', trackable:true },
  { id:546, cat:'gold-medals', sub:'chapter-3', title:'The Battle of Shady Belle', body:'Gold requires: kill all the Lemoyne Raiders at Shady Belle, clear two bodies within 1:40, and finish within 11 minutes. Chapter 3 is now fully covered — 17 of 17.', trackable:true },
  { id:550, cat:'gold-medals', sub:'chapter-4', title:'The Joys of Civilization', body:'Gold requires: catch the street urchin before he reaches the market, and finish within 5:30.', trackable:true },
  { id:551, cat:'gold-medals', sub:'chapter-4', title:'Angelo Bronte, a Man of Honor', body:'Gold requires: witness the dog and the drunk encounter, avoid being spotted by the law, finish within 10:40, and get 4 headshots.', trackable:true },
  { id:552, cat:'gold-medals', sub:'chapter-4', title:'No, No and Thrice, No', body:'Gold requires: kill both Foreman boys yourself during the chase, and hit 90% accuracy.', trackable:true },
  { id:553, cat:'gold-medals', sub:'chapter-4', title:'The Gilded Cage', body:'Gold requires: at the party, pour drinks, compliment a guest\'s attire, accept a gift, and save a life — then follow the servant without being detected.', trackable:true },
  { id:554, cat:'gold-medals', sub:'chapter-4', title:'A Fine Night of Debauchery', body:'Gold requires: win the poker game without Strauss\'s help, escape the boat in under 35 seconds once your cover is blown, get 5 headshots, and use no health items.', trackable:true },
  { id:555, cat:'gold-medals', sub:'chapter-4', title:'Fatherhood and Other Dreams – II', body:'Gold requires: catch the wagon and get it to the secluded spot within 1:45, and take Mary to the theater.', trackable:true },
  { id:556, cat:'gold-medals', sub:'chapter-4', title:'American Fathers – II', body:'Gold requires: infiltrate the factory by hiding in the wagon, reach Danbury\'s office undetected, kill all the horseback pursuers during the escape, and hit 80% accuracy.', trackable:true },
  { id:557, cat:'gold-medals', sub:'chapter-4', title:'Horsemen, Apocalypses', body:'Gold requires: shoot the O\'Driscolls in the boat before they disembark, use only sidearms, hit 70% accuracy, get 15 headshots, and use no health items.', trackable:true },
  { id:558, cat:'gold-medals', sub:'chapter-4', title:'Urban Pleasures', body:'Gold requires: rob all the customers in the trolley station, kill 10 lawmen while on the trolley, stop any lawmen from jumping on the wagon, shoot the dynamite Lenny throws, and use no health items.', trackable:true },
  { id:559, cat:'gold-medals', sub:'chapter-4', title:'Country Pursuits', body:'Gold requires: get Jules back to the skiff within 1:40, and shoot the Bullgator 5 times.', trackable:true },
  { id:560, cat:'gold-medals', sub:'chapter-4', title:'Revenge is a Dish Best Eaten', body:'Gold requires: search every room in Bronte\'s mansion, carry Bronte to the skiff within 1:30, get 20 headshots, and use no health items.', trackable:true },
  { id:561, cat:'gold-medals', sub:'chapter-4', title:'Help a Brother Out', body:'Gold requires: find the captives without threatening the store owner, and finish within 2:45.', trackable:true },
  { id:562, cat:'gold-medals', sub:'chapter-4', title:'Brothers and Sisters, One and All', body:'Gold requires: find the kid within 19 seconds — a fast one.', trackable:true },
  { id:563, cat:'gold-medals', sub:'chapter-4', title:'Banking, the Old American Art', body:'Gold requires: crack the safe without any mistakes, use only sidearms, get 25 headshots, and use no health items. Chapter 4 is now fully covered — 14 of 14.', trackable:true },
  { id:570, cat:'gold-medals', sub:'chapter-5', title:'Welcome to the New World', body:'Gold requires: don\'t fall behind while walking with the chain gang, and get 10 headshots.', trackable:true },
  { id:571, cat:'gold-medals', sub:'chapter-5', title:'Savagery Unleashed', body:'Gold requires: release all the workers within 4 seconds, finish within 5:40, and get 8 headshots.', trackable:true },
  { id:572, cat:'gold-medals', sub:'chapter-5', title:'A Kind and Benevolent Despot', body:'Gold requires: get Javier to safety in under 2 minutes, and get 10 headshots.', trackable:true },
  { id:573, cat:'gold-medals', sub:'chapter-5', title:'Hell Hath No Fury', body:'Gold requires: prevent 4 boats from reaching shore, destroy the naval ship without missing a shot, and hit 70% accuracy.', trackable:true },
  { id:574, cat:'gold-medals', sub:'chapter-5', title:'Paradise Mercifully Departed', body:'Gold requires: kill the first 2 sentries without being spotted, escort the captain to the boat within 1:45, finish within 6:45, and get 25 headshots.', trackable:true },
  { id:575, cat:'gold-medals', sub:'chapter-5', title:'Dear Uncle Tacitus', body:'Gold requires: leave Shady Belle without being detected by the Pinkertons, and finish within 8 minutes.', trackable:true },
  { id:576, cat:'gold-medals', sub:'chapter-5', title:'Fleeting Joy', body:'Gold requires: kill 2 Pinkertons during the Dead Eye ambush, get 5 headshots with the Gatling Gun, hit at least 70% accuracy with it, and use no health items.', trackable:true },
  { id:577, cat:'gold-medals', sub:'chapter-5', title:'That\'s Murfree Country', body:'Gold requires: deliver Meredith to her mother within 2 minutes, get 15 headshots, hit 85% accuracy, and use no health items.', trackable:true },
  { id:578, cat:'gold-medals', sub:'chapter-5', title:'A Fork in the Road', body:'Gold requires: finish within 3:05. Chapter 5 is now fully covered — 9 of 9.', trackable:true },
  { id:900, cat:'arthur-only', title:'Why this list exists', body:'The common thread behind everything here is New Austin. That whole region — the far southwest of the map — isn\'t just locked behind an invisible wall; Arthur gets attacked automatically the moment he enters it, and some enemies will actively chase him out. Wait for the Epilogue and it opens up freely. This list pulls together everything found so far across the Compendium, Challenges, Mission Tips, and Treasure sections, plus a dedicated pass on outfits, points of interest, and side content.', trackable:false },
  { id:901, cat:'arthur-only', title:'Legendary Cougar', body:'Found in Gaptooth Ridge, New Austin (see Compendium > Legendary Animals). Can\'t be hunted as Arthur.', trackable:false },
  { id:902, cat:'arthur-only', title:'Legendary Pronghorn', body:'Found near Rio Bravo, New Austin (see Compendium > Legendary Animals). Can\'t be hunted as Arthur — note the regular (non-legendary) Pronghorn is fine, it\'s only the legendary one that\'s locked.', trackable:false },
  { id:903, cat:'arthur-only', title:'Legendary Channel Catfish', body:'Also found at Rio Bravo, New Austin, and additionally gated behind a Stranger mission trip with Jeremy Gill that only becomes available in the Epilogue (see Compendium > Legendary Fish). Double-locked, effectively.', trackable:false },
  { id:904, cat:'arthur-only', title:'Gila Monster', body:'A New Austin desert lizard (see Compendium > Reptiles & Amphibians). Can\'t be caught as Arthur.', trackable:false },
  { id:905, cat:'arthur-only', title:'Desert Sage', body:'Only grows in Gaptooth Ridge, New Austin (see Compendium > Common Herbs). Can\'t be picked as Arthur.', trackable:false },
  { id:906, cat:'arthur-only', title:'Red Sage', body:'Only grows near Rio Bravo, New Austin (see Compendium > Common Herbs). Can\'t be picked as Arthur.', trackable:false },
  { id:907, cat:'arthur-only', title:'Wild Feverfew', body:'Only grows in Cholla Springs, New Austin (see Compendium > Common Herbs). Can\'t be picked as Arthur.', trackable:false },
  { id:908, cat:'arthur-only', title:'Blackcurrant', body:'Only grows in Gaptooth Ridge and Cholla Springs, New Austin (see Compendium > Common Herbs). Can\'t be picked as Arthur.', trackable:false },
  { id:909, cat:'arthur-only', title:'Herbalist Challenge 9', body:'Requires picking one of every herb species in the game — which means it needs Desert Sage, Red Sage, Wild Feverfew, and Blackcurrant. Since all four are New Austin-locked, this is the one full Challenge tier that can\'t be finished as Arthur (see Challenges > Herbalist).', trackable:false },
  { id:910, cat:'arthur-only', title:'Horseman Challenge 9', body:'Requires riding from Van Horn to Blackwater in under 17 minutes without touching water. Blackwater itself is hostile to Arthur earlier in the story — you\'d be shot on sight — so this ride genuinely can\'t be attempted until the Epilogue (see Challenges > Horseman).', trackable:false },
  { id:911, cat:'arthur-only', title:'The Torn/Mended Treasure Map', body:'Both halves of the map can be picked up as Arthur, but the actual dig site is west of Twin Rocks in New Austin, so the treasure itself — Otis Miller\'s Revolver — can only be collected in the Epilogue (see Treasure Maps > Other Hunts).', trackable:false },
  { id:912, cat:'arthur-only', title:'Some Dinosaur Bones', body:'A number of the collectible dinosaur bones are scattered around New Austin. Which specific ones I haven\'t pinned down individually yet — worth its own pass if Molly is chasing full bone completion.', trackable:false },
  { id:913, cat:'arthur-only', title:'New Austin Points of Interest / sketches', body:'Arthur has his own unique sketch for each Point of Interest he draws in his journal — but since he can never physically reach New Austin\'s POIs, he can never draw those specific ones. John draws his own separate versions later, and that\'s the only way those particular POIs get recorded — Arthur\'s version of them simply doesn\'t exist. Doesn\'t block 100% completion, just means Molly won\'t see Arthur\'s take on those specific spots.', trackable:false },
  { id:914, cat:'arthur-only', title:'⚠ New Austin outfits — workaround exists', body:'Clothing sold in the Blackwater, Armadillo, and Tumbleweed stores can\'t be bought in-game as Arthur since he can\'t enter those towns. However, there\'s a real workaround: those same outfits are sold on the Wheeler, Rawson & Co. online store via the Rockstar Social Club website. Purchases there use Arthur\'s in-game money and get added to his wardrobe next time the game loads — no story-progression requirement involved. Worth knowing if Molly wants a specific New Austin look on Arthur specifically.', trackable:false },
  { id:915, cat:'arthur-only', title:'Tumbleweed side missions & bounties', body:'Tumbleweed is the only place in New Austin with its own side content — a couple of bounty-hunting targets (Joaquin Arroyo, Esteban Cortez) plus general side activity tied to the town. All Epilogue-only, all tied to New Austin being closed off earlier.', trackable:false },
  { id:916, cat:'arthur-only', title:'New Austin hidden loot & easter eggs', body:'Scattered unique finds across New Austin — for example a Ram Skull Mask at Rathskeller Fork, and various burned-out homesteads and ruined farms with unique valuables. None of it is reachable as Arthur.', trackable:false },
  { id:917, cat:'arthur-only', title:'The Del Lobos gang hideouts', body:'This gang and their hideouts are based in New Austin — another pocket of content that only opens up once Arthur is gone and John can move through the region freely.', trackable:false },
  { id:918, cat:'arthur-only', title:'⚠ This list may still not be fully exhaustive', body:'This now covers a genuinely wide sweep — animals, plants, challenges, treasure, outfits, points of interest, side missions, and hidden loot — but RDR2\'s New Austin content is deep, and something small could still be missing (a specific stranger interaction, a particular collectible variant). If Molly hits something in-game that isn\'t on this list, it\'s almost certainly another New Austin item worth adding.', trackable:false },
  { id:1000, cat:'hunting', title:'Only 3-star animals can give a perfect pelt', body:'Study the animal first (hold the study button up close, or use binoculars from range) — it shows a star rating for physical condition. Anything less than pristine (3 stars) simply can\'t yield a perfect pelt no matter how clean the kill is, so it\'s worth checking before you commit to a shot.', trackable:false },
  { id:1001, cat:'hunting', title:'Studying tells you the exact weapon to use', body:'Once you\'ve studied a 3-star animal, the game tells you directly which weapon and ammo type gets a perfect result on that specific animal — no guessing required. This is the single most reliable way to stop wasting pelts.', trackable:false },
  { id:1002, cat:'hunting', title:'Size group determines weapon — rough chart', body:'Tiny animals (small birds, rats, squirrels): Small Game Arrows. Small animals (rabbits, foxes, badgers): Varmint Rifle. Medium animals: regular Arrows or Varmint Rifle depending on the animal. Large animals: Improved Arrows or a Rifle/Repeater. Massive animals (bears, bison, moose, elk, alligators): a scoped Rifle or Improved Arrows. Always check the study prompt to confirm — a few animals don\'t follow the general pattern.', trackable:false },
  { id:1003, cat:'hunting', title:'Aim for the brain, not the heart', body:'A headshot to the brain is the cleanest, most consistent way to get a fatal hit without damaging the pelt. Heart shots can still degrade certain animals\' hides even when they\'re instantly fatal, so brain shots are the safer default across the board.', trackable:false },
  { id:1004, cat:'hunting', title:'Skip the shotgun and explosive ammo almost always', body:'Shotguns and explosive rounds are reliable pelt-ruiners on regular animals — they\'re too much damage for a clean kill. The one exception is Legendary Animals, whose pelts can\'t be damaged no matter what you use them down with.', trackable:false },
  { id:1005, cat:'hunting', title:'One shot only', body:'A perfect pelt needs the animal to go down from a single hit — it doesn\'t have to be instantly fatal (a critical hit that the animal staggers away from and then collapses from still counts), but a second finishing shot will downgrade the pelt.', trackable:false },
  { id:1006, cat:'hunting', title:'Watch for a mismatch between carry size and weapon size', body:'A few animals are one size group for weapon choice but a different size for carrying — a beaver, for example, needs a Varmint Rifle (like a "small" animal) but its pelt has to ride on the back of the horse rather than in the satchel (like a "large" one). If a kill isn\'t stowing where you expect, that\'s usually why — not a bug.', trackable:false },
  { id:1007, cat:'hunting', title:'⚠ The Buck Antler Trinket can save a bad shot', body:'Community-reported (not officially documented): the Buck Antler Trinket appears to give a real chance — roughly 1 in 3 to 1 in 2 by player testing — of upgrading a merely good pelt to perfect during the skinning animation itself. Worth having equipped as a safety net, though don\'t rely on it as a guaranteed fix for a bad shot.', trackable:false },
  { id:919, cat:'arthur-only', title:'Tiger-Striped Mustang', body:'A unique horse, same tier as the Arabian, found at Rio del Lobo Rock in the south of New Austin (see Horses & Bonding > Wild Breeds). Can\'t be tamed as Arthur — Epilogue only.', trackable:false },
  { id:920, cat:'arthur-only', title:'Micah\'s Revolver', body:'Found on Mount Hagen at the end of "American Venom" — but only accessible after Epilogue Part 2 is complete (see Guns & Gear). Not New Austin, but still off-limits to Arthur since it requires the story to have moved past him entirely.', trackable:false },
  { id:921, cat:'arthur-only', title:'Explosive shotgun ammo pamphlet', body:'The crafting recipe for explosive shotgun ammo is found in New Austin (see Guns & Gear). Can\'t be picked up as Arthur.', trackable:false },
  { id:1500, cat:'crafting', sub:'general', title:'Crafting needs a campfire', body:'Crafting and cooking both happen at a campfire — your own, the gang camp\'s, or any other found out in the world. It can\'t be done inside towns. Hold the weapon wheel button and select Camp to set one up anywhere safe on the road.', trackable:false },
  { id:1501, cat:'crafting', sub:'general', title:'Pamphlets unlock recipes', body:'Having the right ingredients isn\'t always enough — plenty of recipes need a Pamphlet learned first before they show up in the crafting menu at all. Pamphlets are found scattered around the world (often in a chest) or bought from a Fence after specific story missions unlock them for sale. Once learned, a recipe stays unlocked permanently.', trackable:false },
  { id:1502, cat:'crafting', sub:'general', title:'Some recipes are free from the start of Chapter 2', body:'A handful of useful recipes — including Improved, Fire, and Small Game Arrows, Improved Tomahawk and Throwing Knife, Split Point and Explosive Cartridges, Fire Bottle, Cover Scent Lotion, and Horse Ointment — are simply handed to Arthur at the start of Chapter 2, no pamphlet hunting required.', trackable:false },
  { id:1503, cat:'crafting', sub:'general', title:'The premium herb cooking trick', body:'When cooking meat at a campfire, you can add an herb for a bonus. Always use one of the three "premium" herbs if you have them: Creeping Thyme boosts the Dead Eye core, Oregano boosts Stamina, and Wild Mint boosts Health. Cooking Big Game meat with one of these creates one of the strongest restorative meals in the game — worth always keeping a stock of all three.', trackable:false },
  { id:1504, cat:'crafting', sub:'general', title:'Tiers stack: Potent → Special', body:'Most tonics and horse items come in two crafted tiers — a cheaper "Potent" version with fewer ingredients, and a stronger "Special" version that needs a pamphlet and more materials. The Special tier is always worth the extra herbs when you have them.', trackable:false },
  { id:1510, cat:'crafting', sub:'tonics', title:'Potent Health Cure', body:'1x Ginseng, 1x Yarrow. Available from the start, no pamphlet needed.', trackable:false },
  { id:1511, cat:'crafting', sub:'tonics', title:'Special Health Cure', body:'2x Ginseng, 2x Yarrow, 2x English Mace or Milkweed. Pamphlet sold by Fences after completing "American Distillation."', trackable:false },
  { id:1512, cat:'crafting', sub:'tonics', title:'Potent Bitters (Stamina)', body:'1x Sage, 1x Burdock Root. Available from the start, no pamphlet needed.', trackable:false },
  { id:1513, cat:'crafting', sub:'tonics', title:'Special Bitters (Stamina)', body:'2x Sage, 2x Burdock Root, 2x Violet Snowdrop or Wild Feverfew. Pamphlet sold by Fences after Chapter 2.', trackable:false },
  { id:1514, cat:'crafting', sub:'tonics', title:'Potent Snake Oil (Dead Eye)', body:'1x Indian Tobacco. Automatically available as soon as camp is set up — no pamphlet needed.', trackable:false },
  { id:1515, cat:'crafting', sub:'tonics', title:'Special Snake Oil (Dead Eye)', body:'2x Indian Tobacco, 2x Currant or Prairie Poppy. Pamphlet sold by Fences after completing "American Distillation."', trackable:false },
  { id:1516, cat:'crafting', sub:'tonics', title:'Potent Miracle Tonic (all 3 cores)', body:'4x Indian Tobacco, 4x Ginseng, 4x Sage. A resource-heavy recipe, but restores Health, Stamina, and Dead Eye all at once — worth the ingredients when things get rough.', trackable:false },
  { id:1517, cat:'crafting', sub:'tonics', title:'⚠ Special Miracle Tonic — the best tonic in the game', body:'6x Currant, 6x Yarrow, 4x Burdock Root. Fully restores AND fortifies Health, Stamina, and Dead Eye simultaneously — widely considered the single most effective tonic available. Pamphlet found in a chest beside a bloody tent southeast of Vetter\'s Echo, or sold by Fences after completing "A Short Walk in a Pretty Town."', trackable:false },
  { id:1518, cat:'crafting', sub:'tonics', title:'Cover Scent Lotion', body:'1x Scent Gland (from a predator). Disguises Arthur\'s scent, making it harder for dangerous animals to detect him. Given automatically at the start of Chapter 2.', trackable:false },
  { id:1520, cat:'crafting', sub:'horse-care', title:'Horse Ointment', body:'1x Sage, 1x Common Bulrush, 1x Yarrow. Cleans and cares for your horse. Pamphlet given automatically at the start of Chapter 2.', trackable:false },
  { id:1521, cat:'crafting', sub:'horse-care', title:'Potent Horse Medicine', body:'1x Ginseng, 1x Common Bulrush. Available from the start, no pamphlet needed.', trackable:false },
  { id:1522, cat:'crafting', sub:'horse-care', title:'Special Horse Medicine', body:'2x Ginseng, 2x Common Bulrush, 2x Wild Carrot. Pamphlet sold by Fences after completing "Pouring Forth Oil."', trackable:false },
  { id:1523, cat:'crafting', sub:'horse-care', title:'Potent Horse Stimulant', body:'1x Sage, 1x Common Bulrush. Instantly refreshes horse stamina — available from the start, no pamphlet needed.', trackable:false },
  { id:1524, cat:'crafting', sub:'horse-care', title:'Special Horse Stimulant', body:'2x Sage, 2x Common Bulrush, 2x Wild Carrot. Pamphlet sold by Fences after completing "Pouring Forth Oil."', trackable:false },
  { id:1525, cat:'crafting', sub:'horse-care', title:'Special Horse Reviver', body:'2x Ginseng, 2x Wild Carrot, 2x Parasol Mushroom. Pamphlet sold by Fences after completing "American Distillation" — worth crafting a couple to keep in the satchel for emergencies.', trackable:false },
  { id:1526, cat:'crafting', sub:'horse-care', title:'Horse Meal', body:'3x Currant, 3x Beets, 3x Hay. Pamphlet sold by Fences after completing "Pouring Forth Oil."', trackable:false },

  { id:1533, cat:'crafting', sub:'arrows', title:'Dynamite Arrow', body:'1x Arrow, 1x Dynamite, 1x Flight Feather. Pamphlet found in a chest at the south end of Wapiti Indian Reservation, at the base of a wooden bridge — also sold by Fences after "A Short Walk in a Pretty Town."', trackable:false },
  { id:1534, cat:'crafting', sub:'arrows', title:'Poison Arrow', body:'1x Arrow, 1x Oleander Sage, 1x Flight Feather. Pamphlet found in a chest northeast of Bacchus Station, right outside the Mysterious Hill Home — also sold by Fences after Chapter 2.', trackable:false },

  { id:1538, cat:'crafting', sub:'arrows', title:'Explosive Slug', body:'1x Regular Shotgun Shell, 1x Animal Fat. Pamphlet found in a chest outside a burned-down alchemist house between Gaptooth Ridge and Cholla Springs — also sold by Fences after "A Short Walk in a Pretty Town."', trackable:false },

  { id:1544, cat:'crafting', sub:'tools', title:'Fire Bottle', body:'1x Animal Fat, 1x Gin, Guarma Rum, Fine Brandy, or Kentucky Bourbon. Given at the start of Chapter 2.', trackable:false },

  { id:1546, cat:'crafting', sub:'tools', title:'Volatile Dynamite', body:'1x Animal Fat, 1x Dynamite, 1x High Velocity Cartridge. Pamphlet found in a chest beneath a broken-down wagon at Hani\'s Bethel, just north of the small pond — also sold by Fences after "American Distillation."', trackable:false },
  { id:1547, cat:'crafting', sub:'tools', title:'Predator Bait', body:'1x Stringy Meat, 1x Wintergreen Berry, Evergreen Huckleberry, Raspberry, or Blackberry.', trackable:false },
  { id:1548, cat:'crafting', sub:'tools', title:'Potent Predator Bait', body:'1x Gritty Fish Meat, 1x Blackberry, Wintergreen Berry, Raspberry, or Evergreen Berry. Given at the start of Chapter 2.', trackable:false },
  { id:1549, cat:'crafting', sub:'tools', title:'Potent Herbivore Bait', body:'1x Vanilla Flower, 1x Violet Snowdrop, 1x Bay Bolete, Ram\'s Head, Parasol Mushroom, or Chanterelle. Given at the start of Chapter 2.', trackable:false },
  { id:1600, cat:'clothing', title:'How Trapper garment sets work', body:'The Trapper sells 16 full garment sets in story mode — 8 built around Legendary Animal pelts (rarer, tied to a specific hunt) and 8 built entirely from Perfect-quality regular pelts (no legendary hunting required, just clean kills). Every Legendary Animal drops enough pelts for everything tied to it in one kill — no need to hunt the same one twice. Pieces with a legendary link below show a clickable animal chip that jumps straight to that animal\'s Compendium entry.', trackable:false },

  { id:1720, cat:'clothing', sub:'bounty-hunter', title:'Plantation Slouch Hat', body:'1x Perfect Bison pelt. $15.', trackable:true },
  { id:1721, cat:'clothing', sub:'bounty-hunter', title:'Beaver Hunting Jacket', body:'1x Perfect Cow hide, 2x Perfect Beaver pelt. $21.', trackable:true },
  { id:1722, cat:'clothing', sub:'bounty-hunter', title:'Sheepskin Vest', body:'2x Perfect Sheep hide. $20.', trackable:true },
  { id:1723, cat:'clothing', sub:'bounty-hunter', title:'Pronghorn Half Chaps', body:'1x Perfect Pronghorn hide. $7.', trackable:true },
  { id:1724, cat:'clothing', sub:'bounty-hunter', title:'Buck Riding Gloves', body:'1x Perfect Buck pelt. $5.', trackable:true },
  { id:1730, cat:'clothing', sub:'desperado', title:'Beaver Drifter Hat', body:'2x Perfect Beaver pelt. $20.', trackable:true },
  { id:1731, cat:'clothing', sub:'desperado', title:'Wolf Coat', body:'1x Perfect Ram hide, 1x Perfect Wolf pelt. $25.', trackable:true },
  { id:1732, cat:'clothing', sub:'desperado', title:'Billy Vest', body:'1x Perfect Armadillo skin, 1x Perfect Goat hide. $32.', trackable:true },
  { id:1733, cat:'clothing', sub:'desperado', title:'Boar and Bull Fowler Boots', body:'1x Perfect Ox hide, 1x Perfect Boar pelt. $31.', trackable:true },
  { id:1734, cat:'clothing', sub:'desperado', title:'Winter Cavalry Gloves', body:'1x Perfect Rabbit pelt, 2x Perfect Muskrat pelt. $25.', trackable:true },
  { id:1740, cat:'clothing', sub:'night-wrangler', title:'Coyote Gambler\'s Hat', body:'2x Perfect Coyote pelt. $16.', trackable:true },
  { id:1741, cat:'clothing', sub:'night-wrangler', title:'Cougar Cutaway Coat', body:'2x Perfect Cougar pelt, 1x Perfect Black Bear pelt. $39.', trackable:true },
  { id:1742, cat:'clothing', sub:'night-wrangler', title:'Wilderness Vest', body:'1x Perfect Wolf pelt, 1x Perfect Panther pelt. $28.', trackable:true },
  { id:1743, cat:'clothing', sub:'night-wrangler', title:'Moose Half Chaps', body:'1x Perfect Moose pelt. $10.', trackable:true },
  { id:1744, cat:'clothing', sub:'night-wrangler', title:'Badger Rifleman Gloves', body:'1x Perfect Badger pelt. $10.', trackable:true },
  { id:1750, cat:'clothing', sub:'mountain-man', title:'Grenadier Hat', body:'1x Perfect Muskrat pelt, 1x Perfect Beaver pelt. $24.', trackable:true },
  { id:1751, cat:'clothing', sub:'mountain-man', title:'Ram Shotgun Coat', body:'2x Perfect Ram hide. $45.', trackable:true },
  { id:1752, cat:'clothing', sub:'mountain-man', title:'Country Vest', body:'1x Perfect Buck pelt, 1x Perfect Beaver pelt. $25.', trackable:true },
  { id:1753, cat:'clothing', sub:'mountain-man', title:'Elk Riding Gloves', body:'1x Perfect Elk pelt. $12.', trackable:true },
  { id:1, cat:'hunting', title:'Match your weapon to the kill', body:'A perfect pelt needs a clean, quick kill — the wrong weapon on small game (or a body shot instead of a vital-zone hit) wrecks the hide even if the animal dies instantly.', trackable:false },
  { id:2, cat:'hunting', title:'Watch the reticle indicator', body:'Aiming shows a small quality readout for the animal in your sights, so you know before you fire whether this shot keeps the pelt pristine.', trackable:false },
  { id:3, cat:'hunting', title:'Legendary animals take patience', body:'They usually need a study/tracking step first — Eagle Eye picks up scent trails once you\'ve got a lead, so don\'t just wander hoping to spot one.', trackable:true },
  { id:4, cat:'hunting', title:'Carry hides on your horse', body:'Pelts and carcasses eat into your personal carry weight fast — stow them on the horse and sell to a trapper for noticeably better prices than a general store.', trackable:false },
  { id:800, cat:'treasure', sub:'jack-hall', title:'Jack Hall Gang — how to start', body:'Available from the start of Chapter 2, tied to the Stranger mission "All That Glitters." Find Maximo Cristobal Valdespino west of Flatneck Station in The Heartlands — he sells the first map for $10 (or $5 if you haggle, or you can just rob him). Total reward for the full chain: 2 Gold Bars (~$1000).', trackable:false },
  { id:801, cat:'treasure', sub:'jack-hall', title:'Jack Hall Gang Map 2 — Caliban\'s Seat', body:'Head up the mountain south of Valentine called Caliban\'s Seat. Take the path down the right side, jump ledge to ledge, and find the map tucked in a crevice in the rock wall.', trackable:true },
  { id:802, cat:'treasure', sub:'jack-hall', title:'Jack Hall Gang Map 3 — Cotorra Springs', body:'North of Fort Wallace. Look for stone piles arranged in a rough circle near the geysers — the middle pile holds the map.', trackable:true },
  { id:803, cat:'treasure', sub:'jack-hall', title:'Jack Hall Gang Treasure — O\'Creagh\'s Run', body:'Swim or ride to the small island in the middle of O\'Creagh\'s Run, Grizzlies East. The 2 Gold Bars are under a small rock on the north side of the island.', trackable:true },
  { id:810, cat:'treasure', sub:'poisonous', title:'Poisonous Trail — how to start', body:'Available from the start of Chapter 2. The first map is in a lockbox under the bed at Cairn Lodge, Cairn Lake, the snowy northwest part of the map. Total reward for the full chain: 4 Gold Bars (~$2000) — the richest of the three main hunts.', trackable:false },
  { id:811, cat:'treasure', sub:'poisonous', title:'Poisonous Trail Map 2', body:'Halfway up a hill you\'ll find a broken tree lying on the ground next to another dead tree still standing — the map is tucked inside the standing one.', trackable:true },
  { id:812, cat:'treasure', sub:'poisonous', title:'Poisonous Trail Map 3', body:'Near the top of a hill, look for a stone formation with a hole in the middle — the map is placed inside it.', trackable:true },
  { id:813, cat:'treasure', sub:'poisonous', title:'⚠ Poisonous Trail Treasure — Elysian Pool cave', body:'The final treasure is behind the waterfall at Elysian Pool, New Hanover. Switch to your lantern before entering (it\'s pitch black) — after passing through the waterfall, stick to the right side going down, find the small tunnel at the bottom, and follow it through a maze of hidden tunnels to the treasure at the end. Genuinely disorienting — worth going slow and sticking to the right-hand wall the whole way if Molly loses her bearings.', trackable:true },
  { id:820, cat:'treasure', sub:'high-stakes', title:'High Stakes — how to start', body:'Unlocks in Chapter 3, after the story mission "The New South." The first map is carried by a random wandering "Chance Encounter" treasure hunter — lasso and hogtie him (or just rob/greet him) to get it. He spawns in a few possible zones, so you may need to check more than one. Total reward for the full chain: 3 Gold Bars (~$1500).', trackable:false },
  { id:821, cat:'treasure', sub:'high-stakes', title:'High Stakes Map 2 — Cumberland Falls', body:'Behind the waterfall at Cumberland Falls — walk up the wooden log on the right side of the falls to get behind it.', trackable:true },
  { id:822, cat:'treasure', sub:'high-stakes', title:'High Stakes Map 3 — Barrow Lagoon', body:'Walk up the small hill at Barrow Lagoon — the map is tucked into a broken tree stump wedged between two rocks.', trackable:true },
  { id:823, cat:'treasure', sub:'high-stakes', title:'High Stakes Treasure — Bacchus Station', body:'Drop down the cliffs above the river near Bacchus Station, platform by platform, starting from the top of the mountain facing the river. After a few drops, the 3 Gold Bars are wedged into a crevice in the rock.', trackable:true },
  { id:830, cat:'treasure', sub:'other', title:'Sketched Map — Elysian Pool area', body:'Found inside Reed Cottage, north of Annesburg. Leads to a tree with a carved X near the falls — from that tree, walk 20 paces north then 5 paces east to find the dig spot. Reward: 1 Gold Ingot (~$300).', trackable:true },
  { id:831, cat:'treasure', sub:'other', title:'Chick\'s Treasure Map', body:'Comes from the Chapter 2 story mission "Money Lending and Other Sins" — tracking down debtor Chick Matthews gives you the map. Worth getting to the marked tree quickly, since Chick can beat you there and take it if you dawdle. Reward: $35.', trackable:true },
  { id:832, cat:'treasure', sub:'other', title:'⚠ Torn/Mended Treasure Map — Epilogue only', body:'Two map halves are found from Chapter 2 onward (one at a wooden hut on the far west side near the start of Little Creek River, the other at a house called Manito Glade). Combined into the Mended Map, but the actual dig site — west of Twin Rocks in New Austin — can only be reached in the Epilogue. Reward: Otis Miller\'s Revolver, not gold.', trackable:true },
  { id:833, cat:'treasure', sub:'other', title:'⚠ Le Trésor des Morts — special edition only', body:'This one requires having pre-ordered the digital edition or owning the special/ultimate edition of RDR2 — it\'s not available on the standard edition at all. If Molly has access, it starts in a burned-out settlement (one building left standing, a former prison cell) and ends up worth 5 Gold Bars (~$2500), the richest single hunt in the game. Worth confirming her edition before chasing this one.', trackable:false },
  { id:834, cat:'treasure', sub:'other', title:'Landmarks of Riches', body:'Starts at an obelisk near Lake Owanjila. A community-reported hunt (less centrally documented than the big three) that leads to 6 Gold Bars — worth a dedicated look if Molly wants every last hunt, but flagging that I have less confidence in this one\'s exact step-by-step than Jack Hall Gang, Poisonous Trail, or High Stakes.', trackable:true },
  { id:1100, cat:'horses', sub:'breeds', title:'Wild American Standardbred', body:'Northern West Elizabeth, at Little Creek River. A racehorse with good speed and acceleration. Wild Morgan also spawns here.', dualTrack:true, trackable:true },
  { id:1101, cat:'horses', sub:'breeds', title:'Wild Morgan', body:'Same spot as the American Standardbred, northern West Elizabeth at Little Creek River.', dualTrack:true, trackable:true },
  { id:1102, cat:'horses', sub:'breeds', title:'Wild Mustang', body:'New Hanover, in The Heartlands. Wild Tennessee Walker can spawn nearby too.', dualTrack:true, trackable:true },
  { id:1103, cat:'horses', sub:'breeds', title:'Wild Tennessee Walker', body:'New Hanover, in The Heartlands — same general area as the Mustang.', dualTrack:true, trackable:true },
  { id:1104, cat:'horses', sub:'breeds', title:'Wild Appaloosa', body:'Ambarino, just south of Wapiti Indian Reservation near Donner Falls. A genuinely strong racing breed — worth bonding with once caught.', dualTrack:true, trackable:true },
  { id:1105, cat:'horses', sub:'breeds', title:'Wild Hungarian Halfbred', body:'Around Blackwater — one of the rarer breeds on this list.', dualTrack:true, trackable:true },
  { id:1106, cat:'horses', sub:'breeds', title:'Wild Kentucky Saddler', body:'Southwest of Blackwater.', dualTrack:true, trackable:true },
  { id:1107, cat:'horses', sub:'breeds', title:'Wild Nokota', body:'New Austin, south of Armadillo — the Morgan breed has a good chance of spawning in this same area too.', dualTrack:true, trackable:true },
  { id:1108, cat:'horses', sub:'breeds', title:'Wild American Paint', body:'New Austin, south of Tumbleweed. The last of the 9 breeds needed for Horseman Challenge 10.', dualTrack:true, trackable:true },
  { id:1109, cat:'horses', sub:'breeds', title:'⚠ Bonus: Arabian (not required for the challenge)', body:'Widely considered the best wild horse in the game — top-tier stats across the board. Not needed for Horseman 10, but worth catching regardless. Also occasionally available to buy from the Blackwater stable.', dualTrack:true, trackable:true },
  { id:1110, cat:'horses', sub:'breeds', title:'⚠ Bonus: Tiger-Striped Mustang — Epilogue only', body:'A unique one-of-a-kind horse, same tier as the Arabian, but it can only be tamed after reaching the Epilogue — it lives in the south of New Austin at Rio del Lobo Rock. Worth adding to the "Can\'t Do as Arthur" list too.', dualTrack:true, trackable:true },
  { id:1120, cat:'horses', sub:'bonding', title:'Best: alternate patting with movement', body:'Hold the pat/calm button (L3) while pressing the speed-up button (X/A) in a repeating rhythm. Each pat while the horse is calm gives XP with no cooldown, so this stacks with travel you\'re already doing — you can max out bonding just by riding around normally and doing this the whole way. Widely considered the single most efficient method in the game.', trackable:false },
  { id:1121, cat:'horses', sub:'bonding', title:'Great, but situational: calm/clean/feed on need', body:'Calming an agitated horse, cleaning it with ointment when dirty, and feeding it when its cores are low each give a solid chunk of XP — but only when the horse actually needs it, so you can\'t just spam these back to back.', trackable:false },
  { id:1122, cat:'horses', sub:'bonding', title:'Good: leading by the reins', body:'Walking the horse by hand is slow in real time but completely passive and safe — no risk of it bolting or getting hurt. A good option to do while just wandering, though it\'ll take close to an hour of real walking to reach max bond this way alone.', trackable:false },
  { id:1123, cat:'horses', sub:'bonding', title:'Okay: normal riding', body:'Just riding the horse gives passive XP over time — more when trotting unburdened, less when galloping or carrying a heavy load. Fine as a baseline, but slow on its own without combining it with patting.', trackable:false },
  { id:1124, cat:'horses', sub:'bonding', title:'Weakest as a repeatable method: hitching in new areas', body:'Hitching or unloading the horse somewhere new gives a decent XP chunk, but it\'s capped by an in-game-hour cooldown — spamming it back to back only gives 1 XP once the cooldown kicks in, so it\'s not a grinding method.', trackable:false },
  { id:1125, cat:'horses', sub:'bonding', title:'Instant boosts when you first get a horse', body:'Taming a wild horse gives an instant +25 XP. Equipping a saddle on a fresh horse instantly caps it at 50 XP, which is enough to hit Bond Level 1 immediately — neither is repeatable, but they\'re a nice head start.', trackable:false },
  { id:1126, cat:'horses', sub:'bonding', title:'Worth having: the Shark Tooth Trinket', body:'A permanent +10% to all horse bonding XP gained, found in a shipwreck lockbox on the shore east of Annesburg. Doesn\'t change the ranking above, but stacks with everything on it.', trackable:false },
  { id:5, cat:'treasure', title:'Zoom in before you ride out', body:'Treasure maps show real landmarks, but they\'re easy to misread at a glance — zoom the map and compare it to the terrain before committing to a direction.', trackable:false },
  { id:6, cat:'treasure', title:'Some maps come in multiple pieces', body:'A few treasure chains only reveal the dig site once every fragment of that particular map has been found and combined.', trackable:true },
  { id:7, cat:'treasure', title:'Listen as much as you look', body:'Dig sites give a faint audio and visual cue once you\'re standing close — a shimmer in the ground plus a soft chime.', trackable:false },
  { id:8, cat:'horses', title:'Bond level changes behavior, not just looks', body:'A higher-bonded horse stays calmer under gunfire, recovers stamina quicker, and follows whistle commands more reliably — it\'s worth investing time even on a horse you didn\'t buy.', trackable:false },
  { id:9, cat:'horses', title:'Breed sets the ceiling, not the coat', body:'Two horses can look totally different and share the same core stats — pick by breed category (stamina/speed/health archetype) rather than color alone.', trackable:false },
  { id:1200, cat:'gear', sub:'pistols', title:'⚠ The Legendary Gunslingers chain has 4 missable weapons', body:'The Stranger mission chain "The Noblest of Men, and a Woman" (found via Landon Ricketts) has Arthur duel four gunslingers — Flaco Hernandez, Billy Midnight, Emmet Granger, and Jim Calloway. Each one drops a unique weapon on their body after the duel: Flaco\'s Revolver, Midnight\'s Pistol, Granger\'s Revolver, and Calloway\'s Revolver. You MUST pick each one up right after winning the duel — if you walk away without grabbing it, it\'s gone forever with no way to get it back.', trackable:false },
  { id:1201, cat:'gear', sub:'pistols', title:'⚠ Otis Miller\'s Revolver — Epilogue only', body:'A gold-and-ivory Schofield Revolver hidden in a chest inside a cave at Rattlesnake Hollow, Cholla Springs — New Austin, so like everything else there it\'s only reachable in the Epilogue (see Can\'t Do as Arthur). It\'s also the reward for the Torn/Mended Treasure Map hunt.', trackable:false },
  { id:1202, cat:'gear', sub:'pistols', title:'⚠ Micah\'s Revolver — after the credits roll', body:'Found on Micah\'s body on Mount Hagen, right where "American Venom" ends — but only accessible after Epilogue Part 2 is complete. If you don\'t grab it right away, it\'s still there waiting on the mountain any time after.', trackable:false },
  { id:1203, cat:'gear', sub:'rifles', title:'⚠ Rare Rolling Block Rifle — grab it mid-mission', body:'Dropped by the sniper pinning you down during the story mission "Magicians for Sport." You have to pick it up during the mission itself — miss the window and it\'s gone.', trackable:false },
  { id:1204, cat:'gear', sub:'shotguns', title:'⚠ Rare Shotgun — from the Hermit', body:'Obtained from the character known as the Hermit, found in a hut north of Annesburg. If he kills you first, or you don\'t loot him, the weapon is lost for good.', trackable:false },
  { id:1205, cat:'gear', sub:'pistols', title:'Schofield Revolver — a Valentine side business', body:'Found by uncovering the doctor\'s side business behind a locked door in Valentine — knock or peek through the window to trigger it, then force the door. A locked box inside holds the revolver. Unlike the gunslinger weapons, this one is a normal (if rare) find, not a missable moment.', trackable:false },
  { id:1206, cat:'gear', sub:'pistols', title:'Pistol & Revolver ammo tiers', body:'Regular is the cheap baseline. Split Point is the best everyday upgrade — cheap, a small XP bonus per kill, and it drains Dead Eye more slowly than other types. High Velocity hits harder and can pierce through multiple lined-up targets. Express is the strongest non-explosive option, at the highest price. Explosive rounds are reserved for Legendary Animals (their pelts can\'t be damaged by anything) or cracking safes — never use them on a normal animal, it always ruins the pelt.', trackable:false },
  { id:1220, cat:'gear', sub:'rifles', title:'Rifle & Repeater ammo tiers', body:'Same five tiers as handguns — Regular, Split Point, High Velocity, Express, Explosive — but rifles and repeaters track their own separate ammo pool from pistols and revolvers, so stocking up on one doesn\'t cover the other. Split Point is still the best everyday pick; save Explosive for Legendary Animals only.', trackable:false },
  { id:1221, cat:'gear', sub:'rifles', title:'The Varmint Rifle only takes Regular ammo', body:'Unlike the full-size rifles, the Varmint Rifle doesn\'t have Split Point, High Velocity, or Express variants — it\'s built specifically for small game and uses standard ammo only. Don\'t go looking for an upgraded version of it.', trackable:false },
  { id:1222, cat:'gear', sub:'bows', title:'Regular Arrow', body:'The baseline arrow — fine for most animals and light combat use, no special effect.', trackable:false },
  { id:1223, cat:'gear', sub:'bows', title:'Small Game Arrow', body:'Built for tiny and small animals (birds, rabbits, squirrels) — won\'t damage the pelt the way a heavier arrow would. The go-to for anything delicate.', trackable:false },
  { id:1224, cat:'gear', sub:'bows', title:'Improved Arrow', body:'Hits noticeably harder than a Regular Arrow — better for larger game or when you need more stopping power in a fight.', trackable:false },
  { id:1225, cat:'gear', sub:'bows', title:'Fire Arrow', body:'Sets the target (or the surroundings) alight. More of a combat and utility tool than a hunting one.', trackable:false },
  { id:1226, cat:'gear', sub:'bows', title:'Dynamite Arrow', body:'Explosive area damage — the bow\'s answer to a stick of dynamite. Overkill for anything you want to keep the pelt of.', trackable:false },
  { id:1227, cat:'gear', sub:'bows', title:'Poison Arrow', body:'Doesn\'t kill outright — the target staggers off and dies from the poison shortly after. Genuinely useful for a quiet takedown of a predator like a Cougar without alerting anything nearby, since there\'s no gunshot to give you away.', trackable:false },
  { id:1228, cat:'gear', sub:'shotguns', title:'Shotgun shell types', body:'Regular shells are the everyday baseline. Slug rounds fire a single heavy projectile instead of a spread — better accuracy at range than normal shot, closer to a rifle in behavior. Incendiary shells set the target alight. Explosive shells are the most powerful shotgun ammo in the game, but need the crafting pamphlet first.', trackable:false },
  { id:1211, cat:'gear', sub:'shotguns', title:'⚠ Explosive shotgun ammo pamphlet — New Austin only', body:'The crafting recipe (pamphlet) for explosive shotgun ammo is found in New Austin, meaning it\'s effectively a post-story unlock — another item for the Can\'t Do as Arthur list.', trackable:false },
  { id:1212, cat:'gear', sub:'general', title:'Gunsmiths handle cleaning for you', body:'Only a clean weapon can be customized, but you don\'t need to do this yourself with Gun Oil — any Gunsmith will clean a weapon cheaply as part of a visit. Worth letting them do it rather than carrying Gun Oil everywhere.', trackable:false },
  { id:1213, cat:'gear', sub:'general', title:'Customize weapons even when they\'re on your horse', body:'You don\'t need to be carrying a weapon to customize it at a Gunsmith — anything stored on your horse is available in the customization menu too.', trackable:false },
  { id:1214, cat:'gear', sub:'general', title:'Components vs. Styles — know the difference', body:'Gunsmith customization splits into two categories: Components change actual performance (accuracy, damage, reload speed, and so on) and are worth prioritizing early when cash is tight. Styles are purely cosmetic (metal finishes, engravings, wood grain) — fun, but don\'t affect how the gun performs.', trackable:false },
  { id:1215, cat:'gear', sub:'general', title:'The Legend of the East Satchel is worth the detour', body:'Pearson can craft satchel upgrades at camp, working toward the "Legend of the East Satchel" — the best in the game, giving close to 99 carrying slots for most item types. It\'s unlocked through a chain of donating perfect pelts to Pearson rather than bought outright, so it pairs naturally with hunting for the Compendium.', trackable:false },
  { id:10, cat:'gear', sub:'general', title:'Clean your guns after mud or water', body:'A dirty weapon is noticeably less reliable — wipe it down regularly, especially after swimming, storms, or dusty rides, to avoid misfires.', trackable:false },
  { id:11, cat:'gear', sub:'general', title:'Ammo type changes what you can do', body:'Different tiers of ammo aren\'t just damage boosts — some hunts and encounters expect a specific type to avoid ruining the kill. Check the Pistols, Rifles, Bows, and Shotguns tabs above for the full breakdown by weapon type.', trackable:false },
  { id:12, cat:'money', sub:'medium', title:'Bounty hunting is steady early cash', body:'Low risk, repeatable, and it restocks — wanted posters at any sheriff\'s office give typical rewards in this range, with no need for story progress.', trackable:false },
  { id:13, cat:'money', sub:'medium', title:'Fences buy what stores won\'t', body:'Stolen or unusual valuables often can\'t be sold at a general store — you\'ll need a fence, and they\'re not in every town. Most individual stolen items (jewelry, watches, small stolen goods) land in this range per sale.', trackable:false },
  { id:1300, cat:'money', sub:'small', title:'Loot every body', body:'A few cents to a couple of dollars per corpse, but it costs nothing and adds up fast across a shootout or a bandit camp. Always worth the ten seconds.', trackable:false },
  { id:1301, cat:'money', sub:'small', title:'Small game pelts and carcasses', body:'Rabbits, squirrels, and small birds sell for pocket change each — not worth a dedicated trip, but free money if you\'re already hunting them for the Compendium.', trackable:false },
  { id:1302, cat:'money', sub:'small', title:'Loot cabins and houses along the road', body:'Drawers, cupboards, and nightstands in random buildings usually hold a few dollars at most, but it costs nothing to check on the way somewhere else.', trackable:false },
  { id:1310, cat:'money', sub:'medium', title:'A perfect large-game carcass', body:'A clean, pristine deer or elk kill sold whole to a butcher — carcass, pelt, and antlers together — lands solidly in this range. Study the animal first to confirm it\'s 3-star before committing the shot.', trackable:false },
  { id:1311, cat:'money', sub:'medium', title:'Rob a store\'s cash register', body:'Quick and repeatable, one register at a time — raises your bounty a little each time, so don\'t do it in the same town back to back.', trackable:false },
  { id:1312, cat:'money', sub:'medium', title:'Sell stolen wagons to the fence', body:'Seamus, the wagon fence at Emerald Ranch, buys stolen wagons specifically — a solid, repeatable amount per wagon delivered.', trackable:false },
  { id:1313, cat:'money', sub:'medium', title:'Rob a stagecoach', body:'Passengers plus whatever cargo is aboard — a decent one-off haul, though it\'ll add to your bounty in that state.', trackable:false },
  { id:1314, cat:'money', sub:'medium', title:'Crack a single train safe', body:'The first couple of cars on most trains usually hold $25–75 in a safe — dynamite it open quickly rather than risking a shootout with the whole train alerted.', trackable:false },
  { id:1320, cat:'money', sub:'big', title:'Gold Bars — the best payout in the game', body:'Each Gold Bar sells to a Fence for roughly $500 — by far the single best per-item payout available. Several caches exist early and don\'t require a treasure map at all: the burned ruins of Limpany (south of the first camp at Horseshoe Overlook), a wrecked train, and a cave with the Strange Statues. Also the reward for the Jack Hall Gang, Poisonous Trail, and High Stakes treasure hunts (see Treasure Maps).', trackable:false },
  { id:1321, cat:'money', sub:'big', title:'A full train robbery', body:'Rather than one safe, working through multiple cars — passengers, baggage car, and every safe on board — before escaping can add up to several hundred dollars in one hit. Higher risk, higher reward.', trackable:false },
  { id:1322, cat:'money', sub:'big', title:'Bandit camp strongboxes', body:'Spot a bandit camp by its campfire smoke, clear it out, and loot both the dead bandits and the strongbox that\'s almost always somewhere in camp — a solid one-off haul for relatively low risk since bandits aren\'t law.', trackable:false },
  { id:1323, cat:'money', sub:'big', title:'Bank robberies', body:'Tied to specific story and stranger content rather than something you can do anytime, but when they come up, they\'re some of the biggest single payouts in the game.', trackable:false },
  { id:14, cat:'secrets', sub:'ghosts', title:'The ghost of Agnes Dowd', body:'Western Bluewater Marsh, Lemoyne, roughly between 9 PM and 3 AM (most reports center on 2 AM). You\'ll hear hysterical wailing before you see her — a glowing figure in a white gown, reliving her final moments. Get close and she vanishes. She can be encountered multiple times, and her story gets progressively darker each time as more of how she died is revealed. Might take a few in-game days of visiting before she shows up.', trackable:true },
  { id:15, cat:'secrets', sub:'strange', title:'Random encounters can reference other stories', body:'A handful of wandering NPCs and hidden scenes are nods to other Rockstar games — easy to miss if you\'re fast-traveling everywhere.', trackable:false },
  { id:1400, cat:'secrets', sub:'ghosts', title:'The ghost train', body:'Tracks northwest of Scarlett Meadows, around 3 AM. A phantom train passes through briefly and then vanishes — it doesn\'t stick around long, so have your camera or attention ready. Also known to spook horses if you get too close.', trackable:true },
  { id:1401, cat:'secrets', sub:'ghosts', title:'The voices of Bolger Glade', body:'No visible ghost here — just haunting voices and echoes of an old battle carrying across the fields at Bolger Glade, Lemoyne. Subtle, but unsettling once you notice it.', trackable:true },

  { id:1409, cat:'secrets', sub:'strange', title:'The meteor house', body:'Northeast of Roanoke Valley and Annesburg — an isolated home with smoke rising from a hole punched clean through its roof. Inside, several corpses surround a small crater; you can pick up the meteorite that caused it. A second, deeper meteor impact site exists further into the forest nearby.', trackable:true },

let activeCat = 'dashboard';
let activeSub = 'all';
let favOnly = false;
let query = '';
let favorites = new Set();
let tracked = new Set();
let foundSet = new Set();
let horseName = '';
let storageReady = false;

// NOTE: this used to call a nonexistent window.storage.get/set API (an artifact-preview-only
// API that doesn't exist in a real browser), so progress silently never persisted at all on
// the live site — every visit "started fresh". Fixed to use real localStorage, same as the
// Skyrim/Oblivion journals, plus the same Gist-backed sync so it survives cleared storage too.
function storageKey(){ return 'rdr2-progress'; }

async function loadProgress(){
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) {
      const parsed = JSON.parse(raw);
      favorites = new Set(parsed.favorites || []);
      tracked = new Set(parsed.tracked || []);
      foundSet = new Set(parsed.found || []);
      horseName = parsed.horseName || '';
    }
  } catch (e) {
    // no saved progress yet, or storage unavailable — start fresh
  }
  storageReady = true;
  const nameInput = document.getElementById('horse-name-input');
  if (nameInput) nameInput.value = horseName;
  renderEntries();
  await syncPullAndReconcile();
}

function saveProgress(){
  try {
    const payload = JSON.stringify({
      favorites: Array.from(favorites),
      tracked: Array.from(tracked),
      found: Array.from(foundSet),
      horseName: horseName,
      updatedAt: Date.now(),
    });
    localStorage.setItem(storageKey(), payload);
    if (window.JawSync) window.JawSync.save(storageKey(), payload);
  } catch (e) {
    console.error('Could not save progress', e);
  }
}

// Pulls the Gist's copy of this journal's progress (if sync is configured) and adopts it
// if it's newer than what's in localStorage — recovers progress after cleared storage,
// a reinstall, or opening on a new device. Local storage stays the fast, offline-safe path.
async function syncPullAndReconcile(){
  if (!window.JawSync) return;
  try {
    const remote = await window.JawSync.pull(storageKey());
    if (!remote) return;
    const remoteParsed = JSON.parse(remote);
    const localRaw = localStorage.getItem(storageKey());
    const localParsed = localRaw ? JSON.parse(localRaw) : null;
    if (!localParsed || (remoteParsed.updatedAt || 0) > (localParsed.updatedAt || 0)) {
      favorites = new Set(remoteParsed.favorites || []);
      tracked = new Set(remoteParsed.tracked || []);
      foundSet = new Set(remoteParsed.found || []);
      horseName = remoteParsed.horseName || '';
      localStorage.setItem(storageKey(), remote);
      const nameInput = document.getElementById('horse-name-input');
      if (nameInput) nameInput.value = horseName;
      renderEntries();
    }
  } catch (e) { console.error('Sync pull failed', e); }
}

function countFor(catId){ return TIPS.filter(t => t.cat === catId).length; }

function renderTabs(){
  const dashBtn = `
    <button class="tab-btn ${activeCat==='dashboard'?'active':''}" data-cat="dashboard">
      <span class="icon">🏠</span> Overview
    </button>`;
  const allBtn = (active) => `
    <button class="tab-btn ${activeCat==='all'?'active':''}" data-cat="all">
      <span class="icon">📖</span> All <span class="count">${TIPS.length}</span>
    </button>`;
  const catBtns = CATEGORIES.map(c => `
    <button class="tab-btn ${activeCat===c.id?'active':''}" data-cat="${c.id}">
      <span class="icon">${c.icon}</span> ${c.label} <span class="count">${countFor(c.id)}</span>
    </button>`).join('');
  const html = dashBtn + allBtn() + catBtns;
  document.getElementById('tabs-desktop').innerHTML = html;
  document.getElementById('tabs-mobile').innerHTML = html;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      activeSub = 'all';
      renderTabs();
      renderSubTabs();
      renderEntries();
    });
  });
}

function statFor(cat, sub){
  const scoped = sub
    ? TIPS.filter(t => t.cat === cat && t.sub === sub && t.trackable)
    : TIPS.filter(t => t.cat === cat && t.trackable);
  const done = scoped.filter(t => tracked.has(t.id)).length;
  return { done, total: scoped.length };
}

function renderDashboard(){
  const container = document.getElementById('entries');
  const compendium = statFor('compendium');
  const challenges = statFor('challenges');
  const goldMedals = statFor('gold-medals');
  const treasure = statFor('treasure');
  const clothing = statFor('clothing');
  const horseBreeds = TIPS.filter(t => t.cat === 'horses' && t.sub === 'breeds' && t.trackable);
  const horsesFound = horseBreeds.filter(t => foundSet.has(t.id)).length;
  const horsesAcquired = horseBreeds.filter(t => tracked.has(t.id)).length;
  const favCount = favorites.size;

  const cards = [
    { label: 'Compendium', icon: '📚', done: compendium.done, total: compendium.total, cat: 'compendium', sub: 'all' },
    { label: 'Challenges', icon: '🏆', done: challenges.done, total: challenges.total, cat: 'challenges', sub: 'all' },
    { label: '100% Mission Tips', icon: '🏅', done: goldMedals.done, total: goldMedals.total, cat: 'gold-medals', sub: 'all' },
    { label: 'Treasure Maps', icon: '🗺️', done: treasure.done, total: treasure.total, cat: 'treasure', sub: 'all' },
    { label: 'Clothing', icon: '👔', done: clothing.done, total: clothing.total, cat: 'clothing', sub: 'all' },
  ];

  const cardHtml = cards.map(c => {
    const pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
    return `
    <div class="dash-card" data-nav-cat="${c.cat}" data-nav-sub="${c.sub}">
      <div class="dash-card-top">
        <span class="dash-icon">${c.icon}</span>
        <span class="dash-label">${c.label}</span>
      </div>
      <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${pct}%;"></div></div>
      <div class="dash-count">${c.done} of ${c.total} — ${pct}%</div>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="dash-grid">${cardHtml}</div>
    <div class="dash-card" data-nav-cat="horses" data-nav-sub="breeds" style="margin-top:14px;">
      <div class="dash-card-top">
        <span class="dash-icon">🐴</span>
        <span class="dash-label">Wild Horse Breeds</span>
      </div>
      <div class="dash-count">${horsesFound} found, ${horsesAcquired} acquired (of ${horseBreeds.length})</div>
    </div>
    <div class="dash-card" data-nav-cat="all" data-nav-sub="all" data-nav-fav="true" style="margin-top:14px;">
      <div class="dash-card-top">
        <span class="dash-icon">★</span>
        <span class="dash-label">Favorites Saved</span>
      </div>
      <div class="dash-count">${favCount} ${favCount === 1 ? 'entry' : 'entries'} starred across the whole journal</div>
    </div>

    <div class="reset-zone">
      <button id="reset-progress-btn" class="reset-btn">Reset All Progress</button>
      <span class="reset-hint">Clears every checkmark and favorite — can't be undone.</span>
    </div>
  `;

  let resetArmed = false;
  let resetTimer = null;
  const resetBtn = document.getElementById('reset-progress-btn');
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = 'Are you sure? Click to confirm';
      resetBtn.classList.add('armed');
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        resetArmed = false;
        resetBtn.textContent = 'Reset All Progress';
        resetBtn.classList.remove('armed');
      }, 4000);
    } else {
      clearTimeout(resetTimer);
      favorites = new Set();
      tracked = new Set();
      foundSet = new Set();
      saveProgress();
      renderTabs();
      renderDashboard();
    }
  });

  container.querySelectorAll('.dash-card[data-nav-cat]').forEach(card => {
    card.addEventListener('click', () => {
      activeCat = card.dataset.navCat;
      activeSub = card.dataset.navSub || 'all';
      favOnly = card.dataset.navFav === 'true';
      renderTabs();
      renderSubTabs();
      renderEntries();
      document.querySelectorAll('.filter-pill[data-fav]').forEach(p => {
        p.classList.toggle('active', p.dataset.fav === (favOnly ? 'favorites' : 'all'));
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function renderSubTabs(){
  const nameBar = document.getElementById('horse-name-bar');
  if (nameBar) nameBar.style.display = (activeCat === 'horses') ? 'flex' : 'none';
  const subRow = document.getElementById('sub-row');
  const subs = SUBCATS[activeCat];
  if (!subs) {
    subRow.style.display = 'none';
    subRow.innerHTML = '';
    return;
  }
  subRow.style.display = 'flex';
  const allCount = TIPS.filter(t => t.cat === activeCat).length;
  let pills = [`<span class="filter-pill ${activeSub==='all'?'active':''}" data-sub="all">All (${allCount})</span>`];
  if (activeCat === 'clothing') {
    const legCount = TIPS.filter(t => t.cat === 'clothing' && LEGENDARY_CLOTHING_SUBS.includes(t.sub)).length;
    pills.push(`<span class="filter-pill ${activeSub==='legendary-group'?'active':''}" data-sub="legendary-group">🏆 Legendary Clothing (${legCount})</span>`);
  }
  pills = pills.concat(subs.map(s => {
      const count = TIPS.filter(t => t.cat === activeCat && t.sub === s.id).length;
      return `<span class="filter-pill ${activeSub===s.id?'active':''}" data-sub="${s.id}">${s.icon} ${s.label} (${count})</span>`;
    }));
  subRow.innerHTML = pills.join('');
  subRow.querySelectorAll('[data-sub]').forEach(pill => {
    pill.addEventListener('click', () => {
      activeSub = pill.dataset.sub;
      renderSubTabs();
      renderEntries();
    });
  });
}

function renderEntries(){
  const container = document.getElementById('entries');
  container.classList.toggle('dashboard-mode', activeCat === 'dashboard');
  const searchRowEls = document.querySelectorAll('.search-row');
  if (activeCat === 'dashboard') {
    searchRowEls.forEach(el => el.style.display = 'none');
    const nameBar = document.getElementById('horse-name-bar');
    if (nameBar) nameBar.style.display = 'none';
    renderDashboard();
    return;
  } else {
    if (searchRowEls[0]) searchRowEls[0].style.display = 'flex';
  }
  let list = TIPS.filter(t => activeCat === 'all' || t.cat === activeCat);
  if (activeCat === 'clothing' && activeSub === 'legendary-group') {
    list = list.filter(t => LEGENDARY_CLOTHING_SUBS.includes(t.sub));
  } else if (SUBCATS[activeCat] && activeSub !== 'all') {
    list = list.filter(t => t.sub === activeSub);
  }
  if (favOnly) list = list.filter(t => favorites.has(t.id));
  if (query.trim()){
    const q = query.toLowerCase();
    list = list.filter(t => t.title.toLowerCase().includes(q) || t.body.toLowerCase().includes(q));
  }

  const progressEl = document.getElementById('progress-tally');
  if (activeCat === 'horses' && activeSub === 'breeds') {
    const scoped = TIPS.filter(t => t.cat === 'horses' && t.sub === 'breeds' && t.trackable);
    const foundCount = scoped.filter(t => foundSet.has(t.id)).length;
    const acquiredCount = scoped.filter(t => tracked.has(t.id)).length;
    progressEl.textContent = `${foundCount} found, ${acquiredCount} acquired (of ${scoped.length})`;
    progressEl.style.display = 'inline';
  } else if (activeCat === 'clothing') {
    const scoped = activeSub === 'all'
      ? TIPS.filter(t => t.cat === 'clothing' && t.trackable)
      : activeSub === 'legendary-group'
        ? TIPS.filter(t => t.cat === 'clothing' && t.trackable && LEGENDARY_CLOTHING_SUBS.includes(t.sub))
        : TIPS.filter(t => t.cat === 'clothing' && t.sub === activeSub && t.trackable);
    const gotCount = scoped.filter(t => tracked.has(t.id)).length;
    progressEl.textContent = `${gotCount} of ${scoped.length} crafted`;
    progressEl.style.display = 'inline';
  } else if (activeCat === 'compendium' || activeCat === 'gold-medals' || activeCat === 'treasure') {
    const scoped = activeSub === 'all'
      ? TIPS.filter(t => t.cat === activeCat && t.trackable)
      : TIPS.filter(t => t.cat === activeCat && t.sub === activeSub && t.trackable);
    const gotCount = scoped.filter(t => tracked.has(t.id)).length;
    const label = activeCat === 'compendium' ? 'found' : activeCat === 'gold-medals' ? 'gold' : 'found';
    progressEl.textContent = `${gotCount} of ${scoped.length} ${label}`;
    progressEl.style.display = 'inline';
  } else {
    progressEl.style.display = 'none';
  }

  if (list.length === 0){
    container.innerHTML = `<div class="empty-state">Nothing here yet, partner. Try another tab or clear the search.</div>`;
    return;
  }

  container.innerHTML = list.map(t => {
    const cat = CATEGORIES.find(c => c.id === t.cat);
    const sub = t.sub && SUBCATS[t.cat] ? SUBCATS[t.cat].find(s => s.id === t.sub) : null;
    const footLabel = sub ? `${sub.icon} ${sub.label}` : `${cat.icon} ${cat.label}`;
    const isFav = favorites.has(t.id);
    const isTracked = tracked.has(t.id);
    const isFound = foundSet.has(t.id);
    const isCollectible = t.cat === 'compendium' || t.cat === 'treasure';
    const isGoldMedal = t.cat === 'gold-medals';
    const trackLabel = isCollectible ? (isTracked ? 'Got it' : 'Need it')
      : isGoldMedal ? (isTracked ? 'Got gold' : 'Mark gold')
      : (isTracked ? 'Done' : 'Mark done');
    const trackButtons = t.dualTrack
      ? `<button class="track-btn ${isFound ? 'is-on' : ''}" data-found="${t.id}"><span class="box"></span> ${isFound ? 'Found' : 'Mark found'}</button>
         <button class="track-btn ${isTracked ? 'is-on' : ''}" data-track="${t.id}"><span class="box"></span> ${isTracked ? 'Acquired' : 'Mark acquired'}</button>`
      : (t.trackable ? `<button class="track-btn" data-track="${t.id}"><span class="box"></span> ${trackLabel}</button>` : '');
    let displayBody = t.body;
    let displayTitle = t.title;
    if (t.cat === 'horses' && t.sub === 'bonding' && horseName.trim()) {
      const name = horseName.trim();
      displayBody = displayBody.replace(/\bthe horse\b/gi, name).replace(/\byour horse\b/gi, name);
      displayTitle = displayTitle.replace(/\bthe horse\b/gi, name).replace(/\byour horse\b/gi, name);
    }
    const animalLinks = (t.linkAnimals || []).map(name =>
      `<button class="animal-link-btn" data-link-animal="${name}">🔗 ${name}</button>`
    ).join('');
    return `
    <article class="entry ${isTracked ? 'tracked' : ''}" data-id="${t.id}">
      <div class="entry-top">
        <h3>${displayTitle}</h3>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${t.id}" aria-label="Favorite">★</button>
      </div>
      <p>${displayBody}</p>
      ${animalLinks ? `<div class="animal-links">${animalLinks}</div>` : ''}
      <div class="entry-foot">
        <span>${footLabel}</span>
        <span style="display:flex; gap:6px;">${trackButtons}</span>
      </div>
    </article>`;
  }).join('');

  container.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.fav);
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      renderEntries();
      saveProgress();
    });
  });
  container.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderEntries();
      saveProgress();
    });
  });
  container.querySelectorAll('[data-found]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.found);
      foundSet.has(id) ? foundSet.delete(id) : foundSet.add(id);
      renderEntries();
      saveProgress();
    });
  });

  container.querySelectorAll('[data-link-animal]').forEach(btn => {
    btn.addEventListener('click', () => {
      const animalName = btn.dataset.linkAnimal;
      const targetId = LEGENDARY_ANIMAL_IDS[animalName];
      if (!targetId) return;
      activeCat = 'compendium';
      activeSub = 'legendary-animals';
      favOnly = false;
      query = '';
      const searchInput = document.getElementById('search');
      if (searchInput) searchInput.value = '';
      renderTabs();
      renderSubTabs();
      renderEntries();
      document.querySelectorAll('.filter-pill[data-fav]').forEach(p => {
        p.classList.toggle('active', p.dataset.fav === 'all');
      });
      const targetCard = document.querySelector(`.entry[data-id="${targetId}"]`);
      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        targetCard.classList.add('flash-highlight');
        setTimeout(() => targetCard.classList.remove('flash-highlight'), 2200);
      }
    });
  });
}

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  renderEntries();
});

let horseNameSaveTimer = null;
document.getElementById('horse-name-input').addEventListener('input', e => {
  horseName = e.target.value;
  renderEntries();
  clearTimeout(horseNameSaveTimer);
  horseNameSaveTimer = setTimeout(saveProgress, 500);
});

document.querySelectorAll('.filter-pill[data-fav]').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.filter-pill[data-fav]').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    favOnly = pill.dataset.fav === 'favorites';
    renderEntries();
  });
});

renderTabs();
renderSubTabs();
loadProgress();
window.__jawSyncOnConfigured = syncPullAndReconcile;

/* ============================= BACK TO TOP ============================= */

const backToTopBtn = document.getElementById('back-to-top');
window.addEventListener('scroll', () => {
  backToTopBtn.classList.toggle('visible', window.scrollY > 600);
});
backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
</script>
