<style>
  :root {
    /* Editorial almanac — warm paper, ink, rust & olive field-guide accents */
    --void: #f2ebda;
    --stone-1: #eee5d0;
    --stone-2: #e7dabd;
    --stone-3: #ddccA5;
    --stone-4: #d0bb8c;
    --stone-5: #bfa877;
    --panel: rgba(255, 253, 246, 0.86);
    --panel-hi: rgba(34, 26, 15, 0.035);
    --iron: #ddccA5;
    --iron-light: #c9a876;
    /* olive — secondary accent, used for favorites/stars */
    --amber: #6a7a45;
    --amber-dim: #4e5b33;
    /* rust — primary accent, key highlights */
    --gold: #a84e2a;
    --gold-bright: #7d3a1f;
    --gold-dim: #c98a5e;
    /* text */
    --heading: #201a10;
    --ink: #3c3521;
    --ink-soft: #756b4e;
    --ink-dim: #9c8f6c;
    --blood: #a3402b;
    --sage-ok: #5f7440;
    --moss: #6a7a45;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--void);
    background-image:
      radial-gradient(ellipse at 20% -10%, rgba(168,78,42,0.05), transparent 45%),
      radial-gradient(ellipse at 100% 0%, rgba(106,122,69,0.05), transparent 40%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 0 0 60px;
    -webkit-font-smoothing: antialiased;
  }

  .tome {
    width: min(94vw, 980px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ---------- TOP NAV (single bar, all breakpoints) ---------- */
  .nav {
    display: flex;
    align-items: stretch;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    gap: 2px;
    background: var(--panel);
    border: 1px solid var(--iron);
    border-radius: 10px;
    padding: 6px;
    margin: 22px 0 0;
    position: sticky;
    top: 12px;
    z-index: 30;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(60, 44, 20, 0.06);
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav::before { content: none; }
  .nav-brand {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--gold-bright);
    display: flex;
    align-items: center;
    letter-spacing: 0.02em;
    padding: 0 14px;
    margin-right: 4px;
    border-right: 1px solid var(--iron);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .nav-btn {
    all: unset;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: background .15s ease, color .15s ease;
    border-radius: 7px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nav-btn .icon { font-size: 14px; flex-shrink: 0; width: 16px; text-align: center; }
  .nav-btn:hover { background: rgba(168,78,42,0.08); color: var(--heading); }
  .nav-btn.active {
    background: var(--gold);
    color: #fff8ee;
  }

  .nav-mobile { display: none !important; }

  /* ---------- MAIN PAGE ---------- */
  .page {
    flex: 1;
    min-width: 0;
    padding: 36px 4px 60px;
  }

  .title-block { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  .title-block h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -0.01em;
    color: var(--heading);
    margin: 0 0 4px;
    line-height: 1.08;
  }
  .subtitle { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em; font-style: italic; }
  .seal {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-bright);
    border: 1px solid var(--iron);
    border-radius: 999px;
    background: var(--panel);
    padding: 8px 14px;
    text-align: center;
    line-height: 1.5;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .rune-divider {
    height: 1px;
    margin: 20px 0 26px;
    background: linear-gradient(90deg, var(--iron), var(--iron) 100%);
  }

  .search-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px; }
  .search-plate {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--iron);
    border-radius: 9px;
    padding: 10px 14px;
    min-width: 220px;
    flex: 1;
  }
  .search-plate input {
    background: transparent; border: none; outline: none;
    color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13.5px; width: 100%;
  }
  .search-plate input::placeholder { color: var(--ink-dim); }

  .filter-pill {
    font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 9px 13px; border: 1px solid var(--iron); border-radius: 999px; color: var(--ink-soft);
    cursor: pointer; user-select: none; white-space: nowrap; background: var(--panel);
  }
  .filter-pill.active { border-color: var(--gold); color: #fff8ee; background: var(--gold); }

  .btn {
    all: unset; cursor: pointer;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11.5px; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 10px 18px; border: 1px solid var(--iron); border-radius: 8px; color: var(--ink-soft); background: var(--panel);
  }
  .btn:hover { color: var(--gold-bright); border-color: var(--gold-dim); background: #fffdf7; }
  .btn.primary { border-color: var(--gold); color: #fff8ee; background: var(--gold); }
  .btn.primary:hover { background: var(--gold-bright); border-color: var(--gold-bright); color: #fff8ee; }
  .btn.danger { border-color: #d3ada0; color: var(--blood); }
  .btn.danger:hover { background: rgba(163,64,43,0.08); }
  .btn.small { padding: 6px 11px; font-size: 10px; }

  /* ---------- GRIDS / CARDS ---------- */
  .entries { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--iron);
    border-radius: 10px;
    padding: 17px 19px;
    position: relative;
    box-shadow: 0 1px 2px rgba(60,44,20,0.03);
  }
  .card.owned { border-color: var(--gold-dim); box-shadow: inset 0 0 0 1px rgba(168,78,42,0.18), 0 1px 2px rgba(60,44,20,0.03); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .card-title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 19px; color: var(--heading); letter-spacing: -0.005em; }
  .card-tag { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold-bright); border: 1px solid var(--iron); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .card-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin: 4px 0 10px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--ink-dim); margin-bottom: 10px; }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .checkbox {
    width: 19px; height: 19px; border: 1px solid var(--iron); border-radius: 5px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    color: #fff8ee; font-size: 12px; background: var(--panel);
  }
  .checkbox.checked { border-color: var(--gold); background: var(--gold); }

  .rank-stepper { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft); }
  .rank-stepper button {
    all: unset; cursor: pointer; width: 21px; height: 21px; text-align: center;
    border: 1px solid var(--iron); border-radius: 5px; color: var(--gold-bright); line-height: 19px;
  }
  .rank-stepper button:hover { background: rgba(168,78,42,0.08); }

  input[type=number], input[type=text], textarea, select {
    background: var(--panel); border: 1px solid var(--iron); border-radius: 7px; color: var(--ink);
    font-family: 'Inter', sans-serif; font-size: 13px; padding: 8px 11px; outline: none;
  }
  input[type=number] { width: 64px; }
  textarea { width: 100%; resize: vertical; min-height: 70px; font-family: 'Inter', sans-serif; }
  input:focus, textarea:focus, select:focus { border-color: var(--gold-dim); }
  label.field-label { display: block; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 6px; font-weight: 600; }

  .form-panel { background: var(--panel); border: 1px solid var(--iron); border-radius: 12px; padding: 22px; margin-bottom: 16px; }
  .form-row { margin-bottom: 16px; }
  .form-grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .form-grid7 .stat-box { text-align: center; }
  .form-grid7 .stat-box label { display:block; font-size: 10px; color: var(--gold-bright); margin-bottom: 5px; letter-spacing: 0.05em; font-weight: 600; }
  .form-grid7 input { width: 100%; text-align: center; }

  .stat-group-head {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 20px; color: var(--heading);
    display: flex; align-items: center; gap: 8px; margin: 26px 0 12px; letter-spacing: -0.005em;
    border-bottom: 1px solid var(--iron); padding-bottom: 8px;
  }
  .stat-group-head:first-child { margin-top: 0; }
  .stat-points { font-size: 11px; color: var(--ink-dim); font-weight: normal; text-transform: none; letter-spacing: normal; font-family: 'Inter', sans-serif; }
  .stat-points.over { color: var(--blood); }

  .empty-state { color: var(--ink-dim); font-size: 13px; padding: 34px 10px; text-align: center; border: 1px dashed var(--iron); border-radius: 10px; }

  .progress-tally { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; color: var(--sage-ok); }

  .note-card { background: var(--panel); border: 1px solid var(--iron); border-radius: 10px; padding: 17px 19px; }
  .note-card h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 19px; color: var(--heading); margin: 0 0 4px; }
  .note-card .note-date { font-size: 10.5px; color: var(--ink-dim); margin-bottom: 8px; }
  .note-card .note-body { font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; line-height: 1.55; }

  .stat-tally-row { display: flex; gap: 26px; flex-wrap: wrap; margin: 22px 0 4px; }
  .stat-tally { text-align: center; }
  .stat-tally .n { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 32px; color: var(--gold-bright); }
  .stat-tally .l { font-size: 10px; color: var(--ink-dim); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }

  .overview-lede { font-size: 14.5px; color: var(--ink-soft); line-height: 1.75; max-width: 640px; }
  .overview-lede code { color: var(--gold-bright); font-family: 'Inter', sans-serif; font-weight: 600; background: rgba(168,78,42,0.08); padding: 1px 5px; border-radius: 4px; }

  .countdown-display {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 30px;
    color: var(--gold-bright); margin: 8px 0 2px; font-variant-numeric: tabular-nums;
  }
  .countdown-local { font-size: 12px; color: var(--sage-ok); font-weight: 600; margin-bottom: 10px; }
  .countdown-advanced { margin-top: 10px; }
  .countdown-advanced summary {
    cursor: pointer; font-size: 11px; color: var(--ink-dim); letter-spacing: 0.02em;
    list-style: none;
  }
  .countdown-advanced summary::-webkit-details-marker { display: none; }
  .countdown-advanced summary::before { content: "▸ "; }
  .countdown-advanced[open] summary::before { content: "▾ "; }
  .countdown-advanced summary:hover { color: var(--gold-bright); }

  .star-btn { all: unset; cursor: pointer; font-size: 16px; color: var(--ink-dim); }
  .star-btn.active { color: var(--amber); }

  .back-to-top {
    position: fixed; left: 22px; bottom: 22px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); backdrop-filter: blur(4px);
    border: 1px solid var(--iron); color: var(--gold-bright); cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
    box-shadow: 0 8px 20px rgba(60,44,20,0.1);
  }
  .back-to-top.show { opacity: 1; pointer-events: auto; }

  footer.note { text-align: center; font-size: 11px; color: var(--ink-dim); margin-top: 44px; letter-spacing: 0.02em; }

  /* ---------- FINDER ---------- */
  .finder-hero { margin-bottom: 22px; }
  .finder-searchbar {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--iron); border-radius: 12px;
    padding: 16px 18px; box-shadow: 0 8px 24px rgba(60,44,20,0.06);
  }
  .finder-searchbar span.icon { font-size: 18px; }
  .finder-searchbar input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--ink); font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 500;
  }
  .finder-searchbar input::placeholder { color: var(--ink-dim); font-style: italic; }
  .finder-hint { font-size: 12px; color: var(--ink-dim); margin-top: 10px; padding: 0 4px; line-height: 1.5; }
  .finder-result { cursor: pointer; transition: border-color .15s ease, transform .1s ease; }

  /* ---------- FINDER: ASK THE ASSISTANT (chat) ---------- */
  .chat-panel {
    background: var(--panel); border: 1px solid var(--iron); border-radius: 12px;
    padding: 16px 18px 18px; margin-top: 22px;
  }
  .chat-panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .chat-panel-head h3 { margin: 0; font-size: 15px; }
  .chat-panel-sub { font-size: 12px; color: var(--ink-dim); margin: 0 0 12px; line-height: 1.5; }
  .chat-endpoint-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .chat-endpoint-row input { flex: 1; min-width: 200px; }
  .chat-endpoint-status { font-size: 11px; }
  .chat-endpoint-status.ok { color: var(--sage-ok); }
  .chat-endpoint-status.missing { color: var(--ink-dim); }
  .chat-log { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; margin-bottom: 12px; padding-right: 2px; }
  .chat-log:empty { display: none; }
  .chat-msg { padding: 9px 13px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; max-width: 88%; white-space: pre-wrap; }
  .chat-msg.user { align-self: flex-end; background: var(--gold-bright); color: #fff; }
  .chat-msg.assistant { align-self: flex-start; background: var(--stone-2); border: 1px solid var(--iron); }
  .chat-msg.error { align-self: flex-start; background: rgba(163,64,43,0.1); border: 1px solid rgba(163,64,43,0.4); color: var(--blood); }
  .chat-msg.pending { opacity: 0.6; font-style: italic; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row textarea {
    flex: 1; resize: vertical; min-height: 40px; max-height: 140px;
    font-family: inherit; font-size: 13.5px; padding: 9px 12px;
    border: 1px solid var(--iron); border-radius: 8px; background: var(--void); color: var(--ink);
  }
  .finder-result:hover { border-color: var(--gold-dim); }

  @media (min-width: 900px) { .grid2.wide { grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); } }

  @media (max-width: 780px) {
    .tome { width: 100%; }
    .page { padding: 28px 18px 40px; }
    .title-block h1 { font-size: 32px; }
    .form-grid7 { grid-template-columns: repeat(4, 1fr); }
  }

  /* ---- shared accessibility defaults (JAW Digital suite) ---- */
  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
    border-radius: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

<div class="tome">
  <nav class="nav" id="nav-desktop"></nav>
  <nav class="nav-mobile" id="nav-mobile"></nav>

  <main class="page">
    <header class="title-block">
      <div>
        <h1 id="page-title">Vault Dweller's Almanac</h1>
        <div class="subtitle" id="page-subtitle">— a survival record for Appalachia —</div>
      </div>
      <!-- PIP-OS version is this journal's own revision number, not flavor text — bump it by
           hand on every merged change to this file: +0.0.1 for a fix/tweak, +0.1.0 for a new
           section/feature, +1.0.0 for a full redesign. Reset the lower part(s) to 0 on a bump,
           same as normal semver. Current: v2.5.0 (Weapons section + AI chat in Finder). -->
      <div class="seal">RobCo<br/>PIP-OS v2.5.0</div>
    </header>
    <div class="rune-divider"></div>

    <div class="search-row" id="search-row" style="display:none;">
      <div class="search-plate">
        <span>🔎</span>
        <input id="search" type="text" placeholder="Search perk cards…" />
      </div>
      <span class="filter-pill active" data-fav="all">All cards</span>
      <span class="filter-pill" data-fav="owned">★ Owned only</span>
      <span id="progress-tally" class="progress-tally" style="display:none;"></span>
    </div>

    <section id="content"></section>

    <footer class="note">JAW Digital</footer>
  </main>
</div>

<button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">↑</button>

<script>

/* ============================================================
   DATA
   ============================================================ */

const SECTIONS = [

];

const SPECIALS = [
  { id: 'S', name: 'Strength',    icon: '💪', desc: 'Melee & heavy gun damage, carry weight.' },
  { id: 'P', name: 'Perception',  icon: '👁️', desc: 'Ranged accuracy, lockpicking, VATS.' },

function storageKey(){ return 'fallout76-journal-progress'; }
function navStateKey(){ return 'fallout76-journal-lastview'; }

function loadProgress(){
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) {
      const parsed = JSON.parse(raw);
      ownedCards = new Set(parsed.ownedCards || []);
      cardRank = parsed.cardRank || {};
      plans = parsed.plans || [];
      stockpile = parsed.stockpile || {};
      notesList = parsed.notesList || [];
      questProgress = parsed.questProgress || {};
      weaponProgress = parsed.weaponProgress || {};
      creatureProgress = parsed.creatureProgress || {};
      storyProgress = parsed.storyProgress || {};
      dailyProgress = parsed.dailyProgress || {};
      customDailies = parsed.customDailies || [];
      countdownSettings = Object.assign({ resetHourET: 12, seasonEndsAt: '' }, parsed.countdownSettings || {});
    }
  } catch (e) { /* start fresh */ }
  // seed default stars for resources not yet touched
  RESOURCES.forEach(r => {
    if (!stockpile[r.id]) stockpile[r.id] = { target: 0, have: false, starred: r.starDefault, note: '' };
  });
  REPEATABLES.forEach(q => {
    if (!questProgress[q.id]) questProgress[q.id] = { timesRun: 0, favorite: false, note: '' };
  });
  WEAPONS.forEach(w => {
    if (!weaponProgress[w.id]) weaponProgress[w.id] = { favorite: false, note: '' };
  });
  CREATURE_POIS.forEach(c => {
    if (!creatureProgress[c.id]) creatureProgress[c.id] = { hunted: false, favorite: false, note: '' };
  });
  STORY_QUESTS.forEach(q => {
    if (!storyProgress[q.id]) storyProgress[q.id] = { done: false, note: '' };
  });
  DAILY_TASKS.forEach(t => {
    if (!dailyProgress[t.id]) dailyProgress[t.id] = { lastDoneDate: null, streak: 0 };
  });
}

function saveProgress(){
  try {
    const state = {
      ownedCards: Array.from(ownedCards),
      cardRank,
      plans,
      stockpile,
      notesList,
      questProgress,
      weaponProgress,
      creatureProgress,
      storyProgress,
      dailyProgress,
      customDailies,
      countdownSettings,
      updatedAt: Date.now(),
    };
    const payload = JSON.stringify(state);
    localStorage.setItem(storageKey(), payload);
    if (window.JawSync) window.JawSync.save(storageKey(), payload);
    if (window.JawAccount && window.JawAccount.isSignedIn()) window.JawAccount.save('fallout76', state);
  } catch (e) { console.error('Could not save progress', e); }
}

async function syncPullAndReconcile(){
  if (window.JawSync && window.JawSync.load) {
    try {
      const remote = await window.JawSync.load(storageKey());
      const localRaw = localStorage.getItem(storageKey());
      const remoteParsed = remote && JSON.parse(remote);
      const localParsed = localRaw && JSON.parse(localRaw);
      if (remoteParsed && (!localParsed || (remoteParsed.updatedAt||0) > (localParsed.updatedAt||0))) {
        localStorage.setItem(storageKey(), remote);
        loadProgress(); renderAll();
      }
    } catch (e) { /* ignore */ }
  }
  if (!window.JawAccount || !window.JawAccount.isSignedIn()) return;
  try {
    const remote = await window.JawAccount.load('fallout76');
    const localRaw = localStorage.getItem(storageKey());
    const localParsed = localRaw && JSON.parse(localRaw);
    if (remote && (!localParsed || (remote.updatedAt||0) > (localParsed.updatedAt||0))) {
      localStorage.setItem(storageKey(), JSON.stringify(remote));
      loadProgress(); renderAll();
    }
  } catch (e) { /* ignore */ }
}

  try { localStorage.setItem(navStateKey(), JSON.stringify({ section: activeSection })); } catch(e){}

function loadNavState(){
  try {
    const raw = localStorage.getItem(navStateKey());
    if (raw) { const p = JSON.parse(raw); if (p.section) activeSection = p.section; }
  } catch(e){}
}

/* ============================================================
   COUNTDOWNS — weekly reset & Season end, computed against Eastern Time
   without any date library, using the Intl API to read ET wall-clock
   time regardless of the visitor's own timezone.
   ============================================================ */

const RESET_TZ = 'America/New_York';
const DOW = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };

// Wall-clock fields for `date` as seen in RESET_TZ, down to the second — the offset
// calculation below compares this against date.getTime() (full ms precision), so it needs
// matching precision or the "leftover" seconds within the current minute leak in as a fake
// offset that changes every tick and makes the countdown's seconds jitter instead of
// counting down steadily.
function etParts(date){
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: RESET_TZ, weekday: 'short',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
  });
  const parts = {};
  fmt.formatToParts(date).forEach(p => { if (p.type !== 'literal') parts[p.type] = p.value; });
  return { weekday: parts.weekday, year: +parts.year, month: +parts.month, day: +parts.day, hour: +parts.hour, minute: +parts.minute, second: +parts.second };
}

// RESET_TZ's current offset from UTC, in minutes (negative = behind UTC). Recomputed from
// "now" each call so it tracks EST/EDT automatically; good enough for a countdown that only
// ever targets a date within the current or next week.
function etOffsetMinutes(date){
  const p = etParts(date);
  const asIfUTC = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
  return (asIfUTC - date.getTime()) / 60000;
}

// Absolute timestamp (ms) for a given calendar date at `hour`:00:00 Eastern Time.
function etDateTimeToMs(year, month, day, hour){
  const offsetMin = etOffsetMinutes(new Date());
  return Date.UTC(year, month - 1, day, hour, 0, 0) - offsetMin * 60000;
}

// Next occurrence of the weekly reset (Tuesdays at resetHourET, Eastern Time).
function nextWeeklyResetMs(resetHourET){
  const now = new Date();
  const p = etParts(now);
  let daysUntil = (DOW.Tue - DOW[p.weekday] + 7) % 7;
  if (daysUntil === 0 && (p.hour * 60 + p.minute) >= resetHourET * 60) daysUntil = 7;
  const baseUTC = Date.UTC(p.year, p.month - 1, p.day) + daysUntil * 86400000;
  const target = new Date(baseUTC);
  return etDateTimeToMs(target.getUTCFullYear(), target.getUTCMonth() + 1, target.getUTCDate(), resetHourET);
}

// Next occurrence of the *daily* reset — same reset hour as the weekly one, but every day
// instead of only Tuesdays (Bethesda runs the daily rollover at the same time of day).
function nextDailyResetMs(resetHourET){
  const now = new Date();
  const p = etParts(now);
  const passedToday = (p.hour * 60 + p.minute) >= resetHourET * 60;
  const baseUTC = Date.UTC(p.year, p.month - 1, p.day) + (passedToday ? 86400000 : 0);
  const target = new Date(baseUTC);
  return etDateTimeToMs(target.getUTCFullYear(), target.getUTCMonth() + 1, target.getUTCDate(), resetHourET);
}

// 'YYYY-MM-DD' for the daily-reset calendar day currently in effect (Eastern Time), so
// "today" flips at the game's own reset hour rather than at local midnight — the same clock
// DAILY_TASKS/customDailies compare lastDoneDate against.
function currentResetDayKey(resetHourET){
  const p = etParts(new Date());
  const passedToday = (p.hour * 60 + p.minute) >= resetHourET * 60;
  const baseUTC = Date.UTC(p.year, p.month - 1, p.day) - (passedToday ? 0 : 86400000);
  const d = new Date(baseUTC);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;
}
function dayBeforeKey(key){
  const [y,m,d] = key.split('-').map(Number);
  const d2 = new Date(Date.UTC(y, m-1, d) - 86400000);
  return `${d2.getUTCFullYear()}-${pad2(d2.getUTCMonth()+1)}-${pad2(d2.getUTCDate())}`;
}
function isDoneToday(entry){ return entry.lastDoneDate === currentResetDayKey(countdownSettings.resetHourET); }
// Toggles a daily task's done-for-today state. Marking done bumps the streak if yesterday
// (by the reset clock) was also done, otherwise starts a new streak at 1; un-marking just
// clears today's date (streak isn't decremented — that's for the next missed reset to handle
// naturally, since streak is derived from lastDoneDate rather than stored history).
function toggleDaily(entry){
  const today = currentResetDayKey(countdownSettings.resetHourET);
  if (entry.lastDoneDate === today) {
    entry.lastDoneDate = null;
  } else {
    entry.streak = (entry.lastDoneDate === dayBeforeKey(today)) ? (entry.streak || 0) + 1 : 1;
    entry.lastDoneDate = today;
  }
}

function pad2(n){ return n.toString().padStart(2, '0'); }

// Formats an absolute timestamp in the *viewer's own* timezone — this is what makes the
// countdown usable without doing any US-time math yourself, wherever you are.
function formatLocalMoment(ms){
  return new Date(ms).toLocaleString(undefined, {
    weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
  });
}

function formatCountdown(ms){
  if (ms <= 0) return 'Resetting…';
  const totalSec = Math.floor(ms / 1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  return (days > 0 ? `${days}d ` : '') + `${pad2(hours)}:${pad2(mins)}:${pad2(secs)}`;
}

// Updates the two countdown displays in place (no full re-render) — called every second and
// right after the Overview renders. No-ops harmlessly on any other page.
function tickCountdowns(){
  const dailyEl = document.getElementById('cd-daily');
  if (dailyEl) {
    const targetMs = nextDailyResetMs(countdownSettings.resetHourET);
    dailyEl.textContent = formatCountdown(targetMs - Date.now());
    const localEl = document.getElementById('cd-daily-local');
    if (localEl) localEl.textContent = 'That’s ' + formatLocalMoment(targetMs) + ' for you';
  }

  const weeklyEl = document.getElementById('cd-weekly');
  if (weeklyEl) {
    const targetMs = nextWeeklyResetMs(countdownSettings.resetHourET);
    weeklyEl.textContent = formatCountdown(targetMs - Date.now());
    const localEl = document.getElementById('cd-weekly-local');
    if (localEl) localEl.textContent = 'That’s ' + formatLocalMoment(targetMs) + ' for you';
  }

  const seasonEl = document.getElementById('cd-season');
  if (seasonEl && countdownSettings.seasonEndsAt) {
    const [y, m, d] = countdownSettings.seasonEndsAt.split('-').map(Number);
    const targetMs = etDateTimeToMs(y, m, d, countdownSettings.resetHourET);
    seasonEl.textContent = formatCountdown(targetMs - Date.now());
    const localEl = document.getElementById('cd-season-local');
    if (localEl) localEl.textContent = 'That’s ' + formatLocalMoment(targetMs) + ' for you';
  }
}

      <br/><br/>
      Card levels, event details & creature spawn notes are all <code>approximate</code> —
      Bethesda rebalances and rotates content regularly. Use the star/note fields to correct
      anything that’s drifted from what you see in-game.
    </div>

    <div class="stat-group-head">⏱️ Countdowns</div>
    <div class="grid2 wide">
      <div class="card countdown-card">
        <div class="card-head">
          <span class="card-title">Weekly Reset</span>
          <span class="card-tag">Every Tuesday</span>
        </div>
        <div class="countdown-display" id="cd-weekly">--</div>
        <div class="countdown-local" id="cd-weekly-local">--</div>
        <div class="card-desc">Daily Ops rotation, weekly challenges & S.C.O.R.E. bonuses roll over at the weekly reset. This already converts to your own timezone automatically — nothing to set up.</div>
        <details class="countdown-advanced">
          <summary>Reset landing at the wrong time? Fine-tune it</summary>
          <div class="card-actions" style="margin-top:8px;">
            <label class="field-label" style="margin:0;">Reset hour (US Eastern Time)</label>
            <input type="number" id="reset-hour-input" min="0" max="23" value="${countdownSettings.resetHourET}">
            <span style="font-size:11px; color:var(--ink-dim);">:00 ET — commonly reported as ~midday ET. Bethesda doesn't publish an exact time, so nudge this if the countdown drifts from what you see in-game.</span>
          </div>
        </details>
      </div>
      <div class="card countdown-card">
        <div class="card-head">
          <span class="card-title">Season End</span>
          <span class="card-tag">${countdownSettings.seasonEndsAt ? 'Set' : 'Not set'}</span>
        </div>
        ${countdownSettings.seasonEndsAt ? `
          <div class="countdown-display" id="cd-season">--</div>
          <div class="countdown-local" id="cd-season-local">--</div>
          <div class="card-desc">Ends at the US reset hour on the date you set below — shown above in your own timezone.</div>
        ` : `<div class="card-desc">Check the in-game Seasons page for the current Season's end date and set it here to get a live countdown in your own timezone — no time conversion needed.</div>`}
        <div class="card-actions">
          <label class="field-label" style="margin:0;">Season ends</label>
          <select id="season-month-input">
            <option value="" ${!seasonY ? 'selected' : ''} disabled>Month</option>
            ${MONTH_NAMES.map((name, i) => `<option value="${i+1}" ${seasonM===i+1?'selected':''}>${name}</option>`).join('')}
          </select>
          <input type="number" id="season-day-input" min="1" max="31" placeholder="DD" style="width:56px;" value="${seasonD || ''}">
          <input type="number" id="season-year-input" min="2018" max="2099" placeholder="YYYY" style="width:76px;" value="${seasonY || ''}">
          ${countdownSettings.seasonEndsAt ? `<button class="btn small" id="clear-season-btn">Clear</button>` : ''}
        </div>
      </div>
    </div>

    <div class="stat-tally-row">
      <div class="stat-tally"><div class="n">${ownedCount}</div><div class="l">Cards Owned</div></div>
      <div class="stat-tally"><div class="n">${plans.length}</div><div class="l">Build Plans</div></div>
      <div class="stat-tally"><div class="n">${storyDone} / ${STORY_QUESTS.length}</div><div class="l">Story Quests Done</div></div>
      <div class="stat-tally"><div class="n">${questsFavorited}</div><div class="l">Farm-Priority Quests</div></div>
      <div class="stat-tally"><div class="n">${creaturesHunted} / ${CREATURE_POIS.length}</div><div class="l">Creatures Hunted</div></div>
      <div class="stat-tally"><div class="n">${starredIncomplete}</div><div class="l">Rare Junk Needed</div></div>
      <div class="stat-tally"><div class="n">${notesList.length}</div><div class="l">Field Log Entries</div></div>
    </div>
  `;

  const resetHourInput = document.getElementById('reset-hour-input');
  resetHourInput.addEventListener('change', () => {
    countdownSettings.resetHourET = Math.max(0, Math.min(23, parseInt(resetHourInput.value) || 0));
    saveProgress(); tickCountdowns();
  });
  const seasonMonthInput = document.getElementById('season-month-input');
  const seasonDayInput = document.getElementById('season-day-input');
  const seasonYearInput = document.getElementById('season-year-input');
  const trySaveSeasonDate = () => {
    const m = parseInt(seasonMonthInput.value, 10);
    const d = parseInt(seasonDayInput.value, 10);
    const y = parseInt(seasonYearInput.value, 10);
    if (!m || !d || !y || y < 2000 || y > 2199) return; // wait until all three are filled in & sane
    countdownSettings.seasonEndsAt = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    saveProgress(); renderOverview();
  };
  [seasonMonthInput, seasonDayInput, seasonYearInput].forEach(el => el.addEventListener('change', trySaveSeasonDate));
  const clearSeasonBtn = document.getElementById('clear-season-btn');
  if (clearSeasonBtn) clearSeasonBtn.addEventListener('click', () => {
    countdownSettings.seasonEndsAt = '';
    saveProgress(); renderOverview();
  });

  tickCountdowns();
}

/* ============================================================
   RENDER: DAILY JOURNAL — the day's login checklist, resetting itself
   against the game's own daily-reset clock (see isDoneToday/toggleDaily).
   ============================================================ */

const DAILY_CATEGORIES = ['Daily Ops & Events', 'Score & Seasonal', 'Vendors & Camp'];

function renderDaily(){
  document.getElementById('page-title').textContent = 'Daily Journal';
  document.getElementById('page-subtitle').textContent = '— today’s login loop — checks itself off against the game’s own reset clock —';
  document.getElementById('search-row').style.display = 'none';

  const allEntries = DAILY_TASKS.map(t => ({ def: t, p: dailyProgress[t.id], custom: false }))
    .concat(customDailies.map(c => ({ def: c, p: c, custom: true })));
  const doneCount = allEntries.filter(e => isDoneToday(e.p)).length;
  const bestStreak = allEntries.reduce((max, e) => Math.max(max, e.p.streak || 0), 0);

  let html = `
    <div class="stat-group-head">⏱️ Daily Reset</div>
    <div class="grid2 wide">
      <div class="card countdown-card">
        <div class="card-head">
          <span class="card-title">Next Daily Reset</span>
          <span class="card-tag">Every day</span>
        </div>
        <div class="countdown-display" id="cd-daily">--</div>
        <div class="countdown-local" id="cd-daily-local">--</div>
        <div class="card-desc">Uses the same reset-hour setting as the Weekly Reset card on Overview — nudge it there if this drifts from what you see in-game.</div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">Today So Far</span></div>
        <div class="stat-tally-row" style="margin:0;">
          <div class="stat-tally"><div class="n">${doneCount} / ${allEntries.length}</div><div class="l">Done Today</div></div>
          <div class="stat-tally"><div class="n">${bestStreak ? '🔥 ' + bestStreak : '—'}</div><div class="l">Best Streak</div></div>
        </div>
        <div class="card-desc">Check something off once you've done it for the day — it un-checks itself at the next reset. Streaks count consecutive resets done, not consecutive calendar days, so they track the game's clock instead of yours.</div>
      </div>
    </div>`;

  DAILY_CATEGORIES.forEach(cat => {
    const items = DAILY_TASKS.filter(t => t.category === cat);
    if (!items.length) return;
    html += `<div class="stat-group-head">${cat}</div><div class="entries">`;
    items.forEach(t => {
      const p = dailyProgress[t.id];
      const done = isDoneToday(p);
      html += `
        <div class="card ${done?'owned':''}">
          <div class="card-head">
            <span class="card-title">${t.name}</span>
            <span class="checkbox ${done?'checked':''}" data-toggle-daily="${t.id}">${done?'✓':''}</span>
          </div>
          <div class="card-desc">${t.desc}</div>
          ${p.streak ? `<div class="card-meta"><span>🔥 ${p.streak}-reset streak</span></div>` : ''}
        </div>`;
    });
    html += `</div>`;
  });

  html += `<div class="stat-group-head">Custom</div>`;
  if (addingCustomDaily) {
    html += `
      <div class="form-panel">
        <div class="form-row">
          <label class="field-label">Task</label>
          <input type="text" id="custom-daily-name" style="width:100%;" placeholder="e.g. Feed the dog in-game (Fallout 1st perk)">
        </div>
        <div class="form-row">
          <label class="field-label">Note (optional)</label>
          <input type="text" id="custom-daily-desc" style="width:100%;" placeholder="Anything worth remembering about it">
        </div>
        <div class="card-actions">
          <button class="btn primary" id="save-custom-daily-btn">Add</button>
          <button class="btn" id="cancel-custom-daily-btn">Cancel</button>
        </div>
      </div>`;
  } else {
    html += `<div class="card-actions" style="margin-bottom:12px;"><button class="btn primary" id="new-custom-daily-btn">+ Add Custom Daily Task</button></div>`;
  }
  if (customDailies.length) {
    html += `<div class="entries">` + customDailies.map(c => {
      const done = isDoneToday(c);
      return `
        <div class="card ${done?'owned':''}">
          <div class="card-head">
            <span class="card-title">${c.name}</span>
            <span class="checkbox ${done?'checked':''}" data-toggle-daily-custom="${c.id}">${done?'✓':''}</span>
          </div>
          ${c.desc ? `<div class="card-desc">${c.desc}</div>` : ''}
          <div class="card-actions">
            ${c.streak ? `<span class="card-meta"><span>🔥 ${c.streak}-reset streak</span></span>` : ''}
            <button class="btn small danger" data-delete-custom-daily="${c.id}">Remove</button>
          </div>
        </div>`;
    }).join('') + `</div>`;
  } else if (!addingCustomDaily) {
    html += `<div class="empty-state">No custom daily tasks yet — add anything from your own routine that isn't listed above.</div>`;
  }

  document.getElementById('content').innerHTML = html;
  tickCountdowns();

  document.querySelectorAll('[data-toggle-daily]').forEach(el => {
    el.addEventListener('click', () => {
      toggleDaily(dailyProgress[el.dataset.toggleDaily]);
      saveProgress(); renderDaily();
    });
  });
  document.querySelectorAll('[data-toggle-daily-custom]').forEach(el => {
    el.addEventListener('click', () => {
      const c = customDailies.find(x => x.id === el.dataset.toggleDailyCustom);
      toggleDaily(c);
      saveProgress(); renderDaily();
    });
  });
  document.querySelectorAll('[data-delete-custom-daily]').forEach(el => {
    el.addEventListener('click', () => {
      customDailies = customDailies.filter(c => c.id !== el.dataset.deleteCustomDaily);
      saveProgress(); renderDaily();
    });
  });
  const newCustomBtn = document.getElementById('new-custom-daily-btn');
  if (newCustomBtn) newCustomBtn.addEventListener('click', () => { addingCustomDaily = true; renderDaily(); });
  const cancelCustomBtn = document.getElementById('cancel-custom-daily-btn');
  if (cancelCustomBtn) cancelCustomBtn.addEventListener('click', () => { addingCustomDaily = false; renderDaily(); });
  const saveCustomBtn = document.getElementById('save-custom-daily-btn');
  if (saveCustomBtn) saveCustomBtn.addEventListener('click', () => {
    const name = document.getElementById('custom-daily-name').value.trim();
    if (!name) return;
    const desc = document.getElementById('custom-daily-desc').value.trim();
    customDailies.push({ id: uid(), name, desc, lastDoneDate: null, streak: 0 });
    addingCustomDaily = false;
    saveProgress(); renderDaily();
  });
}

/* ============================================================
   RENDER: FINDER — search everything in the almanac at once
   ============================================================ */

// Builds a flat searchable index across every dataset (reference content + the player's
// own plans & field notes) so one search box can answer "I found X, what's it for /
// does it matter to anything I'm tracking?" without needing a live game connection.
function buildFinderIndex(){
  const idx = [];

  PERKS.forEach(p => idx.push({
    section: 'special', icon: '🃏', type: 'S.P.E.C.I.A.L. Card',
    title: p.name, desc: p.desc + (p.note ? ' ' + p.note : ''),
    meta: `${specialInfo(p.special).name} • Lvl ~${p.lvl} • ${ownedCards.has(p.id) ? 'Owned' : 'Not owned'}`,
  }));

  RESOURCES.forEach(r => {
    const s = stockpile[r.id];
    const usedFor = (r.usedFor || []).join(', ');
    const relatedPerks = Array.from(new Set((r.usedFor || []).flatMap(tag => CRAFT_TAG_TO_PERKS[tag] || [])))
      .map(id => PERKS.find(p => p.id === id)).filter(Boolean);
    idx.push({
      section: 'stockpile', icon: r.icon, type: 'Junk / Resource',
      title: r.name,
      desc: (r.note ? r.note + ' ' : '') + (usedFor ? `Feeds: ${usedFor}.` : 'General crafting component.') +
        (relatedPerks.length ? ` Pairs well with perks like ${relatedPerks.map(p=>p.name).join(', ')}.` : ''),
      meta: s && s.starred ? '★ Bottleneck resource' : '',
    });
  });

  REPEATABLES.forEach(q => idx.push({
    section: 'quests', icon: '🔁', type: 'Repeatable Quest',
    title: q.name, desc: q.desc + (q.creature ? ` Notable creature: ${q.creature}.` : ''), meta: q.category,
  }));

  WEAPONS.forEach(w => {
    const p = weaponProgress[w.id];
    idx.push({
      section: 'weapons', icon: '🔫', type: 'Weapon',
      title: w.name, desc: w.desc,
      meta: `${w.category}${p && p.favorite ? ' • ★ Go-to pick' : ''}`,
    });
  });

  CREATURE_POIS.forEach(c => idx.push({
    section: 'creatures', icon: '👹', type: 'Creature POI',
    title: c.name, desc: c.desc, meta: c.region,
  }));

  STORY_QUESTS.forEach(q => idx.push({
    section: 'story', icon: '📜', type: 'Story Quest',
    title: q.title, desc: q.desc,
    meta: (STORYLINES.find(l => l.id === q.line) || {}).label || '',
  }));

  plans.forEach(pl => idx.push({
    section: 'builds', icon: '🏕️', type: 'Your Build Plan',
    title: pl.name || 'Untitled Plan', desc: pl.notes || 'No notes yet.', meta: 'Personal',
  }));

  notesList.forEach(n => idx.push({
    section: 'notes', icon: '📝', type: 'Field Log Entry',
    title: n.title || 'Untitled', desc: n.body || '', meta: 'Personal',
  }));

  return idx;
}

function renderFinderResults(){
  const term = finderTerm.trim().toLowerCase();
  const box = document.getElementById('finder-results');
  if (!box) return;
  if (!term) {
    box.innerHTML = `<div class="empty-state">Start typing — try an item you picked up ("screw", "crystal"), a weapon ("gauss rifle", "fixer"), a playstyle ("stealth", "heavy gun"), or a creature name.</div>`;
    return;
  }
  const idx = buildFinderIndex();
  const words = term.split(/\s+/).filter(Boolean);
  const matches = idx.filter(e => {
    const hay = (e.title + ' ' + e.desc + ' ' + e.meta + ' ' + e.type).toLowerCase();
    return words.every(w => hay.includes(w));
  });
  if (!matches.length) {
    box.innerHTML = `<div class="empty-state">No matches for “${finderTerm}” — try a shorter or different word.</div>`;
    return;
  }
  box.innerHTML = `<div class="entries">` + matches.map(m => `
    <div class="card finder-result" data-goto-section="${m.section}">
      <div class="card-head">
        <span class="card-title">${m.icon} ${m.title}</span>
        <span class="card-tag">${m.type}</span>
      </div>
      <div class="card-desc">${m.desc}</div>
      ${m.meta ? `<div class="card-meta"><span>${m.meta}</span></div>` : ''}
    </div>`).join('') + `</div>`;
  box.querySelectorAll('[data-goto-section]').forEach(el => {
    el.addEventListener('click', () => {
      activeSection = el.dataset.gotoSection;
      saveNavState();
      renderAll();
    });
  });
}

function renderFinder(){
  document.getElementById('page-title').textContent = 'Finder';
  document.getElementById('page-subtitle').textContent = '— search cards, junk, weapons, quests, creatures, your builds & field notes at once —';
  document.getElementById('search-row').style.display = 'none';

  document.getElementById('content').innerHTML = `
    <div class="finder-hero">
      <div class="finder-searchbar">
        <span class="icon">🔎</span>
        <input id="finder-input" type="text" autocomplete="off" placeholder="What did you find, or what are you trying to build?" value="${finderTerm.replace(/"/g,'&quot;')}">
      </div>
      <div class="finder-hint">
        This searches everything already in the almanac — it can't read your live inventory (Fallout 76 doesn't expose one to outside apps),
        but it will connect an item to the crafting categories &amp; perks it feeds, surface matching quests/creatures, and search your own build notes too.
      </div>
    </div>
    <div id="finder-results"></div>
    ${chatPanelHtml()}
  `;
  const input = document.getElementById('finder-input');
  input.addEventListener('input', () => { finderTerm = input.value; renderFinderResults(); });
  input.focus();
  renderFinderResults();
  wireChatPanel();
}

/* ============================================================
   ASK THE ASSISTANT — a real Claude-backed chat, proxied through a small
   Cloudflare Worker (see /almanac-chat-worker in the repo) so the API key
   never has to live in this static page. Good for "does the almanac cover
   X" questions and general Fallout 76 Q&A. Endpoint URL + chat history are
   both per-browser only (localStorage / in-memory) — nothing is synced.
   ============================================================ */

const CHAT_ENDPOINT_KEY = 'fallout76-chat-endpoint';
let chatHistory = []; // [{role:'user'|'assistant', content}] — cleared on page reload
let chatPending = false;

function getChatEndpoint(){ try { return localStorage.getItem(CHAT_ENDPOINT_KEY) || ''; } catch(e){ return ''; } }
function setChatEndpoint(url){ try { localStorage.setItem(CHAT_ENDPOINT_KEY, url); } catch(e){} }

function chatContextSummary(){
  return `Vault Dweller's Almanac currently tracks ${PERKS.length} S.P.E.C.I.A.L. perk cards, ` +
    `${RESOURCES.length} junk/resource types, ${WEAPONS.length} weapons across ${WEAPON_CATEGORIES.length} categories, ` +
    `${REPEATABLES.length} repeatable quest/event entries, ${STORY_QUESTS.length} story quests, and ${CREATURE_POIS.length} creature POIs.`;
}

function chatPanelHtml(){
  const endpoint = getChatEndpoint();
  const statusHtml = endpoint
    ? `<span class="chat-endpoint-status ok">✓ URL saved</span>`
    : `<span class="chat-endpoint-status missing">Not set up yet</span>`;
  const logHtml = chatHistory.map(m => `<div class="chat-msg ${m.role}">${(m.content || '').replace(/</g,'&lt;')}</div>`).join('')
    + (chatPending ? `<div class="chat-msg assistant pending">Thinking…</div>` : '');
  return `
    <div class="chat-panel">
      <div class="chat-panel-head"><h3>💬 Ask the Assistant</h3>${statusHtml}</div>
      <p class="chat-panel-sub">
        A real AI assistant for Fallout 76 questions and for checking whether something should be
        added to this almanac. Requires a one-time setup — see <code>/almanac-chat-worker/README.md</code>
        in the repo for the 10-minute walkthrough (a free Cloudflare Worker + your own Gemini API key).
      </p>
      <div class="chat-endpoint-row">
        <label class="field-label" style="margin:0;">Worker URL</label>
        <input type="text" id="chat-endpoint-input" placeholder="https://jaw-almanac-chat.your-subdomain.workers.dev" value="${endpoint.replace(/"/g,'&quot;')}">
        <button class="btn small" id="chat-endpoint-save">Save</button>
      </div>
      <div class="chat-log" id="chat-log">${logHtml}</div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="e.g. &quot;Is the Cremator in here?&quot; or &quot;What perks help a heavy gunner?&quot;" ${endpoint ? '' : 'disabled'}></textarea>
        <button class="btn primary" id="chat-send-btn" ${endpoint ? '' : 'disabled'}>Send</button>
      </div>
    </div>`;
}

function scrollChatToBottom(){
  const log = document.getElementById('chat-log');
  if (log) log.scrollTop = log.scrollHeight;
}

function wireChatPanel(){
  scrollChatToBottom();
  const saveBtn = document.getElementById('chat-endpoint-save');
  if (saveBtn) saveBtn.addEventListener('click', () => {
    const val = document.getElementById('chat-endpoint-input').value.trim().replace(/\/+$/, '');
    setChatEndpoint(val);
    renderFinder();
  });
  const sendBtn = document.getElementById('chat-send-btn');
  const textarea = document.getElementById('chat-input');
  if (!sendBtn || !textarea) return;
  const send = async () => {
    const message = textarea.value.trim();
    if (!message || chatPending) return;
    const endpoint = getChatEndpoint();
    if (!endpoint) return;
    chatHistory.push({ role: 'user', content: message });
    chatPending = true;
    renderFinder();
    try {
      const res = await fetch(endpoint + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, context: chatContextSummary(), history: chatHistory.slice(0, -1) }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) {
        chatHistory.push({ role: 'error', content: data.error || `Request failed (${res.status}).` });
      } else {
        chatHistory.push({ role: 'assistant', content: data.reply || '(no response)' });
      }
    } catch (e) {
      chatHistory.push({ role: 'error', content: 'Could not reach the Worker — check the URL and that it\'s deployed.' });
    }
    chatPending = false;
    renderFinder();
    const ta = document.getElementById('chat-input');
    if (ta) ta.focus();
  };
  sendBtn.addEventListener('click', send);
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
}

/* ============================================================
   RENDER: S.P.E.C.I.A.L. PERK LIBRARY
   ============================================================ */

function renderLibrary(){
  document.getElementById('page-title').textContent = 'S.P.E.C.I.A.L. Perk Cards';
  document.getElementById('page-subtitle').textContent = '— tap a card to mark it owned, then set its rank —';
  document.getElementById('search-row').style.display = 'flex';
  document.getElementById('search').value = searchTerm;
  document.getElementById('search').placeholder = 'Search perk cards…';
  document.querySelectorAll('.filter-pill[data-fav]').forEach(p => p.classList.toggle('active', (p.dataset.fav === 'owned') === ownedOnly));

  const tally = document.getElementById('progress-tally');
  tally.style.display = 'inline';
  tally.textContent = `${ownedCards.size} / ${PERKS.length} cards owned`;

  const term = searchTerm.trim().toLowerCase();
  let html = '';
  SPECIALS.forEach(sp => {
    let cards = PERKS.filter(p => p.special === sp.id);
    if (term) cards = cards.filter(p => p.name.toLowerCase().includes(term) || p.desc.toLowerCase().includes(term));
    if (ownedOnly) cards = cards.filter(p => ownedCards.has(p.id));
    if (!cards.length) return;
    html += `<div class="stat-group-head">${sp.icon} ${sp.name} <span class="stat-points">— ${sp.desc}</span></div>`;
    html += `<div class="grid2 wide">`;
    cards.forEach(p => {
      const owned = ownedCards.has(p.id);
      const rank = cardRank[p.id] || 1;
      html += `
        <div class="card ${owned?'owned':''}">
          <div class="card-head">
            <span class="card-title">${p.name}</span>
            <span class="checkbox ${owned?'checked':''}" data-toggle-card="${p.id}">${owned?'✓':''}</span>
          </div>
          <div class="card-desc">${p.desc}${p.note?`<br/><em>${p.note}</em>`:''}</div>
          <div class="card-meta">
            <span>Lvl ~${p.lvl}</span>
            <span>Cost ${p.cost}pt${p.cost>1?'s':''}/rank</span>
            <span>Max Rank ${p.maxRank}</span>
          </div>
          ${owned ? `
          <div class="card-actions">
            <div class="rank-stepper">
              Rank
              <button data-rank-down="${p.id}">−</button>
              <span>${rank} / ${p.maxRank}</span>
              <button data-rank-up="${p.id}">+</button>
            </div>
          </div>` : ''}
        </div>`;
    });
    html += `</div>`;
  });

  if (!html) html = `<div class="empty-state">No cards match your search.</div>`;
  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('[data-toggle-card]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.toggleCard;
      if (ownedCards.has(id)) { ownedCards.delete(id); delete cardRank[id]; }
      else { ownedCards.add(id); cardRank[id] = 1; }
      saveProgress(); renderLibrary();
    });
  });
  document.querySelectorAll('[data-rank-up]').forEach(el => {
    el.addEventListener('click', () => {
      const p = PERKS.find(x => x.id === el.dataset.rankUp);
      cardRank[p.id] = Math.min(p.maxRank, (cardRank[p.id]||1) + 1);
      saveProgress(); renderLibrary();
    });
  });
  document.querySelectorAll('[data-rank-down]').forEach(el => {
    el.addEventListener('click', () => {
      const p = PERKS.find(x => x.id === el.dataset.rankDown);
      cardRank[p.id] = Math.max(1, (cardRank[p.id]||1) - 1);
      saveProgress(); renderLibrary();
    });
  });
}

/* ============================================================
   RENDER: CAMP & BUILD PLANS
   ============================================================ */

function emptyPlan(){
  return { id: uid(), name: '', special: {S:1,P:1,E:1,C:1,I:1,A:1,L:1}, cards: [], notes: '', updatedAt: Date.now() };
}

function renderBuilds(){
  document.getElementById('page-title').textContent = 'CAMP & Build Plans';
  document.getElementById('page-subtitle').textContent = '— save S.P.E.C.I.A.L. loadouts & CAMP notes for different playstyles —';
  document.getElementById('search-row').style.display = 'none';

  let html = '';
  if (editingPlanId) {
    const plan = editingPlanId === 'new' ? emptyPlan() : plans.find(p => p.id === editingPlanId);
    html += renderPlanForm(plan);
  } else {
    html += `<div class="card-actions" style="margin-bottom:16px;"><button class="btn primary" id="new-plan-btn">+ New Build Plan</button></div>`;
    if (!plans.length) {
      html += `<div class="empty-state">No build plans yet. Create one to lock in a S.P.E.C.I.A.L. spread, equipped cards, and CAMP notes for a playstyle.</div>`;
    } else {
      html += `<div class="entries">`;
      plans.forEach(plan => {
        const specStr = SPECIALS.map(s => `${s.id}${plan.special[s.id]}`).join(' ');
        const cardNames = plan.cards.map(id => { const c = PERKS.find(p=>p.id===id); return c ? c.name : null; }).filter(Boolean);
        html += `
          <div class="card">
            <div class="card-head">
              <span class="card-title">${plan.name || 'Untitled Plan'}</span>
              <div class="card-actions">
                <button class="btn small" data-edit-plan="${plan.id}">Edit</button>
                <button class="btn small danger" data-delete-plan="${plan.id}">Delete</button>
              </div>
            </div>
            <div class="card-meta"><span>${specStr}</span><span>${cardNames.length} card${cardNames.length!==1?'s':''} equipped</span></div>
            ${cardNames.length ? `<div class="card-desc">${cardNames.join(', ')}</div>` : ''}
            ${plan.notes ? `<div class="card-desc"><em>${plan.notes}</em></div>` : ''}
          </div>`;
      });
      html += `</div>`;
    }
  }
  document.getElementById('content').innerHTML = html;
  wireBuildsHandlers();
}

function renderPlanForm(plan){
  const specInputs = SPECIALS.map(s => `
    <div class="stat-box">
      <label>${s.icon} ${s.id}</label>
      <input type="number" min="1" max="15" value="${plan.special[s.id]}" data-spec-input="${s.id}">
    </div>`).join('');

  let cardPicker = '';
  SPECIALS.forEach(sp => {
    const cards = PERKS.filter(p => p.special === sp.id && ownedCards.has(p.id));
    if (!cards.length) return;
    const spent = cards.filter(c => plan.cards.includes(c.id)).reduce((sum,c) => sum + c.cost * (cardRank[c.id]||1), 0);
    const budget = plan.special[sp.id];
    cardPicker += `<div class="stat-group-head">${sp.icon} ${sp.name} <span class="stat-points ${spent>budget?'over':''}">— ${spent} / ${budget} pts used</span></div>`;
    cardPicker += `<div class="grid2">`;
    cards.forEach(c => {
      const checked = plan.cards.includes(c.id);
      cardPicker += `
        <div class="card ${checked?'owned':''}" style="padding:10px 14px;">
          <div class="card-head" style="margin-bottom:0;">
            <span style="font-size:13px; color:var(--ink);">${c.name} <span style="color:var(--ink-dim);">(rank ${cardRank[c.id]||1}, ${c.cost}pt/rk)</span></span>
            <span class="checkbox ${checked?'checked':''}" data-toggle-plan-card="${c.id}">${checked?'✓':''}</span>
          </div>
        </div>`;
    });
    cardPicker += `</div>`;
  });
  if (!cardPicker) cardPicker = `<div class="empty-state">You haven’t marked any cards as owned yet — do that in the S.P.E.C.I.A.L. tab first.</div>`;

  return `
    <div class="form-panel">
      <div class="form-row">
        <label class="field-label">Plan Name</label>
        <input type="text" id="plan-name" value="${plan.name.replace(/"/g,'&quot;')}" placeholder="e.g. Stealth Commando, Heavy Gunner Tank" style="width:100%;">
      </div>
      <div class="form-row">
        <label class="field-label">S.P.E.C.I.A.L. Allocation</label>
        <div class="form-grid7">${specInputs}</div>
      </div>
      <div class="form-row">
        <label class="field-label">Equipped Perk Cards (from your owned cards)</label>
        ${cardPicker}
      </div>
      <div class="form-row">
        <label class="field-label">CAMP / Build Notes</label>
        <textarea id="plan-notes" placeholder="Weapon & armor choices, mutations, CAMP layout, workshop locations, budget notes…">${plan.notes.replace(/</g,'&lt;')}</textarea>
      </div>
      <div class="card-actions">
        <button class="btn primary" id="save-plan-btn" data-plan-id="${plan.id}">Save Plan</button>
        <button class="btn" id="cancel-plan-btn">Cancel</button>
      </div>
    </div>
  `;
}

let planDraft = null;

function wireBuildsHandlers(){
  const newBtn = document.getElementById('new-plan-btn');
  if (newBtn) newBtn.addEventListener('click', () => { editingPlanId = 'new'; planDraft = emptyPlan(); renderBuilds(); });

  document.querySelectorAll('[data-edit-plan]').forEach(el => {
    el.addEventListener('click', () => {
      editingPlanId = el.dataset.editPlan;
      planDraft = JSON.parse(JSON.stringify(plans.find(p => p.id === editingPlanId)));
      renderBuilds();
    });
  });
  document.querySelectorAll('[data-delete-plan]').forEach(el => {
    el.addEventListener('click', () => {
      plans = plans.filter(p => p.id !== el.dataset.deletePlan);
      saveProgress(); renderBuilds();
    });
  });

  if (!editingPlanId) return;
  if (!planDraft) planDraft = editingPlanId === 'new' ? emptyPlan() : JSON.parse(JSON.stringify(plans.find(p => p.id === editingPlanId)));

  document.querySelectorAll('[data-spec-input]').forEach(el => {
    el.addEventListener('input', () => {
      const v = Math.max(1, Math.min(15, parseInt(el.value)||1));
      planDraft.special[el.dataset.specInput] = v;
      renderBuildsPreservingDraft();
    });
  });
  document.querySelectorAll('[data-toggle-plan-card]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.togglePlanCard;
      const i = planDraft.cards.indexOf(id);
      if (i === -1) planDraft.cards.push(id); else planDraft.cards.splice(i,1);
      renderBuildsPreservingDraft();
    });
  });
  const nameEl = document.getElementById('plan-name');
  if (nameEl) nameEl.addEventListener('input', () => { planDraft.name = nameEl.value; });
  const notesEl = document.getElementById('plan-notes');
  if (notesEl) notesEl.addEventListener('input', () => { planDraft.notes = notesEl.value; });

  const saveBtn = document.getElementById('save-plan-btn');
  if (saveBtn) saveBtn.addEventListener('click', () => {
    planDraft.updatedAt = Date.now();
    const idx = plans.findIndex(p => p.id === planDraft.id);
    if (idx === -1) plans.push(planDraft); else plans[idx] = planDraft;
    editingPlanId = null; planDraft = null;
    saveProgress(); renderBuilds();
  });
  const cancelBtn = document.getElementById('cancel-plan-btn');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { editingPlanId = null; planDraft = null; renderBuilds(); });
}

// Re-renders the form using the in-memory draft (not yet saved) so number/checkbox edits
// don't get clobbered by re-reading from the saved `plans` array.
function renderBuildsPreservingDraft(){
  document.getElementById('content').innerHTML = renderPlanForm(planDraft);
  wireBuildsHandlers();
}

/* ============================================================
   RENDER: JUNK STOCKPILE
   ============================================================ */

function renderStockpile(){
  document.getElementById('page-title').textContent = 'Junk Stockpile';
  document.getElementById('page-subtitle').textContent = '— track what you’re hoarding for crafting & mods —';
  document.getElementById('search-row').style.display = 'none';

  const starred = RESOURCES.filter(r => stockpile[r.id] && stockpile[r.id].starred);
  const rest = RESOURCES.filter(r => !(stockpile[r.id] && stockpile[r.id].starred));

  function resourceCard(r){
    const s = stockpile[r.id] || { target:0, have:false, starred:false, note:'' };
    return `
      <div class="card ${s.have?'owned':''}">
        <div class="card-head">
          <span class="card-title">${r.icon} ${r.name}</span>
          <button class="star-btn ${s.starred?'active':''}" data-star="${r.id}" title="Mark as a bottleneck resource">★</button>
        </div>
        ${r.note || s.note ? `<div class="card-desc">${s.note || r.note}</div>` : ''}
        <div class="card-actions">
          <span class="checkbox ${s.have?'checked':''}" data-have="${r.id}">${s.have?'✓':''}</span>
          <span style="font-size:11px; color:var(--ink-dim);">Stocked enough</span>
          <label class="field-label" style="margin:0 0 0 12px;">Target Qty</label>
          <input type="number" min="0" value="${s.target}" data-target="${r.id}">
        </div>
      </div>`;
  }

  let html = '';
  if (starred.length) {
    html += `<div class="stat-group-head">★ Bottleneck Resources</div><div class="grid2 wide">${starred.map(resourceCard).join('')}</div>`;
  }
  html += `<div class="stat-group-head">All Other Junk</div><div class="grid2 wide">${rest.map(resourceCard).join('')}</div>`;
  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('[data-star]').forEach(el => {
    el.addEventListener('click', () => {
      const s = stockpile[el.dataset.star];
      s.starred = !s.starred;
      saveProgress(); renderStockpile();
    });
  });
  document.querySelectorAll('[data-have]').forEach(el => {
    el.addEventListener('click', () => {
      const s = stockpile[el.dataset.have];
      s.have = !s.have;
      saveProgress(); renderStockpile();
    });
  });
  document.querySelectorAll('[data-target]').forEach(el => {
    el.addEventListener('change', () => {
      const s = stockpile[el.dataset.target];
      s.target = Math.max(0, parseInt(el.value)||0);
      saveProgress();
    });
  });
}

function renderNotes(){
  document.getElementById('page-title').textContent = 'Field Log';
  document.getElementById('page-subtitle').textContent = '— event timers, trade offers, workshop notes — whatever’s worth remembering —';
  document.getElementById('search-row').style.display = 'none';

  let html = '';
  if (editingNoteId) {
    const note = editingNoteId === 'new' ? { id: uid(), title:'', body:'', updatedAt: Date.now() } : notesList.find(n => n.id === editingNoteId);
    html += `
      <div class="form-panel">
        <div class="form-row">
          <label class="field-label">Title</label>
          <input type="text" id="note-title" value="${note.title.replace(/"/g,'&quot;')}" style="width:100%;" placeholder="e.g. Fasnacht Day timers">
        </div>
        <div class="form-row">
          <label class="field-label">Notes</label>
          <textarea id="note-body" placeholder="Anything worth remembering…">${note.body.replace(/</g,'&lt;')}</textarea>
        </div>
        <div class="card-actions">
          <button class="btn primary" id="save-note-btn" data-note-id="${note.id}">Save Entry</button>
          <button class="btn" id="cancel-note-btn">Cancel</button>
        </div>
      </div>`;
  } else {
    html += `<div class="card-actions" style="margin-bottom:16px;"><button class="btn primary" id="new-note-btn">+ New Entry</button></div>`;
    if (!notesList.length) {
      html += `<div class="empty-state">No field log entries yet.</div>`;
    } else {
      const sorted = [...notesList].sort((a,b) => b.updatedAt - a.updatedAt);
      html += `<div class="entries">` + sorted.map(n => `
        <div class="note-card">
          <div class="card-head">
            <h3>${n.title || 'Untitled'}</h3>
            <div class="card-actions">
              <button class="btn small" data-edit-note="${n.id}">Edit</button>
              <button class="btn small danger" data-delete-note="${n.id}">Delete</button>
            </div>
          </div>
          <div class="note-date">${new Date(n.updatedAt).toLocaleString()}</div>
          <div class="note-body">${n.body}</div>
        </div>`).join('') + `</div>`;
    }
  }
  document.getElementById('content').innerHTML = html;

  const newBtn = document.getElementById('new-note-btn');
  if (newBtn) newBtn.addEventListener('click', () => { editingNoteId = 'new'; renderNotes(); });
  document.querySelectorAll('[data-edit-note]').forEach(el => el.addEventListener('click', () => { editingNoteId = el.dataset.editNote; renderNotes(); }));
  document.querySelectorAll('[data-delete-note]').forEach(el => el.addEventListener('click', () => {
    notesList = notesList.filter(n => n.id !== el.dataset.deleteNote);
    saveProgress(); renderNotes();
  }));
  const saveBtn = document.getElementById('save-note-btn');
  if (saveBtn) saveBtn.addEventListener('click', () => {
    const id = saveBtn.dataset.noteId;
    const title = document.getElementById('note-title').value;
    const body = document.getElementById('note-body').value;
    const idx = notesList.findIndex(n => n.id === id);
    const entry = { id, title, body, updatedAt: Date.now() };
    if (idx === -1) notesList.push(entry); else notesList[idx] = entry;
    editingNoteId = null;
    saveProgress(); renderNotes();
  });
  const cancelBtn = document.getElementById('cancel-note-btn');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { editingNoteId = null; renderNotes(); });
}
