<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Champion's Codex — Oblivion Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral+SC:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    /* canvas — aged umber-leather journal cover, warm Imperial dusk instead of Skyrim's cold slate */
    --void: #150F0A;
    --stone-1: #1C130D;
    --stone-2: #241A11;
    --stone-3: #2D2116;
    --stone-4: #37291A;
    --stone-5: #453420;
    /* card/panel surface + aged bronze borders + inner highlight */
    --panel: rgba(37, 27, 18, 0.78);
    --panel-hi: rgba(255, 224, 170, 0.06);
    --iron: #4E3A22;
    --iron-light: #A3803F;
    /* verdigris — patina on Imperial bronze; the secondary interactive accent */
    --frost: #6FA394;
    --frost-dim: #466E62;
    /* Imperial gold — key highlights */
    --gold: #C9A227;
    --gold-bright: #E8C766;
    --gold-dim: #8F7318;
    /* text & headings — aged parchment cream; meta — faded ink-brown */
    --heading: #F0E4C8;
    --ink: #E8DBC0;
    --ink-soft: #B0A181;
    --ink-dim: #786B4E;
    --blood: #A23B2E;
    /* "done"/success accent — laurel-green, the Imperial victory wreath */
    --sage-ok: #8FA65C;
    /* muted warm bronze — used for a middle rarity tier between gold (rare) and stone-grey (common) */
    --moss: #B08B4F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(201,162,39,0.05), transparent 40%),
      radial-gradient(ellipse at 12% 0%, rgba(111,163,148,0.05), transparent 50%),
      radial-gradient(circle at 50% 42%, transparent 30%, rgba(0,0,0,0.6) 100%);
    font-family: 'Spectral', serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  .tome {
    width: min(95vw, 1520px);
    margin: 0 auto;
    display: flex;
    gap: 0;
    box-shadow: 0 30px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(78,58,34,0.7);
    border-radius: 0;
    overflow: hidden;
  }

  /* ---------- SIDE NAV (desktop) ---------- */
  .nav {
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--stone-2), var(--stone-1));
    padding: 28px 0 20px;
    min-width: 210px;
    flex-shrink: 0;
    position: relative;
    border-right: 1px solid var(--iron);
  }
  .nav::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, transparent 2px 44px);
    pointer-events: none;
  }
  .nav-brand {
    font-family: 'Cinzel Decorative', serif;
    font-size: 15px;
    color: var(--gold);
    text-align: center;
    letter-spacing: 0.1em;
    padding: 0 16px 20px;
    border-bottom: 1px solid var(--iron);
    margin-bottom: 10px;
  }

  .nav-btn {
    all: unset;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    margin: 1px 8px;
    color: var(--ink-soft);
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 0;
    transition: background .15s ease, color .15s ease;
    border-left: 2px solid transparent;
  }
  .nav-btn .icon { font-size: 15px; filter: saturate(0.7); flex-shrink: 0; width: 18px; text-align: center; }
  .nav-btn:hover { background: rgba(111,163,148,0.06); color: var(--heading); }
  .nav-btn.active {
    background: rgba(201,162,39,0.09);
    color: var(--gold-bright);
    border-left-color: var(--gold);
    text-shadow: 0 0 10px rgba(201,162,39,0.25);
  }

  .nav-mobile { display: none; }

  /* ---------- PAGE ---------- */
  .page {
    flex: 1;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(201,162,39,0.03), transparent 45%),
      radial-gradient(ellipse at 100% 100%, rgba(0,0,0,0.45), transparent 55%),
      linear-gradient(165deg, var(--stone-3), var(--stone-2) 65%, var(--stone-1));
    background-color: var(--stone-2);
    padding: 34px clamp(24px, 3.4vw, 54px) 50px;
    position: relative;
    min-height: 680px;
    min-width: 0;
  }
  .page::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: 0.5;
    mix-blend-mode: overlay;
  }

  header.title-block {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 2px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(20px, 3vw, 30px);
    color: var(--heading);
    margin: 0;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .subtitle {
    font-family: 'Spectral SC', serif;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-top: 5px;
  }
  .seal {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    color: var(--gold-dim);
    background: rgba(0,0,0,0.3);
    border: 2px solid var(--gold-dim);
    border-radius: 50%;
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
    letter-spacing: 0.04em;
    transform: rotate(-6deg);
    opacity: 0.9;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .rune-divider {
    position: relative;
    height: 15px;
    margin: 6px 0 20px;
  }
  .rune-divider::before {
    content: "";
    position: absolute;
    top: 50%; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--iron) 12%, var(--iron) 88%, transparent 100%);
  }
  .rune-divider::after {
    content: "❖";
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%,-50%);
    color: var(--gold-dim);
    font-size: 9px;
    background: var(--stone-2);
    padding: 0 10px;
    line-height: 1;
  }

  /* search */
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .search-plate {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(11,13,14,0.55);
    color: var(--ink);
    padding: 9px 14px;
    border-radius: 0;
    border: 1px solid var(--iron);
    box-shadow: inset 0 1px 0 var(--panel-hi);
    flex: 1;
    min-width: 220px;
  }
  .search-plate input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: 'Spectral', serif;
    font-size: 13px;
    width: 100%;
    letter-spacing: 0.02em;
  }
  .search-plate input::placeholder { color: var(--ink-dim); }

  .filter-pill {
    font-family: 'Cinzel', serif;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 7px 10px 6px;
    border-radius: 0;
    cursor: pointer;
    user-select: none;
    text-transform: uppercase;
    transition: color .15s ease, border-color .15s ease, text-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-pill:hover { color: var(--heading); border-bottom-color: rgba(111,163,148,0.5); text-shadow: 0 0 10px rgba(111,163,148,0.3); }
  .filter-pill:focus { outline: none; }
  .filter-pill:focus-visible { outline: none; color: var(--heading); border-bottom-color: rgba(111,163,148,0.5); text-shadow: 0 0 10px rgba(111,163,148,0.3); }
  .filter-pill.active { color: var(--gold-bright); border-bottom-color: var(--gold); text-shadow: 0 0 10px rgba(201,162,39,0.25); }

  /* sub nav (questlines / tabs) */
  .sub-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .sub-pill {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 7px 12px 6px;
    border-radius: 0;
    cursor: pointer;
    text-transform: uppercase;
    transition: color .15s ease, border-color .15s ease, text-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .sub-pill:hover { color: var(--heading); border-bottom-color: rgba(111,163,148,0.5); text-shadow: 0 0 10px rgba(111,163,148,0.3); }
  .sub-pill:focus { outline: none; }
  .sub-pill:focus-visible { outline: none; color: var(--heading); border-bottom-color: rgba(111,163,148,0.5); text-shadow: 0 0 10px rgba(111,163,148,0.3); }
  .sub-pill.active { color: var(--gold-bright); border-bottom-color: var(--gold); text-shadow: 0 0 10px rgba(201,162,39,0.25); }
  .sub-pill .n { opacity:0.65; font-size:9px; margin-left:2px; }
  .sub-pill .n::before { content: '[ '; }
  .sub-pill .n::after { content: ' ]'; }

  .branch-banner {
    background: rgba(162,59,46,0.08);
    border: 1px solid var(--blood);
    border-radius: 0;
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    position: relative;
    z-index: 1;
  }
  .branch-banner b { color: var(--blood); font-family:'Cinzel', serif; font-size: 11px; letter-spacing:0.06em; text-transform: uppercase; }

  /* dashboard */
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
    position: relative;
    z-index: 1;
  }
  .dash-card {
    background: var(--panel);
    border: 1px solid var(--iron);
    border-left: 3px solid var(--gold-dim);
    border-radius: 0;
    padding: 16px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 var(--panel-hi);
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .dash-card:hover { transform: translateY(-2px); border-color: var(--frost-dim); box-shadow: 2px 6px 18px rgba(0,0,0,0.5), inset 0 1px 0 var(--panel-hi), 0 0 12px rgba(111,163,148,0.12); }
  .dash-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dash-icon { font-size: 18px; }
  .dash-label { font-family: 'Cinzel', serif; font-size: 12px; color: var(--heading); letter-spacing: 0.08em; text-transform: uppercase; }
  .dash-bar-track { background: rgba(0,0,0,0.4); border: 1px solid var(--iron); border-radius: 0; height: 7px; overflow: hidden; margin-bottom: 8px; }
  .dash-bar-fill { background: var(--gold); height: 100%; border-radius: 0; transition: width .3s ease; }
  .dash-count { font-family: 'Spectral', serif; font-size: 11px; color: var(--ink-soft); }

  .overview-hero {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--iron);
    box-shadow: inset 0 1px 0 var(--panel-hi);
    padding: 22px 26px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .completion-ring-wrap { position: relative; width: 104px; height: 104px; flex-shrink: 0; }
  .completion-ring { width: 104px; height: 104px; transform: rotate(-90deg); }
  .completion-ring-track { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 9; }
  .completion-ring-fill { fill: none; stroke: var(--gold); stroke-width: 9; stroke-linecap: butt; transition: stroke-dashoffset .6s ease; }
  .completion-ring-pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: 21px; font-weight: 600; color: var(--heading);
  }
  .overview-hero-info { flex: 1; min-width: 220px; }
  .overview-hero-title { font-family: 'Cinzel', serif; font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-bright); margin-bottom: 4px; }
  .overview-hero-count { font-family: 'Spectral', serif; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .points-total-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: 'Spectral SC', serif; font-size: 12.5px; letter-spacing: 0.02em; color: var(--gold-bright);
    background: rgba(201,162,39,0.1); border: 1px solid rgba(201,162,39,0.35);
    padding: 6px 13px;
  }

  .io-btn {
    all: unset;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--frost);
    border: 1px solid var(--frost-dim);
    border-radius: 0;
    padding: 8px 14px;
    text-transform: uppercase;
  }
  .io-btn:hover { background: rgba(111,163,148,0.1); }
  .io-status { font-family: 'Spectral', serif; font-size: 11.5px; opacity: 0.9; }
  .io-status.ok { color: var(--sage-ok); }
  .io-status.err { color: var(--blood); }

  .reset-zone {
    margin-top: 8px;
    padding-top: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .reset-btn {
    all: unset;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--blood);
    border: 1px solid var(--blood);
    border-radius: 0;
    padding: 8px 14px;
    text-transform: uppercase;
  }
  .reset-btn:hover { background: rgba(162,59,46,0.12); }
  .reset-btn.armed { background: var(--blood); color: var(--stone-1); }
  .reset-hint { font-family: 'Spectral', serif; font-size: 11.5px; color: var(--ink-soft); opacity: 0.8; }

  /* quest / entry cards */
  .entries { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
  .entries.grid-mode { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); align-items: start; }
  .ach-group-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 4px; }

  .quest {
    background: var(--panel);
    border: 1px solid var(--iron);
    border-left: 3px solid var(--gold-dim);
    border-radius: 0;
    padding: 16px 18px 14px;
    position: relative;
    box-shadow: 0 3px 16px rgba(0,0,0,0.4), inset 0 1px 0 var(--panel-hi);
  }
  .quest.done { border-left-color: var(--sage-ok); }
  .quest.alt { border-left-color: var(--blood); border-left-style: dashed; }
  .quest.optional { border-left-color: var(--frost-dim); }

  .quest-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
  .quest-title-wrap { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .quest-order { font-family:'Spectral SC', serif; font-size: 11px; color: var(--gold-dim); }
  .quest h3 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 14.5px; margin: 0; color: var(--heading); letter-spacing: 0.02em; line-height: 1.35; }
  .tag-chip {
    font-family: 'Spectral SC', serif;
    font-size: 9.5px;
    letter-spacing: 0.03em;
    padding: 2px 7px;
    border-radius: 0;
    text-transform: uppercase;
  }
  .tag-optional { background: rgba(111,163,148,0.14); color: var(--frost); }
  .tag-alt { background: rgba(162,59,46,0.16); color: var(--blood); }
  .tag-rare { background: rgba(111,163,148,0.14); color: var(--frost); }
  .tag-uncommon { background: rgba(176,139,79,0.18); color: var(--moss); }
  .tag-common { background: rgba(142,148,153,0.14); color: var(--ink-soft); }

  .fav-btn, .track-btn { all: unset; cursor: pointer; }
  .fav-btn { font-size: 16px; line-height: 1; flex-shrink: 0; color: var(--ink-dim); opacity: 0.7; transition: color .15s ease, opacity .15s ease, transform .15s ease; }
  .fav-btn:hover { color: var(--gold-dim); opacity: 1; }
  .fav-btn.active { color: var(--gold-bright); opacity: 1; transform: scale(1.12); text-shadow: 0 0 8px rgba(232,199,102,0.45); }

  .quest-meta { font-family: 'Spectral', serif; font-size: 11.5px; color: var(--ink-soft); margin: 3px 0 10px; opacity: 0.95; }
  .quest-meta span { margin-right: 12px; }
  .quest-meta b { color: var(--heading); font-weight: 600; }

  .quest-steps { margin: 0 0 10px; padding-left: 20px; font-size: 12.8px; line-height: 1.55; color: var(--ink); }
  .quest-steps li { margin-bottom: 4px; }

  .choice-box {
    background: rgba(201,162,39,0.07);
    border: 1px solid var(--gold-dim);
    border-radius: 0;
    padding: 9px 12px;
    margin: 0 0 10px;
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .choice-box b { font-family: 'Cinzel', serif; font-size: 10.5px; letter-spacing: 0.06em; color: var(--gold-bright); text-transform: uppercase; display:block; margin-bottom:4px; }

  .rewards-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .reward-chip {
    font-family: 'Spectral', serif;
    font-size: 11px;
    color: var(--gold-bright);
    background: rgba(201,162,39,0.1);
    border: 1px solid rgba(201,162,39,0.35);
    padding: 3px 9px;
    border-radius: 0;
    margin: 0;
  }

  .quest-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .track-btn {
    display: flex; align-items: center; gap: 6px;
    color: var(--ink-soft);
    font-family: 'Cinzel', serif;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .track-btn .box { width: 13px; height: 13px; border: 1.5px solid var(--ink-soft); border-radius: 0; display: inline-block; }
  .quest.done .track-btn .box { background: var(--sage-ok); border-color: var(--sage-ok); }
  .quest.done .track-btn { color: var(--sage-ok); opacity: 1; }

  .empty-state {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 46px 10px;
    text-align: center;
    opacity: 0.8;
    position: relative;
    z-index: 1;
  }

  .placeholder-card {
    background: var(--panel);
    border: 1px dashed var(--iron-light);
    border-radius: 0;
    padding: 40px 30px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .placeholder-card .p-icon { font-size: 34px; margin-bottom: 12px; opacity: 0.75; }
  .placeholder-card h2 { font-family: 'Cinzel', serif; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--heading); margin: 0 0 8px; }
  .placeholder-card p { font-family: 'Spectral', serif; font-size: 13px; color: var(--ink-soft); max-width: 440px; margin: 0 auto; line-height: 1.6; }

  /* achievement cards */
  .points-badge {
    font-family: 'Spectral SC', serif;
    font-size: 9.5px;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 0;
    text-transform: uppercase;
    background: rgba(201,162,39,0.14);
    color: var(--gold-bright);
    border: 1px solid rgba(201,162,39,0.35);
  }
  .points-badge.gold { background: rgba(201,162,39,0.22); color: var(--gold-bright); border-color: var(--gold); }
  .points-badge.silver { background: rgba(111,163,148,0.14); color: var(--frost); border-color: rgba(111,163,148,0.4); }
  .ach-desc { font-size: 12.8px; line-height: 1.55; color: var(--ink); margin: 0 0 10px; }
  .ach-link-btn {
    all: unset;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--frost);
    border: 1px solid rgba(111,163,148,0.4);
    border-radius: 0;
    padding: 4px 10px;
    text-transform: uppercase;
  }
  .ach-link-btn:hover { background: rgba(111,163,148,0.12); }

  .ach-categories { grid-column: 1 / -1; width: 100%; }
  .ach-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 4px; }
  @media (min-width: 700px) { .ach-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1180px) { .ach-grid { grid-template-columns: repeat(3, 1fr); } }
  .ach-grid .ach-card { display: flex; flex-direction: column; height: 100%; margin: 0; }
  .ach-grid .ach-card .quest-title-wrap { flex-direction: column; align-items: flex-start; gap: 5px; }
  .ach-grid .ach-card .ach-desc { flex-grow: 1; }
  .ach-grid .ach-card .quest-foot { margin-top: auto; padding-top: 6px; }

function buildSearchIndex(){
  const idx = [];

  QUESTS.forEach(q => {
    const ql = QUESTLINES.find(l => l.id === q.line);
    idx.push({
      itemId: q.id, title: q.title, sectionLabel: 'Quests & Factions', icon: ql ? ql.icon : '📜',
      snippet: [q.giver, q.location].filter(Boolean).join(' — ') || (q.steps && q.steps[0]) || '',
      searchText: [q.title, q.giver, q.location, q.prince, (q.steps||[]).join(' '), (q.rewards||[]).join(' '), q.choice ? q.choice.text : ''].join(' ').toLowerCase(),
      nav: { section:'quests', line:q.line },
    });
  });

  RACES.forEach(r => idx.push({
    itemId: r.id, title: r.name, sectionLabel: 'Character Builds › Races', icon: '🧬',

/* ============================= STATE ============================= */

let activeSection = 'overview';
let activeLine = null;          // questline id within Quests & Factions
let activeBuildTab = 'races';   // sub-tab within Character Builds
let activeCraftTab = 'ingredients'; // sub-tab within Alchemy & Enchanting
let activeLocationTab = 'cities';   // sub-tab within Locations
let favOnly = false;
let hideCompleted = false;
let query = '';
let favorites = new Set();
let tracked = new Set();

function storageKey(){ return 'oblivion-journal-progress'; }

function syncFilterPills(){
  document.querySelectorAll('.filter-pill[data-fav]').forEach(p => p.classList.toggle('active', p.dataset.fav === (favOnly ? 'favorites' : 'all')));
  const hideBtn = document.querySelector('.filter-pill[data-hide-done]');
  if (hideBtn) hideBtn.classList.toggle('active', hideCompleted);
}

function loadProgress(){
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) {
      const parsed = JSON.parse(raw);
      favorites = new Set(parsed.favorites || []);
      tracked = new Set(parsed.tracked || []);
    }
  } catch (e) { /* start fresh */ }
}
function saveProgress(){
  try {
    localStorage.setItem(storageKey(), JSON.stringify({
      favorites: Array.from(favorites),
      tracked: Array.from(tracked),
    }));
  } catch (e) { console.error('Could not save progress', e); }
}

function navStateKey(){ return 'oblivion-journal-lastview'; }
function saveNavState(){
  try {
    localStorage.setItem(navStateKey(), JSON.stringify({
      activeSection, activeLine, activeBuildTab, activeCraftTab, activeLocationTab,
    }));
  } catch (e) { /* not critical */ }
}
function loadNavState(){
  try {
    const raw = localStorage.getItem(navStateKey());
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && typeof s === 'object' && SECTIONS.some(sec => sec.id === s.activeSection)) activeSection = s.activeSection;
    if ('activeLine' in s) activeLine = s.activeLine;
    if (s.activeBuildTab) activeBuildTab = s.activeBuildTab;
    if (s.activeCraftTab) activeCraftTab = s.activeCraftTab;
    if (s.activeLocationTab) activeLocationTab = s.activeLocationTab;
  } catch (e) { /* start at the default view */ }
}

function questsForLine(line){ return QUESTS.filter(q => q.line === line); }
function statFor(line){
  const scoped = questsForLine(line).filter(q => q.trackable);
  const done = scoped.filter(q => tracked.has(q.id)).length;
  return { done, total: scoped.length };
}
function achStat(){
  const done = ACHIEVEMENTS.filter(a => tracked.has(a.id)).length;
  return { done, total: ACHIEVEMENTS.length };
}
function achPointsStat(){
  let earned = 0, total = 0;
  ACHIEVEMENTS.forEach(a => { total += a.points; if (tracked.has(a.id)) earned += a.points; });
  return { earned, total };
}
function buildsStat(){
  const items = [...RACES, ...CLASSES, ...BIRTHSIGNS];
  const done = items.filter(i => tracked.has(i.id)).length;
  return { done, total: items.length };
}
function bestiaryStat(){
  const done = CREATURES.filter(c => tracked.has(c.id)).length;
  return { done, total: CREATURES.length };
}
function craftingStat(){
  const done = INGREDIENTS.filter(i => tracked.has(i.id)).length;
  return { done, total: INGREDIENTS.length };
}
function locationsStat(){
  const items = [...CITIES, ...POI];
  const done = items.filter(i => tracked.has(i.id)).length;
  return { done, total: items.length };
}
function overallStat(){
  let done = 0, total = 0;
  QUESTLINES.forEach(ql => { const s = statFor(ql.id); done += s.done; total += s.total; });
  [achStat(), buildsStat(), bestiaryStat(), craftingStat(), locationsStat()]
    .forEach(s => { done += s.done; total += s.total; });
  return { done, total };
}

/* ============================= NAV ============================= */

function renderNav(){
  const btns = SECTIONS.map(s => `<button class="nav-btn ${activeSection===s.id?'active':''}" data-section="${s.id}">
      <span class="icon">${s.icon}</span> ${s.label}
    </button>`).join('');
  document.getElementById('nav-desktop').innerHTML = btns;
  document.getElementById('nav-mobile').innerHTML = btns;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSection = btn.dataset.section;
      if (activeSection === 'quests' && !activeLine) activeLine = 'main';
      favOnly = false; hideCompleted = false; query = '';
      const si = document.getElementById('search'); if (si) si.value = '';
      syncFilterPills();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ============================= HEADER ============================= */

function renderHeader(){
  const titleEl = document.getElementById('page-title');
  const subEl = document.getElementById('page-subtitle');
  if (activeSection === 'overview') {
    titleEl.textContent = "The Champion's Codex";
    subEl.textContent = '— a record of the Empire, Cyrodiil —';
  } else {
    const sec = SECTIONS.find(s => s.id === activeSection);
    titleEl.textContent = sec ? sec.label : "The Champion's Codex";
    subEl.textContent = activeSection === 'quests' ? '— the Main Quest, the guilds, the Daedra, and the small favors between —'
      : activeSection === 'achievements' ? '— trophies and deeds of the Champion —'
      : activeSection === 'builds' ? '— races, classes & birthsigns —'
      : activeSection === 'crafting' ? '— alchemy & enchanting —'
      : activeSection === 'bestiary' ? '— creatures & foes of Cyrodiil —'
      : activeSection === 'locations' ? '— cities, ruins & landmarks —'
      : '— a record of the Empire, Cyrodiil —';
  }
}

function renderSubRow(){
  const subRow = document.getElementById('sub-row');
  const banner = document.getElementById('branch-banner');
  banner.style.display = 'none';
  banner.innerHTML = '';
  if (activeSection !== 'quests') {
    subRow.style.display = 'none';
    subRow.innerHTML = '';
    return;
  }
  subRow.style.display = 'flex';
  subRow.innerHTML = QUESTLINES.map(ql => {
    const { done, total } = statFor(ql.id);
    return `<span class="sub-pill ${activeLine===ql.id?'active':''}" data-line="${ql.id}">${ql.icon} ${ql.label} <span class="n">${done}/${total}</span></span>`;
  }).join('');
  subRow.querySelectorAll('[data-line]').forEach(pill => {
    pill.addEventListener('click', () => {
      activeLine = pill.dataset.line;
      renderAll();
    });
  });
}

  container.classList.add('grid-mode');
  document.getElementById('search-row').style.display = 'none';

  let questDone = 0, questTotal = 0;
  QUESTLINES.forEach(ql => { const s = statFor(ql.id); questDone += s.done; questTotal += s.total; });
  const favCount = favorites.size;

  const heroCard = (() => {
    const { done, total } = overallStat();
    const pct = total ? Math.round((done / total) * 100) : 0;
    const { earned, total: totalPts } = achPointsStat();
    const r = 52, circumference = 2 * Math.PI * r;
    const offset = circumference * (1 - pct / 100);
    return `
    <div class="overview-hero" style="grid-column:1/-1;">
      <div class="completion-ring-wrap">
        <svg class="completion-ring" viewBox="0 0 120 120">
          <circle class="completion-ring-track" cx="60" cy="60" r="${r}"></circle>
          <circle class="completion-ring-fill" cx="60" cy="60" r="${r}"
            style="stroke-dasharray:${circumference.toFixed(2)}; stroke-dashoffset:${offset.toFixed(2)};"></circle>
        </svg>
        <div class="completion-ring-pct">${pct}%</div>
      </div>
      <div class="overview-hero-info">
        <div class="overview-hero-title">Overall Completion</div>
        <div class="overview-hero-count">${done} of ${total} trackable entries logged across the entire codex</div>
        <div class="points-total-badge">🏆 ${earned} / ${totalPts} pts</div>
      </div>
    </div>`;
  })();

  const cardFor = (icon, label, section, done, total, noun) => {
    const pct = total ? Math.round((done / total) * 100) : 0;
    return `
    <div class="dash-card" data-nav-section="${section}">
      <div class="dash-card-top"><span class="dash-icon">${icon}</span><span class="dash-label">${label}</span></div>
      <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${pct}%;"></div></div>
      <div class="dash-count">${done} of ${total} ${noun} — ${pct}%</div>
    </div>`;
  };

  const achS = achStat(), buildsS = buildsStat(), bestS = bestiaryStat(), craftS = craftingStat(), locS = locationsStat();

  const dashCards = [
    cardFor('📜', 'Quests & Factions', 'quests', questDone, questTotal, 'quests logged'),
    cardFor('🏆', 'Achievements', 'achievements', achS.done, achS.total, 'earned'),
    cardFor('⚔️', 'Character Builds', 'builds', buildsS.done, buildsS.total, 'races/classes/signs logged'),
    cardFor('👹', 'Bestiary / Compendium', 'bestiary', bestS.done, bestS.total, 'encountered'),
    cardFor('⚗️', 'Alchemy & Enchanting', 'crafting', craftS.done, craftS.total, 'ingredients logged'),
    cardFor('🗺️', 'Locations', 'locations', locS.done, locS.total, 'visited'),
  ].join('');

  const favCard = `
    <div class="dash-card" data-nav-section="quests" data-nav-fav="true" style="margin-top:14px;">
      <div class="dash-card-top"><span class="dash-icon">★</span><span class="dash-label">Favorites Saved</span></div>
      <div class="dash-count">${favCount} ${favCount === 1 ? 'entry' : 'entries'} starred across the codex</div>
    </div>`;

  container.innerHTML = `
    ${heroCard}
    <div class="dash-grid" style="grid-column:1/-1;">${dashCards}</div>
    ${favCard}
    <div class="rune-divider" style="grid-column:1/-1;"></div>
    <div class="reset-zone" style="grid-column:1/-1;">
      <button id="export-progress-btn" class="io-btn">Export Progress</button>
      <button id="import-progress-btn" class="io-btn">Import Progress</button>
      <input id="import-progress-file" type="file" accept="application/json,.json" style="display:none;" />
      <button id="reset-progress-btn" class="reset-btn">Reset All Progress</button>
      <span class="reset-hint">Clears every checkmark and favorite — can't be undone.</span>
      <span id="io-status" class="io-status"></span>
    </div>
  `;

  let resetArmed = false, resetTimer = null;
  const resetBtn = document.getElementById('reset-progress-btn');
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = 'Are you sure? Click to confirm';
      resetBtn.classList.add('armed');
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { resetArmed = false; resetBtn.textContent = 'Reset All Progress'; resetBtn.classList.remove('armed'); }, 4000);
    } else {
      clearTimeout(resetTimer);
      favorites = new Set(); tracked = new Set();
      saveProgress(); renderAll();
    }
  });

  const showIoStatus = (msg, ok) => {
    const el = document.getElementById('io-status');
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('ok', ok);
    el.classList.toggle('err', !ok);
  };

  document.getElementById('export-progress-btn').addEventListener('click', () => {
    try {
      const payload = {
        app: 'oblivion-champions-codex',
        version: 1,
        exportedAt: new Date().toISOString(),
        favorites: Array.from(favorites),
        tracked: Array.from(tracked),
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = payload.exportedAt.slice(0, 10);
      a.href = url;
      a.download = `champions-codex-progress-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showIoStatus(`✓ Exported ${payload.tracked.length} tracked + ${payload.favorites.length} favorited entries.`, true);
    } catch (e) {
      showIoStatus('Export failed — see console for details.', false);
      console.error('Export failed', e);
    }
  });

  const importInput = document.getElementById('import-progress-file');
  document.getElementById('import-progress-btn').addEventListener('click', () => { importInput.value = ''; importInput.click(); });
  importInput.addEventListener('change', () => {
    const file = importInput.files && importInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { showIoStatus('Import failed — that file is not valid JSON.', false); return; }

      const isIdArray = arr => Array.isArray(arr) && arr.every(v => typeof v === 'number' || typeof v === 'string');
      if (!parsed || typeof parsed !== 'object' || !isIdArray(parsed.favorites) || !isIdArray(parsed.tracked)) {
        showIoStatus('Import failed — file is missing the expected "favorites"/"tracked" id lists.', false);
        return;
      }

      favorites = new Set(parsed.favorites);
      tracked = new Set(parsed.tracked);
      saveProgress();
      renderAll();
      showIoStatus(`✓ Imported ${parsed.tracked.length} tracked + ${parsed.favorites.length} favorited entries.`, true);
    };
    reader.onerror = () => showIoStatus('Import failed — could not read that file.', false);
    reader.readAsText(file);
  });

  container.querySelectorAll('.dash-card[data-nav-section]').forEach(card => {
    card.addEventListener('click', () => {
      activeSection = card.dataset.navSection;
      if (activeSection === 'quests') activeLine = 'main';
      favOnly = card.dataset.navFav === 'true';
      hideCompleted = false;
      renderAll();
      syncFilterPills();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ============================= QUESTS RENDER ============================= */

function renderQuests(){
  try { renderQuestsInner(); } catch (err) { showRenderError(err); }
}

function renderQuestsInner(){
  document.getElementById('search-row').style.display = 'flex';
  const container = document.getElementById('entries');
  container.classList.remove('grid-mode');

  let list = questsForLine(activeLine);
  if (favOnly) list = list.filter(q => favorites.has(q.id));
  if (hideCompleted) list = list.filter(q => !tracked.has(q.id));
  if (query.trim()) {
    const q = query.toLowerCase();
    list = list.filter(item =>
      item.title.toLowerCase().includes(q) ||
      (item.steps||[]).join(' ').toLowerCase().includes(q) ||
      (item.rewards||[]).join(' ').toLowerCase().includes(q) ||
      (item.giver||'').toLowerCase().includes(q) ||
      (item.prince||'').toLowerCase().includes(q) ||
      (item.choice ? item.choice.text.toLowerCase().includes(q) : false)
    );
  }

  const progressEl = document.getElementById('progress-tally');
  const stat = statFor(activeLine);
  progressEl.textContent = `${stat.done} of ${stat.total} quests complete`;
  progressEl.style.display = 'inline';

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">No entries here yet. Try another questline or clear the search.</div>`;
    return;
  }

  container.innerHTML = list.map(q => {
    const isFav = favorites.has(q.id);
    const isDone = tracked.has(q.id);
    const stepsHtml = (q.steps||[]).map(s => `<li>${s}</li>`).join('');
    const rewardsHtml = (q.rewards||[]).map(r => `<span class="reward-chip">${r}</span>`).join('');
    const metaBits = [
      q.prince ? `<span><b>Prince:</b> ${q.prince}</span>` : '',
      q.giver ? `<span><b>Giver:</b> ${q.giver}</span>` : '',
      q.location ? `<span><b>Where:</b> ${q.location}</span>` : '',
    ].join('');
    return `
    <article class="quest ${isDone ? 'done' : ''}" data-id="${q.id}">
      <div class="quest-top">
        <div class="quest-title-wrap">
          ${q.order ? `<span class="quest-order">#${q.order}</span>` : ''}
          <h3>${q.title}</h3>
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${q.id}" aria-label="Favorite">★</button>
      </div>
      ${metaBits ? `<div class="quest-meta">${metaBits}</div>` : ''}
      ${stepsHtml ? `<ol class="quest-steps">${stepsHtml}</ol>` : ''}
      ${q.choice ? `<div class="choice-box"><b>${q.choice.flag || 'Choice Point'}</b>${q.choice.text}</div>` : ''}
      ${rewardsHtml ? `<div class="rewards-row">${rewardsHtml}</div>` : ''}
      <div class="quest-foot">
        <span></span>
        ${q.trackable ? `<button class="track-btn" data-track="${q.id}"><span class="box"></span> ${isDone ? 'Completed' : 'Mark complete'}</button>` : ''}
      </div>
    </article>`;
  }).join('');

  container.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.fav);
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      renderQuests(); saveProgress(); renderSubRow(); renderNav();
    });
  });
  container.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderQuests(); saveProgress(); renderSubRow();
    });
  });
}

      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderAchievements(); saveProgress(); renderNav();
    });

  container.querySelectorAll('[data-link-line]').forEach(btn => {

      activeSection = 'quests';

      favOnly = false; hideCompleted = false; query = '';
      const si = document.getElementById('search'); if (si) si.value = '';
      renderAll();

          targetCard.classList.add('flash-highlight');

      }
    });
  });
}

  } else if (activeCraftTab === 'potions') {
    document.getElementById('search-row').style.display = 'none';
    container.innerHTML = tabsHtml + `<div class="ach-group-list">${POTION_BASICS.map(p => `
      <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>${p.name}</h3></div></div>
        <p class="ach-desc">${p.text}</p>
      </article>`).join('')}</div>`;
  } else if (activeCraftTab === 'enchanting') {
    document.getElementById('search-row').style.display = 'none';
    container.innerHTML = tabsHtml + `<div class="ach-group-list">${ENCHANTING_BASICS.map(e => `
      <article class="quest"><div class="quest-top"><div class="quest-title-wrap"><h3>${e.name}</h3></div></div>
        <p class="ach-desc">${e.text}</p>
      </article>`).join('')}</div>`;
  }

  container.querySelectorAll('[data-crafttab]').forEach(pill => {
    pill.addEventListener('click', () => { activeCraftTab = pill.dataset.crafttab; favOnly = false; hideCompleted = false; query = ''; const si = document.getElementById('search'); if (si) si.value = ''; renderAll(); });
  });
  container.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.fav);
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      renderCrafting(); saveProgress();
    });
  });
  container.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderCrafting(); saveProgress(); renderNav();
    });
  });
}

/* ============================= LOCATIONS RENDER ============================= */

function renderLocations(){
  try { renderLocationsInner(); } catch (err) { showRenderError(err); }
}

function renderLocationsInner(){
  document.getElementById('search-row').style.display = 'flex';
  document.getElementById('sub-row').style.display = 'none';
  document.getElementById('branch-banner').style.display = 'none';
  const container = document.getElementById('entries');
  container.classList.remove('grid-mode');

  const tabsHtml = `<div class="sub-row" style="display:flex; margin-bottom:18px;">${LOCATION_TABS.map(t =>
    `<span class="sub-pill ${activeLocationTab===t.id?'active':''}" data-loctab="${t.id}">${t.icon} ${t.label}</span>`).join('')}</div>`;

  const dataFor = activeLocationTab === 'cities' ? CITIES : POI;
  let list = dataFor.slice();
  if (favOnly) list = list.filter(i => favorites.has(i.id));
  if (hideCompleted) list = list.filter(i => !tracked.has(i.id));
  if (query.trim()) {
    const q = query.toLowerCase();
    list = list.filter(i => JSON.stringify(i).toLowerCase().includes(q));
  }
  const done = dataFor.filter(i => tracked.has(i.id)).length;
  const progressEl = document.getElementById('progress-tally');
  progressEl.textContent = `${done} of ${dataFor.length} visited`;
  progressEl.style.display = 'inline';

  const cardHtml = i => {
    const isFav = favorites.has(i.id), isDone = tracked.has(i.id);
    return `
    <article class="quest ${isDone ? 'done' : ''}" data-id="${i.id}">
      <div class="quest-top">
        <div class="quest-title-wrap"><h3>${i.name}</h3></div>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${i.id}" aria-label="Favorite">★</button>
      </div>
      ${i.county ? `<div class="quest-meta"><span><b>${i.county}</b></span></div>` : ''}
      <p class="ach-desc">${i.desc}</p>
      <div class="quest-foot"><span></span><button class="track-btn" data-track="${i.id}"><span class="box"></span> ${isDone ? 'Visited' : 'Mark visited'}</button></div>
    </article>`;
  };

  container.innerHTML = tabsHtml + (list.length === 0
    ? `<div class="empty-state">No locations match. Try another search or clear the filter.</div>`
    : `<div class="ach-group-list">${list.map(cardHtml).join('')}</div>`);

  container.querySelectorAll('[data-loctab]').forEach(pill => {
    pill.addEventListener('click', () => { activeLocationTab = pill.dataset.loctab; favOnly = false; hideCompleted = false; query = ''; const si = document.getElementById('search'); if (si) si.value = ''; renderAll(); });
  });
  container.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.fav);
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      renderLocations(); saveProgress();
    });
  });
  container.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.track);
      tracked.has(id) ? tracked.delete(id) : tracked.add(id);
      renderLocations(); saveProgress(); renderNav();
    });
  });
}

/* ============================= ERROR / MASTER RENDER ============================= */

function showRenderError(err){
  console.error('Codex render error:', err);
  const container = document.getElementById('entries');
  if (!container) return;
  container.classList.remove('grid-mode');
  container.innerHTML = `
    <div class="placeholder-card" style="border-color: var(--blood);">
      <div class="p-icon">⚠️</div>
      <h2 style="color: var(--blood);">Something tore in the page</h2>
      <p>The codex hit an unexpected error while drawing this page. Try clicking another tab and back again. If it keeps happening, this is the detail to report:</p>
      <p style="font-family:'Spectral', monospace; font-size:11px; color: var(--ink-dim); word-break:break-word;">${(err && err.message) ? err.message : String(err)}</p>
    </div>`;
}

/* ============================= GLOBAL SEARCH RESULTS RENDER ============================= */

function navigateToResult(r){
  const nav = r.nav;
  activeSection = nav.section;
  if ('line' in nav) activeLine = nav.line;
  if (nav.buildTab) activeBuildTab = nav.buildTab;
  if (nav.craftTab) activeCraftTab = nav.craftTab;
  if (nav.locationTab) activeLocationTab = nav.locationTab;
  favOnly = false; hideCompleted = false; query = '';
  const si = document.getElementById('search'); if (si) si.value = '';
  renderAll();
  syncFilterPills();
  let scrolled = false;
  if (r.itemId !== null && r.itemId !== undefined) {
    const targetCard = document.querySelector(`.quest[data-id="${r.itemId}"]`);
    if (targetCard) {
      targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      targetCard.classList.add('flash-highlight');
      setTimeout(() => targetCard.classList.remove('flash-highlight'), 2200);
      scrolled = true;
    }
  }
  if (!scrolled) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderGlobalSearchResults(){
  document.getElementById('search-row').style.display = 'flex';
  document.getElementById('sub-row').style.display = 'none';
  document.getElementById('branch-banner').style.display = 'none';
  const container = document.getElementById('entries');
  container.classList.remove('grid-mode');

  const q = query.trim().toLowerCase();
  let results = SEARCH_INDEX.filter(r => r.searchText.includes(q));
  if (favOnly) results = results.filter(r => r.itemId !== null && favorites.has(r.itemId));
  if (hideCompleted) results = results.filter(r => r.itemId === null || !tracked.has(r.itemId));

  const progressEl = document.getElementById('progress-tally');
  const sectionCount = new Set(results.map(r => r.sectionLabel.split(' › ')[0])).size;
  progressEl.textContent = results.length
    ? `${results.length} result${results.length === 1 ? '' : 's'} across ${sectionCount} section${sectionCount === 1 ? '' : 's'}`
    : '';
  progressEl.style.display = results.length ? 'inline' : 'none';

  if (results.length === 0) {
    container.innerHTML = `<div class="empty-state">No matches for "${query.trim()}" anywhere in the codex. Try a different search term.</div>`;
    return;
  }

  const order = [];
  const bySection = {};
  results.forEach(r => {
    if (!bySection[r.sectionLabel]) { bySection[r.sectionLabel] = []; order.push(r.sectionLabel); }
    bySection[r.sectionLabel].push(r);
  });

  const resultCardHtml = (r, idx) => `
    <article class="quest ach-card search-result-card" data-search-idx="${idx}">
      <div class="quest-top">
        <div class="quest-title-wrap"><span class="result-icon">${r.icon}</span><h3>${r.title}</h3></div>
      </div>
      ${r.snippet ? `<p class="ach-desc">${r.snippet}</p>` : ''}
    </article>`;

  container.innerHTML = `<p class="search-section-note">Searching the whole codex — every quest, race, class, birthsign, achievement, creature, ingredient, and location, not just this tab.</p>
    <div class="ach-categories">${order.map(label => {
      const items = bySection[label];
      return `<div style="margin: 18px 0 10px; font-family:'Cinzel', serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold-dim);">${label} <span style="opacity:0.6; font-family:'Spectral', serif; text-transform:none; letter-spacing:0;">(${items.length})</span></div>
        <div class="ach-grid">${items.map(r => resultCardHtml(r, results.indexOf(r))).join('')}</div>`;
    }).join('')}</div>`;

  container.querySelectorAll('[data-search-idx]').forEach(card => {
    card.addEventListener('click', () => navigateToResult(results[Number(card.dataset.searchIdx)]));
  });
}

/* ============================= MASTER RENDER ============================= */

function renderSectionContent(){
  if (query.trim()) { renderGlobalSearchResults(); return; }
  if (activeSection === 'overview') { renderOverview(); }
  else if (activeSection === 'quests') { renderQuests(); }
  else if (activeSection === 'achievements') { renderAchievements(); }
  else if (activeSection === 'builds') { renderBuilds(); }
  else if (activeSection === 'bestiary') { renderBestiary(); }
  else if (activeSection === 'crafting') { renderCrafting(); }
  else if (activeSection === 'locations') { renderLocations(); }
}

function renderAll(){
  try {
    renderNav();
    renderHeader();
    renderSubRow();
    renderSectionContent();
    saveNavState();
  } catch (err) {
    showRenderError(err);
  }
}

function renderCurrentList(){
  try {
    renderSectionContent();
  } catch (err) {
    showRenderError(err);
  }
}

document.getElementById('search').addEventListener('input', e => { query = e.target.value; renderCurrentList(); });
document.querySelectorAll('.filter-pill[data-fav]').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.filter-pill[data-fav]').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    favOnly = pill.dataset.fav === 'favorites';
    renderCurrentList();
  });
});
document.querySelectorAll('.filter-pill[data-hide-done]').forEach(pill => {
  pill.addEventListener('click', () => {
    hideCompleted = !hideCompleted;
    pill.classList.toggle('active', hideCompleted);
    renderCurrentList();
  });
});

loadProgress();
loadNavState();
renderAll();
</script>
</body>
</html>
