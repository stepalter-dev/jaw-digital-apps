<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="canonical" href="https://stepalter-dev.github.io/jaw-digital-apps/home-maintenance/" />
<meta name="theme-color" content="#FBF3E6" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏠%3C/text%3E%3C/svg%3E" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="JAW Digital" />
<meta property="og:title" content="Home Maintenance Companion" />
<meta property="og:description" content="A warm, simple household maintenance tracker — HVAC, plumbing, appliances, safety, garden and more, all in one place." />
<meta property="og:url" content="https://stepalter-dev.github.io/jaw-digital-apps/home-maintenance/" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Home Maintenance Companion" />
<meta name="twitter:description" content="A warm, simple household maintenance tracker — HVAC, plumbing, appliances, safety, garden and more, all in one place." />
<title>Home Maintenance Companion</title>
<meta name="description" content="A warm, simple household maintenance tracker — HVAC, plumbing, appliances, safety, garden and more, all in one place." />
<style>
  :root {
    /* warm cream, light mode */
    --bg: #FBF3E6;
    --bg-soft: #F5E9D8;
    --panel: #FFFCF5;
    --panel-hi: rgba(255,255,255,0.6);
    --border: #E9DBC0;
    --border-soft: #F0E4CC;
    --ink: #4A3D2C;
    --heading: #33291C;
    --ink-soft: #8C7A5E;
    --ink-dim: #B6A583;

    --amber: #C9822F;
    --amber-bg: rgba(201,130,47,0.12);
    --amber-bright: #E0A85C;
    --teal: #3F9187;
    --teal-bg: rgba(63,145,135,0.12);
    --teal-bright: #56ADA2;
    --graybrown: #8A7357;
    --graybrown-bg: rgba(138,115,87,0.14);
    --graybrown-bright: #A5906F;
    --coral: #D9695A;
    --coral-bg: rgba(217,105,90,0.13);
    --coral-bright: #E88A7D;
    --sage-ok: #6E9B5A;
    --sage-bg: rgba(110,155,90,0.14);

    --shadow: 0 2px 10px rgba(74,61,44,0.08);
    --shadow-lg: 0 10px 30px rgba(74,61,44,0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1712;
      --bg-soft: #241D15;
      --panel: #26201A;
      --panel-hi: rgba(255,255,255,0.04);
      --border: #3B3021;
      --border-soft: #2E2718;
      --ink: #E9DDC4;
      --heading: #FAF1DD;
      --ink-soft: #B3A17E;
      --ink-dim: #7C6E52;

      --amber-bg: rgba(224,168,92,0.15);
      --teal-bg: rgba(86,173,162,0.15);
      --graybrown-bg: rgba(165,144,111,0.16);
      --coral-bg: rgba(232,138,125,0.16);
      --sage-bg: rgba(140,190,120,0.15);
      --shadow: 0 2px 10px rgba(0,0,0,0.3);
      --shadow-lg: 0 14px 34px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1712;
    --bg-soft: #241D15;
    --panel: #26201A;
    --panel-hi: rgba(255,255,255,0.04);
    --border: #3B3021;
    --border-soft: #2E2718;
    --ink: #E9DDC4;
    --heading: #FAF1DD;
    --ink-soft: #B3A17E;
    --ink-dim: #7C6E52;

    --amber-bg: rgba(224,168,92,0.15);
    --teal-bg: rgba(86,173,162,0.15);
    --graybrown-bg: rgba(165,144,111,0.16);
    --coral-bg: rgba(232,138,125,0.16);
    --sage-bg: rgba(140,190,120,0.15);
    --shadow: 0 2px 10px rgba(0,0,0,0.3);
    --shadow-lg: 0 14px 34px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }
  a { color: inherit; }
  button { font-family: inherit; }

  .shell { display: flex; min-height: 100vh; }

  /* ---------- SIDE NAV (desktop) ---------- */
  .nav {
    display: flex;
    flex-direction: column;
    width: 220px;
    flex-shrink: 0;
    padding: 26px 14px;
    background: var(--bg-soft);
    border-right: 1px solid var(--border-soft);
    gap: 4px;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px 20px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border-soft);
  }
  .nav-brand .mark { font-size: 22px; }
  .nav-brand .word { font-weight: 700; font-size: 14.5px; color: var(--heading); line-height: 1.25; }
  .nav-brand .word span { display: block; font-weight: 400; font-size: 10.5px; color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }

  .nav-btn {
    all: unset;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    color: var(--ink-soft);
    font-size: 13.5px;
    font-weight: 500;
    transition: background .15s ease, color .15s ease;
  }
  .nav-btn .icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
  .nav-btn:hover { background: var(--panel-hi); color: var(--heading); }
  .nav-btn.active { background: var(--amber-bg); color: var(--amber); font-weight: 700; }
  .nav-footer { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .theme-toggle {
    all: unset;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-size: 12.5px;
  }
  .theme-toggle:hover { color: var(--heading); border-color: var(--ink-dim); }

  .nav-mobile { display: none; }

  /* ---------- MAIN ---------- */
  .page {
    flex: 1;
    min-width: 0;
    padding: 28px clamp(18px, 3vw, 44px) 60px;
  }

  header.title-block {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  h1 { font-size: clamp(20px, 3vw, 26px); margin: 0 0 4px; color: var(--heading); font-weight: 800; letter-spacing: -0.01em; }
  .subtitle { font-size: 13px; color: var(--ink-soft); }
  .add-btn {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--amber);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 11px 18px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    flex-shrink: 0;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .add-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .search-plate {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px;
    flex: 1;
    min-width: 220px;
    box-shadow: var(--shadow);
  }
  .search-plate input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-size: 13.5px;
    width: 100%;
  }
  .search-plate input::placeholder { color: var(--ink-dim); }
  .search-hint { font-size: 11.5px; color: var(--ink-soft); align-self: center; }

  /* category chips */
  .cat-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }
  .cat-chip {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    transition: all .12s ease;
  }
  .cat-chip .n { opacity: 0.65; font-weight: 500; }
  .cat-chip:hover { border-color: var(--ink-dim); color: var(--heading); }
  .cat-chip.active { color: #fff; border-color: transparent; }
  .cat-chip.active.c-amber { background: var(--amber); }
  .cat-chip.active.c-teal { background: var(--teal); }
  .cat-chip.active.c-graybrown { background: var(--graybrown); }
  .cat-chip.active.c-coral { background: var(--coral); }

  /* stat / overview cards */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stat-card .n { font-size: 26px; font-weight: 800; color: var(--heading); }
  .stat-card .l { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .stat-card.overdue .n { color: var(--coral); }
  .stat-card.upcoming .n { color: var(--amber); }
  .stat-card.done .n { color: var(--sage-ok); }

  .overview-hero {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 26px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .ring-wrap { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
  .ring { width: 96px; height: 96px; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--border-soft); stroke-width: 9; }
  .ring-fill { fill: none; stroke: var(--sage-ok); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; color: var(--heading); }
  .overview-hero-info { flex: 1; min-width: 200px; }
  .overview-hero-title { font-weight: 700; font-size: 13.5px; color: var(--heading); margin-bottom: 4px; }
  .overview-hero-count { font-size: 12.5px; color: var(--ink-soft); }

  .panel-block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .panel-block h3 { margin: 0 0 12px; font-size: 13.5px; color: var(--heading); text-transform: uppercase; letter-spacing: 0.04em; }
  .io-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .io-btn {
    all: unset;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--teal);
    border: 1px solid var(--teal);
    border-radius: 999px;
    padding: 9px 16px;
  }
  .io-btn:hover { background: var(--teal-bg); }
  .io-status { font-size: 12px; }
  .io-status.ok { color: var(--sage-ok); }
  .io-status.err { color: var(--coral); }
  .reset-btn {
    all: unset;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--coral);
    border: 1px solid var(--coral);
    border-radius: 999px;
    padding: 9px 16px;
  }
  .reset-btn:hover { background: var(--coral-bg); }
  .reset-btn.armed { background: var(--coral); color: #fff; }
  .reset-hint { font-size: 11.5px; color: var(--ink-soft); }

  /* task cards */
  .task-list { display: flex; flex-direction: column; gap: 12px; }
  .task-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--ink-dim);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .task-card.cat-amber { border-left-color: var(--amber); }
  .task-card.cat-teal { border-left-color: var(--teal); }
  .task-card.cat-graybrown { border-left-color: var(--graybrown); }
  .task-card.cat-coral { border-left-color: var(--coral); }
  .task-card.overdue { background: var(--coral-bg); }

  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .task-title-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task-icon { font-size: 15px; }
  .task-card h3 { margin: 0; font-size: 15px; color: var(--heading); font-weight: 700; }
  .chip {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .chip.c-amber { background: var(--amber-bg); color: var(--amber); }
  .chip.c-teal { background: var(--teal-bg); color: var(--teal); }
  .chip.c-graybrown { background: var(--graybrown-bg); color: var(--graybrown); }
  .chip.c-coral { background: var(--coral-bg); color: var(--coral); }
  .chip.freq { background: var(--border-soft); color: var(--ink-soft); }
  .chip.overdue-tag { background: var(--coral); color: #fff; }

  .task-meta { font-size: 12px; color: var(--ink-soft); margin: 4px 0 8px; }
  .task-meta b { color: var(--heading); }
  .task-notes { font-size: 12.5px; color: var(--ink); margin: 0 0 10px; line-height: 1.5; }
  .task-link { font-size: 12px; color: var(--teal); text-decoration: none; }
  .task-link:hover { text-decoration: underline; }

  .task-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .task-actions { display: flex; gap: 8px; }
  .icon-btn {
    all: unset;
    cursor: pointer;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  .icon-btn:hover { color: var(--heading); border-color: var(--ink-dim); }
  .complete-btn {
    all: unset;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    background: var(--sage-ok);
    padding: 8px 16px;
    border-radius: 999px;
  }
  .complete-btn:hover { opacity: 0.9; }

  .log-entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 16px;
  }
  .log-entry .name { font-weight: 700; color: var(--heading); font-size: 13.5px; }
  .log-entry .date { font-size: 12px; color: var(--ink-soft); }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }
  .empty-state .e-icon { font-size: 30px; margin-bottom: 10px; }

  /* modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(30,24,16,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--panel);
    border-radius: 20px;
    padding: 26px 26px 22px;
    width: min(92vw, 480px);
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }
  .modal h2 { margin: 0 0 16px; font-size: 17px; color: var(--heading); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13.5px;
    color: var(--ink);
    font-family: inherit;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--amber); }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
  .btn-primary {
    all: unset; cursor: pointer;
    background: var(--amber); color: #fff; font-weight: 700; font-size: 13.5px;
    padding: 11px 20px; border-radius: 999px;
  }
  .btn-secondary {
    all: unset; cursor: pointer;
    color: var(--ink-soft); font-size: 13px; padding: 11px 14px;
  }
  .btn-secondary:hover { color: var(--heading); }
  .btn-delete {
    all: unset; cursor: pointer;
    color: var(--coral); font-size: 12.5px; font-weight: 700;
  }

  footer.note {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.75;
  }

  @media (max-width: 820px) {
    .shell { flex-direction: column; }
    .nav { display: none; }
    .nav-mobile {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 12px 14px;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border-soft);
    }
    .nav-mobile .nav-btn { flex-shrink: 0; }
    .page { padding: 20px 16px 50px; }
  }

  /* ---- shared accessibility defaults (JAW Digital suite) ---- */
  :focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
    border-radius: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="shell">
  <nav class="nav" id="nav-desktop">
    <div class="nav-brand"><span class="mark">🏡</span><span class="word">Home Maintenance<span>Companion</span></span></div>
  </nav>

  <main class="page">
    <nav class="nav-mobile" id="nav-mobile"></nav>

    <header class="title-block">
      <div>
        <h1 id="page-title">Upcoming</h1>
        <div class="subtitle" id="page-subtitle">Everything due, sorted so nothing sneaks past you.</div>
      </div>
      <button class="add-btn" id="add-task-btn">+ Add task</button>
    </header>

    <div class="search-row">
      <div class="search-plate">
        <span>🔎</span>
        <input id="search" type="text" placeholder="Search all tasks and notes…" />
      </div>
    </div>

    <div id="view-root"></div>

    <footer class="note">A record kept for one household by JAW Digital</footer>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal">
    <h2 id="modal-title">Add task</h2>
    <form id="task-form">
      <div class="field">
        <label for="f-name">Name</label>
        <input id="f-name" type="text" required placeholder="e.g. Clean gutters &amp; downpipes" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-category">Category</label>
          <select id="f-category"></select>
        </div>
        <div class="field">
          <label for="f-frequency">Frequency</label>
          <select id="f-frequency"></select>
        </div>
      </div>
      <div class="field">
        <label for="f-lastdone">Last done</label>
        <input id="f-lastdone" type="date" />
      </div>
      <div class="field">
        <label for="f-notes">Notes</label>
        <textarea id="f-notes" placeholder="Anything worth remembering next time…"></textarea>
      </div>
      <div class="field">
        <label for="f-link">Linked doc / URL (optional)</label>
        <input id="f-link" type="url" placeholder="Manual, warranty, receipt…" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-delete" id="f-delete" style="display:none;">Delete task</button>
        <div style="flex:1;"></div>
        <button type="button" class="btn-secondary" id="f-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ============================= DATA ============================= */

const CATEGORIES = [
  { id: 'hvac',        label: 'HVAC',                 icon: '🔥', color: 'amber' },
  { id: 'plumbing',    label: 'Plumbing',              icon: '💧', color: 'teal' },
  { id: 'electrical',  label: 'Electrical',            icon: '⚡', color: 'graybrown' },
  { id: 'exterior',    label: 'Exterior & Gutters',    icon: '🏠', color: 'teal' },
  { id: 'appliances',  label: 'Appliances',            icon: '🔧', color: 'amber' },
  { id: 'safety',      label: 'Safety',                icon: '🔔', color: 'coral' },
  { id: 'garden',      label: 'Garden & Irrigation',   icon: '🌱', color: 'teal' },
  { id: 'pest',        label: 'Pest Control',          icon: '🐜', color: 'graybrown' },
];
const CAT_BY_ID = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

const FREQUENCIES = {
  monthly:   { label: 'Monthly',   months: 1 },
  quarterly: { label: 'Quarterly', months: 3 },
  biannual:  { label: 'Biannual',  months: 6 },
  annual:    { label: 'Annual',    months: 12 },
  oneoff:    { label: 'One-off',   months: null },
};

  { id: 'upcoming',  label: 'Home / Upcoming', icon: '🏡' },
  { id: 'category',  label: 'By Category',     icon: '🗂️' },
  { id: 'log',       label: 'Completed Log',   icon: '📋' },
  { id: 'overview',  label: 'Overview',        icon: '📊' },
];

/* ---------- date helpers ---------- */
const pad = n => (n < 10 ? '0' + n : '' + n);
const toISODate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISODate(new Date());
const monthsAgoISO = n => { const d = new Date(); d.setMonth(d.getMonth() - n); return toISODate(d); };
const daysAgoISO = n => { const d = new Date(); d.setDate(d.getDate() - n); return toISODate(d); };
const addMonthsISO = (iso, months) => { const d = new Date(iso + 'T00:00:00'); d.setMonth(d.getMonth() + months); return toISODate(d); };
const fmtDate = iso => {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
};
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);

/* ---------- seed data ---------- */
let SEED_ID = 1;
const t = (name, category, frequency, lastDone, notes, link) => ({
  id: SEED_ID++, name, category, frequency, lastDone: lastDone || null,

});

// Snapshot the seed data as JSON right away — tasks get mutated in place as the
// app runs (mark complete, edit), so SEED_TASKS itself is not safe to reuse
// later. freshSeedTasks() always hands back untouched copies, both for the
// first-ever load and for Reset.
const SEED_TASKS_JSON = JSON.stringify(SEED_TASKS);
function freshSeedTasks() { return JSON.parse(SEED_TASKS_JSON); }

/* ============================= STATE ============================= */

const TASKS_KEY = 'hmc_tasks';
const LOG_KEY = 'hmc_completed_log';
const THEME_KEY = 'hmc_theme';

let tasks = [];
let completedLog = [];
let activeSection = 'upcoming';
let activeCategory = null;
let searchQuery = '';
let editingTaskId = null;
let resetArmed = false;
let resetTimer = null;

function loadState() {
  try {
    const rawTasks = localStorage.getItem(TASKS_KEY);
    tasks = rawTasks ? JSON.parse(rawTasks) : freshSeedTasks();
  } catch (e) { tasks = freshSeedTasks(); }
  try {
    const rawLog = localStorage.getItem(LOG_KEY);
    completedLog = rawLog ? JSON.parse(rawLog) : [];
  } catch (e) { completedLog = []; }
  if (!Array.isArray(tasks) || tasks.length === 0) tasks = freshSeedTasks();
  if (!Array.isArray(completedLog)) completedLog = [];
}
function saveTasks() { try { localStorage.setItem(TASKS_KEY, JSON.stringify(tasks)); } catch (e) { console.error('Could not save tasks', e); } }
function saveLog() { try { localStorage.setItem(LOG_KEY, JSON.stringify(completedLog)); } catch (e) { console.error('Could not save log', e); } }

/* ---------- theme ---------- */
function applyTheme(mode) {
  if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-theme', mode);
  else document.documentElement.removeAttribute('data-theme');
}
function loadTheme() {
  let mode = null;
  try { mode = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(mode);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const currentlyDark = current === 'dark' || (!current && prefersDark);
  const next = currentlyDark ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  renderNav();
}

/* ============================= LOGIC ============================= */

function nextDueFor(task) {
  if (task.frequency === 'oneoff') return null;
  if (!task.lastDone) return null;
  const months = FREQUENCIES[task.frequency].months;
  return addMonthsISO(task.lastDone, months);
}
function statusFor(task) {
  if (task.frequency === 'oneoff' && task.completed) return 'done';
  const due = nextDueFor(task);
  if (!due) return 'upcoming';
  return due < todayISO() ? 'overdue' : 'upcoming';
}
function isActive(task) { return !(task.frequency === 'oneoff' && task.completed); }

function markComplete(id) {
  const task = tasks.find(x => x.id === id);
  if (!task) return;
  const today = todayISO();
  task.lastDone = today;
  if (task.frequency === 'oneoff') task.completed = true;
  completedLog.unshift({
    id: Date.now() + Math.random(),
    taskId: task.id,
    name: task.name,
    category: task.category,
    frequency: task.frequency,
    doneDate: today,
  });
  saveTasks(); saveLog();
  renderAll();
}

function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  saveTasks();
  closeModal();
  renderAll();
}

function upsertTaskFromForm() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) return;
  const category = document.getElementById('f-category').value;
  const frequency = document.getElementById('f-frequency').value;
  const lastDone = document.getElementById('f-lastdone').value || null;
  const notes = document.getElementById('f-notes').value.trim();
  const link = document.getElementById('f-link').value.trim();

  if (editingTaskId != null) {
    const task = tasks.find(x => x.id === editingTaskId);
    if (task) Object.assign(task, { name, category, frequency, lastDone, notes, link });
  } else {
    const id = tasks.reduce((m, x) => Math.max(m, x.id), 0) + 1;
    tasks.push({ id, name, category, frequency, lastDone, notes, link, completed: false });
  }
  saveTasks();
  closeModal();
  renderAll();
}

/* ============================= MODAL ============================= */

function populateSelect(select, obj, labelFn) {
  select.innerHTML = Object.keys(obj).map(key => `<option value="${key}">${labelFn(obj[key], key)}</option>`).join('');
}

function openModal(taskId) {
  editingTaskId = taskId || null;
  const task = taskId ? tasks.find(x => x.id === taskId) : null;
  document.getElementById('modal-title').textContent = task ? 'Edit task' : 'Add task';
  document.getElementById('f-delete').style.display = task ? 'inline' : 'none';

  const catSelect = document.getElementById('f-category');
  populateSelect(catSelect, CAT_BY_ID, c => `${c.icon} ${c.label}`);
  const freqSelect = document.getElementById('f-frequency');
  populateSelect(freqSelect, FREQUENCIES, f => f.label);

  document.getElementById('f-name').value = task ? task.name : '';
  catSelect.value = task ? task.category : (activeCategory || CATEGORIES[0].id);
  freqSelect.value = task ? task.frequency : 'quarterly';
  document.getElementById('f-lastdone').value = task ? (task.lastDone || '') : '';
  document.getElementById('f-notes').value = task ? task.notes : '';
  document.getElementById('f-link').value = task ? task.link : '';

  document.getElementById('modal-overlay').hidden = false;
}
function closeModal() {
  document.getElementById('modal-overlay').hidden = true;
  editingTaskId = null;
}

/* ============================= RENDER ============================= */

function taskMatchesSearch(task, q) {
  if (!q) return true;
  const hay = (task.name + ' ' + task.notes).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function renderNav() {
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current === 'dark' || (!current && prefersDark);
  const themeBtnHTML = `<button class="theme-toggle" id="theme-toggle-desktop">${isDark ? '☀️ Light mode' : '🌙 Dark mode'}</button>`;

  const btnsHTML = SECTIONS.map(s =>
    `<button class="nav-btn ${activeSection === s.id ? 'active' : ''}" data-section="${s.id}"><span class="icon">${s.icon}</span>${s.label}</button>`
  ).join('');

  const desktop = document.getElementById('nav-desktop');
  desktop.innerHTML = `<div class="nav-brand"><span class="mark">🏡</span><span class="word">Home Maintenance<span>Companion</span></span></div>${btnsHTML}<div class="nav-footer">${themeBtnHTML}</div>`;

  document.getElementById('nav-mobile').innerHTML = btnsHTML;

  document.querySelectorAll('[data-section]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSection = btn.dataset.section;
      if (activeSection !== 'category') activeCategory = null;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  const themeBtn = document.getElementById('theme-toggle-desktop');
  if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
}

function categoryChip(catId, category, count, clickable) {
  const activeClass = activeCategory === catId ? `active c-${category.color}` : '';
  return `<button class="cat-chip ${activeClass}" data-cat="${catId}">
    <span>${category.icon}</span>${category.label}<span class="n">(${count})</span>
  </button>`;
}

function taskCard(task) {
  const cat = CAT_BY_ID[task.category];
  const status = statusFor(task);
  const due = nextDueFor(task);
  const overdueDays = due ? daysBetween(due, todayISO()) : null;

  let metaHTML;
  if (task.frequency === 'oneoff' && task.completed) {
    metaHTML = `<span>Done ${fmtDate(task.lastDone)}</span>`;
  } else if (!due) {
    metaHTML = `<span>Not yet logged — due whenever it suits</span>`;
  } else if (status === 'overdue') {
    metaHTML = `<span><b>Overdue</b> by ${overdueDays} day${overdueDays === 1 ? '' : 's'} (was due ${fmtDate(due)})</span>`;
  } else {
    metaHTML = `<span>Next due <b>${fmtDate(due)}</b></span>`;
  }
  if (task.lastDone) metaHTML += ` <span>· Last done ${fmtDate(task.lastDone)}</span>`;

  return `
  <div class="task-card cat-${cat.color} ${status === 'overdue' ? 'overdue' : ''}" data-id="${task.id}">
    <div class="task-top">
      <div class="task-title-wrap">
        <span class="task-icon">${cat.icon}</span>
        <h3>${escapeHTML(task.name)}</h3>
        ${status === 'overdue' ? '<span class="chip overdue-tag">Overdue</span>' : ''}
      </div>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <span class="chip c-${cat.color}">${cat.label}</span>
        <span class="chip freq">${FREQUENCIES[task.frequency].label}</span>
      </div>
    </div>
    <div class="task-meta">${metaHTML}</div>
    ${task.notes ? `<p class="task-notes">${escapeHTML(task.notes)}</p>` : ''}
    ${task.link ? `<a class="task-link" href="${escapeAttr(task.link)}" target="_blank" rel="noopener">🔗 Linked doc</a>` : ''}
    <div class="task-foot">
      <div class="task-actions">
        <button class="icon-btn" data-edit="${task.id}">Edit</button>
        <button class="icon-btn" data-delete="${task.id}">Delete</button>
      </div>
      ${isActive(task) ? `<button class="complete-btn" data-complete="${task.id}">✓ Mark complete</button>` : ''}
    </div>
  </div>`;
}

function escapeHTML(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function escapeAttr(s) { return escapeHTML(s); }

function sortedActiveTasks(list) {
  return list.slice().sort((a, b) => {
    const sa = statusFor(a), sb = statusFor(b);
    if (sa === 'overdue' && sb !== 'overdue') return -1;
    if (sb === 'overdue' && sa !== 'overdue') return 1;
    const da = nextDueFor(a), db = nextDueFor(b);
    if (da && db) return da < db ? -1 : da > db ? 1 : 0;
    if (da && !db) return -1;
    if (db && !da) return 1;
    return a.name.localeCompare(b.name);
  });
}

function renderUpcoming(root) {
  document.getElementById('page-title').textContent = 'Upcoming';
  document.getElementById('page-subtitle').textContent = 'Everything due, sorted so nothing sneaks past you.';

  let list = tasks.filter(isActive).filter(t => taskMatchesSearch(t, searchQuery));
  list = sortedActiveTasks(list);

  if (list.length === 0) {
    root.innerHTML = emptyState('🎉', searchQuery ? 'Nothing matches that search.' : 'All caught up — nothing due right now.');
    return;
  }
  root.innerHTML = `<div class="task-list">${list.map(taskCard).join('')}</div>`;
}

function renderCategory(root) {
  document.getElementById('page-title').textContent = 'By Category';
  document.getElementById('page-subtitle').textContent = 'Browse tasks by area of the house.';

  const counts = Object.fromEntries(CATEGORIES.map(c => [c.id, tasks.filter(t => t.category === c.id && isActive(t)).length]));
  const chipsHTML = `<div class="cat-grid">${CATEGORIES.map(c => categoryChip(c.id, c, counts[c.id])).join('')}</div>`;

  let list = tasks.filter(isActive).filter(t => taskMatchesSearch(t, searchQuery));
  // search overrides the category filter so results span every category
  if (!searchQuery && activeCategory) list = list.filter(t => t.category === activeCategory);
  list = sortedActiveTasks(list);

  let bodyHTML;
  if (list.length === 0) {
    bodyHTML = emptyState('🗂️', searchQuery ? 'Nothing matches that search.' : 'No tasks in this category yet.');
  } else {
    bodyHTML = `<div class="task-list">${list.map(taskCard).join('')}</div>`;
  }
  root.innerHTML = chipsHTML + bodyHTML;

  document.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.cat;
      activeCategory = activeCategory === id ? null : id;
      renderAll();
    });
  });
}

function renderLog(root) {
  document.getElementById('page-title').textContent = 'Completed Log';
  document.getElementById('page-subtitle').textContent = 'A history of everything that\'s been ticked off.';

  let list = completedLog.filter(e => taskMatchesSearch({ name: e.name, notes: '' }, searchQuery));
  if (list.length === 0) {
    root.innerHTML = emptyState('📋', searchQuery ? 'Nothing matches that search.' : 'Nothing logged yet — mark a task complete to start the record.');
    return;
  }
  const rows = list.map(e => {
    const cat = CAT_BY_ID[e.category];
    return `<div class="log-entry">
      <div><span class="task-icon">${cat.icon}</span> <span class="name">${escapeHTML(e.name)}</span>
        <span class="chip c-${cat.color}" style="margin-left:8px;">${cat.label}</span></div>
      <div class="date">${fmtDate(e.doneDate)}</div>
    </div>`;
  }).join('');
  root.innerHTML = `<div class="task-list">${rows}</div>`;
}

function renderOverview(root) {
  document.getElementById('page-title').textContent = 'Overview';
  document.getElementById('page-subtitle').textContent = 'How the household is tracking.';

  const active = tasks.filter(isActive);
  const overdueCount = active.filter(t => statusFor(t) === 'overdue').length;
  const upcomingCount = active.length - overdueCount;
  const onTrackPct = active.length ? Math.round((upcomingCount / active.length) * 100) : 100;
  const circumference = 2 * Math.PI * 42;
  const offset = circumference * (1 - onTrackPct / 100);

  root.innerHTML = `
    <div class="overview-hero">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 96 96">
          <circle class="ring-track" cx="48" cy="48" r="42"></circle>
          <circle class="ring-fill" cx="48" cy="48" r="42" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="ring-pct">${onTrackPct}%</div>
      </div>
      <div class="overview-hero-info">
        <div class="overview-hero-title">On track</div>
        <div class="overview-hero-count">${upcomingCount} of ${active.length} active tasks are not overdue.</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="n">${active.length}</div><div class="l">Active tasks</div></div>
      <div class="stat-card overdue"><div class="n">${overdueCount}</div><div class="l">Overdue</div></div>
      <div class="stat-card upcoming"><div class="n">${upcomingCount}</div><div class="l">Upcoming</div></div>
      <div class="stat-card done"><div class="n">${completedLog.length}</div><div class="l">Logged complete</div></div>
    </div>

    <div class="panel-block">
      <h3>Backup</h3>
      <div class="io-row">
        <button class="io-btn" id="export-btn">⬇ Export progress</button>
        <button class="io-btn" id="import-btn">⬆ Import progress</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;" />
        <span class="io-status" id="io-status"></span>
      </div>
    </div>

    <div class="panel-block">
      <h3>Reset</h3>
      <div class="io-row">
        <button class="reset-btn" id="reset-btn">Reset all progress</button>
        <span class="reset-hint" id="reset-hint">Clears every task and the completed log back to the starter set. Click twice to confirm.</span>
      </div>
    </div>
  `;

  document.getElementById('export-btn').addEventListener('click', exportProgress);
  document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', importProgress);
  document.getElementById('reset-btn').addEventListener('click', handleResetClick);
}

function emptyState(icon, msg) {
  return `<div class="empty-state"><div class="e-icon">${icon}</div>${msg}</div>`;
}

function renderAll() {
  renderNav();
  const root = document.getElementById('view-root');
  if (activeSection === 'upcoming') renderUpcoming(root);
  else if (activeSection === 'category') renderCategory(root);
  else if (activeSection === 'log') renderLog(root);
  else renderOverview(root);

  document.querySelectorAll('[data-complete]').forEach(b => b.addEventListener('click', () => markComplete(Number(b.dataset.complete))));
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(Number(b.dataset.edit))));
  document.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => {
    if (confirm('Delete this task? This cannot be undone.')) deleteTask(Number(b.dataset.delete));
  }));
}

/* ============================= EXPORT / IMPORT / RESET ============================= */

function showIoStatus(msg, ok) {
  const el = document.getElementById('io-status');
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle('ok', ok);
  el.classList.toggle('err', !ok);
}

function exportProgress() {
  try {
    const payload = {
      app: 'home-maintenance-companion',
      version: 1,
      exportedAt: new Date().toISOString(),
      tasks,
      completedLog,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `home-maintenance-progress-${payload.exportedAt.slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showIoStatus(`✓ Exported ${tasks.length} tasks + ${completedLog.length} log entries.`, true);
  } catch (e) {
    showIoStatus('Export failed — see console for details.', false);
    console.error('Export failed', e);
  }
}

function importProgress(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch (e) { showIoStatus('Import failed — that file is not valid JSON.', false); return; }

    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.completedLog)) {
      showIoStatus('Import failed — file is missing the expected "tasks"/"completedLog" lists.', false);
      return;
    }
    tasks = parsed.tasks;
    completedLog = parsed.completedLog;
    saveTasks(); saveLog();
    renderAll();
    showIoStatus(`✓ Imported ${tasks.length} tasks + ${completedLog.length} log entries.`, true);
  };
  reader.onerror = () => showIoStatus('Import failed — could not read that file.', false);
  reader.readAsText(file);
  ev.target.value = '';
}

function handleResetClick() {
  const btn = document.getElementById('reset-btn');
  const hint = document.getElementById('reset-hint');
  if (!resetArmed) {
    resetArmed = true;
    btn.classList.add('armed');
    btn.textContent = 'Click again to confirm';
    if (hint) hint.textContent = 'This will wipe everything back to the starter task set.';
    resetTimer = setTimeout(() => {
      resetArmed = false;
      btn.classList.remove('armed');
      btn.textContent = 'Reset all progress';
      if (hint) hint.textContent = 'Clears every task and the completed log back to the starter set. Click twice to confirm.';
    }, 4000);
  } else {
    clearTimeout(resetTimer);
    resetArmed = false;
    tasks = freshSeedTasks();
    completedLog = [];
    saveTasks(); saveLog();
    renderAll();
  }
}

/* ============================= WIRE UP ============================= */

document.getElementById('add-task-btn').addEventListener('click', () => openModal(null));
document.getElementById('f-cancel').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
document.getElementById('task-form').addEventListener('submit', e => { e.preventDefault(); upsertTaskFromForm(); });
document.getElementById('f-delete').addEventListener('click', () => {
  if (editingTaskId != null && confirm('Delete this task? This cannot be undone.')) deleteTask(editingTaskId);
});
document.getElementById('search').addEventListener('input', e => { searchQuery = e.target.value; renderAll(); });

loadTheme();
loadState();
renderAll();
</script>
